사유 항만과 정식 군수 대금은 같은 재정 흐름이 아니다. 수입 물품과 장물의 구별에는 납품 서류와 거래 상대의 신뢰가 필요하다. 도그타운의 시장은 이 체계와 접하지만 바게스트의 별도 관리를 받는다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"나이트 시티 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"}],"priority":196},{"title":"노마드의 외곽 차량 개조","group":"이동","keywords":["노마드차량","배드랜드개조","외곽정비","차량행렬","사막차량"],"short":"정비 환경과 화물에 맞춰 바꾸는 차","body":"노마드의 차량은 집단의 이동과 운송, 장기적인 정비를 동시에 떠받치는 생산 자산이다. 손톤 갈레나와 매키나우 같은 차체, 미즈타니 시온과 쿼드라 타입-66을 바탕으로 바꾼 여러 모델이 있다. 모래와 거친 노면을 만나는 곳에서는 바퀴, 화물 적재부, 덧댄 외장이 용도에 맞춰 변한다. 목적이 서로 다른 차량이 같은 행렬을 이루면 선두에서 길을 확인하는 차와 적재량이 중요한 차의 상태가 다를 수 있다. 수리를 맡는 노마드 기술자와 시장에서 부품을 조달하는 사람은 역할을 나눈다. 도시에 등록된 공장 사양과 배드랜드에서 실제로 대대로 고친 차량의 등급을 같은 기준으로만 평가하기 어렵다. 도시에서 온 오토바이와 오랜 시간 모래를 맞는 대형 장비가 제때 정비될 수 있도록 행렬에는 여러 갈래의 부품 공급원이 필요하다. 노마드가 보관하는 소모품만으로 기업의 부양 투입 장비를 정비하기는 어렵기 때문에 종류를 나눈다.","sources":[{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"Cyberpunk 2077 Vehicles · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Vehicles"},{"label":"Guns and Horses · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Guns_and_Horses"}],"priority":196},{"title":"도심 갱단과 용병 계약","group":"세력","keywords":["용병계약","경비계약","구역분쟁","갱단연락망"],"short":"거리 조직과 고용 관계의 경계","body":"애니멀의 시설 경비, 타이거 클로가 출입에 관여하는 업소, 멜스트롬의 장물 거래처럼 갱단이 제공하는 서비스와 범죄는 목적에 따라 다르다. 픽서가 소개한 용병이 특정 단체의 일을 도왔다고 해서 구성원 전체와 영구 동맹을 맺는 것은 아니다. 조직은 구역과 자산의 손실, 내부 평판, 보수 조건에 따라 행동한다. 연락책의 개인 약속과 지도자의 지시, 독립적인 경비 사업자의 계약은 같은 권한을 갖지 않는다. 나이트 시티 갱단의 활동은 유흥업, 보호비, 장물, 약물, 경비, 용병 계약 등으로 나뉜다. 멜스트롬은 왓슨 공업권, 타이거 클로는 재팬타운, 발렌티노는 헤이우드, 식스 스트리트는 산토 도밍고와 인접 지역에서 잘 알려져 있다. 목스와 부두 보이즈는 각각 다른 공동체를 기반으로 삼는다. 애니멀은 경비 계약에 관여하고, 스캐빈저는 여러 지역의 느슨한 무리로 활동한다. 바게스트는 장벽 안의 군정에 가까운 통제권을 지닌다.","sources":[{"label":"픽서 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Fixer"},{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":197},{"title":"배드랜드 북부 길목","group":"도시","keywords":["로키리지","북부배드랜드","폐정착지"],"short":"유령 마을과 외곽 도로의 갈림길","body":"로키 리지는 한때 사람이 정착했으나 현재는 버려진 건물이 남은 외곽 마을이다. 긴 도로와 버려진 주택·점포 사이에서는 도심의 공공 경비와 상설 서비스가 기대만큼 이어지지 않는다. 북부 배드랜드와 노스사이드의 시 경계 쪽은 주택 밀도가 낮아지고 공업 부지와 황무지가 서로 가까워진다. 노마드 차량과 외부 호송, 기업 작업 차량이 같은 경로를 공유하더라도 정차 목적과 지나가는 방향이 다르다. 관리되지 않는 건물은 상점으로 영업하지 않는다. 동부 배드랜드의 선셋 모텔은 외곽 도로의 숙박·정차 거점이며, 매립지는 도시에서 반출한 폐기물이 쌓이는 지대다. 바람 농장의 발전 설비와 레드 피크 일대의 트레일러 주거는 사막 도로에 서로 다른 수요를 만든다. 벌판의 가동 시설 주변과 폐기물 구역은 같은 형태의 출입 관리를 받지 않는다. 건조한 대지, 오염, 열린 도로는 이동과 생활을 제약하고, 시가지와 물리적으로 가까운 곳도 공공 서비스의 밀도는 다르다.","sources":[{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":198},{"title":"선박·항공 기술 제조사","group":"기업","keywords":["제타테크","아카리중공업","AV산업","드론제조","항공기업"],"short":"드론·공중 차량·운송 사업의 분업","body":"제타테크는 공중 차량과 드론, 전자 기술에서 이름이 확인된다. 아카리 중공업은 기업 목록의 산업 조직이며, 오비탈 에어는 항공 장비의 단순 제조 브랜드라기보다 승객·화물 운송과 시설 운영이 중요한 회사다. 시민이 볼 수 있는 항공편, 사기업의 경비용 드론, 응급팀의 공중 차량은 장비의 표면이 비슷해도 담당자와 작업이 다르다. 정식 제조사와 구매 기업의 독자 사양을 구별한다. 오비탈 에어는 항공·궤도 운송과 스페이스포트 사업으로 존재감을 드러낸다. 나이트 시티의 NCX에서 일반 항공편과 우주편이 서로 다른 터미널과 등급으로 운영된다. 우주 식민지와의 운송 수익, 자체 터미널 운영, 기업의 시설 안전 요구가 회사의 사업 모델에 걸린다. 마키가이와 마히르 모터스, 미즈타니는 도시 이동에 볼 수 있는 차량 제조사다. 카우카즈는 무거운 적재와 운송에 적합한 상용 차량으로 알려졌다. 가부키의 좁은 길과 배드랜드의 열린 도로에서는 적합한 차량의 크기와 역할이 다르다.","sources":[{"label":"기업 목록 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Corporation"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":200},{"title":"배드랜드 동부 설비","group":"도시","keywords":["동부배드랜드","선셋모텔","매립지","바람농장","레드피크"],"short":"외곽 숙박·매립·풍력의 회랑","body":"동부 배드랜드의 선셋 모텔은 외곽 도로의 숙박·정차 거점이며, 매립지는 도시에서 반출한 폐기물이 쌓이는 지대다. 바람 농장의 발전 설비와 레드 피크 일대의 트레일러 주거는 사막 도로에 서로 다른 수요를 만든다. 벌판의 가동 시설 주변과 폐기물 구역은 같은 형태의 출입 관리를 받지 않는다. 건조한 대지, 오염, 열린 도로는 이동과 생활을 제약하고, 시가지와 물리적으로 가까운 곳도 공공 서비스의 밀도는 다르다. 로키 리지는 한때 사람이 정착했으나 현재는 버려진 건물이 남은 외곽 마을이다. 긴 도로와 버려진 주택·점포 사이에서는 도심의 공공 경비와 상설 서비스가 기대만큼 이어지지 않는다. 북부 배드랜드와 노스사이드의 시 경계 쪽은 주택 밀도가 낮아지고 공업 부지와 황무지가 서로 가까워진다. 노마드 차량과 외부 호송, 기업 작업 차량이 같은 경로를 공유하더라도 정차 목적과 지나가는 방향이 다르다. 관리되지 않는 건물은 상점으로 영업하지 않는다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":202},{"title":"자동차 제조사의 시장","group":"기업","keywords":["쿼드라","아처","손톤","빌레포트","미즈타니"],"short":"대중차·업무차·성능차의 다양한 제조사","body":"쿼드라, 아처, 손톤, 빌레포트, 미즈타니는 2077년 나이트 시티에서 모델을 확인할 수 있는 차량 브랜드다. 도시의 대형 세단과 소형 대중차, 작업용 운송과 성능을 강조한 차량은 같은 고객을 겨냥하지 않는다. 노마드가 개조한 차량에는 제조 당시의 용도와 다른 보강 및 수리 이력이 있을 수 있다. 기업 공용차와 개인 소유 차량이 같은 모델을 사용해도 운전자와 운행 목적, 정비 상태는 각각 다르다. 컴뱃 캡은 위험 지역의 택시와 연결되는 브랜드이며, 리비어 쿠리어 서비스는 배달과 화물 서비스에 속한다. 데커 다나카 앤 로저스는 운송 사업의 다른 주체이고 델라메인과 오비탈 에어는 각각 차량 및 항공·궤도 운송에 중심을 둔다. 계약의 종류는 승객의 이동, 화물 납기, 안전 보장과 책임 범위를 달리 정한다. 회사 소유 차량과 외부 운전자가 같은 상표를 사용해도 업체의 모든 내부 데이터에 접근할 권한이 생기지는 않는다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":204},{"title":"배드랜드 남부 산업","group":"도시","keywords":["남부배드랜드","바이오테크니카플랫","단백질농장","라구나벤드"],"short":"단백질 생산 단지와 수몰 마을","body":"남부에는 바이오테크니카 플랫의 대규모 식량 생산 시설과 잭슨 평야의 전력 설비가 있다. 단백질 농장은 도시 상점으로 이어지는 기업 식량 공급망의 일부다. 라구나 벤드는 저수지 조성으로 수몰된 마을이며, 옛 주민의 기억과 물속 건물이 남아 있다. 작동하는 생산 단지와 가라앉은 옛 거주지는 같은 바깥 도로망에 접하지만 관리 주체와 방문 목적이 다르다. 댐, 저수지, 생산 시설이 황무지를 비어 있는 사막 이상의 장소로 만든다. 동부 배드랜드의 선셋 모텔은 외곽 도로의 숙박·정차 거점이며, 매립지는 도시에서 반출한 폐기물이 쌓이는 지대다. 바람 농장의 발전 설비와 레드 피크 일대의 트레일러 주거는 사막 도로에 서로 다른 수요를 만든다. 벌판의 가동 시설 주변과 폐기물 구역은 같은 형태의 출입 관리를 받지 않는다. 건조한 대지, 오염, 열린 도로는 이동과 생활을 제약하고, 시가지와 물리적으로 가까운 곳도 공공 서비스의 밀도는 다르다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":206},{"title":"고급차와 오토바이 회사","group":"기업","keywords":["레이필드","에레라","셰빌론","야이바","아치"],"short":"고급 세단과 독자 디자인의 이륜차","body":"레이필드는 고급 자동차로 알려졌고, 에레라와 셰빌론은 별도의 차량 제품군을 가진다. 야이바와 아치 모터사이클, 브레넌 사이클스는 이륜차 시장과 연결된다. 도심의 기업 고객, 배드랜드 장거리 운전자, 야간 거리의 오토바이 소유자는 다른 조건을 본다. 같은 차량의 개조형과 일반 공장 출고 모델은 외관만 비슷할 수 있다. 제품을 제조하는 회사와 차량 클럽, 차량을 빌려 주는 업체는 법적 지위가 다르다. 쿼드라, 아처, 손톤, 빌레포트, 미즈타니는 2077년 나이트 시티에서 모델을 확인할 수 있는 차량 브랜드다. 도시의 대형 세단과 소형 대중차, 작업용 운송과 성능을 강조한 차량은 같은 고객을 겨냥하지 않는다. 제타테크는 공중 차량과 드론, 전자 기술에서 이름이 확인된다. 아카리 중공업은 기업 목록의 산업 조직이며, 오비탈 에어는 항공 장비의 단순 제조 브랜드라기보다 승객·화물 운송과 시설 운영이 중요한 회사다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"기업 목록 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Corporation"}],"priority":208},{"title":"모로 록과 NCX","group":"도시","keywords":["모로록","스페이스포트","NCX","오비탈에어"],"short":"국제·달행 교통을 연결하는 우주 항만","body":"모로 록의 옛 지형이 있던 자리에는 나이트 시티 국제 및 달행 스페이스포트가 운영된다. 오비탈 에어는 이 시설에 깊게 관여하며, 여러 터미널이 항공사와 서비스 등급에 따라 다른 운송을 처리한다. 처음 계약에서 구상한 매스 드라이버 사업과 실제 공항 건설은 서로 다른 경과를 밟았다. 장거리 항공과 궤도행 이동이 같은 시설에 걸려 있어 일반 항공 승객, 우주편 예약자, 시설 출입 인력의 동선과 검사가 갈린다. 나이트 시티의 해안에는 아라사카가 통제하는 워터프론트, 노스사이드의 창고·부두, 도심과 연결되는 상업 시설이 들어선다. 카고 베이와 에부니케는 산업 항만이 접객지의 외관과 다르게 쓰이는 사례다. 항공·궤도 화물은 모로 록의 NCX를 경유할 수 있고, 육상 호송은 배드랜드 도로로 이어진다. 하역이나 기업 자재 이동에는 현장 근무 권한이 따르고, 호텔 투숙 정보나 소매 주문이 같은 서류로 처리되지는 않는다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":210},{"title":"도시 소형차와 특수 차량","group":"기업","keywords":["미즈타니","마히르모터스","마키가이","카우카즈","상용차"],"short":"좁은 거리의 대중차부터 작업 차량까지","body":"마키가이와 마히르 모터스, 미즈타니는 도시 이동에 볼 수 있는 차량 제조사다. 카우카즈는 무거운 적재와 운송에 적합한 상용 차량으로 알려졌다. 가부키의 좁은 길과 배드랜드의 열린 도로에서는 적합한 차량의 크기와 역할이 다르다. 제조사의 상표를 공유하더라도 광고에 내세우는 개인용 모델과 물류·기업이 가동하는 업무 차량은 정비와 운용 계약이 다르다. 구매가와 책임 보험도 모델에 따라 나뉜다. 컴뱃 캡은 위험 지역의 택시와 연결되는 브랜드이며, 리비어 쿠리어 서비스는 배달과 화물 서비스에 속한다. 데커 다나카 앤 로저스는 운송 사업의 다른 주체이고 델라메인과 오비탈 에어는 각각 차량 및 항공·궤도 운송에 중심을 둔다. 계약의 종류는 승객의 이동, 화물 납기, 안전 보장과 책임 범위를 달리 정한다. 회사 소유 차량과 외부 운전자가 같은 상표를 사용해도 업체의 모든 내부 데이터에 접근할 권한이 생기지는 않는다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":212},{"title":"드라이 크릭 경계","group":"도시","keywords":["드라이크릭","경계검문소","유카","국경"],"short":"자유도시 바깥과 이어지는 통행 관문","body":"드라이 크릭은 외곽 통행과 국경 검사 자료에 등장하는 경계 지대다. 경계 검문소는 나이트 시티 안의 일반 교통 단속과 다른 방식으로 외부 차량과 이동 서류를 확인한다. 유카는 경계 일대의 바깥 정착 지점이다. 국경의 존재는 도시가 신미합중국의 평범한 시 행정 구역과 같은 지위를 갖지 않는다는 것을 보여 준다. 같은 차라도 사람, 화물, 소속과 거래 허가가 다르면 장거리 통행의 조건이 달라진다. 도시의 관할은 시경계, 기업 사유지, 퍼시피카의 장벽으로 여러 차례 갈린다. NCPD가 담당하는 도심 도로, 직원 카드가 필요한 기업 창고, 바게스트가 직접 통제하는 도그타운은 대응 기관부터 다르다. 배드랜드 국경 검문은 시가지에서 이뤄지는 교통 검사와 별개다. 같은 장소를 지나는 기차나 차량도 정류장과 하역 지점의 권한 규정을 따른다. 지역 주민, 정식 계약 인력, 외부 철도·항공 이용객은 서로 다른 서류와 신원 확인 절차를 만날 수 있다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"나이트 시티 경찰국 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0%20%EA%B2%BD%EC%B0%B0%EA%B5%AD"},{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"},{"label":"바게스트(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B0%94%EA%B2%8C%EC%8A%A4%ED%8A%B8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":214},{"title":"기업 숙박과 접객","group":"기업","keywords":["콘페키플라자","바이오테크니카호텔","기업접객","귀빈"],"short":"고급 숙박과 기업 보안이 결합한 업종","body":"콘페키 플라자는 아라사카 워터프론트의 고급 숙박 시설, 바이오테크니카 호텔은 별도의 기업명과 입지를 가진 접객 시설이다. 예약과 결제, 출입 통제, 귀빈의 이동, 직원의 후방 업무가 층과 구역에 따라 나뉜다. 행사장은 외부 초대를 받을 수 있으나 관리·경비 구역은 같은 예약으로 열리지 않는다. 노텔 모텔이나 외곽 선셋 모텔은 가격대와 고객, 이동 목적이 다른 체류 시설이다. 기업 직원의 카드, 외부 용역 계약, 방문객의 초대는 대개 서로 다른 공간에 접근할 수 있게 한다. 금융과 경비, 의료와 식품 연구처럼 같은 법인의 사무 영역도 업무 구조 및 기밀 수준은 다르다. 공식 부서에서 빼낸 장비와 기업 외부 시장에 정식으로 판매한 제품은 소유 확인이 달라진다. 거래 상대나 중개인은 연락망을 보유할 수 있으나 해당 회사의 공식 지위를 갖는 것은 아니다. 회사 부지 밖에서도 계약의 책임 관계가 남는다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"},{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":216},{"title":"메가빌딩과 집합주택","group":"도시","keywords":["메가빌딩","H10","H8","복합주거","승강기"],"short":"주거·상점·교통을 층별로 쌓은 건물","body":"메가빌딩은 수많은 주거 공간을 수직으로 쌓아 식당과 상점, 통로와 공용 시설을 한 주소에 묶은 복합주택이다. 리틀 차이나의 H10과 재팬타운의 H8은 별개의 건물이며, H8에는 돌 업소 클라우드가 있다. 같은 건물 안에서도 주거층, 상업 시설, 유지보수 구역은 사용자와 관리 규칙이 다르다. 지상 로비나 엘리베이터 옆에 사람이 몰리고, 에너지·주거 관리 문제는 가구뿐 아니라 점포의 영업에도 영향을 준다. 리틀 차이나에는 조밀한 고층 주거, 상가, 의료 시설이 맞물린다. 메가빌딩 H10은 주거 기능과 내부 공용 공간을 갖춘 대형 복합 건물이다. 엄랜드 스트리트에는 미스티의 에소테리카와 빅터의 클리닉이 가까이 자리한다. 애프터라이프는 용병의 일거리와 평판이 교차하는 바이며, 라이엇은 별도의 나이트클럽이다. 의료 시설이 있다고 해서 모든 골목이 같은 치안을 누리는 것은 아니다. 좁은 출입구와 건물 안쪽 복도가 거리와 점포를 잇는다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":218},{"title":"기업 내부 권한과 계약","group":"기업","keywords":["사원증","기업계약","부서권한","보안인가","접근권"],"short":"고용과 현장 출입의 서로 다른 승인","body":"기업 직원의 카드, 외부 용역 계약, 방문객의 초대는 대개 서로 다른 공간에 접근할 수 있게 한다. 금융과 경비, 의료와 식품 연구처럼 같은 법인의 사무 영역도 업무 구조 및 기밀 수준은 다르다. 공식 부서에서 빼낸 장비와 기업 외부 시장에 정식으로 판매한 제품은 소유 확인이 달라진다. 거래 상대나 중개인은 연락망을 보유할 수 있으나 해당 회사의 공식 지위를 갖는 것은 아니다. 회사 부지 밖에서도 계약의 책임 관계가 남는다. 아라사카는 기업과 중요 인물을 지키는 경비 업무를 큰 사업으로 삼는다. 시설과 차량 경비, 고위 인물의 호위, 정보 수집과 내부 방첩은 배치와 권한이 다르다. 타케무라 고로와 오다 산다유는 서로 다른 보호 대상과 경력을 가지며 모든 사설 경비원을 대표하지 않는다. 나이트 시티에서 아라사카의 회사 부지에 들어갈 때 다른 지점이나 일반 도로와 같은 확인 절차가 적용되지는 않는다.","sources":[{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"}],"priority":220},{"title":"도시의 항만과 물류","group":"도시","keywords":["하역","항만물류","카고베이","기업부두","에부니케"],"short":"기업 부두와 공업 창고가 나뉜 운송망","body":"나이트 시티의 해안에는 아라사카가 통제하는 워터프론트, 노스사이드의 창고·부두, 도심과 연결되는 상업 시설이 들어선다. 카고 베이와 에부니케는 산업 항만이 접객지의 외관과 다르게 쓰이는 사례다. 항공·궤도 화물은 모로 록의 NCX를 경유할 수 있고, 육상 호송은 배드랜드 도로로 이어진다. 하역이나 기업 자재 이동에는 현장 근무 권한이 따르고, 호텔 투숙 정보나 소매 주문이 같은 서류로 처리되지는 않는다. 아라사카 워터프론트는 왓슨의 다른 생활 구역과 구별되는 기업 통제 항만이다. 주된 공간은 하역 시설, 기업 부지, 보안 통행로이며 일반 노점 거리와 달리 근무자와 차량의 출입 자격이 중요하다. 콘페키 플라자는 이곳에 있는 고급 호텔로, 숙박과 기업 접객, 보안 통제가 결합한 장소다. 호텔의 고객과 부두의 하역 인력, 경비 회사의 교대조는 같은 해안에 오더라도 서로 다른 통행 경로와 신분 확인을 거친다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"}],"priority":222},{"title":"유로 비즈니스와 전자 기업","group":"기업","keywords":["유로비즈니스머신즈","EBM","IEC","기업연산","설비"],"short":"연산·전자·산업 설비를 보급하는 회사","body":"유로 비즈니스 머신즈는 기업 전자·연산 분야에 연결되며, EBM이라는 이름은 도그타운의 스타디움 이름에도 남아 있다. 인터내셔널 일레트릭 코퍼레이션과 마이크로테크는 다른 기업 계통이다. 도시 시설에 남은 스폰서 명칭과 현재 시설을 실제로 운영하는 세력은 다를 수 있다. 서버와 산업 설비의 판매업체, 설치·유지보수 업체, 시설의 지역 책임자는 장비가 한 장소에 있어도 같은 계약을 맡지 않는다. 서초 일렉트로닉스는 전자 및 사이버웨어 관련 제품이 확인되는 한국계 회사다. 후유츠키 일렉트로닉스, 사이테크와는 서로 다른 제조사이고, 같은 제품 계열이라도 각자의 설계와 시장이 있다. 코프-버드 같은 건설업체와 나이트 코프, 시의 공공 사업은 같은 도시 재개발에 다른 방식으로 참여한다. 시는 허가와 계약 조건을 정하고, 민간 사업자는 자금과 시공, 때로 시설 운영을 맡는다. 도심의 제염과 기업 플라자 재건, 퍼시피카 관광지 공사 중단은 공사 구조와 자금 사정이 다르다.","sources":[{"label":"기업 목록 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Corporation"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":224},{"title":"자유도시 기업 조달","group":"기업","keywords":["기업조달","자유무역","부두계약","도시후원"],"short":"독립 도시의 계약·수출입·경비","body":"나이트 시티가 자유도시라는 지위는 여러 기업이 법인과 부지, 거래 거점을 유지하는 이유 가운데 하나다. 해운과 육상 운송, 항공·궤도 수송은 서로 다른 통행 규정을 가진다. 시정부의 공공 계약, 나이트 코프의 후원, 국제 기업의 사유 항만과 정식 군수 대금은 같은 재정 흐름이 아니다. 수입 물품과 장물의 구별에는 납품 서류와 거래 상대의 신뢰가 필요하다. 도그타운의 시장은 이 체계와 접하지만 바게스트의 별도 관리를 받는다. 메가코프는 생산과 판매를 넘어 군수, 고용, 교육, 의료, 사설 보안이나 인프라에 관여한다. 아라사카는 금융·경비·무기, 밀리테크는 군수와 국가 조달, 캉 타오는 스마트 무기, 바이오테크니카는 생명공학에 특화된다. 나이트 코프는 도시 개발·운영과 깊게 연결된다. 같은 크기의 회사가 동일한 무장과 법적 지위를 가지지는 않는다. 제조 업체, 민간 계약 업체, 시의 후원 기업은 계약 종류에 따라 다른 권한을 행사한다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"나이트 시티 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"기업 목록 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Corporation"}],"priority":228},{"title":"엘 코요테 코호","group":"도시","keywords":["코요테","엘코요테코호","웰즈","글렌"],"short":"웰즈 가족이 돌보는 헤이우드 공동체의 바","body":"엘 코요테 코호는 글렌에서 웰즈 가족과 지역 주민의 관계가 드러나는 바다. 마마 웰즈와 재키의 생활권에 있는 장소로, 비즈니스 축의 고급 클럽과 달리 오래 찾아온 손님과 친척의 기억이 쌓인다. 주변 사람들의 만남과 추모, 술자리와 연락이 가능한 공간이며, 같은 글렌의 엠버스나 시청과는 성격이 다르다. 여러 세대가 공유하는 단골 관계는 갱단의 직급이나 기업 계약만으로 설명되지 않는다. 글렌에는 나이트 시티 시청과 공공 공간이 있고, 지역 상점과 고급 접객 시설이 함께 있다. 엘 코요테 코호는 웰즈 가족과 헤이우드 주민의 접점인 바다. 라 카트리나, 엠버스, 파드레의 거점은 각기 다른 고객과 목적을 가진 장소다. 시청은 도시의 공식 행정과 선거 정치가 작동하는 기관이며, 주변 바와 상점은 지역 관계와 소문이 돌고 도는 생활 기반이다. 두 권력층이 같은 거리에서 만나도 같은 담당자나 승인 경로를 거치지 않는다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":230},{"title":"아라사카 타워와 저택","group":"도시","keywords":["아라사카타워","아라사카저택","기업본부","사유지"],"short":"도심 업무 거점과 노스 오크 가족 사유지","body":"기업 플라자의 아라사카 타워는 나이트 시티 사업과 조직 권력의 상징이며 공식 방문객과 직원이 다른 층으로 향한다. 노스 오크의 아라사카 저택은 가문과 귀빈을 위한 사유지로서 타워의 일반 업무 기능과 구별된다. 2023년 파괴된 옛 타워의 역사와 2077년 운영되는 건물의 현재 상태도 구분해야 한다. 경비 책임과 접객 절차가 기업 명의에서 시작되더라도 두 부지는 업무, 사생활, 의전 측면에서 같은 장소가 아니다. 기업 플라자는 도심의 기업 권력이 건축으로 집중된 구역이다. 아라사카 타워는 아라사카의 나이트 시티 거점이고, 더 뷰는 고급 쇼핑몰이고 서쪽의 엠퍼시는 브레인댄스 클럽이다. 바깥 광장과 도로는 시민이 지나는 공간이지만 사무층과 통신·경비 시설은 회사가 접근 권한을 통제한다. 과거 방사능 피해 지대가 재건된 자리여서 화려한 건물과 기념 공간이 폭발의 기록과 지리적으로 맞닿아 있다. 계약자와 방문객의 출입 허가 범위도 구별된다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"}],"priority":234},{"title":"낡은 도심과 재건","group":"도시","keywords":["핫존","도심재건","화해공원","방사능"],"short":"2023년의 폐허와 재개발의 겹침","body":"도심 핵폭발 뒤 피해 지대는 건물 붕괴, 오염, 기반 시설 중단을 겪었다. 도심 외곽에 거처와 상업이 이동했고 왓슨은 한동안 피난과 일자리의 거점이 됐다. 이후 제염과 재개발이 진행되면서 기업 플라자와 고층 업무 구역이 새로 자리 잡았다. 화해의 공원 같은 기념 공간은 재건을 도시 정체성에 묶는다. 같은 지역의 화려한 광고와 오래된 피난 기록은 각기 다른 시기의 나이트 시티를 보여 준다. 재건의 비용과 혜택은 지구마다 균등하게 분배되지 않았다. 사업가 리처드 나이트는 부패와 혼란에 대응하겠다며 기업 투자를 끌어들여 코로나도 시티를 설계했다. 도시 건설에는 거대기업의 자금과 이해관계가 시작부터 얽혔다. 1998년 그가 암살된 뒤 도시는 나이트 시티로 개명됐다. 후원 기업과 범죄조직의 충돌은 근대적이고 질서 있는 계획도시라는 목표를 오래 유지하기 어렵게 했다. 오늘날의 나이트 코프, 시정부, 기업 플라자는 설립자 영웅담과 별개로 각자의 계약과 권한을 지닌다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":238},{"title":"도시 경계와 관할","group":"도시","keywords":["관할","검문","기업구역","도시경계"],"short":"시 경찰·기업·바게스트의 서로 다른 권한","body":"도시의 관할은 시경계, 기업 사유지, 퍼시피카의 장벽으로 여러 차례 갈린다. NCPD가 담당하는 도심 도로, 직원 카드가 필요한 기업 창고, 바게스트가 직접 통제하는 도그타운은 대응 기관부터 다르다. 배드랜드 국경 검문은 시가지에서 이뤄지는 교통 검사와 별개다. 같은 장소를 지나는 기차나 차량도 정류장과 하역 지점의 권한 규정을 따른다. 지역 주민, 정식 계약 인력, 외부 철도·항공 이용객은 서로 다른 서류와 신원 확인 절차를 만날 수 있다. 드라이 크릭은 외곽 통행과 국경 검사 자료에 등장하는 경계 지대다. 경계 검문소는 나이트 시티 안의 일반 교통 단속과 다른 방식으로 외부 차량과 이동 서류를 확인한다. 유카는 경계 일대의 바깥 정착 지점이다. 국경의 존재는 도시가 신미합중국의 평범한 시 행정 구역과 같은 지위를 갖지 않는다는 것을 보여 준다. 같은 차라도 사람, 화물, 소속과 거래 허가가 다르면 장거리 통행의 조건이 달라진다.","sources":[{"label":"나이트 시티 경찰국 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0%20%EA%B2%BD%EC%B0%B0%EA%B5%AD"},{"label":"바게스트(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B0%94%EA%B2%8C%EC%8A%A4%ED%8A%B8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"}],"priority":242},{"title":"나이트 시티 기원","group":"도시","keywords":["리처드나이트","코로나도시티","나이트인터내셔널","건설"],"short":"계획도시의 건립과 이름의 변화","body":"사업가 리처드 나이트는 부패와 혼란에 대응하겠다며 기업 투자를 끌어들여 코로나도 시티를 설계했다. 도시 건설에는 거대기업의 자금과 이해관계가 시작부터 얽혔다. 1998년 그가 암살된 뒤 도시는 나이트 시티로 개명됐다. 후원 기업과 범죄조직의 충돌은 근대적이고 질서 있는 계획도시라는 목표를 오래 유지하기 어렵게 했다. 오늘날의 나이트 코프, 시정부, 기업 플라자는 설립자 영웅담과 별개로 각자의 계약과 권한을 지닌다. 리처드 나이트가 사라진 뒤 범죄조직과 부패한 사업 세력이 건설 도시의 공백을 파고들었다. 기업도 계약과 자산을 지키기 위해 사설 경비와 무장 조직을 확대하며 영향력을 되찾으려 했다. 폭력단 전쟁은 거리의 범죄조직과 회사 세력의 갈등이며 2020년대에 벌어진 4차 기업 전쟁과 구별된다. 이후에도 치안 공백을 어떤 기관이 채울지, 사기업의 안전이 누구에게 돌아갈지는 지역마다 다르게 남았다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":246},{"title":"폭력단 전쟁과 기업 치안","group":"도시","keywords":["폭력단전쟁","범죄조직","기업치안","개명"],"short":"건립 뒤의 범죄조직과 기업 세력 충돌","body":"리처드 나이트가 사라진 뒤 범죄조직과 부패한 사업 세력이 건설 도시의 공백을 파고들었다. 기업도 계약과 자산을 지키기 위해 사설 경비와 무장 조직을 확대하며 영향력을 되찾으려 했다. 폭력단 전쟁은 거리의 범죄조직과 회사 세력의 갈등이며 2020년대에 벌어진 4차 기업 전쟁과 구별된다. 이후에도 치안 공백을 어떤 기관이 채울지, 사기업의 안전이 누구에게 돌아갈지는 지역마다 다르게 남았다. 도심 핵폭발 뒤 피해 지대는 건물 붕괴, 오염, 기반 시설 중단을 겪었다. 도심 외곽에 거처와 상업이 이동했고 왓슨은 한동안 피난과 일자리의 거점이 됐다. 이후 제염과 재개발이 진행되면서 기업 플라자와 고층 업무 구역이 새로 자리 잡았다. 화해의 공원 같은 기념 공간은 재건을 도시 정체성에 묶는다. 같은 지역의 화려한 광고와 오래된 피난 기록은 각기 다른 시기의 나이트 시티를 보여 준다. 재건의 비용과 혜택은 지구마다 균등하게 분배되지 않았다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":250},{"title":"나이트 시티 방송권","group":"도시","keywords":["라디오","모로록라디오","그라울FM","바디히트","HKGN"],"short":"지역 음악과 뉴스가 뒤섞인 방송 문화","body":"나이트 시티의 라디오는 차량, 바, 상점과 거주지에서 음악 및 뉴스를 공급한다. 방송국마다 선곡 장르와 청취자층이 갈리고, 전문 클럽이나 유흥 시설의 현장 음원은 방송과 별도의 소비 문화다. 언론사의 보도와 DJ의 사설을 같은 종류의 정보로 다루지 않는다. 긴박한 사건이 뉴스로 옮겨 가면 목격과 보도 시점 사이에 시차가 생기며, 같은 사건도 기업 매체와 지역 대화에서 다른 방식으로 알려질 수 있다. 88.9 퍼시픽 드림스, 89.3 라디오 벡셀스트롬, 91.9 로열 블루, 98.7 바디 히트, 107.3 모로 록 라디오는 다른 채널이다. 모로 록의 맥시멈 마이크는 도시의 오래된 음악을 소개하고, 도그타운에 기반을 둔 89.7 그라울 FM에서는 애시가 진행한다. 102.0 HKGN에서는 엣지러너와 연결된 곡들을 들을 수 있다. 바게스트도 자체 방송을 운영하므로 공개 음악 채널의 보도와 검문 당국의 공지는 발신 조직을 구별할 수 있다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"사이버펑크 2077 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077"},{"label":"2077년 라디오 방송국 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Radio_Stations"},{"label":"엣지러너 2 업데이트 · 공식 사이트","url":"https://www.cyberpunk.net/en/news/52120/check-out-whats-coming-to-night-city-in-the-edgerunners-2-update-for-cyberpunk-2077"}],"priority":254},{"title":"도시의 주거 격차","group":"도시","keywords":["주거","임대","기업주택","트레일러","부촌"],"short":"고층 집합주택부터 언덕 대저택까지","body":"왓슨의 메가빌딩, 차터 힐의 기업 직원용 아파트, 노스 오크의 대저택, 란초 코로나도의 기업 개발 주택은 같은 도시에서도 기능과 관리 방식이 다르다. 퍼시피카에는 중단된 재개발과 노후 시설이 남고, 배드랜드 바깥길에는 트레일러 정착지가 있다. 집의 가격과 지위뿐 아니라 교통편, 공공 경비, 계약 기간, 수리 서비스를 같이 봐야 한다. 기업 사택의 고용 안정과 생활환경은 회사와 주거지를 분리해 판단하기 어렵다는 사실을 보여 준다. 메가빌딩은 수많은 주거 공간을 수직으로 쌓아 식당과 상점, 통로와 공용 시설을 한 주소에 묶은 복합주택이다. 리틀 차이나의 H10과 재팬타운의 H8은 별개의 건물이며, H8에는 돌 업소 클라우드가 있다. 같은 건물 안에서도 주거층, 상업 시설, 유지보수 구역은 사용자와 관리 규칙이 다르다. 지상 로비나 엘리베이터 옆에 사람이 몰리고, 에너지·주거 관리 문제는 가구뿐 아니라 점포의 영업에도 영향을 준다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":258},{"title":"도시의 먹거리 상권","group":"도시","keywords":["가판대","재래시장","해안식당","시장골목","단백질"],"short":"시장과 기업식품의 다른 판매 경로","body":"가부키 라운드어바웃과 헤이우드 멜카도 소노라는 지역 손님이 대면으로 거래하는 시장이다. 웰스프링스의 해안 식당과 도심의 고급 레스토랑은 가격과 고객층이 다르다. 올 푸드 같은 브랜드와 바이오테크니카의 원료 생산은 대규모 식품 공급 쪽에 걸쳐 있다. 가격, 유통기한, 품질보증은 노점과 체인점, 기업 계약 식당에 동일하게 적용되지 않는다. 구내식당이나 포장 음식점은 일터가 가까운 지역의 식사 시간과 이동 경로를 반영한다. 가부키 라운드어바웃 주변에는 가격대가 낮은 상품과 여러 소규모 상점이 모인다. 리지의 바는 목스와 관련된 브레인댄스 업소이고, 호오는 별도의 유흥 공간이다. 레지나 존스의 거점과 노텔 모텔도 이 생활권에 걸쳐 있다. 가부키는 과거 일본계 기업 영향의 흔적을 이름에 남겼다. 복잡한 골목과 가판대가 이동 동선을 나누며, 시장의 가격 경쟁과 별개로 상품의 보증, 출처, 위생 상태는 점포마다 차이가 크다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https:// :"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%EC%98%A4%EB%AA%A8%ED%86%A0%20%EC%B9%98%EC%9A%94.png"},"내쉬":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%EB%82%B4%EC%89%AC.png"},"패트리샤":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%ED%8C%A8%ED%8A%B8%EB%A6%AC%EC%83%A4.png"},"레이첼 캐시치":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%EB%A0%88%EC%9D%B4%EC%B2%BC%20%EC%BA%90%EC%8B%9C%EC%B9%98.png"},"라파엘 페레즈":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%EB%9D%BC%ED%8C%8C%EC%97%98%20%ED%8E%98%EB%A0%88%EC%A6%88.png"},"레이저 휴즈":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%EB%A0%88%EC%9D%B4%EC%A0%80%20%ED%9C%B4%EC%A6%88.png"},"로버트 윌슨":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%EB%A1%9C%EB%B2%84%ED%8A%B8%20%EC%9C%8C%EC%8A%A8.png"},"앤서니 해리스":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%EC%95%A4%EC%84%9C%EB%8B%88%20%ED%95%B4%EB%A6%AC%EC%8A%A4.png"},"프랭크 노스트라":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%ED%94%84%EB%9E%AD%ED%81%AC%20%EB%85%B8%EC%8A%A4%ED%8A%B8%EB%9D%BC.png"},"빌 미첼":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%EB%B9%8C%20%EB%AF%B8%EC%B2%BC.png"},"니나 크라비츠":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%EB%8B%88%EB%82%98%20%ED%81%AC%EB%9D%BC%EB%B9%84%EC%B8%A0.png"},"비쿠 형":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%EB%B9%84%EC%BF%A0%20%ED%98%95.png"},"비쿠 동생":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%EB%B9%84%EC%BF%A0%20%EB%8F%99%EC%83%9D.png"},"아리프 이크발":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%EC%95%84%EB%A6%AC%ED%94%84%20%EC%9D%B4%ED%81%AC%EB%B0%9C.png"},"사토 히로미":{"kind":"individual","detail":"","source":"사용자 프로필 이미지","src":"%ED%94%84%EB%A1%9C%ED%95%84%20%EC%9D%B4%EB%AF%B8%EC%A7%80/%EC%82%AC%ED%86%A0%20%ED%9E%88%EB%A1%9C%EB%AF%B8.png"}}}</script>
  <script>
    'use strict';
    const byId = id => document.getElementById(id);
    const dataset = JSON.parse(byId('archive-data').textContent);
    const tabs = Array.from(document.querySelectorAll('[data-tab]'));
    const lists = { characters: dataset.characters, lore: dataset.lore };
    const state = {
      characters: { group: '', search: '', record: 0, portrait: '' },
      lore: { group: '', search: '', record: 0 }
    };
    let view = 'world';
    let current;
    let noticeTimer;

    function element(tag, label, className) {
      const node = document.createElement(tag);
      node.textContent = label;
      if (className) node.className = className;
      return node;
    }

    function clear(id) {
      const target = byId(id);
      target.replaceChildren();
      return target;
    }

    function showSources(target, sources) {
      for (const source of sources) {
        const row = element('li', '');
        const link = element('a', source.label);
        link.href = source.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        row.append(link);
        target.append(row);
      }
    }

    function announce(message) {
      clearTimeout(noticeTimer);
      byId('notice').textContent = message;
      noticeTimer = setTimeout(() => { byId('notice').textContent = ''; }, 3200);
    }

    async function copy(value) {
      try {
        await navigator.clipboard.writeText(value);
        announce('클립보드에 복사했습니다.');
        return;
      } catch {}
      const field = element('textarea', value);
      field.setAttribute('aria-label', '복사할 텍스트');
      field.setAttribute('readonly', '');
      Object.assign(field.style, { position: 'fixed', top: '0', opacity: '0' });
      const previous = document.activeElement;
      document.body.append(field);
      let copied = false;
      try {
        field.select();
        copied = document.execCommand('copy');
      } catch {} finally {
        field.remove();
      }
      if (previous instanceof HTMLElement) previous.focus({ preventScroll: true });
      announce(copied ? '클립보드에 복사했습니다.' : '복사가 제한되었습니다. 본문을 선택해 복사할 수 있습니다.');
    }

    function showPortrait(name) {
      const frame = byId('portrait-reference');
      const image = byId('portrait-image');
      const note = byId('portrait-note');
      const portrait = dataset.portraits[name];
      frame.hidden = !name;
      image.hidden = !portrait;
      if (!portrait) {
        image.removeAttribute('src');
        image.alt = '';
        note.textContent = name ? '확인된 이미지 없음 · 아래 외모 설명 참고' : '';
        return;
      }
      const kinds = { individual: '개별 이미지', group: '단체 이미지', scene: '장면 이미지' };
      image.alt = name + ' 참고 이미지';
      image.setAttribute('src', portrait.src);
      note.textContent = [kinds[portrait.kind], portrait.source, portrait.detail].filter(Boolean).join(' · ');
    }

    function displayTitle(record) {
      return record.rank ? record.rank + '위 ' + record.title : record.title;
    }

    function showDetail(record) {
      current = record;
      byId('detail').hidden = !record;
      const isCharacter = view === 'characters';
      showPortrait(isCharacter && record ? record.title : '');
      if (!record) return;
      byId('detail-title').textContent = displayTitle(record);
      byId('detail-group').textContent = record.group;
      byId('detail-status').textContent = record.status || '';
      byId('detail-status').hidden = !record.status;
      byId('detail-short').textContent = record.short;
      const tags = clear('detail-tags');
      for (const word of record.keywords) tags.append(element('li', word));
      byId('entry-length').textContent = record.body.length.toLocaleString('ko-KR') + '자';
      const area = clear('detail-content');
      if (isCharacter) {
        const profile = element('dl', '', 'detail-body');
        for (const line of record.body.split('\n')) {
          const pivot = line.indexOf(':');
          profile.append(element('dt', line.slice(0, pivot)), element('dd', line.slice(pivot + 1).trim()));
        }
        area.append(profile);
      } else {
        area.append(element('p', record.body, 'detail-body'));
      }
      byId('sources').open = false;
      const sources = [...record.sources];
      const portrait = isCharacter ? dataset.portraits[record.title] : undefined;
      if (portrait?.sourceUrl && !sources.some(source => source.url === portrait.sourceUrl)) {
        sources.push({ label: portrait.source + ' · 이미지 출처', url: portrait.sourceUrl });
      }
      showSources(clear('entry-sources'), sources);
    }

    function normalized(text) {
      return text.toLowerCase().normalize('NFKC').replace(/[\p{P}\p{Z}\s]+/gu, '');
    }

    function renderList(preserveScroll = false) {
      const section = state[view];
      const searchTerms = section.search.trim().split(/\s+/).map(normalized).filter(Boolean);
      const records = lists[view].map((record, index) => ({ record, index })).filter(({ record }) => {
        if (section.group && section.group !== record.group) return false;
        if (section.portrait && section.portrait !== (dataset.portraits[record.title]?.kind || 'missing')) return false;
        const searchText = normalized([record.title, record.short, ...record.keywords, record.body].join(' '));
        return searchTerms.every(term => searchText.includes(term));
      });
      if (!records.some(({ index }) => index === section.record)) section.record = records[0]?.index ?? 0;
      const list = byId('entry-list');
      const offset = preserveScroll ? list.scrollTop : 0;
      list.replaceChildren();
      for (const { record, index } of records) {
        const item = element('li', '');
        const button = element('button', displayTitle(record));
        button.type = 'button';
        button.dataset.entry = String(index);
        button.setAttribute('aria-controls', 'detail');
        if (index === section.record) button.setAttribute('aria-current', 'true');
        button.append(element('span', record.short));
        item.append(button);
        list.append(item);
      }
      list.scrollTop = offset;
      byId('empty').hidden = records.length > 0;
      const unit = view === 'characters' ? '명' : '개';
      byId('results-count').textContent = records.length.toLocaleString('ko-KR') + unit + ' · 중요도순';
      showDetail(records.length && lists[view][section.record]);
    }

    function route() {
      const requested = location.hash.slice(1);
      if (requested === 'main') return;
      view = Object.hasOwn(lists, requested) ? requested : 'world';
      for (const tab of tabs) {
        if (tab.dataset.tab === view) tab.setAttribute('aria-current', 'page');
        else tab.removeAttribute('aria-current');
      }
      byId('world').hidden = view !== 'world';
      byId('catalog').hidden = view === 'world';
      if (view === 'world') return;
      const isCharacter = view === 'characters';
      byId('portrait-filter-field').hidden = !isCharacter;
      if (isCharacter) byId('portrait-filter').value = state.characters.portrait;
      byId('catalog-title').textContent = isCharacter ? '캐릭터 목록' : '로어북 목록';
      byId('filter-label').textContent = isCharacter ? '작품' : '분류';
      byId('search').value = state[view].search;
      const field = clear('filter');
      field.append(new Option(isCharacter ? '모든 작품' : '모든 분류', ''));
      const groups = [...new Set(lists[view].map(record => record.group))];
      if (isCharacter) groups.sort((a, b) => a.localeCompare(b, 'ko-KR'));
      for (const group of groups) field.append(new Option(group, group));
      field.value = state[view].group;
      renderList();
    }

    for (const block of dataset.world.split('\n\n')) {
      const [line, ...rest] = block.split('\n');
      if (line.startsWith('#')) {
        byId('world-body').append(element('h2', line.replace(/^#+ +/, '')));
        if (rest.length) byId('world-body').append(element('p', rest.join('\n')));
      } else {
        byId('world-body').append(element('p', block));
      }
    }
    byId('character-count').textContent = dataset.characters.length;
    byId('lore-count').textContent = dataset.lore.length;
    byId('world-count').textContent = dataset.world.length.toLocaleString('ko-KR') + '자';
    showSources(byId('world-sources'), dataset.worldSources);
    byId('world-copy').addEventListener('click', () => copy(dataset.world));
    byId('entry-copy').addEventListener('click', () => {
      if (current) copy([current.title, current.keywords.join(', '), current.short, current.body].join('\n\n'));
    });
    byId('body-copy').addEventListener('click', () => { if (current) copy(current.body); });
    byId('search').addEventListener('input', event => { state[view].search = event.target.value; renderList(); });
    byId('filter').addEventListener('change', event => { state[view].group = event.target.value; renderList(); });
    byId('portrait-filter').addEventListener('change', event => {
      state.characters.portrait = event.target.value;
      renderList();
    });
    byId('entry-list').addEventListener('click', event => {
      const button = event.target.closest('[data-entry]');
      if (!button) return;
      const selected = byId('entry-list').querySelector('[aria-current="true"]');
      if (selected) selected.removeAttribute('aria-current');
      button.setAttribute('aria-current', 'true');
      state[view].record = Number(button.dataset.entry);
      showDetail(lists[view][state[view].record]);
      if (matchMedia('(max-width:680px)').matches) byId('detail-title').focus();
    });
    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
