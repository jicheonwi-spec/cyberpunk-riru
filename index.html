롯한 인격 칩을 다룰 때에는 저장소의 접근과 탑재된 구성체의 상태를 따로 보아야 한다. 연구용 칩이 개별 사건에서 등장해도, 일반 데이터 샤드를 여는 것과 인격 칩의 설치·접속은 다른 작업이다. 개별 구성체와 대화하는 능력을 소개하는 광고와 자리를 비운 신체에 인격을 정착시키는 실험의 요구 사항은 다르다. 중간에 냉각 장치에서 떨어졌는지와 어느 단말이 칩을 읽었는지에 따라서도 실물이 확인된 기록의 가치가 달라진다. 용도에 따라 기판·보관 용기·신체 인터페이스의 이력을 각각 확인한다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"},{"label":"Relic · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Relic"},{"label":"Soulkiller · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Soulkiller"}],"priority":24},{"title":"운영체제 네 가지 계열","group":"사이버웨어","keywords":["운영체제","사이버덱","산데비스탄","버서크","크롬컴프레서"],"short":"넷·가속·과부하·용량 설계 구분","body":"사이버덱은 넷과 호환되는 장치에 접근하고 퀵핵을 처리하는 장비다. 산데비스탄은 신경 처리와 반응을 일시적으로 크게 가속하고, 버서크는 위험에 노출된 동안 몸의 출력과 버티는 능력을 끌어올리는 쪽에 집중한다. 크롬 컴프레서는 다른 이식 장비에 허용되는 용량을 늘리는 대신 이들처럼 고유한 작동 모드가 없는 운영체제다. 네 계열 모두 같은 중추 기능을 맡는 갈래라서 서로의 장점을 당연히 겸비하지 않는다. 작은 반사 신경 보조기나 RAM 보조 부품의 존재는 별도의 운영체제가 들어간 것과 다르다. 특정 모델의 제조사를 알아도 어떤 계열인지까지 확인해야 실제 기능을 알 수 있다. 사이버덱을 달지 않고 남은 반사 기능이 있거나, 버서크와 함께 방호용 장비를 시술한 경우가 있다. 주 장치와 보조 장치를 각각 알아보아야 순간적으로 무엇이 돌아갔는지, 다른 동작을 위한 자원이 얼마나 남는지를 판단할 수 있다. 보철 수술 기록에는 중추 슬롯의 실제 내용이 남는다.","sources":[{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"Cyberdeck · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberdeck"}],"priority":25},{"title":"나이트 시티의 갱단","group":"세력","keywords":["갱단","거리세력","텃세","보호비"],"short":"지역 상권과 범죄가 얽힌 거리 권력","body":"나이트 시티 갱단의 활동은 유흥업, 보호비, 장물, 약물, 경비, 용병 계약 등으로 나뉜다. 멜스트롬은 왓슨 공업권, 타이거 클로는 재팬타운, 발렌티노는 헤이우드, 식스 스트리트는 산토 도밍고와 인접 지역에서 잘 알려져 있다. 목스와 부두 보이즈는 각각 다른 공동체를 기반으로 삼는다. 애니멀은 경비 계약에 관여하고, 스캐빈저는 여러 지역의 느슨한 무리로 활동한다. 바게스트는 장벽 안의 군정에 가까운 통제권을 지닌다. 애니멀의 시설 경비, 타이거 클로가 출입에 관여하는 업소, 멜스트롬의 장물 거래처럼 갱단이 제공하는 서비스와 범죄는 목적에 따라 다르다. 픽서가 소개한 용병이 특정 단체의 일을 도왔다고 해서 구성원 전체와 영구 동맹을 맺는 것은 아니다. 조직은 구역과 자산의 손실, 내부 평판, 보수 조건에 따라 행동한다. 연락책의 개인 약속과 지도자의 지시, 독립적인 경비 사업자의 계약은 같은 권한을 갖지 않는다.","sources":[{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"픽서 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Fixer"}],"priority":26},{"title":"알데칼도","group":"세력","keywords":["알데칼도","브라이트패밀리","사울","팬앰","미치"],"short":"여러 가족으로 나뉜 오래된 노마드 네이션","body":"알데칼도는 후안 알데칼도가 이끈 로스앤젤레스의 도시 노동자와 공동체에서 출발한 오래된 노마드 네이션이다. 북미의 여러 패밀리가 이름을 공유하며, 나이트 시티 배드랜드에는 사울 브라이트의 패밀리가 활동한다. 이동, 호송, 차량 수리, 협상과 공동 자원 관리가 생존에 중요하다. 사회가 가족 중심이어도 기업 계약을 둘러싼 구성원의 판단은 갈라질 수 있다. 레이스 같은 라펜 쉬브와 공동 혈통 또는 같은 종류의 무장 집단이라 가정할 수 없다. 배드랜드의 브라이트 패밀리에는 사울, 팬앰, 미치, 스콜피온 등 서로 다른 역할을 가진 사람이 있다. 사울의 기업 거래 구상과 팬앰의 자율성 중시는 가족을 보호하는 방법에 관한 다른 판단이다. 미치와 스콜피온의 군 경험은 차량과 현장 작업, 네이션 밖 연락에 영향을 준다. 개별 캠프는 네이션의 모든 결정을 대리하지 않으며, 배드랜드의 도로와 거래처를 계속 이용하려면 물과 연료, 수리 부품과 시간을 관리해야 한다.","sources":[{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"알데칼도 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Aldecaldos"}],"priority":27},{"title":"맥스택","group":"국가와 공권력","keywords":["맥스택","MaxTac","사이코분대","고위험대응"],"short":"NCPD의 고위험 사이버 사이코 전담부대","body":"맥스택은 NCPD의 정예 부대이자 고위험 사이버 사이코 사건을 상대하는 전문 전력이다. 고성능 사이버웨어와 중무장 장비, 독자성이 큰 현장 지휘가 다른 경찰 부서와 구별된다. 강한 제압 능력과 함께 과잉 진압과 책임 회피 논란이 따라다닌다. 일부 요원이 과거 사이버 사이코 사건에 연루된 사례와 조직 전체를 둘러싼 소문은 구별된다. 체포와 사살은 서로 다른 결과이며, 일반 교통 단속에 호출되는 순찰대가 아니다. NCPD 전술과는 순찰대가 감당하기 어려운 중무장 총격이나 인질 사건, 대규모 군중 통제 상황에 개입한다. 특수기동대는 장비와 기동력을 요구하는 고위험 사건을 처리하고 폭동 진압팀은 차단과 비살상 통제를 중심으로 훈련된다. 맥스택은 그중에서도 위험한 사이버 사이코 사건에 특화된 조직이다. 전문 부대가 온다는 사실만으로 민간인의 안전이나 사건의 독립 수사가 보장되지는 않으며, 사건 종류에 따라 경찰 내부의 보고 경로가 다르다.","sources":[{"label":"나이트 시티 경찰국 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0%20%EA%B2%BD%EC%B0%B0%EA%B5%AD"},{"label":"맥스택 · 나무위키","url":"https://namu.wiki/w/%EB%A7%A5%EC%8A%A4%ED%83%9D"}],"priority":28},{"title":"산데비스탄 신경 가속","group":"사이버웨어","keywords":["산데비스탄","신경가속","반응가속","군용가속기"],"short":"신경 속도가 만드는 시간감각 변화","body":"산데비스탄은 일정 시간 동안 사용자의 판단과 움직임을 가속하여 몸 밖의 움직임이 느려진 것처럼 느끼게 하는 운영체제다. 활성화와 종료 사이에 급격한 체감 차이가 있고, 회복 없이 여러 차례 발동하면 신경계와 몸의 부담이 누적될 수 있다. 군용 개조의 높은 출력과 상용 모델의 지속 시간·재가동 간격은 다르다. 신경 신호가 빠르다고 관절이나 근육의 강도가 무한히 오르는 것도 아니며, 장착자는 더 빨라진 감각 아래에서도 몸을 제어해야 한다. 엣지러너의 데이비드는 군용 장치에 뛰어난 적응을 보였지만 사용의 대가를 면제받지는 않았다. 모델명이나 정확한 사양이 확인되지 않은 장치는 군용 계열로만 분류한다. 같은 구동 장치라도 신체의 어느 부위까지 가속을 따라갈 수 있는지가 관건이다. 학교와 갱단, 기업에서 목격한 데이비드의 움직임은 확실한 사례지만 제품을 개발한 기업에 남은 내부 기록까지 모두 알려진 것은 아니다.","sources":[{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"},{"label":"사이버웨어/신경계 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%8B%A0%EA%B2%BD%EA%B3%84"}],"priority":29},{"title":"나이트 코프","group":"기업","keywords":["나이트코프","NightCorp","나이트인터내셔널","도시인프라"],"short":"나이트 시티 설립사와 인프라 후원 기업","body":"나이트 코프는 나이트 시티 설립 과정의 나이트 인터내셔널에서 이어진 기업으로, 재건과 도시 기반 시설에 깊이 관여한다. NCPD를 후원하지만 시 경찰의 공식 조직을 회사의 한 부서처럼 볼 수는 없다. 재개발 인력과 도시 사업, 외부에 드러나지 않는 연구 의혹은 같은 공개 수준을 가지지 않는다. 시정부와 주민, 민간 계약 업체는 같은 사업을 도시 정비, 일자리, 정보 수집처럼 서로 다른 이해로 볼 수 있다. 나이트 시티가 자유도시라는 지위는 여러 기업이 법인과 부지, 거래 거점을 유지하는 이유 가운데 하나다. 해운과 육상 운송, 항공·궤도 수송은 서로 다른 통행 규정을 가진다. 시정부의 공공 계약, 나이트 코프의 후원, 국제 기업의 사유 항만과 정식 군수 대금은 같은 재정 흐름이 아니다. 수입 물품과 장물의 구별에는 납품 서류와 거래 상대의 신뢰가 필요하다. 도그타운의 시장은 이 체계와 접하지만 바게스트의 별도 관리를 받는다.","sources":[{"label":"기업 목록 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Corporation"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"나이트 시티 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"}],"priority":30},{"title":"총기의 세 작동 계열","group":"장비","keywords":["파워무기","테크무기","스마트무기","총기분류","현장무장"],"short":"발사와 조준 원리에 따른 세 계열","body":"파워 무기는 실탄의 운동 에너지를 중심으로 하는 계열이고, 일부는 단단한 표면에서 튀는 탄의 경로 정보를 제공한다. 테크 무기는 전자기력으로 투사체를 가속하며 충전 시 재료에 대한 관통 성능이 강해진다. 스마트 무기는 센서와 연결되어 유도하는 미세 투사체를 쓰며, 유도에 스마트 링크나 각인형 인터페이스가 관여한다. 각 계열 안에서도 권총·산탄총·소총처럼 총기의 형태는 여럿이다. 조준 화면을 띄워 주는 장치, 발사체의 운동을 바꾸는 장치, 총을 쥔 사람에게 가해지는 반동을 처리하는 부품은 각자 역할이 있다. 같은 크기의 무기라도 제조사와 모델에 따른 사양이 다르다. 기술 분류를 확인할 때는 장비의 외형부터 발사체의 성질, 조준에 관여한 장치의 흔적까지 함께 살펴본다. 동일한 기업에서 만든 화기를 들었더라도 모델이 바뀌면 충전에 걸리는 상태나 안구에 표시되는 표적 정보가 바뀐다. 휴대 방식과 작동 방식을 둘 다 확인하면 총기 식별이 정확해진다.","sources":[{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":31},{"title":"멜스트롬","group":"세력","keywords":["멜스트롬","로이스","브릭","크롬갱","토텐탄츠"],"short":"왓슨 북부의 과격한 이식과 파벌","body":"멜스트롬은 노스사이드의 산업 시설과 왓슨 일부를 무대로 활동한다. 여러 개의 붉은 광학 렌즈와 얼굴판, 노출된 기계 부품은 일부 구성원의 중요한 외형이다. 기업에서 흘러나온 장비와 불법 크롬을 둘러싼 거래가 거점 유지에 관여한다. 토텐탄츠와 올 푸드 공장은 서로 역할이 다른 거점이다. 브릭, 로이스, 덤 덤이나 패트리샤가 가진 지위와 선택을 하나로 합치지 않는다. 새 지도자의 권위와 기존 구성원의 충성은 같지 않다. 파벌은 현재 지도자의 승인을 지키려는 사람과 이전의 관계를 유지하려는 사람으로 갈릴 수 있다. 조직의 외관에 붉은 센서와 여러 기계 장치가 자주 드러나지만, 개개의 임플란트가 모두 동일한 모델은 아니다. 올 푸드 공장은 거래와 현장 인력이 모이기 쉬운 산업 거점이며 토텐탄츠는 손님과 운영 인력이 오가는 클럽이다. 사업 거래가 유지된다고 해서 웨스트브룩의 타이거 클로까지 같은 경비 구조를 따르지는 않는다.","sources":[{"label":"멜스트롬 · 나무위키","url":"https://namu.wiki/w/%EB%A9%9C%EC%8A%A4%ED%8A%B8%EB%A1%AC"},{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":32},{"title":"부두 보이즈","group":"세력","keywords":["부두보이즈","마만브리짓","플래시드","퍼시피카","넷러너"],"short":"퍼시피카 공동체와 고급 넷러닝 세력","body":"2077년 퍼시피카의 부두 보이즈는 아이티계 공동체와 연결된다. 마만 브리짓은 넷과 블랙월에 대한 목표를 가진 지도자이며, 플래시드는 외부 접촉과 현장 임무에 주로 보인다. 교회와 지역 거점의 생활 공간은 넷러너의 장비와 접속 공간과 구별된다. 과거 같은 명칭을 쓴 조직과, 도그타운의 윌키 라게르 쪽 인맥을 모두 동일한 지휘 아래 두지 않는다. 지역 사회의 주민 전원이 갱단의 계획이나 넷러닝 능력을 공유하지 않는다. 퍼시피카에서 드러나는 지역 조직은 바깥 넷과 블랙월의 경계를 연구하며 넷워치와 상충하는 목적을 갖는다. 마만 브리짓의 기술 판단과 플래시드의 현장 이해가 항상 같은 것은 아니다. 도그타운에서 활동하는 부두 보이즈 계열 사람들은 바게스트 관할과 지역의 별도 세력 관계를 겪는다. 교회에서 이뤄지는 주민의 생활과 기밀 접속 공간을 구분하면, 출신 지역 하나로 사람의 정보와 직무를 단정하는 일을 피할 수 있다.","sources":[{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":33},{"title":"퀵핵과 로컬 네트워크","group":"넷","keywords":["퀵핵","Quickhack","스캔","로컬네트워크","업로드"],"short":"장치나 보철에 보내는 근거리 프로그램","body":"퀵핵은 사이버덱에 장착한 프로그램을 호환 장치나 신경 보철에 전송하는 기술이다. 안구 스캔으로 기기·보철과 연결 상태를 확인하고, 전자기기의 조작과 사람의 감각 교란 등 프로그램마다 다른 효과를 실행한다. 사무실과 거리의 연결망에서 바로 가해지는 개입이라는 점에서 몸을 깊은 사이버스페이스에 맡기는 넷러닝과 다르다. 넷러너가 가용 메모리와 업로드 시간을 관리하는 사이 상대는 경보를 울리거나 연결을 끊을 수 있다. 전투, 제어, 잠행, 장치, 얼티밋과 같은 분류는 변화시키는 대상과 목적에 근거한다. 카메라와 인간의 시각을 교란하는 기술은 서술에서도 각각의 장비를 드러낸다. 현장의 안구 화면에 대상이 나타난 단계와 덱에서 전송한 프로그램이 완료된 단계를 따로 기록한다. 조직이 나뉜 두 시설의 카메라가 물리적으로 가까워도 같은 서브넷에서 관리된다는 증거가 없으면 개입의 결과가 달라진다. 보철의 짧은 오작동에는 업로드에 성공했던 기록이 필요하다.","sources":[{"label":"퀵핵 · 나무위키","url":"https://namu.wiki/w/%ED%80%B5%ED%95%B5"},{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"Quickhacking · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Quickhacking"}],"priority":34},{"title":"바게스트","group":"세력","keywords":["바게스트","핸슨","도그타운","군벌","검문"],"short":"정전 뒤 도그타운을 장악한 무장 조직","body":"바게스트는 통일 전쟁에서 활동한 커트 핸슨의 밀리테크 출신 부대가 핵심이었다. 정전 뒤에도 퍼시피카 일부를 떠나지 않고 도그타운을 지배했다. 옛 군인뿐 아니라 새 지원병, 용병과 다른 조직 출신이 들어온다. 스타디움과 검문소, 물자 거래, 현장 순찰을 직접 통제하며 나이트 시티 경찰의 일상적인 지휘를 받지 않는다. 대령과 부하들의 명령 체계가 거리 장사, 시장의 중개, 계약으로 출입하는 외부 인력에 여러 방식으로 작용한다. 바게스트의 최고 권위는 핸슨에게 있으며 체스터 베넷과 야고 서보는 군사와 사업에서 서로 다른 영향력을 보인다. 다저와 현장 부대, 일반 시장 상인도 각각 다른 권한을 가진다. 조직은 급여와 장비, 리퍼닥의 지원을 제공하며 대가로 복종을 요구한다. 검문 통행은 장벽 외부의 NCPD 배지나 도시의 민간 계약만으로 확보되지 않는다. 본편의 승계 후보와 역할은 참고할 수 있지만 통합 연표에서는 핸슨의 사망과 후임을 미리 확정하지 않는다.","sources":[{"label":"바게스트(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B0%94%EA%B2%8C%EC%8A%A4%ED%8A%B8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":35},{"title":"데이터크래쉬와 구망 붕괴","group":"넷","keywords":["데이터크래쉬","데이터크래시","레이치바트모스","RABIDS","구망붕괴"],"short":"구 넷을 파괴하고 자율 AI를 풀어놓은 사건","body":"레이치 바트모스가 이하라-그럽 변환과 관련한 기술에 숨겨 둔 R.A.B.I.D.S.가 그의 죽음 뒤 퍼졌다. 4차 기업전쟁과 겹친 구망의 붕괴로 수많은 데이터가 훼손되고, 넷의 자율 프로그램이나 AI가 통제에서 벗어났다. 데이터크래쉬를 겪은 시기와 넷워치가 망의 사용 불능을 공식적으로 인정한 시기는 기록에서 구분된다. 기업들은 파괴된 영역에 재진입해 데이터를 되찾거나 자기 전쟁에 쓰려 했으며, 그 과정에서 더 많은 전투용 프로그램이 구망에 남았다. 이후 안정된 서비스를 위해 구역별 망을 다시 깔고 구망의 연결을 봉하는 일이 따로 진행되었다. 망의 붕괴는 기존 지식과 기록의 대량 단절도 뜻했다. 망이 무너질 무렵 전쟁 당사자들은 보존보다 상대에게 당장 피해를 주는 활동을 선택했다. 폐허에서 보이는 여러 프로그램의 계보는 바트모스의 공격, 그 후의 기업 운용, 이후 분리되어 생존한 AI의 문제로 나누어 추적한다.","sources":[{"label":"블랙월(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B8%94%EB%9E%99%EC%9B%94(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"Blackwall · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Blackwall"}],"priority":36},{"title":"사이버덱 제조사와 모델","group":"사이버웨어","keywords":["패럴라인","테트라토닉","아라사카섀도","레이븐덱","넷드라이버"],"short":"제조사마다 다른 사이버덱 특화","body":"밀리테크 패럴라인은 범용으로 사용할 수 있으며 무기 인터페이스·모노와이어와 닿는 운용이 있다. 테트라토닉 리플러는 전투용 퀵핵 출력과 연계에 무게를 뒀고, 아라사카 섀도는 들키지 않는 현장 작업에 맞는 계열이다. 레이븐 마이크로사이버는 퀵핵이 이웃 연결로 퍼지는 동작에 특화되고, 넷워치 넷드라이버는 카메라를 포함한 시설 장치에 간섭하는 데 강점이 있다. 바이오테크 시그마는 일정 시간 지속되는 효과와 연계되는 제품이며, 칸토는 블랙월과 연결된 예외적 연구 장비로 따로 분류한다. 외부 장비와 같은 제조사라고 착용자 몸의 신경 연결 규격까지 자동으로 맞는다는 뜻은 아니다. 덱의 제품군을 고르면 사용할 프로그램에 필요한 메모리 배분과 한꺼번에 연결될 장치의 성격이 달라질 수 있다. 시그마와 리플러는 단일 감시 카메라를 조작하는 장치형 프로그램과 달리, 사람이나 기계에 지속되는 전투 효과가 주목되는 종류다.","sources":[{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"Cyberdeck · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberdeck"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":37},{"title":"타이거 클로","group":"세력","keywords":["타이거클로","재팬타운","유흥업","보호비","와카코"],"short":"웨스트브룩 상업과 유흥에 얽힌 갱단","body":"타이거 클로는 웨스트브룩 특히 재팬타운의 유흥업과 상업권에 깊게 얽힌 조직이다. 문신, 일본도와 오토바이, 일본계 간판과 업소가 거리에서 자주 연결된다. 돌 업소나 바의 영업, 보호비, 경비와 부동산 수익은 구성원과 연계자의 서로 다른 이해다. 아라사카와의 인맥이나 거래 의혹은 회사 전체의 일괄 지시와 구분한다. 와카코는 지역 중개에 영향력이 큰 픽서이지만 업소의 관리자나 모든 클로의 지휘관으로 취급할 수 없다. 클라우드에서는 타이거 클로의 수익과 경비, 관리자 업무, 돌들의 노동이 같은 업소에 걸쳐 있다. 가게의 대표가 조합된 영업을 맡더라도 업소 종사자의 모든 선택을 대신하지 않는다. 지그지그 스트리트와 레드우드 마켓, 주변 신사에는 서로 다른 방문객과 거래가 모인다. 왓슨에서 목스를 만든 사건과 재팬타운 업소의 현재 경비 문제는 과거와 현재를 분리해 본다. 조직의 표식과 해당 인물의 실제 권한도 구분된다.","sources":[{"label":"타이거 클로 · 나무위키","url":"https://namu.wiki/w/%ED%83%80%EC%9D%B4%EA%B1%B0%20%ED%81%B4%EB%A1%9C"},{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":38},{"title":"연방 정보국","group":"국가와 공권력","keywords":["FIA","연방정보국","솔로몬리드","송버드","알렉스"],"short":"신미합중국의 정보와 비공식 작전 기관","body":"FIA는 신미합중국의 정보기관이다. 정보 수집, 보호, 잠입 등 공식 군대와 다른 임무를 맡으며, 정부나 상관의 일정이 현장 요원의 판단과 충돌할 수 있다. 솔로몬 리드와 알렉스는 배치·위장 경력이 있는 요원이며 송소미는 넷러닝 능력 때문에 핵심 자산으로 취급받는다. 2077년 도그타운에 심어진 연락망과 바게스트의 지휘 계통은 별개다. 소속이 같은 인물도 동일한 정보와 허가를 공유하는 것은 아니다. 신미합중국은 대붕괴 이후 옛 미국의 연방 체제를 재편한 국가다. 로잘린드 마이어스 대통령의 정부는 군사력과 정보기관, 기업 계약을 통해 연방의 영향력을 유지한다. 통일 전쟁 뒤에도 북미의 모든 지역이 동일한 연방 관할에 들어가지는 않았다. 서부의 자치 지역, 독립을 유지한 텍사스와 자유도시 나이트 시티의 지위를 구별해야 한다. 신미합중국의 공식 기관과 밀리테크는 인력과 조달에서 밀접하지만 별개 조직이다.","sources":[{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"}],"priority":39},{"title":"바이오테크니카","group":"기업","keywords":["바이오테크니카","Biotechnica","생명공학","단백질농장","CHOOH2"],"short":"생명공학·식량·연료 원료를 다루는 기업","body":"바이오테크니카의 사업은 유전자 기술, 농업, 약품과 기업 연구를 아우른다. CHOOH2의 원료 작물과 생산 기술은 에너지 산업의 성장에 영향을 주었다. 나이트 시티 남쪽의 단백질 농장과 플랫은 도시 식량 공급의 생산 거점이다. 고급 접객용 바이오테크니카 호텔과 농업 현장, 연구 부서는 같은 회사에 닿아도 사용 목적이 다르다. 대량 생산이나 재배 기술이 주민의 식량 접근성과 농업 환경 문제를 모두 해결하는 것은 아니다. 올 푸드 같은 대형 제조 브랜드와 카피탄 칼리엔테, 가부토, 카바얀 푸드, 두한이네 4유로달러 버거샵 같은 이름은 나이트 시티의 식품 시장을 구성한다. 대량 가공 식품과 테이크아웃 메뉴, 독립 노점, 직장 식당은 생산 방식과 가격대가 다르다. 바이오테크니카의 단백질 생산은 식당 영업과 다른 공급 단계에 해당한다. 올 푸드 공장이라는 지명에 남은 시간이 소비자가 오늘 받는 기업 상품의 유통 상태와 늘 일치하지는 않는다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":40},{"title":"넷워치","group":"기업","keywords":["넷워치","NetWatch","넷감시","넷보안","블랙월"],"short":"지역망과 블랙월을 감시하는 국제 조직","body":"넷워치는 통신망의 안전과 넷 범죄 대응에 관여하는 국제 조직이다. 블랙월 감시와 구 넷 바깥 위협으로부터의 격리가 핵심이며, 지상 도시 경찰의 일반 교통과 살인 수사를 그대로 맡지는 않는다. 기업, 지역 조직과 독립 넷러너는 같은 망의 사건을 서로 다른 이해관계에서 본다. 퍼시피카에서 넷워치와 부두 보이즈가 충돌하는 것은 감시·접속 목표가 다르기 때문이다. 현장 요원과 기술 책임자의 권한은 상황마다 다르다. 유럽의 네트워크 보안 회사에서 출발한 뒤 기업과 각국의 지원을 받는 국제 조직으로 바뀌었다. 공개 망의 순찰, 데이터 요새 보호, 허가받지 않은 인공지능과 불법 넷러닝의 추적은 서로 다른 업무다. 블랙월의 관리에는 구 넷 쪽에서 현재 망으로 넘어오는 위험을 막는 일과 사람의 월경을 제한하는 일이 모두 포함된다. 퍼시피카 현장의 브라이스 모슬리와 국제 조직 전체의 권한이 모든 상황에서 같지는 않다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"기업 목록 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Corporation"}],"priority":41},{"title":"노마드 생활과 강령","group":"세력","keywords":["노마드","패밀리","호송대","클랜","강령"],"short":"가족 단위의 자원 공유와 장거리 이동","body":"노마드는 대붕괴와 지역 산업 붕괴, 전쟁이나 환경 문제로 정착 생활을 유지하기 어려워진 여러 공동체를 포함한다. 가족과 팩, 클랜, 네이션은 규모가 다르며 이름이 같다고 항상 동일한 의사 결정이 내려지지 않는다. 차량 정비와 운송, 기계 기술, 도로 정보가 생존 기반이다. 공동 자원과 가족을 해치는 행위는 집단 내 배제나 추방의 사유가 된다. 도시와의 교역·계약이 없어야만 노마드로 남는 것은 아니다. 북미의 일곱 네이션으로 알데칼도, 스네이크 네이션, 메타코프, 조드, 블러드 네이션, 포크 네이션, 텔라스 네이션이 알려졌다. 일부는 농업 붕괴, 일부는 도시 공동체나 군 복무의 경험, 일부는 해양 생활에 뿌리를 둔다. 이 분류는 역사적 혈통과 연합을 이해하는 데 쓰이며 2077년 나이트 시티에서 일곱 집단 모두가 상주한다는 뜻은 아니다. 라펜 쉬브를 여덟 번째로 세는 관점은 다른 노마드들에게 보편적으로 받아들여지지 않는다.","sources":[{"label":"노마드 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Nomad"},{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"노마드 일곱 네이션 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Seven_Nations"}],"priority":42},{"title":"증강 신체의 감각 계통","group":"사이버웨어","keywords":["감각증강","신경인터페이스","감각피드백","의체감각"],"short":"생체 감각과 기계 신호의 연결","body":"인공 안구는 시각 신호를 보낼 뿐 아니라 확대, 스캔, 표적 강조 같은 정보를 시야 위에 올릴 수 있다. 손의 조준 보조기는 무기 정보와 안구 출력을 연결하고, 전두피질 장비는 들어온 신호와 연산 자원을 다룬다. 팔이 움직일 때 느끼는 반응과 테크 장비가 표시하는 계측값은 다른 정보다. 신경 연결이 잘 맞지 않으면 부품이 정상이어도 자연스러운 감각을 되찾기 어렵다. 깊은 넷 접속의 장치는 몸 움직임 대신 가상공간의 정보를 우선 연결한다. 외형만 나눈 의체 목록과 기능을 연결한 신경 계통도를 구별하면, 부품 교환으로 어떤 기능이 살아나거나 손실되는지 설명할 수 있다. 넷러너가 깊은 넷에서 느끼는 표상과 사람이 새 안구로 거리 풍경을 보는 경험에는 신호의 출처가 다르다. 눈에서 보이는 표시가 의수의 움직임을 뜻하거나 직접 만졌다는 감각이 되는 것은 아니며, 기계 응답을 재현하는 부위가 각기 다르다.","sources":[{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"사이버웨어/전두피질 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%A0%84%EB%91%90%ED%94%BC%EC%A7%88"},{"label":"사이버웨어/안구 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%95%88%EA%B5%AC"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":42},{"title":"사이노슈어 프로젝트","group":"넷","keywords":["사이노슈어","Cynosure","밀리테크AI","구망연구","케르베로스"],"short":"밀리테크의 자율 AI 포획·활용 연구","body":"사이노슈어는 밀리테크가 깊은 넷에 남아 있던 자율 AI를 포획하고 활용하기 위해 벌인 비밀 연구다. 퍼시피카 지하와 연결된 시설, 운영 단말과 실험 인력, 그 연구에서 나타난 장비는 서로 다른 소재를 이룬다. 아라사카의 소울킬러가 인간의 인격에 관여한다면 사이노슈어의 목표는 통제에서 벗어난 AI의 능력을 이용하는 데 더 가깝다. 칸토와 에레보스는 시설 기술이 전설적인 장비로 나타난 사례다. 자율 장치와 넷이 시설의 기계를 점유할 때 현장 요원의 명령과 기계가 실제로 따르는 명령이 달라질 수 있다. 공개 자료가 적으므로 기획 목적과 개별 실험의 성공 여부를 구별한다. 밀리테크가 연구를 포기했다고 알려진 시점과 퍼시피카 아래 시설의 장비가 다시 가동된 시점 사이에는 공백이 있다. 군사 연구자와 넷러너가 대응하는 대상이 사람이 만든, 목표가 고정된 프로그램인지 학습하는 구망 AI인지가 핵심 쟁점이다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"블랙월(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B8%94%EB%9E%99%EC%9B%94(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"Cynosure · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cynosure"}],"priority":43},{"title":"트라우마 팀 인터내셔널","group":"기업","keywords":["트라우마팀","TraumaTeam","플래티넘","의료계약","현장회수"],"short":"보험 등급에 따른 응급의료 서비스","body":"트라우마 팀 인터내셔널은 가입자에게 응급 의료와 위험 지역에서의 회수 서비스를 제공한다. 의료 인력과 구조용 공중 차량, 현장 안전을 맡는 인력이 하나의 계약에 묶인다. 계약의 지속 여부와 서비스 범위, 지역 상황이 출동에 영향을 준다. 거리에서 부상자가 발견됐다고 모두 같은 우선순위로 회수되지는 않는다. 트라우마 팀의 현장 경호는 환자를 인수하기 위해 쓰이며 경찰의 수사 지휘권을 대신하지 않는다. 나이트 시티의 응급 구조 시장에는 트라우마 팀뿐 아니라 R.E.O. 미트왜건 같은 별도 업체가 있다. 출동 권역과 서비스 대상, 장비 수준, 비용 및 계약의 약속 범위는 업체마다 다르다. 타 기업의 경비나 시 경찰이 현장에 같이 있어도 누가 응급 환자를 계약에 따라 인수할 수 있는지는 별개다. 정기 보험 상품과 현장에서 개인이 호출한 지원은 결제와 우선순위가 같지 않다. 리퍼닥의 시술은 이들의 구급·운송과 역할이 다르다.","sources":[{"label":"나이트 시티 경찰국 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0%20%EA%B2%BD%EC%B0%B0%EA%B5%AD"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":43},{"title":"애프터라이프 용병 바","group":"도시","keywords":["애프터라이프","로그","용병바","시그니처칵테일"],"short":"픽서의 소개와 용병 명성이 오가는 바","body":"애프터라이프는 리틀 차이나의 옛 영안실을 쓰는 용병 바다. 로그 아멘디아레스는 이 장소에서 강한 중개 권한과 네트워크를 가진다. 출입자 모두가 의뢰를 직접 받는 것은 아니며, 인맥과 평판, 일의 위험도에 따라 서로 다른 자리에 접근한다. 유명인의 이름으로 불리는 칵테일은 용병들이 전설을 기억하는 방식 가운데 하나다. 겉으로는 술을 파는 업소지만 의뢰인과 픽서, 대기하는 일꾼의 만남이 반복되면서 거래와 평판이 연결된다. 입구 경비와 별실의 접촉은 구분되고, 바텐더 클레어 러셀은 술과 이곳의 관습을 다룬다. 전설의 용병을 기리는 칵테일이 있다고 이름을 쓴 사람이 현장에 살아 있다는 뜻은 아니다. 모건 블랙핸드의 유령이 돌아다닌다는 이야기는 오래된 용병들의 도시 소문이다. 로그와 덱스터 같은 픽서가 같은 바를 드나들어도 의뢰와 정보망이 합쳐지지는 않는다. 거리 평판은 술집 출입과 위험한 거래를 맡기기에 앞서 서로 다른 정도로 검토된다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":44},{"title":"켄다치 모노와이어","group":"사이버웨어","keywords":["모노와이어","켄다치모노와이어","단분자와이어"],"short":"손목에서 인출하는 단분자 커터","body":"켄다치의 모노와이어는 손목 슬롯에서 가느다란 필라멘트를 꺼내 쓰는 팔 사이버웨어다. 손바닥과 일부 손가락의 합성 세라믹 그립은 손 자체가 날에 쉽게 손상되지 않도록 보조한다. 수납 상태에서는 돌출한 칼날이 보이지 않으며 케이블이 곡선을 그리는 동작은 고정형 칼과 다르다. 루시는 이 도구를 감거나 베는 데 쓰지만, 순간마다 절삭 기능이 어떻게 바뀌는지까지는 설명되지 않는다. 2077년의 고급 연계에서는 와이어가 닿을 때 퀵핵 전송을 보조하며, 이 기능은 호환되는 덱과 프로그램 없이 자연스럽게 생기지 않는다. 켄다치가 만들었다는 점에서도 아라사카의 세 가지 팔 병기와 출처가 구분된다. 손에서 와이어가 보이는 상태와 수납된 상태가 뚜렷하게 갈린다. 긴 길이를 이용해 팔 밖까지 영향을 미치는 모습은 팔뚝 안에 들어가는 맨티스 블레이드와 형태가 다르고, 손에 따로 쥔 칼의 분실 여부와 독립된 상태 변화다.","sources":[{"label":"사이버웨어/팔 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%ED%8C%94"},{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"}],"priority":44},{"title":"거리 의뢰와 픽서","group":"거리 문화","keywords":["픽서","의뢰","중개","정산","스트리트크레드"],"short":"의뢰인·연락책·용병을 묶는 거래","body":"픽서는 일을 맡길 의뢰인과 이를 수행할 솔로, 넷러너, 테키 등을 연결한다. 특정 구역이나 업종의 연락망을 가진 픽서는 현장 사정과 보수의 평판을 알고 있으며 보통 중개 몫을 받는다. 일의 목표와 대금, 인도 장소, 추가 요청은 별도 조건이다. 일회성 연락만으로 다른 구역의 중개인까지 같은 신뢰를 부여하지 않는다. 고객의 대외 명분, 중개인이 아는 정보, 현장 인력이 발견한 사실도 각각 다를 수 있다. 레지나 존스는 왓슨, 오카다 와카코는 웨스트브룩, 파드레는 헤이우드, 엘 카피탄은 산토 도밍고와 연결된다. 디노 디노비치는 도심, 다코타 스미스는 배드랜드, 미스터 핸즈는 퍼시피카와 도그타운 쪽 활동에서 알려졌다. 로그의 애프터라이프와 덱스터 드숀의 연락망도 각각 다른 인맥과 평판을 갖는다. 대표 구역은 일하는 곳을 알려 주는 출발점이지만, 그 안에 있는 모든 의뢰와 인물을 독점적으로 거느린다는 뜻은 아니다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"사이버펑크 2077/등장인물 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC"},{"label":"픽서 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Fixer"}],"priority":45},{"title":"파워 무기와 탄도 표시","group":"장비","keywords":["파워총기","도탄","도탄표시","탄도프로세서"],"short":"실탄형 화기와 손·안구의 정보 연계","body":"거리에 가장 흔히 보이는 파워 계열은 탄환이 충돌하는 운동 에너지로 화력을 낸다. 일부 모델의 보조 조준은 단단한 물질에서 튈 수 있는 탄도 정보를 손의 프로세서와 안구에 보여 준다. 모델별 총열과 부속, 사용하는 탄의 유형에 따라 방호물에 맞았을 때의 결과가 달라진다. 밀리테크 렉싱턴과 아라사카 콩고처럼 손에 드는 화기, 아약스처럼 긴 총열을 쓰는 화기, 카니지처럼 여러 투사체를 쓰는 화기도 각각 파워 계열에 속한다. 탄도를 볼 수 있는 보철과 별도 카메라로 주변을 평가하는 기능은 서로 관계하지만 처리하는 정보가 다르다. 파워 계열 화기에서 흩어진 탄흔이 나왔다는 사실은 소유자가 손에 도탄 보조 프로세서를 시술했다는 증거는 아니며, 주변의 설비와 착용자의 기록이 별도로 필요하다. 파워 무기의 대표적인 총기와 동일 계열의 외장 부착물은 소싱과 교체 여부를 다르게 검토한다. 콩고에는 별도의 인물 이력과 탄도 관련 특징이 붙어 있다.","sources":[{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"사이버웨어/손 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%86%90"},{"label":"사이버웨어/안구 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%95%88%EA%B5%AC"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":45},{"title":"발렌티노","group":"세력","keywords":["발렌티노","헤이우드","오르타","지역공동체"],"short":"가족·신앙·지역 연고에 연결된 헤이우드 갱","body":"발렌티노는 헤이우드의 라틴계 공동체와 깊게 얽힌다. 가족, 지역 명예, 신앙의 상징, 장식이 강한 외양이 소속 문화에 영향을 준다. 지역 주민과 노점·바의 단골이라고 모두 현역 조직원은 아니다. 헤이우드의 생활 인맥은 거래를 쉽게 이어 주기도 하고 내부의 원한과 경쟁을 지속시키기도 한다. 과거 발렌티노와 인연이 있던 사람, 현재 조직을 이끄는 사람, 파드레 같은 지역 픽서는 서로 다른 권한을 가진다. 금색 사이버웨어와 장신구, 산타 무에르테와 헤수스 말베르데의 문신은 잘 보이는 표지다. 식당·정비소·나이트클럽처럼 공개적으로 운영하는 사업 옆에서 밀수와 돈세탁도 일어난다. 치카노와 멕시코계 지역 문화의 영향이 크지만 민족이 가입의 일률적인 기준은 아니다. 글렌과 비스타 델 레이의 상권은 조직 인맥과 연결되고, 지역 주민이나 상인이 개별 갱단의 범죄에 연대 책임을 지는 것은 아니다. 나이트 시티 갱단의 활동은 유흥업, 보호비, 장물, 약물, 경비, 용병 계약 등으로 나뉜다.","sources":[{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":46},{"title":"테크 무기와 전자기 가속","group":"장비","keywords":["테크총기","전자기가속","충전사격","테크라이플"],"short":"전자기력과 충전에 기반한 화기","body":"테크 계열은 전자기력을 써 금속 투사체를 빠르게 밀어낸다. 충전에 필요한 시간이 있으며, 충전된 상태의 관통과 일반적인 상태에서 작동할 때 관찰되는 효과는 모델마다 다르다. 방호 시설의 벽면과 같은 가벼운 덮개 사이로 영향을 미치는 모습이 연작의 특징이다. 아라사카의 켄신, 밀리테크의 오마하와 아킬레스, 쓰나미의 네코마타처럼 권총에서 정밀 소총까지 제품이 다양하다. 전투용 퀵핵이나 스마트 총기의 조준 링크처럼 가상망을 찾아 작동하는 것이 아니라, 본체의 전자기 부품과 전력으로 나타나는 현상이다. 기체의 크기와 충전의 특성도 서로 다르다. 같은 계열에 속하는 오마하와 켄신도 몸에 들었을 때 눈에 띄는 충전부와 조준 방식이 다르다. 일부 테크 화기가 손에 쥐기 쉬운 소형이어도, 오래된 시설의 문과 벽에 나타나는 현상은 저장된 전력과 시설의 구성에 따라 달라진다. 같은 전자기 가속을 이용한 저격소총과 권총은 본체 크기와 전력 조건부터 다르다.","sources":[{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":46},{"title":"목스","group":"세력","keywords":["목스","리지바","수지큐","리지보든","바텐더"],"short":"유흥업 종사자를 보호하려 등장한 조직","body":"목스는 업주와 손님, 폭력에 노출되는 유흥업 종사자의 관계 속에서 만들어졌다. 리지 보든의 죽음과 타이거 클로에 대한 반발이 결성의 역사에 중요하며, 리지의 바는 왓슨 가부키의 활동 거점이다. 수지 Q와 리타 윌러, 주디 알바레스는 같은 공간과 연관되지만 운영과 경비, 브레인댄스 기술의 역할이 나뉜다. 손님과 일반 종사자, 조직 핵심 인력이 같은 지시 체계를 따르는 것은 아니다. 대외적인 보호 명분과 업소 운영의 여유도 다르다. 리지 보든의 죽음을 계기로 모인 목스의 보호 활동은 유흥업 종사자에 대한 폭력과 착취에 대응하는 데서 출발했다. 리지의 바는 기술자와 경비, 운영자와 접객 노동자가 같은 공간에서 가족과 다른 형태의 연대를 이룬 곳이다. 타이거 클로와의 마찰은 조직 간 통제권에 닿지만 피해자와 종사자가 어떻게 회복하고 일할지는 별도의 문제다. 유흥업소가 모두 목스의 보호를 받고, 모든 보호가 무료로 제공되는 것은 아니다.","sources":[{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":47},{"title":"스마트 무기와 조준 링크","group":"장비","keywords":["스마트총기","유도탄환","스마트링크","스마트센서","록온"],"short":"센서에 잡힌 표적을 좇는 투사체","body":"스마트 계열은 무기 센서의 정보와 손에 있는 스마트 링크를 연동해 작은 유도 투사체를 보낸다. 유도와 표적 인식이 범위와 시간에 의존하므로 무기 안에서 감지하는 범위와 인식된 대상이 중요하다. 여러 대상을 읽는 제품과 한 대상을 강하게 표시하는 제품, 조준 상태에 따라 발사 양식이 달라지는 모델이 있다. 아라사카 유키무라·신겐 및 캉 타오 디안·줘우 같은 화기가 형태가 다르면서도 이 계열에 속한다. 눈에 스캔이 표시되더라도 손 보철이 호환되는지, 무기 센서가 어느 대상을 구별할 수 있는지를 따로 봐야 한다. 스마트 링크 기능을 구현한 피부 각인도 등장한다. 어떤 스마트 화기와 안구, 손 부품이 함께 작동했는지는 기계의 연결 상태와 사용자에게 표시된 표적 인식을 같이 보면 알 수 있다. 스캔을 수행한 장비의 종류와 실제로 조준 계산을 할 수 있는 본체의 사양은 각각 확인해야 한다. 조준 정보가 한 표적에 잘 전달되는지는 링크와 센서에 달렸다.","sources":[{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"사이버웨어/손 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%86%90"},{"label":"캉 타오 · 나무위키","url":"https://namu.wiki/w/%EC%BA%89%20%ED%83%80%EC%98%A4"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":47},{"title":"식스 스트리트","group":"세력","keywords":["식스스트리트","애국주의","참전용사","윌거너"],"short":"퇴역군인 자경단에서 확장된 지역 갱단","body":"식스 스트리트는 퇴역군인과 지역 방어 성격의 자경단을 뿌리로 둔다. 산토 도밍고와 헤이우드 일부에서 영향력을 행사하며, 군복 요소와 미국의 애국 상징을 거리 정체성에 쓴다. 창설기의 지역 보호 구호와 2077년의 세력 다툼·범죄 거래는 같은 상태가 아니다. 윌 거너 같은 현역 인물의 힘과 모든 대원의 참전 경력은 구별된다. 바게스트 역시 전직 군인에게서 비롯됐으나 식스 스트리트와 같은 지역·부대·지휘권을 쓰지는 않는다. 아로요의 차고와 작전 거점은 산업권 안에 분포한다. 창설 인력에는 퇴역군인 외에 전직 경찰과 기업 보안 인력도 있었다. 후기 조직에는 무기 거래·절도와 기업 계약이 얽히고, 윌 거너의 세력이 초기 지도권에 도전했다. 성조기와 제복처럼 군사에서 가져온 표식이 남아도 회사 교대조나 연방 부대의 훈령을 따르는 전력은 아니다. 란초 코로나도의 주택과 아로요의 시설이 같은 권역이라도 주민과 조직의 접점은 다르다.","sources":[{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":48},{"title":"스캐빈저","group":"세력","keywords":["스캐빈저","스캐브","불법적출","장물"],"short":"사람과 임플란트를 수익으로 보는 범죄 집단","body":"스캐빈저는 한 지역을 일괄 통치하는 지휘 조직보다는 여러 활동조의 형태로 나타난다. 납치와 임플란트 적출, 장물과 불법 브레인댄스 거래로 악명이 높다. 폐건물이나 빈 작업 공간이 임시 거점이 되며, 은닉 장소와 거래 장소는 다를 수 있다. 거래되는 중고 사이버웨어 모두가 스캐빈저의 물건은 아니지만 출처가 불명확한 장비는 도난과 피해의 가능성을 키운다. 외양이나 특정 언어보다 행위와 연결망이 조직을 파악하는 근거가 된다. 왓슨 북부 공업권의 폐공장과 창고는 중고 기계와 장물, 정식 제조품이 교차할 물리적 거점을 제공한다. 멜스트롬은 과격한 크롬 도입과 관련 있지만 임플란트 사용자가 모두 조직원이 되는 것은 아니다. 정식 일련번호와 보증, 불법 판매자에게서 얻는 신분 불명의 제품은 같은 위험을 갖지 않는다. 외부 계약자의 물품, 내부 지도부가 소유한 장비, 조직원의 개인 이식은 별개의 거래 대상이다.","sources":[{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"멜스트롬 · 나무위키","url":"https://namu.wiki/w/%EB%A9%9C%EC%8A%A4%ED%8A%B8%EB%A1%AC"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":49},{"title":"키로시 시각 임플란트","group":"사이버웨어","keywords":["키로시","키로시안구","광학임플란트","시각스캔"],"short":"기본 시각 복원과 정보 덧씌우기","body":"키로시 안구는 생체 눈을 대신하면서 광학 확대와 스캔, 사용자의 시야 위 정보 표시를 맡는다. 기본형은 여러 기능 가운데 탐지 정보와 관측 편의를 고루 제공하며, 특화형은 대상이나 물체의 특정 신호를 강조한다. 카메라가 인식하는 얼굴과 착용자가 직접 보는 장면은 처리 경로가 다르다. 광학계가 배율을 높여도 벽 뒤의 모든 것을 직접 보는 것은 아니며, 스캔으로 얻는 정보는 연결된 장치와 안구 모델에 의해 제한된다. 손의 보조 프로세서와 연동하면 무기에 달린 정보를 눈으로 확인할 수 있지만, 안구 자체의 시력 보정과 연동 기능은 별개다. 안구 이식의 표면 색만으로 제조 모델을 구분하기 어렵다. 빅터처럼 시술을 맡는 리퍼닥은 안구와 사용자의 신경 반응을 맞추고 어떤 표시를 연동할지 확인한다. 같은 광학 보철이 사람을 인식하는 일과 연결망에서 그 사람의 보철을 향해 데이터를 전달하는 일은 서로 다른 과정이다.","sources":[{"label":"사이버웨어/안구 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%95%88%EA%B5%AC"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"},{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"}],"priority":49},{"title":"애니멀","group":"세력","keywords":["애니멀","사스콰치","용병경비","육체강화"],"short":"근육과 신체 강화 중심의 경비 집단","body":"애니멀은 강한 신체와 힘을 집단 정체성으로 삼으며, 경비나 현장 용병으로 고용되는 경우가 있다. 주스라고 부르는 강화 약물과 극한의 신체 단련, 신체 보강이 외형과 평판에 영향을 준다. 사스콰치는 몸집과 존재감이 두드러지는 인물이며, 지부나 계약 인력이 항상 그의 현장 지휘를 받지는 않는다. 퍼시피카의 대형 시설에서 보이는 집중 배치와 체육관·거리의 개별 인력을 구별해야 한다. 덩치만으로 조직원임을 확정할 수 없다. 애니멀의 시설 경비, 타이거 클로가 출입에 관여하는 업소, 멜스트롬의 장물 거래처럼 갱단이 제공하는 서비스와 범죄는 목적에 따라 다르다. 픽서가 소개한 용병이 특정 단체의 일을 도왔다고 해서 구성원 전체와 영구 동맹을 맺는 것은 아니다. 조직은 구역과 자산의 손실, 내부 평판, 보수 조건에 따라 행동한다. 연락책의 개인 약속과 지도자의 지시, 독립적인 경비 사업자의 계약은 같은 권한을 갖지 않는다.","sources":[{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"픽서 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Fixer"}],"priority":50},{"title":"팔 의체와 내장 장비","group":"사이버웨어","keywords":["팔의체","팔사이버웨어","내장무기","기계팔"],"short":"형태와 기능별로 다른 팔 임플란트","body":"팔을 잃고 일상을 회복하려 이식한 의수와 아예 무기를 내장한 팔은 모두 보철이지만 목적이 다르다. 켄다치 모노와이어는 손목에서 가는 단분자 와이어를 꺼내며, 아라사카의 고릴라 암즈는 기계 관절과 손에 큰 힘을 집중한다. 맨티스 블레이드는 팔뚝에 두 칼날을 접어 넣고, 투사체 발사 시스템은 팔에 들어간 발사기를 사용한다. 손가락 피부를 덮었다고 기계 팔의 기능이 모두 밖에서 드러나지는 않는다. 팔의 구동부가 교체되었는지, 손에만 조준 보조가 있는지, 평범한 보철에 외관만 꾸민 것인지 구분한다. 몸속에 고정된 팔 장비는 휴대 중인 별도의 총이나 칼과 달리 무장을 검토할 때 별도로 본다. 소유자에게 필수인 의수라면 쓰는 손의 스타일과 시술에 맞춘 감각 설정이 개인에게 중요하다. 같은 팔의 내부에 무장을 넣었는지는 손과 관절의 연결 구조, 팔 아래에 턱처럼 열린 틈, 작업 기록에 남은 모델을 통해 확인한다.","sources":[{"label":"사이버웨어/팔 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%ED%8C%94"},{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"}],"priority":50},{"title":"스네이크 네이션","group":"세력","keywords":["스네이크네이션","독립노마드","연합","D넷러너"],"short":"자치적인 가족을 느슨하게 잇는 노마드 연합","body":"스네이크 네이션은 북미의 독립 노마드 집단이 자율성을 유지하면서 정치적 목소리를 내기 위해 결합한 연합이다. 각 가족과 팩은 생활권과 전문 분야를 독자적으로 지킬 수 있어 연합 전체가 하나의 산업이나 지휘자를 두고 움직이는 것은 아니다. D는 스네이크 네이션 계열의 넷러너다. 알데칼도 브라이트 패밀리의 스콜피온은 통일 전쟁에서 돌아온 뒤 연합에 관심을 보인 인물이다. 정치적 연계와 개별 클랜의 실질 통제권은 다르다. 북미의 일곱 네이션으로 알데칼도, 스네이크 네이션, 메타코프, 조드, 블러드 네이션, 포크 네이션, 텔라스 네이션이 알려졌다. 일부는 농업 붕괴, 일부는 도시 공동체나 군 복무의 경험, 일부는 해양 생활에 뿌리를 둔다. 이 분류는 역사적 혈통과 연합을 이해하는 데 쓰이며 2077년 나이트 시티에서 일곱 집단 모두가 상주한다는 뜻은 아니다. 라펜 쉬브를 여덟 번째로 세는 관점은 다른 노마드들에게 보편적으로 받아들여지지 않는다.","sources":[{"label":"스네이크 네이션 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Snake_Nation"},{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"노마드 일곱 네이션 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Seven_Nations"}],"priority":51},{"title":"넷워치와 경계 감시","group":"넷","keywords":["넷워치","NetWatch","넷경찰","경계감시","구역망보안"],"short":"사설 네트워크와 블랙월의 감시 주체","body":"넷워치는 기업과 개인의 데이터 요새에 닿는 위협, 통제되지 않은 AI, 위험한 넷러너 활동을 추적하는 네트워크 보안 조직이다. 구 넷을 되찾으려던 시도가 막힌 뒤에는 안전한 연결 영역을 남기고 블랙월 경계를 유지하는 방식을 택했다. 2040년대의 연구 과정에서 생존한 여러 인공지능과 협력했다는 기록도 이어진다. 2077년에는 블랙월 너머에 다가가거나 그쪽 존재를 들여오려는 부두 보이즈 같은 집단과 마찰을 빚는다. 현장의 요원은 각자의 목적을 갖고 고용주나 갱단과 대치하며, 도시의 일반 경찰이 맡는 범죄 수사와 넷워치의 중심 임무는 다르게 조직된다. 넷워치가 구역망에 들어가는 것은 보안 사고 조사나 안전한 망을 유지하는 일과 연관된다. 전파 방향과 접속자 정보를 확인하는 절차가 도시의 단속 기관이 실제 건물이나 노상 현장에서 사람을 구금하는 권한과 언제나 같은 것은 아니다. 넷워치의 수사는 기업 보안 직원의 현장 대응과 별도로 진행될 수 있다.","sources":[{"label":"블랙월(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B8%94%EB%9E%99%EC%9B%94(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"NetWatch · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/NetWatch"}],"priority":52},{"title":"레이스와 라펜 쉬브","group":"세력","keywords":["레이스","라펜쉬브","황무지갱","내쉬"],"short":"추방자 집단과 배드랜드 습격 세력","body":"라펜 쉬브는 노마드 집단에서 심각한 배신이나 범죄 등으로 추방된 이들을 통칭하며, 레이스는 그 가운데 배드랜드에서 활동하는 대표적인 조직이다. 라펜이라고 모두 레이스 소속인 것은 아니다. 레이스는 차량을 굴리며 도로를 이동하고, 호송대와 외딴 거점, 다른 노마드를 약탈 대상으로 삼기도 한다. 노마드 정착지, 합법적 물류 호송, 추방자 무리는 외지인의 눈에 비슷한 차량을 써도 규칙과 거래 상대가 다르다. 노마드는 대붕괴와 지역 산업 붕괴, 전쟁이나 환경 문제로 정착 생활을 유지하기 어려워진 여러 공동체를 포함한다. 가족과 팩, 클랜, 네이션은 규모가 다르며 이름이 같다고 항상 동일한 의사 결정이 내려지지 않는다. 차량 정비와 운송, 기계 기술, 도로 정보가 생존 기반이다. 공동 자원과 가족을 해치는 행위는 집단 내 배제나 추방의 사유가 된다. 도시와의 교역·계약이 없어야만 노마드로 남는 것은 아니다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"노마드 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Nomad"}],"priority":52},{"title":"4차 기업 전쟁","group":"국가와 공권력","keywords":["기업전쟁","4차기업전쟁","CINO","OTEC","2023년"],"short":"해양 사업 분쟁에서 거대기업 무력 충돌로","body":"4차 기업 전쟁은 해양 사업을 두고 경쟁한 CINO와 OTEC의 대립에 아라사카와 밀리테크가 각각 얽히며 크게 확대됐다. 기업군과 계약 인력이 여러 전역으로 투입됐으며 국가와 도시의 이해까지 침해했다. 2023년 나이트 시티 아라사카 타워의 핵폭발은 도심 파괴와 장기 재건으로 이어졌다. 넷의 붕괴와 지리적 피해는 연관된 시대의 사건이지만 동일한 사건은 아니다. 2077년에 두 회사의 적대가 남는 역사적 배경이다. 붉은 시대는 4차 기업 전쟁 다음에 도시와 교역이 다시 짜이는 시기다. 나이트 시티의 옛 도심에는 오염 지대가 남았고 교통, 식량 공급과 건설 자재가 부족했다. 노마드의 물류와 기업의 재개발이 도시 생활에 서로 다른 방식으로 개입했다. 전쟁 전의 광역 넷과 같은 네트워크를 이용하기 어려워져 지역 연결망이 중요해졌다. 2077년 고층 사옥과 거주 시설의 모습은 재건에 성공한 결과인 동시에, 투자가 닿지 않은 지역과의 격차를 보여 준다.","sources":[{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"나이트 시티 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"}],"priority":53},{"title":"버서크 운영체제","group":"사이버웨어","keywords":["버서크","무어테크","바이오다인","밀리테크버서크","제타테크버서크"],"short":"출력과 근접전 지속성에 치중한 증강","body":"버서크는 사용자의 몸이 신체 손상과 과부하에 버티는 데 힘을 싣는 근접전 지향 운영체제다. 반응을 크게 앞당기는 산데비스탄이나 신호를 전송하는 사이버덱과 달리, 발동 중 가해지는 부하를 견디면서 힘을 집중하는 것이 특징이다. 무어 테크는 비교적 부담이 적은 기초형이며, 바이오다인은 짧은 교전의 공격 성능, 제타테크는 반복 운용, 밀리테크는 강한 버티기와 지속력으로 설명된다. 일시적으로 쓰러지지 않게 해 주는 효과를 영구적인 외피 방호나 모든 손상의 제거와 같게 읽어서는 안 된다. 버서크가 끝난 뒤 몸이 회복해야 할 문제와 의료적인 회복은 또 다른 일이다. 버서크의 작동이 기대되는 순간은 높은 부하를 버티며 몸 전체에 힘을 보내야 할 때다. 이 장비를 달았다는 사실은 팔의 타격 장치나 회피할 수 있게 반응을 맞추는 보조기까지 지정하지 않는다. 인물의 피로와 작동 종료 시점을 기준으로 몸의 변화를 읽는다.","sources":[{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":53},{"title":"키로시 옵틱스","group":"기업","keywords":["키로시","Kiroshi","광학기업","사이버옵틱","스캐너"],"short":"사이버 안구와 광학 분야의 강자","body":"키로시 옵틱스는 인공 안구와 스캐너, 광학 보조 장치 시장에서 두드러지는 제조 기업이다. 같은 키로시 제품군에도 기본 안구와 특정 표식·감지를 강조하는 제품이 있다. 정식 제조 부문과 임플란트를 시술하는 지역 리퍼닥의 역할은 다르다. 일본 본사뿐 아니라 여러 도시의 사업망과 궤도 시설 투자도 알려졌다. 특정 브랜드의 시각 센서가 있다는 사실만으로 모든 착용자가 같은 소프트웨어와 현장 데이터에 접속하지는 않는다. 나가노 본사 외에 도쿄, 나이트 시티, 상하이 등에도 사무 거점이 있다. 인공 눈뿐 아니라 시야 안의 정보를 표시하는 제품과 광학 카메라, 눈부심을 줄이는 기기 등 제품군이 갈린다. 궤도 시설 투자는 나이트 시티의 일상적인 판매망과 다른 산업 활동이다. 리퍼닥이 설치하는 기본형 안구, 특정 대상을 확인하도록 설계된 모델, 별도 외장 스캐너는 설치·운용 방식과 감지 범위가 다르다. 록클린은 의수·보철의 역사와 디자인을 가진 업체다.","sources":[{"label":"키로시 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Kiroshi"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"기업 목록 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Corporation"}],"priority":54},{"title":"광고판과 판매 문화","group":"거리 문화","keywords":["광고","홀로그램","메가스크린","기업홍보","판촉"],"short":"기업 상품과 도시의 시각 소음","body":"홀로그램과 스크린, 안내 설비, 간판은 거리에서 음료·패션·서비스와 크롬을 알린다. 도심의 대형 화면, 음식점의 가격 광고, 고급 기업 시설의 브랜드 표시, 메가빌딩 자판기는 위치와 목표 고객이 다르다. 제품의 실제 성능과 광고에서 보여 주는 사회적 지위·건강 이미지는 구분된다. 클럽 앞 성인 업소 홍보와 병원 예약, 거리 판매대의 홍보는 정보를 배치하는 공간과 기대하는 이용자가 다르다. 니콜라, 크로맨티코어, 시러스 콜라는 자동 판매대와 소매 제품에 나타나는 여러 음료 이름이다. 올 푸드는 포장 식품과 가공 식품 쪽의 이름이고, 게스트룸과 로비에서는 호텔의 기업 상표가 전면에 드러난다. 네오키치 광고의 장식과 실제 구매 자격은 별개이며, 기업 의료의 홍보는 이용 등급이나 약관을 다 보여 주지 않는다. 나이트 시티 상점의 쇼윈도, 길거리 전광판, 방송의 협찬은 각각 다른 위치의 상품 노출 방식이다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"2077년 소비재 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Consumables"}],"priority":55},{"title":"아라사카 고릴라 암즈","group":"사이버웨어","keywords":["고릴라암즈","고릴라팔","동력의수","아라사카의수"],"short":"강화된 손가락과 구동력을 갖춘 팔","body":"고릴라 암즈는 힘의 전달을 크게 늘린 아라사카의 동력 의수다. 손가락 부분이 검고 관절과 손등에는 단단한 기계 부위가 보이는 형태가 대표적이다. 손가락이 접히고 펴지는 힘, 팔의 구동, 타격을 받아 내는 장갑 부위가 맞물린다. 칼날을 밖으로 빼거나 탄환을 쏘지 않고 신체 일부를 단단한 타격부로 만든다는 점에서 맨티스 블레이드와 발사 시스템과 다르다. 팔에 힘이 생긴다고 다리나 척추의 지지력이 함께 오르는 것은 아니므로, 몸 전체에 걸리는 부하는 별개로 남는다. 표면은 의수처럼 보이더라도 일상 근력을 보완하는 제품인지 높은 전투 출력을 내는 표준 모델인지는 특정할 필요가 있다. 타격의 앞면이 되는 손가락 마디와 너클이 보통 쓰는 손 보철보다 두드러진다. 팔 힘만 높이는 설계는 앉거나 한쪽 어깨를 쓰기 힘든 상황에서도 체중을 완전히 지탱하는 일이 가능한지를 개별 신체의 연결 구조와 함께 보아야 한다.","sources":[{"label":"사이버웨어/팔 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%ED%8C%94"},{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":55},{"title":"아라사카 맨티스 블레이드","group":"사이버웨어","keywords":["맨티스블레이드","사마귀칼날","전완칼날","맥스택블레이드"],"short":"팔뚝에 접어 넣는 한 쌍의 칼날","body":"맨티스 블레이드는 사마귀 앞다리 같은 형태로 양쪽 팔뚝에 접혀 있는 아라사카제 무기다. 팔의 특정 부위를 열면 길고 뾰족한 날이 펼쳐지며 몸과 가까운 거리에서 팔 자체의 움직임을 사용한다. 양손의 칼날을 휘두르는 것과 한 손에 따로 쥔 카타나의 움직임은 다르다. 일반 파생형 외에 맥스택 표기가 붙은 변형도 존재하나, 맥스택의 모든 요원이 이를 똑같이 사용하는 것은 아니다. 날을 평소에 수납하더라도 팔의 외형이 상용 의료 의수와 반드시 일치하지는 않는다. 장비를 지녔다는 사실만으로 사이버 사이코시스를 진단할 수도 없다. 칼이 있는 전완부는 각도와 길이가 조절되어 양팔을 오므렸을 때 수납될 수 있으며, 개조에 따라 열이나 전기를 띤 칼날을 볼 수 있다. 붙잡은 물건을 내려놓은 상태와 팔에 담긴 무장이 꺼진 상태는 다르므로, 건물의 출입 규칙이 외부 무기에만 적용된 사례와 팔 무장의 기록을 나란히 본다.","sources":[{"label":"사이버웨어/팔 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%ED%8C%94"},{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":56},{"title":"옵티컬 카모와 위장","group":"사이버웨어","keywords":["옵티컬카모","광학위장","광학은폐","활성위장"],"short":"외피 장치로 시각 탐지를 어렵게 함","body":"옵티컬 카모는 몸을 둘러싼 광학 효과를 일으켜 일정 시간 이동 중인 모습을 시각으로 알아차리기 어렵게 만든다. 유리나 투명한 옷을 입는 것과 달리 활성화되는 외피 임플란트다. 조명과 배경을 이용한 눈속임이 실패할 때에는 주변이 비치듯 일그러지거나 몸이 움직인 흔적이 남을 수 있다. 바닥의 압력, 넘어뜨린 물건, 숨소리까지 같은 조건으로 감추는 기능으로 해석하지 않는다. 얼굴과 신원 자료를 바꾸는 행동 각인 동기화 안면, 발걸음만 낮추는 스라소니 앞발과 명칭과 용도가 다르다. 같은 투명 효과가 보이더라도 카메라에 아무것도 기록되지 않는지는 주변 장비의 성격에 따라 달라진다. 조명 아래에서 흐려진 몸과 완전히 숨은 물체를 구별할 수 있는 기록이 있다. 감시 장치가 빛을 이용하는지 다른 신호를 읽는지도 함께 확인해야 하며, 안면 위장처럼 특정 사람으로 보이게 만드는 신원 정보 처리와 분리한다. 광학 잔상은 보철을 작동한 위치와 시간에 따라 관찰된다.","sources":[{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"},{"label":"송소미 · 나무위키","url":"https://namu.wiki/w/%EC%86%A1%EC%86%8C%EB%AF%B8"}],"priority":57},{"title":"내장 투사체 발사기","group":"사이버웨어","keywords":["투사체발사기","투사체발사시스템","팔발사기","내장유탄"],"short":"왼팔에 수납된 투사체 발사 장비","body":"아라사카의 투사체 발사 시스템은 왼팔 의체에 발사 장치를 통합한 장비다. 별도로 던지는 수류탄과 목적이 겹치는 경우가 있지만 투사체가 팔 구동부를 통해 나간다는 점에서 외부 장비와 구별된다. 물리 폭발을 일으키는 기본 계열 외에 열·전기·화학 특성을 가진 제품도 있다. 통합 2077년에서는 살아 있는 메인이 쓰던 발사기를 데이비드가 넘겨받았다. 휴대하는 총기와는 별개의 장비다. 구동부가 손등의 조준 링크와 붙어 있다고 해서 발사기가 곧 스마트 무기나 맨티스 블레이드가 되는 것은 아니다. 그의 시각 정보와 팔에 저장된 작동 상태는 각각 다르게 봐야 한다. 교체한 발사체의 성질은 장치가 팔 전체를 덮는 외형과 별개로 기록한다. 사용 뒤 팔에서 나타나는 열이나 화면에 뜨는 경고, 외부에서 발생한 폭발의 흔적은 각기 다른 단서다. 장착자가 강한 기계 손으로 다른 물건을 붙잡을 때는 발사기보다 의체의 구동부가 맡는다.","sources":[{"label":"사이버웨어/팔 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%ED%8C%94"},{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":59},{"title":"NCART 도시 철도","group":"이동","keywords":["NCART","도시철도","나이트시티지하철","메트로패스"],"short":"나이트 코프가 관리하는 대중교통","body":"NCART는 나이트 코프가 운영하는 대중교통 체계로, 나이트 시티의 철도와 노면교통을 포괄한다. 열차와 역사에는 기업 구역, 주거지, 메가빌딩과 공업 지대에서 온 승객이 섞인다. 이용자는 시티 패스를 비롯한 승차 수단을 쓰며, 도시의 노선 확대 기록과 현재 실제로 운행하는 노선은 구분된다. 완공되지 않거나 여객 운행을 하지 않는 일부 선로도 도시 곳곳에 남는다. 워터프론트 쪽과 주거지의 메가빌딩을 통과하는 역이 있고, 지상에서 역을 보는 시야와 열차 안에서 내려다보는 전경이 다르다. 철도가 연결된 지구끼리도 역사 입구의 거리 분위기와 안전은 시각에 따라 달라진다. 시 운송 자료에는 여섯 노선이 언급되고, 현재 승객이 이용하는 철도 안내로는 다섯 노선이 확인된다. 기본 시설 안팎에서 쓰는 입구와 승차 통로, 보행자 도로에 남은 시설의 범위는 어느 시점의 지도를 보는지에 따라 달라질 수 있다. 옛 지도에 나온 역명과 승강장에서 확인되는 안내는 시기가 다를 수 있다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"Night City Area Rapid Transit · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City_Area_Rapid_Transit"},{"label":"NCART Network · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/NCART_Network"},{"label":"Night City · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"}],"priority":61},{"title":"CHOOH2 연료와 공급","group":"이동","keywords":["CHOOH2","추투","합성연료","페트로켐연료","바이오테크니카연료"],"short":"바이오 연료의 개발과 상업 유통","body":"CHOOH2는 바이오테크니카가 개발한 합성 알코올 연료이며, 추투나 추로도 불린다. 자원을 개발한 기업과 대규모 생산에 참여한 업체는 다르다. 페트로켐과 소브오일이 생산과 공급에 얽혔고 전쟁, 화석연료와 기존 대체 연료의 공급 위기가 보급을 넓혔다. 2077년에는 주유 시설에서 취급되는 주요 연료지만, 지역의 주유망과 노마드가 멀리 갖고 가야 하는 보급 물자는 환경에 따라 다르다. 자동차와 산업 장비가 같은 원료의 이름을 내걸더라도 저장 시설, 개별 엔진의 설계, 어느 기업의 공급을 받는가는 구분한다. 불붙는 연료라는 설정은 기업이 연료 생산권을 둘러싸고 경쟁하는 배경과도 연결된다. 연료가 보편화되면 도시의 수송 차량과 외곽에서 이동하는 노마드의 일정에도 정기적인 공급이 전제된다. 어떤 시설이 직접 생산하는지와 기존 화석연료 시대에 설계된 장비가 무슨 연료를 쓰는지는 제조 이력에서 구분해 보아야 한다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"CHOOH2 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/CHOOH2"},{"label":"Night City · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"}],"priority":62},{"title":"브레인댄스 체험 기술","group":"미디어","keywords":["브레인댄스","BD","감각기록","체감영상","신경재생"],"short":"타인의 감각과 경험을 재생하는 매체","body":"브레인댄스는 촬영하는 사람에게 들어온 감각과 정서적 경험을 기록하고, 재생하는 이의 신경으로 다시 체험하게 하는 매체다. 일반 영상보다 촬영자의 목소리와 손동작, 감각 범위가 중요하며, 관객은 같은 장소를 멀리서 내려다보는 것과 다른 경험을 한다. 단말은 연결 플러그나 앉은 채 쓰는 헤드셋 형태를 취한다. 샤드에 저장한 기록은 보급형 시청 장치를 통해 보거나 전문 편집 장치에서 층을 나누어 확인할 수 있다. 오락과 교육, 수사와 증거 검토, 건강과 통제 연구처럼 여러 곳에서 사용한다. 무엇을 기록할 수 있는지와 어떤 방식으로 시청자에게 재구성했는지를 구분한다. 사람의 신체 감각을 함께 보존한다는 점 때문에 단순 녹음보다 기록을 고르는 과정이 까다롭다. 상업 편집된 체험과 촬영된 감각을 검토하는 작업의 차이는 채집한 신호가 어떤 장치로 해석되어 어떤 의도로 배포되었는지에 드러난다. 기록을 체험 가능한 형태로 옮기는 편집 기술도 발달했다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"Braindance · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Braindance"},{"label":"주디 알바레스 · 나무위키","url":"https://namu.wiki/w/%EC%A3%BC%EB%94%94%20%EC%95%8C%EB%B0%94%EB%A0%88%EC%8A%A4"}],"priority":63},{"title":"블랙월 형성과 정체","group":"넷","keywords":["장벽형성","블랙월AI","자율장벽","넷워치계획"],"short":"경계 구축 기록과 자율 AI의 실체","body":"넷워치는 데이터크래쉬와 기업전쟁을 겪은 뒤 살아남은 영역을 구 넷에서 떼어 놓으려 했다. 2040년대의 자료는 넷워치가 초월자들과 고스트를 포함한 생존 세력과 접촉하며 장벽을 개발한 과정을 가리킨다. 대중에게 블랙월은 인간이 남은 망을 지키는 방화벽으로 알려져 있다. 기업 연구 기록과 넷러너의 관찰은 그 경계를 통제하는 자율 인격이 역할을 맡고 있음을 보여 준다. 장벽 수립 과정에서 구망에 남아 있던 넷러너는 귀환 경로를 잃었고, 현대의 연구자에게 남은 것은 산재한 기록과 조심스럽게 관측한 현상이다. 협력에 참여한 주체의 동기와 완성된 AI의 행동 원리가 모두 공개된 상태는 아니다. 경계 유지에는 구망을 되찾을 수 없었던 사정과 그 안에 남은 생존 AI의 이해가 함께 걸려 있다. 경계가 장기간 유지됐다는 기록은 공식 설명의 모든 부분이나 최초 건설 때 각 참여자가 밝힌 역할까지 확인해 주지는 않는다.","sources":[{"label":"블랙월(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B8%94%EB%9E%99%EC%9B%94(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"Blackwall · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Blackwall"},{"label":"NetWatch · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/NetWatch"}],"priority":64},{"title":"케렌지코프와 부스트","group":"사이버웨어","keywords":["케렌지코프","부스트시스템","찰나가속","반사보철"],"short":"짧은 반응 보조와 연결된 증폭 부품","body":"케렌지코프는 회피하거나 몸을 미끄러뜨리는 동작과 일을 맞춰 짧은 동안 지각·반응에 여유를 만드는 신경계 장비다. 산데비스탄처럼 반응을 돕지만 지속 시간, 발동 조건과 사용자가 같이 느끼는 감각의 변화가 다르다. 전두피질의 케렌지코프 부스트 시스템은 이 장비를 함께 이식했을 때 쓸 수 있는 별개의 보조 부품이다. 데펜지코프는 발동이 끝난 뒤 방어에 영향을 미치는 외피 장비로, 이름이 비슷해도 신경계를 가속하는 본체가 아니다. 보철 하나의 정확한 모델을 확인하는 일과 신체가 회피 동작에 익숙한지는 다른 정보다. 가속이 끝난 뒤 몸을 보호하는 부품과 발동 전 반응을 관찰하는 장비 역시 구분된다. 몸이 실제로 가속하는 순간과 경비의 움직임을 느리게 인식하는 순간을 함께 살핀다. 케렌지코프 부스트의 처리와 옵션은 하나의 자기완결된 산데비스탄처럼 긴 시간을 자유롭게 쓰는 효과보다 특정 동작과 때에 더욱 가깝다.","sources":[{"label":"사이버웨어/신경계 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%8B%A0%EA%B2%BD%EA%B3%84"},{"label":"사이버웨어/전두피질 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%A0%84%EB%91%90%ED%94%BC%EC%A7%88"},{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"}],"priority":65},{"title":"전두피질 보철 분류","group":"사이버웨어","keywords":["전두피질","메카트로닉","바이오전도체","엑스디스크","양자튜너"],"short":"뇌에 연결되는 메모리·회로·보안 보조","body":"전두피질 보철은 감각 자료와 명령을 해석하거나 넷러너가 쓸 계산 자원과 동작을 보조한다. 램 업그레이드는 저장 여력을 늘리고 엑스-디스크는 프로그램 업로드 처리도 돕는다. 바이오 전도체와 COX-2는 전투용 퀵핵에 관계하는 회로 장치이며, 메카트로닉 코어는 기계형 대상에 관여하는 기능으로 구분된다. 뉴튼 모듈과 아홀로틀은 활성 장비가 다시 돌아오기까지의 간격에 영향을 주는 부품이고, 셀프 ICE는 상대가 들여오는 퀵핵을 막는 성격을 갖는다. 기능이 다르면 용량과 슬롯을 함께 쓸 수 있어도 같은 문제를 해결하지 않는다. 양자 튜너 역시 위 부품들과 별도로 다른 사이버웨어의 재사용 시간을 다루는 장치다. 신경계가 짧은 시간 몸의 반응을 높이는 동안 전두피질의 처리 회로는 이미 걸린 프로그램과 보철의 회복 여부를 관리하는 층이다. 장비가 데이터를 받아들일 빈 연산 공간은 신체에 남아 있는 다른 체력의 여유와 분리해서 읽는다.","sources":[{"label":"사이버웨어/전두피질 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%A0%84%EB%91%90%ED%94%BC%EC%A7%88"},{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":66},{"title":"총기 연동 손 임플란트","group":"사이버웨어","keywords":["손사이버웨어","탄도보조프로세서","스마트링크","조준연동"],"short":"탄도 정보와 유도 조준을 잇는 손 장비","body":"손 사이버웨어는 팔 전체를 바꾸는 제품보다 손과 무기, 안구 사이를 연결하는 기능에 집중한다. 탄도 보조 프로세서는 파워 발사체의 탄도와 도탄 정보를 표시하는 데 쓰이며, 스마트 링크는 호환 스마트 무기의 유도 조준을 활성화한다. 손에 들어온 장탄·무기 정보는 안구를 통해 표시될 수 있지만 확대 안구 자체가 스마트 무기의 유도 장치가 되어 주지는 않는다. 타이거 클로의 피부 각인과 같은 문신형 장비 가운데서도 연결 기능을 갖춘 것이 있다. 조준용 문신과 장식용 문신은 겉에 문양이 보인다는 점만 같다. 반동이나 무기의 흔들림을 보조하는 손 부품은 위 두 연동 방식과 또 다른 선택이다. 몸에 심은 통신부가 총기 데이터를 가져오면 신체 감각의 보정과 안구 화면의 정보 표기가 갈린다. 손의 프로세서를 바꾸거나 안구를 교체한 이후에는 어느 연결에 필요한 새 보정이 생기는지 각각 판단한다. 타이거 클로의 피부 각인은 연결을 대체하는 사례다.","sources":[{"label":"사이버웨어/손 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%86%90"},{"label":"사이버웨어/안구 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%95%88%EA%B5%AC"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"}],"priority":67},{"title":"밀리테크 가속기 계열","group":"사이버웨어","keywords":["팔콘","어포지","밀리테크팔콘","밀리테크어포지"],"short":"팔콘과 어포지의 고성능 가속","body":"밀리테크의 팔콘과 어포지는 일반적인 산데비스탄과 달리 완전히 충전되기 전에도 남은 작동 시간으로 짧게 다시 가속할 수 있는 계열로 묘사된다. 팔콘과 어포지는 신경을 가속한다는 원리가 같아도 반응의 강도와 유지 방식은 다르다. 어포지는 군용 소량 장비로 다뤄지며 녹색 잔상과 노란색 단자 등 디자인이 애니메이션 속 군용 제품을 연상시킨다. 이를 근거로 데이비드가 쓰던 장치의 정확한 상품명이 어포지라고 확정할 수는 없다. 팔콘과 어포지는 모두 사이버덱 대신 들어가는 운영체제이며, 개별 신경계 보조기나 신체 전체를 감싸는 전투 프레임과도 구분한다. 밀리테크 제품의 특징은 사용 중에 신경 감각을 바꾸고, 발동이 끝난 뒤 남은 작동량을 다시 나누어 쓸 수 있다는 데 있다. 두 장치의 운용 기록으로 애니메이션의 정체불명 장비를 식별하려면 당시 장치에 달린 이름이나 명판 같은 직접 증거가 따로 필요하다. 어포지의 애니메이션 속 모델 대응 관계에는 추정이 섞여 있다.","sources":[{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"},{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"}],"priority":68},{"title":"다리의 이동 보조 장치","group":"사이버웨어","keywords":["다리사이버웨어","강화힘줄","보강발목","스라소니앞발","젠킨스힘줄"],"short":"수직 기동·질주·소음을 바꾸는 다리 보철","body":"강화 힘줄과 보강 발목은 모두 몸을 위로 밀어 올리는 데 쓰이지만 출력 형태가 다르다. 강화 힘줄은 공중에서 다리를 다시 쓰는 동작을, 보강 발목은 힘을 모았다 높은 곳으로 도약하는 동작을 지원한다. 보강 발목의 관절은 플라스틱 섬유와 나노젤을 이용한 구조로 소개된다. 스라소니 앞발은 발걸음의 소음을 낮추며, 젠킨스의 힘줄과 리로이 인대 시스템은 지상에서 속도를 내는 쪽에 강점이 있다. 소음이 줄어드는 것과 몸이 시야에서 사라지는 것은 별개고, 다리만 강화했다고 바닥의 지지 상태나 낙하 때의 충격이 없어지지 않는다. 다리 외피의 발과 발목이 같아 보여도 기능은 다양하다. 도약을 돕는 장비는 위로 뛰어 거리의 층을 바꿀 때 드러나고, 조용한 발과 빠른 질주 부품은 같은 평면을 움직일 때 드러난다. 데이비드의 보강 발목처럼 개조 뒤 확인된 제품과 무명 사용자의 점프로 추측할 수 있는 제품의 범위를 구별한다.","sources":[{"label":"사이버웨어/다리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EB%8B%A4%EB%A6%AC"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"},{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"}],"priority":69},{"title":"사이코시스 개입과 치료","group":"사이버웨어","keywords":["사이코치료","면역억제제","이식부작용","장기재활"],"short":"약물 통제와 치료의 차이","body":"이식 직후 신체 반응을 관리하는 약물과 장기적인 정신 치료의 목적은 다르다. 엣지러너에 나오는 면역억제제·진정 약물은 증상을 버틸 시간을 벌어 주지만, 몸을 계속 강화했을 때 생기는 부담을 사라지게 만들지 않는다. 과거 판본은 이식 뒤 심리적 치료와 인간성 회복을 규칙으로 설명하고, 2077년의 개별 사례는 환경과 생계 문제도 관리하지 않으면 위험이 되풀이될 수 있음을 보여 준다. 사망을 전제로 하지 않고 신병을 확보한 사례와 중무장 부대가 출동한 사례의 목적은 다르다. 고장 난 부품을 빼거나 교체하는 과정에도 회복과 보정이 필요하다. 증강을 견디는 개인차와 면역은 별개의 주장으로 다뤄진다. 강력한 출력에 재차 맞추기 위해 약물 효과를 연장하면 예정된 처치 간격과 회복기의 길이도 바뀐다. 이식품 자체의 고장, 재활이 필요한 신체 손상, 타인에 대한 공격을 멈추기 위한 보호 조치를 각각 기록한다.","sources":[{"label":"사이버 사이코 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%20%EC%82%AC%EC%9D%B4%EC%BD%94"},{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":70},{"title":"바이오 모니터와 혈액 펌프","group":"사이버웨어","keywords":["바이오모니터","혈액펌프","바이탈신호","자동회복"],"short":"신체 상태 감지와 순환계 자동 대응","body":"바이오 모니터는 신체가 위험한 상태인지 읽고 대응용 회복 장비를 자동으로 작동시킬 수 있다. 혈액 펌프는 순환계에 직접 연결되어 외부에서 약제나 기구를 집어 드는 과정 없이 회복에 관여한다. 모니터는 몸의 상태를 판별하는 쪽이고, 펌프는 실제로 작동해 영향을 주는 쪽이라 두 기능은 한 부품으로만 볼 수 없다. 두 번째 심장은 신체가 쓰러질 정도로 손상된 상황에 대비한 별도 장치다. 자동 보조기가 움직여도 심각한 기계·조직 손상을 즉시 치료한 것은 아니며, 응급 조치 뒤에는 고장과 부상의 원인을 찾아야 한다. 시술 단위마다 회복을 위해 함께 준비하는 보철도 다르다. 상태를 읽는 모듈과 실제로 공급·회복을 돕는 모듈의 연결 오류는 각 불능 양상이 된다. 바이오 모니터가 정상이더라도 회복용 장비의 여력이 따로 필요하고, 반대로 약제가 준비된 경우라도 자동으로 올바른 신호를 보냈는지 확인한다. 혈액 펌프는 몸에 들어간 순환계 회복 수단으로 분류된다.","sources":[{"label":"사이버웨어/순환계 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%88%9C%ED%99%98%EA%B3%84"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":71},{"title":"장치 퀵핵과 경보","group":"넷","keywords":["장치퀵핵","카메라교란","터렛조작","구역경보","전자설비"],"short":"전자기기·감시망에 작용하는 프로그램","body":"장치 퀵핵은 지역 네트워크의 카메라와 터렛, 움직이는 기계와 주변 전자제품의 기능을 바꾸는 프로그램이다. 감시 영상을 확인하거나 센서의 동작을 바꾸면 시설 경비의 상황 인식에 영향을 준다. 교란 기능은 근처의 기계에 소리나 예상 밖의 작동을 일으켜 현장의 시선을 돌리는 방식이다. 같은 방 안에 있어도 장치가 각기 다른 구역망에 물려 있다면 하나에 접근한 것으로 모두 제어되는 것은 아니다. 장치가 받아들이는 동작과 변경된 경보의 영향도 별개다. 사람을 향해 안구 재부팅을 올리는 것과 카메라 한 대가 비추는 화면을 바꾸는 것에는 다른 프로그램과 호환 조건이 따른다. 한편 차량은 건물 보안과는 다른 연결을 가지고 있어 유리창 밖으로 보이는 자동차 전부가 조작 가능한 장비로 분류되지는 않는다. 작동을 멈췄다는 말과 사람에게 다른 곳을 보고 돌아서게 했다는 말은 보내는 프로그램의 목적부터 갈린다. 정찰 로봇이나 차량에도 본체의 명령 해석 범위가 있다.","sources":[{"label":"퀵핵 · 나무위키","url":"https://namu.wiki/w/%ED%80%B5%ED%95%B5"},{"label":"Quickhacking · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Quickhacking"},{"label":"Cyberpunk 2077 Quickhacks · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Quickhacks"}],"priority":72},{"title":"ICE와 침입 대응","group":"넷","keywords":["ICE","침입대응","데이터요새","전자방벽"],"short":"망의 접근을 제어하는 가상 보안","body":"ICE는 기업의 중요 자료와 데이터 요새를 보호하고 침입을 탐지·차단하는 기술을 가리킨다. 한 기관은 계약한 넷러너로 보안 부서를 운영하고, 보안망 안에서도 중요한 데이터에 대한 접근 권한을 나누어 관리할 수 있다. 연결된 소프트웨어가 사용자의 뇌까지 들어가는 세계라서 반응이 심한 보안에 부딪힌 넷러너는 가상 공간에만 손해를 입는 것으로 끝나지 않는다. 방어 수단을 상대하는 전용 프로그램은 아이스브레이커라 부른다. 보철에 시술하는 셀프 ICE는 개인 장비 보호에 쓰이고, 블랙월은 구망 전체를 격리하는 문제에 적용된다. ICE라는 공통 이름 안에서도 규모와 위험이 다르다. 기록물을 찾기 위해 접근하는 기업 데이터 요새는 구성에 따라 여러 층의 감시와 방어가 이어진다. 장비로 열린 접속을 인증하는 과정, 사람의 개입을 찾아내는 과정, 피해를 주는 반응은 서로 다른 성격의 보안으로 분류할 수 있다. 규모가 큰 기업은 이 영역의 인력을 따로 고용하기도 한다.","sources":[{"label":"Intrusion Countermeasures Electronics · 나무위키","url":"https://namu.wiki/w/Intrusion%20Countermeasures%20Electronics"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"Intrusion Countermeasures Electronics · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Intrusion_Countermeasures_Electronics"}],"priority":73},{"title":"블랙월 게이트웨이","group":"넷","keywords":["블랙월게이트웨이","게이트웨이","블랙월펄스","구망퀵핵"],"short":"구망의 힘을 끌어들이는 특수 프로그램","body":"블랙월 게이트웨이는 일반적인 데이터 교환보다 훨씬 위험한 구망 접점에 기대는 특수 프로그램이다. 칸토처럼 관련 기능을 탑재한 장비를 사용한 사례에서 여러 표적의 보철이나 신경과 기계를 심각하게 정지시키는 효과가 확인된다. 처음 표적 하나를 거친 뒤 연쇄가 이어질 수 있고, 이후에 드는 계산 자원과 사람 몸의 부담이 커질 수 있다. 에레보스는 연관된 연구가 장비로 나타난 또 다른 갈래지만 일반적인 퀵핵 메뉴의 프로그램과 동일한 장치는 아니다. 송소미 사례에서도 구망과의 접촉은 신경 손상과 통제 상실의 위험을 함께 남긴다. 장벽 너머의 힘을 빌렸다고 해서 그 출처가 지시에 복종하는 것은 아니다. 신경 연결에 나타난 효과가 가까운 기계까지 이어지는 현상은 줄어든 RAM과 별개로 위험을 증폭한다. 사이노슈어 출처인 정황이 있어도 관여한 자율 신호와 실제 덱의 소유 기록이 남아 있는지를 따로 확인한다. 구망 접점에서 발생한 고장은 연결된 전자 장치에 나타날 수 있다.","sources":[{"label":"퀵핵 · 나무위키","url":"https://namu.wiki/w/%ED%80%B5%ED%95%B5"},{"label":"블랙월(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B8%94%EB%9E%99%EC%9B%94(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"Cyberpunk 2077 Quickhacks · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Quickhacks"}],"priority":75},{"title":"밀리테크 칸토","group":"사이버웨어","keywords":["밀리테크칸토","칸토MK6","Canto","특수사이버덱"],"short":"블랙월 연구에서 나온 예외적 사이버덱","body":"밀리테크 칸토 MK.6는 일반 상용 사이버덱과 달리 블랙월 게이트웨이를 작동시키는 기능을 가진 특수 장비다. 사이노슈어 시설 기술과 연관되며, 그 뒤에 있는 AI의 성격은 제조사가 보증하는 보통의 소프트웨어처럼 다룰 수 없다. 탑재 장치는 넷러너의 장비와 접속하지만 그 기능을 쓰는 것과 블랙월 경계를 완전히 이해하거나 통제하는 일은 다르다. 에레보스는 비슷한 연구와 연결된 무기 쪽 장치이며, 칸토는 사람의 운영체제와 연결되는 덱이다. 블랙월 게이트웨이는 여러 표적에 이어질 수 있는 소프트웨어 현상으로, 칸토의 존재만으로 일반 개인이 구망을 자유롭게 항해할 수 있게 되지는 않는다. 부품과 프로그램이 기업 자료에서 같은 이름으로 보이더라도 칸토의 겉모습만으로 활성 상태를 알기는 어렵다. 겉으로 멈춰 있는 기계와 전원이 들어간 칸토가 놓인 사람의 신경에 생기는 부하는 서로 다른 관찰에 해당한다. 제품 번호의 MK.6 표기가 일반 패럴라인과 구별되는 표지다.","sources":[{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"블랙월(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B8%94%EB%9E%99%EC%9B%94(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"},{"label":"사이버 사이코 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%20%EC%82%AC%EC%9D%B4%EC%BD%94"}],"priority":76},{"title":"순환계 보조 임플란트","group":"사이버웨어","keywords":["순환계사이버웨어","위협회피","힐온킬","아드레날린부스터"],"short":"상황에 반응하는 회복·피로 보조기","body":"순환계 임플란트는 온몸으로 이어진 순환의 기능을 조절해 손상이나 고된 사용으로 버티기 힘들 때 보조한다. 힐-온-킬은 일정 조건을 계기로 회복을 돕고 아드레날린 부스터는 피로와 격한 몸 쓰기에 대응한다. 위협 회피는 몸 상태가 위험할 때 움직이는 능력에 힘을 싣는다. 바이오 모니터와 혈액 펌프의 조합은 신체 신호 관찰과 대응을 결합하지만, 약물 반응과 피를 돌리는 기계는 물리적으로 다른 부품이다. 높은 출력을 내는 근육·팔과 이를 버티게 할 보조기 사이에는 활동 지속성의 관계가 있다. 아직 부상이 없는 겉모습만으로 회복 보철이 작동 중인지 판단하기는 어렵다. 다리 장비나 반응 부품이 함께 설치되었을 때 부상 뒤 빠르게 전장을 떠날 수 있는 능력과 활성 장비가 신체를 회복시키는 능력을 같은 것으로 계산하지 않는다. 순환 보철의 신호는 팔과 다리 대신 인공 혈관이나 생체의 신호 변화를 따라 확인한다.","sources":[{"label":"사이버웨어/순환계 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%88%9C%ED%99%98%EA%B3%84"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":79},{"title":"블랙 ICE와 신경 위험","group":"넷","keywords":["블랙ICE","BlackICE","신경침입","넷사망"],"short":"침입자의 신경에도 영향을 주는 방어","body":"블랙 ICE는 경비 시스템의 인증만 거는 수준을 넘어 넷러너와 장비에 적극적으로 피해를 줄 수 있는 방어에 붙는 이름이다. 신경이 연결된 넷러너가 이런 프로그램에 붙잡히면 깊은 접속 중 손상의 범위가 머리와 신경에까지 이어진다. 연결을 안정적으로 끊는 일과 보안 체계를 영구히 뚫는 일은 서로 다른 목표다. 넷러너 집단이 쓰는 별칭과 기업체의 제품 명칭은 겹칠 수 있어 기록에서는 당시 실행된 프로그램과 피해를 따로 본다. 높은 위험성 때문에 일반 방화벽과 구별하며, 전 지구적인 구망 경계를 맡는 블랙월은 이름이 비슷하더라도 별개 규모의 문제다. 깊이 접속한 넷러너가 갑자기 몸을 움직이지 못하거나 연결 장비의 안내와 다른 반응을 보일 때, 기계에 발생한 오류와 신경에 나타난 손상을 각각 기록한다. 기업이 배치한 ICE가 공격에 관여했는지 여부는 접속 이력과 독립된 현장 증거도 필요하다. 물리적인 신경 손상을 남기는 판본은 고위험으로 분류한다.","sources":[{"label":"Intrusion Countermeasures Electronics · 나무위키","url":"https://namu.wiki/w/Intrusion%20Countermeasures%20Electronics"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"}],"priority":81},{"title":"비상용 두 번째 심장","group":"사이버웨어","keywords":["두번째심장","세컨드하트","보조심장","응급순환"],"short":"위기 때 순환을 다시 일으키는 장치","body":"두 번째 심장은 심대한 손상으로 쓰러질 때 사용자의 순환을 다시 가동하도록 마련된 장비다. 바이오 모니터가 상처 신호를 읽고 혈액 펌프가 회복을 보조하는 방식과 달리, 중대한 위기 뒤에도 다시 움직일 가능성을 만드는 비상 부품으로 구분된다. 효과가 발동되었다고 기존에 파손된 보철과 살이 모두 원래 상태로 수복되지는 않는다. 장치가 한 번 충격을 감당한 뒤에 곧바로 같은 출력을 유지하지도 않는다. 영구 사망한 인물을 되돌리는 장치나 생전 기억을 복사하는 렐릭과는 원리와 목적으로 구분된다. 비상 신호 전에 부상 원인을 제거하지 않으면 되살아난 정상 순환 상태를 유지하기 어려울 수 있다. 한 차례 순환을 회복한 뒤에는 의료진이 의체의 계측과 남은 생체 상태를 함께 읽는다. 자동으로 다시 움직인 모습만 보면 구조가 끝난 것으로 보일 수 있으나 보철이 감당한 하중과 장기에서 받은 손상의 크기는 따로 검사해야 한다.","sources":[{"label":"사이버웨어/순환계 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%88%9C%ED%99%98%EA%B3%84"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":82},{"title":"외피와 피하 장갑","group":"사이버웨어","keywords":["외피사이버웨어","피하장갑","키틴","카라페이스","나노플레이팅"],"short":"몸 안에 심는 방호 외피의 종류","body":"피하 장갑은 옷을 걸치는 대신 피부 아래 보호층을 넣어 몸의 바깥 부분이 외부 충격을 버티도록 돕는다. 키틴은 유전적으로 변형한 키틴질로 만든 단단한 피하 장갑으로, 회복 보조가 붙은 고급형이다. 카라페이스 계열은 옆과 뒤에서 오는 충격을 받는 상황에 강점을 보이고, 나노플레이팅은 날아오는 투사체 일부를 방어한다. 외장 보호복을 벗는다고 피부 밑의 장갑도 동시에 없어지는 것은 아니다. 피부 아래에 보철이 있다는 사실이 감각이 완전히 단절되거나 총탄에 모두 견딘다는 뜻은 아니다. 외피와 내부 골격의 보강은 피해를 받아 내는 층이 달라 각각 기록한다. 차량 외장과 신체의 피하 보호는 작동 중 충격을 줄인다는 공통점이 있어도 장착 방식과 감지 방법이 다르다. 장갑이 들어간 두께와 소재의 종류, 개조 담당 시술자의 기록은 인물의 옷이나 체격으로만 파악할 수 없는 안전상의 정보다. 키틴의 방호 소재는 표준적인 피하 장갑과 다른 계통이다.","sources":[{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":83},{"title":"키로시 탐지형 안구","group":"사이버웨어","keywords":["스토커","보초병","재앙예언가","천리안","키로시신탁"],"short":"표적·장치 종류별 키로시 탐지 모델","body":"스토커, 보초병, 재앙 예언가, 천리안과 신탁은 키로시가 내놓은 특화 안구의 이름이다. 스토커는 보호물 너머의 표적 발견, 보초병은 카메라와 터렛 같은 감시 장치 탐색, 재앙 예언가는 폭발물과 함정 표시에 각각 치중한다. 천리안은 스캔 중 적을 표시하며, 신탁은 이렇게 갈라지는 탐지 항목 여럿을 포괄하는 쪽에 가깝다. 코카트리스는 표시할 물체 종류를 늘리는 방식과 달리 조준 성능을 돕는다. 화면의 강조 색이나 범위는 각 모델과 스캔 상태에 따라 정해지며, 감시 장치를 눈에 보이게 만드는 기능 자체가 그 장치를 꺼 주거나 무력화하는 것은 아니다. 특화 안구로 발견한 것에는 시설의 센서와 연결된 제어기, 사람이나 위험한 물체처럼 실체가 있는 것이 섞여 있다. 탐색 화면에서 단서가 두드러져도 시야 밖에서 물체가 실제로 움직였는지와 어떤 경보를 썼는지에 관한 기록이 따로 필요하다. 코카트리스의 초점은 스캔 중 발견하는 대상의 종류보다 정밀한 조준에 있다.","sources":[{"label":"사이버웨어/안구 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%95%88%EA%B5%AC"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":84},{"title":"인공 골격과 관절","group":"사이버웨어","keywords":["골격사이버웨어","생체공학관절","티타늄뼈","고밀도골수","스프링관절"],"short":"하중과 충격을 다르게 받는 골격 보철","body":"생체공학 관절은 신체 내부를 보강하며, 티타늄 뼈는 몸이 더 큰 하중을 감당할 수 있도록 설계된 골격 장비다. 고밀도 골수는 무게와 근접 동작에 실리는 힘을 늘리나 그만큼 힘을 내는 동작의 피로가 커질 수 있다. 스프링 관절은 충격이 전달되는 양을 조절하는 데 가까운 보철이고, 에피모픽 골격은 전신이 버티는 힘과 내부 방호를 함께 높이는 고용량 제품이다. 단단한 뼈를 가졌다고 관절과 근육, 바깥 피부가 같은 강도로 교체된 것은 아니다. 몸통에 걸리는 하중이 손끝이나 다른 관절로 흩어지는 구조를 함께 고려해야 한다. 외형만으로 내부 골격의 재질과 보강 범위는 드러나지 않는다. 가벼운 일상 하중을 일시적으로 견디는 의체와 전투 프레임을 받치는 골격은 교체되는 신체의 규모부터 다르다. 한 부위에 힘이 모일 때 주변 생체가 받는 무게와 연결부가 실제로 튼튼한지를 나눠 본다. 티타늄 뼈의 부하 보조는 피부의 방호와 다른 위치에 작용한다.","sources":[{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":85},{"title":"엑소스켈레톤 전투 시험","group":"사이버웨어","keywords":["엑소스켈레톤","사이버스켈레톤","시제품의체","중력장치"],"short":"단독 실험 프레임과 군용 임플란트","body":"엣지러너에 등장하는 사이버스켈레톤은 신체를 감싸는 특수 전투 프레임으로, 일반적인 다리 임플란트나 신경계 부품보다 훨씬 큰 힘을 한꺼번에 다룬다. 데이비드가 결합한 장치는 육중한 장치와 연결된 상태에서도 기동을 보조하고, 주변의 중력 작용을 이용하는 기능까지 보여 준다. 아라사카의 실험과 관련된 한정 장비로, 흔히 구할 수 있는 골격 보강 부품을 여러 개 단다고 같은 결과가 생기지 않는다. 사용자의 신체 및 정신 부하가 막대하고, 손에 드는 액세서리처럼 쉽게 해체할 수 있는 구성이 아니다. 초기의 군용 산데비스탄과 실험 프레임은 방출되는 힘과 달리는 위치부터 서로 다르다. 프레임이 고정되어 있을 때 힘을 받아 내는 곳은 그대로 남은 생체와 접속 부품이다. 짧은 신경 가속, 무거운 골격의 지속적인 출력, 장비가 만드는 장을 한 개의 산데비스탄 능력만으로 해석하면 구동의 세부 연결 조건을 놓치게 된다.","sources":[{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"},{"label":"아담 스매셔 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%8B%B4%20%EC%8A%A4%EB%A7%A4%EC%85%94"},{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"}],"priority":86},{"title":"구망의 자율 AI","group":"넷","keywords":["불량AI","로그AI","올드넷AI","구망인공지능"],"short":"통제 밖 AI의 기원과 현실 접점","body":"구망의 일부 AI는 기업과 군대가 만든 프로그램에서 기원하며, 일부는 데이터크래쉬와 4차 기업전쟁을 거치는 동안 기존 명령에서 벗어났다. 무너진 저장소와 데이터 요새에는 목적과 성향이 제각각인 존재가 남아 있어 모두 같은 집단으로 움직인다는 근거가 없다. 현실에 연결된 장치나 신경계에 닿으면 로봇과 통신망, 보철을 통제하거나 망가뜨릴 정도의 힘이 드러나는 사례가 있다. 사람이 보내는 메시지처럼 응답하는 것과 어떤 조건의 물리적 통로를 얻었는지의 차이가 크다. 그중에는 사람과 협력하기를 바라거나 수단으로 여기는 존재도 있어, 기업과 갱단이 그 가치를 서로 다르게 판단한다. 과거에는 사람이 지키던 저장소와 데이터 요새가 새 AI의 활동 장소가 될 수 있었다. 낡은 시설에서 움직이는 기계를 만났을 때에는 현재의 운영 단말, 생체 신경을 통해 확보한 연결, 기계의 자기 명령이 각각 어디서 왔는지를 구별한다.","sources":[{"label":"블랙월(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B8%94%EB%9E%99%EC%9B%94(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"Blackwall · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Blackwall"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":87},{"title":"전투용 퀵핵 갈래","group":"넷","keywords":["과열","합선","전염","시냅스과열","전투퀵핵"],"short":"열·전기·연쇄·신경 손상의 구분","body":"전투용 퀵핵은 연결된 시스템에 직접적인 손상 효과를 준다. 과열은 몸이나 장치에 열의 문제를 일으키고, 합선은 전기적 충격으로 특히 기계 종류에 큰 영향을 줄 수 있다. 전염은 한 대상을 중심으로 주변 연결에 퍼지는 프로그램이고, 시냅스 과열은 신경과 깊이 이어진 대상에 작용하는 고강도 계열이다. 네 유형은 같은 사이버덱에서 올리더라도 표적의 연결 상태, 보철의 방어 여부, 효과가 드러나는 속도가 서로 다르다. 네트워크 개입을 받는 대상이 기계인지 생체인지에 따라 열이 오르거나 움직임이 끊기는 식으로 관찰되는 증상도 달라진다. 직전에 보철이 손상되었다는 사실은 다른 기록과 대조할 단서다. 가시적 열을 발생시키는 과열과 겉의 장갑이 멀쩡해도 신경에 먼저 영향을 주는 시냅스 과열은 별도로 분류한다. 같은 망에 연결된 여러 사람이 비슷한 증상을 보였을 때에는 전염의 영향과 공통 건물의 연결 장애를 구분한다.","sources":[{"label":"퀵핵 · 나무위키","url":"https://namu.wiki/w/%ED%80%B5%ED%95%B5"},{"label":"Cyberpunk 2077 Quickhacks · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Quickhacks"}],"priority":90},{"title":"상용 산데비스탄 계열","group":"사이버웨어","keywords":["다이낼러","워프댄서","치앤T","제타테크가속기"],"short":"형태별 반응 가속 운영체제 비교","body":"다이낼러는 상용 산데비스탄 계열이고, 제타테크 제품은 지면을 벗어난 상황에서 강점이 드러나는 모델로 구분된다. 치앤T 워프 댄서는 단순히 가장 긴 가속을 주는 장비로 소개되기보다 신경 가속 중 방어에 초점을 둔 모델이다. 같은 계열의 보철을 쓴다고 항상 동일한 잔상과 지속 시간, 완충 조건을 보이는 것은 아니다. 서로 다른 산데비스탄이 유통된다는 점은 군용 한정품과 일반 시장에서 살 수 있는 제품을 나누는 배경이 된다. 신경계를 조절하는 케렌지코프나 신호 감지 장치는 여기에 같이 시술될 수 있으나 산데비스탄의 제조 모델명은 아니다. 지면을 딛는 동안과 떠 있는 동안의 강점이 다른 제타테크의 사례는 짧은 체감 속도만으로 우열을 정하기 어렵게 한다. 치앤T의 방어 보조와 다이낼러의 기본 가속에는 서로 다른 제품 전략이 드러나며, 시장에서 구하는 모델에도 장착자의 신체 조건을 맞춘다. 워프 댄서의 조정은 모델별로 확인한다.","sources":[{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":91},{"title":"넷러너의 딥 다이브","group":"넷","keywords":["넷다이브","딥다이브","넷러너","다이브포트","재킹"],"short":"신경을 통해 가상 공간에 들어가는 접속","body":"딥 다이브는 머리의 신경 인터페이스와 접속 장비를 사용해 화면 너머의 데이터를 몸으로 느끼듯 경험하는 넷러닝이다. 외부에서 쓸 수 있는 무선 기능과 맞물리지만, 표면에 드러나는 한두 장치만 찾는 퀵핵보다 깊은 층에 들어갈 수 있다. 가상 공간에 집중하면 현실에서의 몸은 움직임과 방어에 취약해진다. 넷러너가 몸을 식히는 물이나 냉각 장비, 곁에서 상태를 볼 수 있는 지원을 이용하는 장면도 나온다. 꿈이나 브레인댄스처럼 감각을 경험하더라도 연결 상대가 외부 망이고 그 안에서 다른 프로그램과 맞부딪힌다는 점이 중요하다. 딥 다이브 전용 포트의 흔적과 일상용 신경 단자는 겉으로 다른 경우가 있다. 연결 중 현장 지원 인력은 장비나 물의 상태, 몸이 받을 과부하를 따로 볼 수 있다. 접속자의 의식이 가상 공간에서 마주친 방어와 현실에서 환자에게 확인되는 열과 손상은 서로 다른 위치에서 기록되지만 원인과 결과로 이어진다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"},{"label":"Cyberdeck · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberdeck"}],"priority":92},{"title":"제어용 퀵핵 갈래","group":"넷","keywords":["이동제한","안구재부팅","사이버웨어오작동","무기오류","제어퀵핵"],"short":"움직임과 감각·장치를 일시 제한","body":"이동 제한은 보행과 움직임을, 안구 재부팅은 시야에 올라오는 정보와 관측을 불안정하게 한다. 사이버웨어 오작동은 특정 보철의 기능 사용을 방해하며, 무기 오류는 연결된 총기 등의 동작에 문제를 낸다. 이런 제어 프로그램은 상황을 잠깐 바꾸는 데 주로 쓰이며, 보철 전체를 물리적으로 파괴하거나 영구 교체하는 수술과 구분된다. 움직임을 대신하는 의체, 눈의 광학 센서, 외부에서 쥔 장비는 하나의 신경망과 통신하더라도 서로 다른 구성품이다. 어떤 부품이 작동을 멈췄는지에 따라 상대가 아직 대꾸하거나 신호를 보내는 능력이 남을 수 있다. 현장의 혼란은 각 차단 효과의 범위에 맞춰 드러난다. 안구 모델이 빛이나 형상을 잃었어도 청각과 외부 장비에 연결하는 능력은 남을 수 있다. 팔에 보이는 무기 오작동과 몸속 구동부의 변화가 겹치는 경우에는 어느 출력과 신호가 영향을 받았는지를 감시 기록과 함께 확인한다.","sources":[{"label":"퀵핵 · 나무위키","url":"https://namu.wiki/w/%ED%80%B5%ED%95%B5"},{"label":"Cyberpunk 2077 Quickhacks · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Quickhacks"}],"priority":93},{"title":"밀리테크 화기 계보","group":"장비","keywords":["밀리테크화기","렉싱턴","오마하","아약스","사라토가"],"short":"군용부터 일반 유통까지 밀리테크 장비","body":"밀리테크의 렉싱턴은 파워 권총, 오마하는 테크 권총, 사라토가는 파워 기관단총 계열이다. 아약스는 파워 돌격소총으로 쓰이며, 아킬레스는 전자기 가속의 정밀 소총이다. 크러셔는 산탄총, Mk.31은 중기관총 계열로 공급된다. 모델명의 일관성이 있더라도 수납 구조와 발사 방식은 각 제품으로 갈라진다. 밀리테크는 탄환을 쏘는 도구 외에 눈으로 보는 광학 부속과 차량·드론, 활동을 돕는 사이버웨어를 제조한다. 같은 기업 로고가 붙은 장비라고 모두 현역 군의 직속 자산이라는 뜻은 아니며, 시내에서 판매되거나 다른 기관에 공급된 모델인지 구별한다. 회사 제품의 이름으로 어떤 현장에 거래됐는지는 아약스의 군용 공급, 렉싱턴의 상점 유통처럼 모델마다 따로 확인한다. 같은 부착물 계열을 만들더라도 권총과 정밀 소총에 들어가는 부품은 크기와 사용자인 신체에 걸리는 부하가 달라 구별된다. 회사 내부의 화기와 계측·센서 제품은 모델 사양이 각각 존재한다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":94},{"title":"전신 의체와 생체 잔존","group":"사이버웨어","keywords":["전신의체","전신보철","아담스매셔의체","중장갑보철"],"short":"몸 대부분을 기계화하는 증강","body":"전신 의체는 한쪽 팔이나 한 쌍의 눈만 바꾸는 수준을 넘어 몸의 넓은 부분을 기계로 대체하는 설계다. 아담 스매셔는 일부 생체만 남은 채 중장갑 기계 몸을 운용하는 사례로, 같은 인물이 시기에 따라 다른 형태의 몸을 사용했다. 외장에 달린 화기와 의체의 내부 구동부는 각각 부품을 갈고 정비할 수 있는 층이다. 덩치가 큰 몸이라고 전부 같은 세대의 프레임을 사용하는 것이 아니고, 사람이 생체를 많이 남겼다고 가속과 감각 분야에 약하다는 보장도 없다. 전신 교체와 엔그램으로 의식을 기록하는 기술은 다르며, 사람을 기계 몸으로 관찰한다고 어느 쪽의 존재인지 묻지 않아도 되는 것은 아니다. 스매셔의 사례에서는 장비의 몸통과 다리에 가하는 하중 자체가 사람의 일상용 의체와 차이가 있다. 비슷한 갑옷을 입은 사람, 같은 계열명 부품을 달고 있는 사람, 정비 중 떼어 낸 몸 전체 의체를 따로 구분해서 기록한다.","sources":[{"label":"아담 스매셔 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%8B%B4%20%EC%8A%A4%EB%A7%A4%EC%85%94"},{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":95},{"title":"셀프 ICE와 개인 방어","group":"넷","keywords":["셀프ICE","셀프아이스","개인방벽","퀵핵방호"],"short":"개인에게 들어오는 퀵핵에 대응","body":"셀프 ICE는 사용자의 전두피질에 연결해 자신을 향해 들어오는 퀵핵에 대응하는 개인 방어 모듈이다. 장비가 준비되어 있을 때 한 번의 침입을 막고 다음 방어를 다시 준비하는 간격이 있다. 몸에 있는 사이버웨어가 상대의 서브넷에 접근하는 동안 같은 연결성이 방어가 필요한 계기가 될 수 있다. 장갑으로 파편을 받아 내거나 바이오 모니터로 상처의 위급함을 읽는 과정과 함께 보안에도 별도 장치를 쓰는 이유다. 기업 데이터 요새를 보호하는 대규모 ICE와 달리 보호 대상이 사용자의 신경·사이버웨어라는 점에서 역할이 분명하다. 공격을 수행할 사이버덱이 없는 착용자에게도 유용하다. 착용한 몸이 상대에게 감지되었다고 반드시 같은 공격을 맞은 상태는 아니다. 셀프 ICE는 들어온 프로그램의 전달 단계에 관여하며, 생활 중 접속 이력을 모두 없애거나 기업의 여러 층짜리 데이터 요새를 보호하는 장비와는 기능을 구별한다.","sources":[{"label":"사이버웨어/전두피질 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%A0%84%EB%91%90%ED%94%BC%EC%A7%88"},{"label":"퀵핵 · 나무위키","url":"https://namu.wiki/w/%ED%80%B5%ED%95%B5"},{"label":"Intrusion Countermeasures Electronics · 나무위키","url":"https://namu.wiki/w/Intrusion%20Countermeasures%20Electronics"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":96},{"title":"아이스브레이커와 방어층","group":"넷","keywords":["아이스브레이커","ICEBreaker","보안방벽","넷방어층"],"short":"방벽에 접근하는 전용 프로그램","body":"아이스브레이커는 가상 환경의 ICE에 맞서는 소프트웨어를 가리킨다. 데이터 보관소 앞에서 접근을 차단하는 방어, 감시를 울리는 방어, 넷러너의 신경에 손상을 주는 블랙 ICE가 저마다 다른 위험을 상대에게 던진다. 방어층 하나를 넘었다는 사실은 그 안에서 데이터를 읽거나 반출할 권한까지 생겼다는 결과와 다르다. 여러 보안 층과 현장에 배치된 넷러너가 역할을 나누면 접속 부위를 통해 본 제한된 정보와 내부에서 확인되는 정보의 차이도 커진다. 장비의 이름에는 조직과 시대에 따른 표기가 달라지지만, 접속자가 가상 공간에서 방벽에 맞선다는 기능이 공통된다. 방벽 프로그램이 같은 작업 환경에 존재해도 대상자의 신경을 위협하는 대응은 물리적인 방호 설비와 다른 위치에서 이뤄진다. 넷러너의 장비가 전자적으로 접근한 경로와 다른 직원의 인증 도구가 연결돼 있는 계통을 구분할 수 있다. 보안 프로그램의 존재를 감지하는 일과 사용자의 신체를 안정시키는 일은 별도다.","sources":[{"label":"Intrusion Countermeasures Electronics · 나무위키","url":"https://namu.wiki/w/Intrusion%20Countermeasures%20Electronics"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"Cyberdeck · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberdeck"}],"priority":97},{"title":"나이트 시티의 픽서 권역","group":"거리 문화","keywords":["레지나","와카코","파드레","엘카피탄","미스터핸즈"],"short":"구역마다 다른 중개인의 사업과 정보","body":"레지나 존스는 왓슨, 오카다 와카코는 웨스트브룩, 파드레는 헤이우드, 엘 카피탄은 산토 도밍고와 연결된다. 디노 디노비치는 도심, 다코타 스미스는 배드랜드, 미스터 핸즈는 퍼시피카와 도그타운 쪽 활동에서 알려졌다. 로그의 애프터라이프와 덱스터 드숀의 연락망도 각각 다른 인맥과 평판을 갖는다. 대표 구역은 일하는 곳을 알려 주는 출발점이지만, 그 안에 있는 모든 의뢰와 인물을 독점적으로 거느린다는 뜻은 아니다. 픽서는 일을 맡길 의뢰인과 이를 수행할 솔로, 넷러너, 테키 등을 연결한다. 특정 구역이나 업종의 연락망을 가진 픽서는 현장 사정과 보수의 평판을 알고 있으며 보통 중개 몫을 받는다. 일의 목표와 대금, 인도 장소, 추가 요청은 별도 조건이다. 일회성 연락만으로 다른 구역의 중개인까지 같은 신뢰를 부여하지 않는다. 고객의 대외 명분, 중개인이 아는 정보, 현장 인력이 발견한 사실도 각각 다를 수 있다.","sources":[{"label":"사이버펑크 2077/등장인물 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"픽서 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Fixer"}],"priority":98},{"title":"잠행용 퀵핵 갈래","group":"넷","keywords":["메모리소거","미끼","음파충격","지원요청","잠행퀵핵"],"short":"인식·통신·주의를 건드리는 프로그램","body":"잠행용 퀵핵은 상대의 주의와 통신을 바꾸는 방식으로 쓰인다. 메모리 소거는 최근에 인지한 상황을 지속하는 데 영향을 미치고, 미끼는 대상이 주변 소리나 신호에 주의를 돌리게 한다. 음파 충격은 감각이나 동료와 통신하는 상태를 방해하는 계열이고, 지원 요청은 대상이 다른 인원을 부르도록 유도한다. 핑은 망의 연결을 확인하는 정보 쪽 기능이다. 소리가 나도 경비실의 관찰자와 현장의 경비가 같은 사실을 보는 것은 아니며, 누가 이미 대상을 목격했는지에 따라 남는 기록도 달라진다. 프로그램이 일으킨 변화와 사람이 스스로 판단해 움직이는 과정 사이에는 상황상의 차이가 남는다. 동료의 지원을 요청한 말이 전송됐다는 기록과 가까운 사람이 실제로 그 장소에 왔다는 사건은 별개다. 기억에 공백이 있는 인물을 만났을 때에도 퀵핵의 짧은 효과와, 사람 생전의 기억을 통째로 가져오는 인격 추출은 분명히 나뉜다. 통신 교란의 지속 시간과 사람의 기억 혼란은 따로 살핀다.","sources":[{"label":"퀵핵 · 나무위키","url":"https://namu.wiki/w/%ED%80%B5%ED%95%B5"},{"label":"Cyberpunk 2077 Quickhacks · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Quickhacks"}],"priority":98},{"title":"나이트 시티 시정부","group":"국가와 공권력","keywords":["시의회","나이트시티시청","시장","자치권"],"short":"시장·시의회와 기업 후원의 도시 행정","body":"나이트 시티에는 시장과 시의회, 시청을 중심으로 한 행정 체계가 있다. 시정부는 계약, 치안 예산, 개발 정책을 다루며 사기업이 소유한 부지에는 기업 경비가 별도로 배치된다. 루시우스 라인과 웰든 홀트, 제퍼슨 페랄레즈는 서로 다른 위치로 시장 정치에 얽힌다. 통합 연표의 개막에서 특정 후보의 당선이나 경쟁자의 사망을 선결 조건으로 삼을 수는 없다. 도시의 대외 자치와 내부 주민 개개인의 권리는 같은 문제가 아니다. NCPD는 나이트 시티의 경찰 조직으로, 순찰과·수사과·전술과가 서로 다른 현장에 대응한다. 나이트 코프의 후원과 아라사카·밀리테크 같은 대기업의 힘이 경찰이 행사할 수 있는 권한에 영향을 준다. 인력·예산 부족, 부패, 과중한 사건 업무가 있더라도 모든 대원이 같은 태도를 보이지는 않는다. 기업 관할 구역과 도그타운은 일반 시가지와 다른 접근 조건을 갖는다. 중무장 사건과 사이버 사이코 사건에는 전문 전력이 투입된다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"나이트 시티 시정부 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Government_of_Night_City"},{"label":"나이트 시티 경찰국 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0%20%EA%B2%BD%EC%B0%B0%EA%B5%AD"}],"priority":99},{"title":"넷러너 메모리 보조기","group":"사이버웨어","keywords":["램업그레이드","메모리부스트","램재분배기","카밀로램","엑스디스크"],"short":"용량·복구·업로드를 나누는 전두피질 부품","body":"램 업그레이드와 엑스-디스크는 프로그램에 쓸 수 있는 메모리를 늘리는 쪽에 속하지만 엑스-디스크는 업로드 처리도 함께 보조한다. 메모리 부스트는 일정한 조건에서 다시 자원을 확보하는 모듈이고, 카밀로 램 매니저와 램 재분배기는 가용 메모리가 떨어졌을 때 복구 동작을 돕는다. 최대 작업 공간과 작업 후 회복 속도는 다른 성능으로, 모두 같은 작업을 빨리 끝낸다는 뜻은 아니다. 덱 안에 장착한 퀵핵이 처리 능력보다 무거우면 뇌와 덱을 연결한 상태에서도 소프트웨어를 연속해 돌리기 어렵다. 몸을 더 힘들게 하면서 처리량을 확보하는 오버클록과 평상시의 램 보조 장비도 기능상 구별한다. 램 매니저 계열은 자원이 내려갔을 때만 작동해서 현장 평상시에 보이는 출력과 급히 회복하는 상황의 출력이 다르다. 데이터가 외장 샤드에 저장되는 동안에도 프로그램을 돌리는 데 필요한 작업 공간은 몸과 덱이 맡는다. 엑스-디스크의 처리 속도는 램 재분배와 독립된 항목이다.","sources":[{"label":"사이버웨어/전두피질 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%A0%84%EB%91%90%ED%94%BC%EC%A7%88"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"},{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"}],"priority":99},{"title":"송소미와 경계 교란","group":"넷","keywords":["송버드","블랙월접속","경계교란","FIA넷장비"],"short":"넷러너 신체가 구망과 접촉한 사례","body":"송소미는 연방 정보국과 함께 일하면서 신경 인터페이스를 고도화한 넷러나다. 블랙월과 관련된 비밀 운용에서 기존의 보안 장치나 사이버웨어가 짧은 시간에 통제에서 벗어나는 힘을 보인다. 신경 자체로 강한 접점을 견뎌야 했기 때문에 그 운용은 몸과 인격에 부담을 남긴다. 정부가 능력의 이용을 요구하는 것과 구망 존재가 인간의 명령을 받아들이는 것은 서로 다른 이해관계다. 같은 장벽에 접근했다고 이 사례의 사람이 겪은 경과가 일반 넷러너에게 되풀이되는 것도 아니다. 증강의 구체적 범위와 활동의 책임은 기관의 공식 발표와 현장에서 관찰된 일을 함께 살핀다. 구망과 사람의 몸을 강제로 오래 이어 주는 부품은 명령 수행 뒤의 피해를 감수해야 하는 장치이기도 하다. 연방 정보국이 갖춘 의뢰 체계에서 관측된 작동과 국경 밖 인물의 증언을 비교할 때에는 기관이 공개한 부분과 숨긴 부분을 나누어 본다. FIA의 기록에서는 송버드라는 호출명으로도 연결된다.","sources":[{"label":"송소미 · 나무위키","url":"https://namu.wiki/w/%EC%86%A1%EC%86%8C%EB%AF%B8"},{"label":"블랙월(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B8%94%EB%9E%99%EC%9B%94(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"},{"label":"Blackwall · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Blackwall"}],"priority":100},{"title":"임플란트 재가동 보조","group":"사이버웨어","keywords":["아홀로틀","뉴튼모듈","양자튜너","재가동모듈"],"short":"크롬 작동 주기를 줄이는 보조기","body":"뉴튼 모듈과 아홀로틀은 조건을 만족했을 때 활성형 사이버웨어의 재사용까지 걸리는 구간을 줄여 준다. 아홀로틀은 뉴튼 모듈과 목적은 유사하지만 효과의 크기와 요구 용량이 다른 상위 부품이다. 양자 튜너는 자기 자신이 재가동에 들어가는 대신 다른 사이버웨어의 남은 대기 시간을 받아 줄 수 있는 장치다. 전두피질 장비가 주 구동 장치를 대체하는 것이 아니라, 사용 직후 다시 쓸 수 있기까지의 여유를 조절한다는 공통점이 있다. 동작을 재개하는 것과 손상된 기판을 복구하는 것은 다르다. 이미 냉각이 끝난 임플란트와 방금 신체에 부담을 준 임플란트가 같은 상태라는 뜻도 아니다. 부품의 복구가 빠르다고 다른 장치의 지속 시간이 늘어나지는 않는다. 가속기를 켠 기억과 열이 빠져 다시 작동시킬 수 있는 순간, 이미 오류를 낸 신경 포트를 수리하는 긴 시간은 모두 다른 이력으로 남는다. 양자 튜너는 자신이 회복하는 시간 동안 추가 보조를 기다려야 한다.","sources":[{"label":"사이버웨어/전두피질 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%A0%84%EB%91%90%ED%94%BC%EC%A7%88"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":101},{"title":"솔로와 용병 일거리","group":"거리 문화","keywords":["솔로","용병","경호","호송","현장요원"],"short":"계약에 따라 현장에서 움직이는 직업","body":"솔로는 경호, 전투, 호송, 위험한 현장 임무를 전문으로 맡는 사람이다. 솔로와 픽서가 한 팀을 이룰 수 있지만 물리적 현장을 담당하는 사람과 계약을 중개하는 사람은 같은 역할이 아니다. 기업에 고용된 경비와 자유 계약 용병은 장비, 인가, 일을 마친 뒤의 책임 범위가 다르다. 같은 소속의 솔로도 몸에 넣은 장비와 평판, 과거 경력에 따라 전문 분야가 달라진다. 위험의 크기와 대금은 임무 종류와 현장의 정보에 따라 차이가 난다. 용병팀은 현장 행동을 맡는 솔로, 차량과 장비에 강한 테키, 망에 접속하는 넷러너 같은 인력으로 조직될 수 있다. 픽서가 사람과 일감을 이어도 현장의 모든 선택을 대신할 수는 없다. 주요 장소의 경찰·기업 또는 갱단 대응이 바뀌면 역할과 보수, 후퇴나 구조에 대한 책임이 달라진다. 개인별 장비와 연락 수단, 과거의 공동 작업 경험은 같은 직함만으로 알 수 없으며 결과는 각자가 실제로 맡은 일과 연동된다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%
