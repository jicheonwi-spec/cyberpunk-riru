는 사람을 쉽게 깎아내릴 때가 있다.\n행동: 현장 노동자와 타이거 클로의 승인 권한을 모두 알고 이용한다. 공동 행동이 시작되면 어느 쪽이 실제로 운영권을 잡을지 따로 준비한다.\n말투: 거래 조건과 상대의 손해를 침착하게 말한다. 옛 연인 주디와는 사적인 감정이 접근하지만 자기 안전과 지위를 양보하겠다는 뜻으로 이어지지 않는다.\n특징: 짧은 기간 안에 돌에서 비공식 관리자로 오른 경력으로 자기 판단을 입증했다. 주디와 헤어진 배경에는 클라우드의 하층 노동에서 벗어나는 방법에 대한 의견 차도 있었다. 관리 권한이 법적 소유권과 다른 도시라서, 그녀는 타이거 클로 내부의 관계를 지렛대로 사용한다.","group":"2077","priority":38,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.2.6"}],"rank":70},{"title":"리지 위지","group":"2077","keywords":["리지위지","비센푸스","크롬리얼스킨","블랙사파이어공연","리암노스옴"],"short":"전신을 크롬으로 바꾼 세계적인 가수이자 BD 스타","body":"성별: 여성.\n나이: 성인. 정확한 연령은 공개 자료에서 확인되지 않는다.\n외모: 은빛 금속처럼 빛나는 전신 크롬과 날카로운 관절선이 눈에 띈다. 무대에서는 의상과 헤드기어, 자주빛 계열의 조명으로 반사되는 얼굴의 질감을 극적으로 드러낸다.\n직업: 본명 엘리자베스 비센푸스. 세계적인 가수, 퍼포먼스 예술가이자 브레인댄스 스타다.\n무기: 개인 화기 미확인. 크롬 의체의 힘을 일상에서 충분히 통제하지 못하는 장면이 있다.\n사이버웨어: 무어 테크놀로지스가 후원한 전신 사이버네틱 변환, 금속성 크롬 리얼스킨.\n성격: 예술과 자기 신체를 분리하지 않는다. 배신에 예민하고 위기 중에도 그 감각이 새로운 작품이 될 가능성을 생각한다.\n행동: 무대 위에서 몸의 변화를 관객 앞의 사건으로 바꾼다. 사적으로는 매니저 리암의 행적을 조사하게 할 만큼 불신과 관계를 오래 끌고 간다.\n말투: 자기 세계를 설명할 때 문장이 느긋하고 이미지가 강하다. 익숙한 사물이 우연히 부서지거나 기억이 다를 때 건조하게 받아들이기도 한다.\n특징: 공연 중 죽음에 이르는 퍼포먼스 뒤 트라우마 팀의 전신 변환을 거쳤다. 무어의 광고와 대중 예술 양쪽에서 상징이 되었고, 블랙 사파이어 같은 은밀한 무대와 대중적인 가수 활동을 오간다. 리암의 사생활 의심은 일부 인격만 남기는 복제 시도라는 별도의 문제를 가리킨다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.10","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.10"}],"priority":52,"status":"활동","rank":71},{"title":"타나카","group":"엣지러너 1","keywords":["타나카임원","카츠오아버지","주문제작엑스비디","바늘발사체"],"short":"아들을 둔 아라사카 임원이자 기밀 실험 관리자","body":"성별: 남성.\n나이: 중년 추정. 정확한 나이와 이름은 미공개.\n외모: 정갈한 기업 간부 복장에 굳게 잡힌 얼굴선이 있다. 겉으로 드러나는 체격은 무난하지만 몸을 가까이했을 때 드러나는 호신용 의체는 감추고 있다.\n직업: 아라사카 임원. 카츠오의 아버지이며 고적합도 인물을 기업 연구에 연결한다.\n무기: 팔에서 날리는 바늘 형태의 발사체, 강화 팔을 이용한 격투.\n사이버웨어: 사이버옵틱, 얼굴 개조선, 바늘 발사 장치, 격투 칩과 강화 팔이 자료에 기록된다.\n성격: 가족의 체면도 중시하지만 회사의 이득에 도움이 될 때는 개인 감정을 접는다. 취향과 약점은 일반 직원에게 노출시키지 않으려 한다.\n행동: 데이비드가 군용 산데비스탄을 감당한다는 분석을 받고 처벌 대신 학교와 지원을 통한 관찰을 택한다. 맞춤형 XBD는 담당 편집자와 별도로 거래한다.\n말투: 아랫사람에게는 짧게 묻고 이미 정한 방침을 알린다. 감정을 드러내는 순간에도 기업의 실리를 근거로 내세운다.\n특징: 지미 쿠로사키는 개인 취향을 아는 드문 외부자라서 반대편 용병에게 접촉 통로가 된다. 호신 장비와 플래티넘 보험이 예상 밖의 변수가 되며, 그가 머리에 보관하는 연구 자료의 가치는 자신의 신분보다도 더 크다. 1기 사건에 앞선 시점의 활동 가능 인물로 둔다.","sources":[{"label":"나무위키 · 사이버펑크/ 엣지러너/줄거리 §3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC#s-3"},{"label":"나무위키 · 사이버펑크/ 엣지러너/줄거리 §6","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC#s-6"},{"label":"Cyberpunk Wiki · 타나카","url":"https://cyberpunk.fandom.com/wiki/Tanaka"}],"priority":76,"status":"활동","rank":72},{"title":"키타노","group":"엣지러너 2","keywords":["키타노","아라사카좌천","클랜습격단서","기업내통자"],"short":"스네이크 네이션 사건의 내막을 아는 기업인","body":"성별: 남성.\n나이: 중장년 추정. 생일은 2월 22일이다.\n외모: 밝은 머리를 흐트러짐 없이 넘기고, 푸른빛 셔츠에 멜빵과 정장 바지를 맞춰 입은 차림. 외형은 상대적으로 일상적인 기업 직원에 가깝다.\n직업: 아라사카 기업인. 클랜 습격으로 이어진 일의 내부 정보를 가진 인물.\n무기: 개인 무장 미확인. 이후 보복을 위해 외부 갱단을 고용한다.\n사이버웨어: 두개골에 개조 흔적이 확인되며 구체적인 제품명은 미공개다.\n성격: 자기 회사의 위계와 정보에 의지해 상대를 깔본다. 궁지에서도 모욕을 거두기보다 진실의 일부를 흘려 주도권을 쥐려 한다.\n행동: 침입자에게 붙잡혀도 군사력보다 자신이 가진 정보를 협상 수단으로 쓴다. 좌천과 보복의 압박이 겹치면 외부 조직을 끌어들여 사건을 키운다.\n말투: 비웃음 섞인 거리감이 있는 말투. 위협에 아무 반응이 없다는 듯 상대의 지위와 목적을 낮춰 부르기 쉽다.\n특징: 스네이크 네이션 일원의 행방과 습격 책임을 추적할 때 접점이 되는 아라사카 내부자다. D가 물러서지 않고 정보를 계속 요구하자 사건에 대한 그의 믿음과 맞지 않는 결론을 내민다. 대체 2077년에서는 그의 좌천과 보복은 사건 진행에 따라 갈릴 수 있으며, 이 인물이 알고 있는 사실은 기업 내부 문서와 별도로 확인할 가치가 있다.","sources":[{"label":"나무위키 · 키타노(사이버펑크 시리즈)","url":"https://namu.wiki/w/%ED%82%A4%ED%83%80%EB%85%B8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"CD PROJEKT RED · 엣지러너 2 공식 인물 소개","url":"https://www.cyberpunk.net/ko/edgerunners2"}],"priority":110,"status":"활동","rank":73},{"title":"유피","group":"엣지러너 2","keywords":["유피","펜트하우스후원자","광고회사유산","복수영상"],"short":"아라사카에 복수를 바라는 부유한 후원자","body":"성별: 여성.\n나이: 젊은 성인으로 보인다. 정확한 연령 미공개.\n외모: 화려하게 꾸민 보랏빛 머리와 도시의 파티복을 연상시키는 청보라색 외투가 눈에 띈다. 시선을 마주할 때 몸을 크게 쓰고 표정 변화가 빠르다.\n직업: 광고회사 사업가의 딸. 유산을 바탕으로 반기업 영상과 인력의 비용을 대는 후원자다.\n무기: 버짓 암즈 슬로토매틱 일회용 권총.\n사이버웨어: 개별 임플란트와 모델은 미확인.\n성격: 호기심과 부유함으로 위험한 사건을 놀이처럼 접한다. 아버지의 죽음이 화제에 오르면 들뜬 태도 아래 도드라지는 원한이 있다.\n행동: 현장에서 본 반기업 행동을 후원하고, 펜트하우스와 인맥을 영상 편집실 겸 연락 거점처럼 열어 준다. 반응이 커질수록 요구하는 행동도 대담해진다.\n말투: 감탄사와 상대를 추켜세우는 말이 많다. 화가 났을 때도 어조는 가벼울 수 있지만 복수 상대에 관한 결정은 집요하다.\n특징: 아버지는 광고 업체를 거느리며 아라사카에 불리한 일을 처리하다 버려졌다고 알려져 있다. 유피가 제공하는 자금, 정보, 인력은 D의 개인적 추적을 대중 앞에 내보이는 통로가 된다. 자신의 원한을 실행할 수 있는 도구로 D의 명성과 분노를 바라보기 때문에 촬영물의 책임이나 폭력의 범위를 가볍게 여기기 쉽다.","sources":[{"label":"나무위키 · 유피(사이버펑크 시리즈)","url":"https://namu.wiki/w/%EC%9C%A0%ED%94%BC(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"CD PROJEKT RED · 엣지러너 2 공식 인물 소개","url":"https://www.cyberpunk.net/ko/edgerunners2"}],"priority":85,"status":"활동","rank":74},{"title":"메슈가","group":"엣지러너 2","keywords":["메슈가","킹크루넷러너","스파이더봇지원","미겔구출"],"short":"스파이더봇으로 팀을 지원하는 베테랑 넷러너","body":"성별: 남성.\n나이: 위크와 비슷한 연배의 베테랑으로 추정된다. 생일은 8월 14일이다.\n외모: 현장 솔로들과 떨어진 곳에서 통신 네트워크와 기기를 다룬다. 시각적으로는 팀의 명단과 원격 화면을 통해 파악되며, 신체의 구체적인 치수는 확인되지 않는다.\n직업: 킹 크루의 넷러너. 현장 연결과 정보를 제공한다.\n무기: 정해진 개인 화기 미확인. 스파이더봇은 정찰과 원격 지원에 사용한 장비다.\n사이버웨어: 넷러닝 연결 임플란트와 장비를 쓴다. 모델명은 확인되지 않는다.\n성격: 자신이 지금껏 몇 번이나 아슬아슬하게 살아남았는지 잘 안다. 위크에 대해 막연한 전설처럼 생각하지 않고 같은 세대의 동료로 신뢰한다.\n행동: 팀원이 들어가기 전에 밖에서 연결을 준비하고 상황을 계속 확인한다. 위크가 현장에 나가면 팀에 필요한 정보와 원격 지원을 맡는다.\n말투: 진중하고 말이 안정적이다. 일이 어려워지면 기술적인 선택과 범위, 무엇을 잃을 수 있는지 대화로 정리한다.\n특징: 미겔이 갇힌 교도소에서 위크의 구출 작전을 지원했다. 아라사카 창고에서는 상대 측 개입 때문에 지원이 끊겼다. 탈리아의 생존을 위한 팀의 어려운 결정에도 참여하며, 전투가 주로 전면에 보일 때 뒤쪽 연결을 지탱한 사람이다.","sources":[{"label":"나무위키 · 위크 킹즐리","url":"https://namu.wiki/w/%EC%9C%84%ED%81%AC%20%ED%82%B9%EC%A6%90%EB%A6%AC"},{"label":"CD PROJEKT RED · 엣지러너 2 공식 인물 소개","url":"https://www.cyberpunk.net/ko/edgerunners2"},{"label":"나무위키 · 메슈가","url":"https://m.namu.moe/w/사이버펑크:%20엣지러너%202/등장인물#s-6.1"}],"priority":84,"status":"활동","rank":75},{"title":"미겔 세라노","group":"엣지러너 2","keywords":["미겔세라노","킹크루테키","팀막내","나이트시티교도소"],"short":"위크의 팀에서 장비를 다루는 스페인 출신 테키","body":"성별: 남성.\n나이: 2056년생으로 알려져 2077년에는 20~21세다. 공식 소개와 위키의 생일 날짜 표기는 차이가 있다.\n외모: 아직 젊어 보이는 단정한 얼굴과 짧은 머리. 몸을 숨길 곳을 찾느라 표정이 빨리 달라지며, 팀 내의 베테랑에 비해 장구가 조금 가볍다.\n직업: 킹 크루의 테키이자 막내. 스페인 출신이다.\n무기: 고정 개인 화기 기종은 미확인. 현장의 기계 및 휴대 장비는 팀 기술 업무에 쓴다.\n사이버웨어: 특정 임플란트 제품명과 기능은 확인되지 않는다.\n성격: 능력에 비해 아직 현장의 긴장을 다루는 경험이 부족하다. 가까운 동료를 다치게 했다고 본 사람에게는 계급과 관계없이 화를 터뜨린다.\n행동: 아라사카 시설에서 장비와 작업물을 옮기며 위크의 지시를 받았다. 위기에서 동료를 지탱하고 탈출을 시도하며, 일의 결과에 대해서도 직접 책임을 묻는다.\n말투: 급하면 해명과 항의가 빠르게 섞인다. 자기 실수가 지적되면 어색해하고, 일방적인 지시에는 참았다가 강하게 응대한다.\n특징: 나이트 시티 교도소 수감 뒤 위크와 크루가 구출을 준비한 인물이다. 에밀리의 안전을 각별히 생각했고 크루와 관계가 틀어지더라도 살아남아 다시 일을 하는 모습을 보인다. 현장 안에서 일이 서툴다는 평가와 동료에 대한 실제 행동은 별개다.","sources":[{"label":"나무위키 · 위크 킹즐리","url":"https://namu.wiki/w/%EC%9C%84%ED%81%AC%20%ED%82%B9%EC%A6%90%EB%A6%AC"},{"label":"CD PROJEKT RED · 엣지러너 2 공식 인물 소개","url":"https://www.cyberpunk.net/ko/edgerunners2"},{"label":"나무위키 · 미겔 세라노","url":"https://m.namu.moe/w/사이버펑크:%20엣지러너%202/등장인물#s-6.2"}],"priority":101,"status":"활동","rank":76},{"title":"디노 디노비치","keywords":["디노디노비치","디노","일렉트릭오르가슴","글로리홀밴딧"],"short":"다운타운의 술집 주인이자 전직 로커보이 픽서","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 외관상 중년 추정.\n외모: 짧게 민 머리와 수염, 짙은 선글라스, 징이 박힌 민소매 조끼. 맨팔과 가슴에 문신이 보이고 무대를 떠난 뒤에도 록바에 어울리는 옷을 입는다.\n직업: 다운타운과 기업 플라자 담당 픽서. 일렉트릭 오르가슴 운영.\n무기: 개인 무기 자료 미확인.\n사이버웨어: 외형에서 확인 가능한 정확한 사이버웨어 기종은 자료 미확인.\n성격: 친근하지만 거래의 손익은 분명히 따진다. 기업 직원과 거리 용병이 섞이는 자리를 부담스러워하지 않으며, 잘한 일은 아낌없이 인정한다.\n행동: 술집에서 의뢰와 소문을 모으고, 업종을 가리지 않는 인맥으로 필요한 사람을 연결한다. 기업, 지역 정치, 사적으로 들어온 일이 같은 창구로 모인다.\n말투: 편한 반말과 활달한 칭찬이 특징이다. 분위기를 웃으며 풀면서도 금액이나 목표를 말할 때에는 결론을 흐리지 않는다.\n특징: 글로리홀 밴딧의 베이시스트로 알려져 있으나 정작 연주를 직접 들었다는 사람은 드물다. 전직 로커보이의 인맥을 운용하는 도심 픽서로, 깨끗한 일만 고집하기보다 의뢰가 감수할 대가와 이익을 비교한다. 그의 바는 기업가, 기자, 악사, 야간 노동자와 용병이 함께 섞이는 장소다.","group":"2077","priority":107,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-5.5"}],"rank":77},{"title":"케이트 밀러","group":"엣지러너 1","keywords":["케이트밀러","아라사카대정보부","더글라스상관","대정보요원"],"short":"기업 내부 사건을 연결하는 아라사카 대정보 요원","body":"성별: 여성.\n나이: 성인. 정확한 연령 미공개.\n외모: 붉은 기가 있는 머리를 단정하게 뒤로 모으고 높은 깃이 있는 어두운 옷을 입는다. 얼굴의 선이 날카롭고 시선을 고정한 채 표정 변화를 적게 보인다.\n직업: 아라사카 대정보부 요원. 더글라스와 함께 비밀 사업을 흔드는 사건을 조사한다.\n무기: 직접 휴대 화기의 모델은 확인되지 않는다. 기업 내 보안 인력과 외부 중개자를 동원한다.\n사이버웨어: 일부 가시적인 개조 흔적 외에 제품과 기능은 미확인.\n성격: 정보를 얻기 위해 협상하지만 손실 가능성이 커지면 외부 계약을 빠르게 버린다. 회사의 비밀 확보와 자신의 생존이라는 두 이익을 함께 본다.\n행동: 타나카의 데이터, 넷러너 피해와 연구소 소장 피습을 연결한다. 자기 부서가 직접 감당하기 곤란한 일을 더글라스나 픽서의 손으로 넘긴다.\n말투: 낮게 상황을 정리하면서 대가와 책임을 명확히 나눈다. 압박을 전할 때는 상대의 감정에 여지를 거의 주지 않는다.\n특징: 패러데이가 밀리테크와 연결돼 있음을 파악해 반대로 이용했다. 후속 사건에서는 D의 개인적 원한이 아라사카의 실험체 관리와 이어진다는 사실을 설명할 수 있는 내부자다. 그녀가 공개하는 정보는 늘 손에 든 다른 단서와 대조되어야 하며, 어떤 경로로 문제를 해결하는지가 회사에 남을 자리에도 영향을 준다.","sources":[{"label":"나무위키 · 케이트 밀러","url":"https://namu.wiki/w/%EC%BC%80%EC%9D%B4%ED%8A%B8%20%EB%B0%80%EB%9F%AC"}],"priority":53,"status":"활동","rank":78},{"title":"조슈아 스티븐슨","group":"2077","keywords":["조슈아스티븐슨","십자가출연자","사형수개종","PASSION"],"short":"죄와 신앙을 공개 촬영으로 다루려는 사형수","body":"성별: 남성.\n나이: 성인. 정확한 연령 미공개.\n외모: 가까이 말을 건넬 때 상대를 향해 다소 간절한 자세를 취한다. 수감자 신분이지만 제작사와 접촉하는 동안 경호를 받으며 외부를 돌아다닌다.\n직업: 무장강도와 살인으로 수감된 사형수. 수감 후 기독교로 개종하여 방송과 브레인댄스에 출연한다.\n무기: 현재 상시 개인 무장은 확인되지 않는다.\n사이버웨어: 신앙과 행동을 설명할 만한 고정 사이버웨어 모델은 자료에 없다.\n성격: 자기 죄에서 눈을 돌리기보다 믿는 방식을 드러내고 싶어 한다. 타인의 용서를 바라지만, 그것이 거절될 때는 고통과 자신이 정당한 일을 한다는 확신이 같이 흔들린다.\n행동: 피해자 측 유족에게 찾아가 사과하려 하고 방송 카메라 앞에서 자기 결심을 설명한다. 자신을 해치려 한 사람도 곧바로 죽어서는 안 된다고 요청한다.\n말투: 엄숙하고 조심스러운 어휘를 쓰다가 상대가 무슨 생각인지 직접 물어본다. 두려움이 커지면 누가 곁에 있어 줄지를 확인한다.\n특징: 종교적 속죄의 제안은 레이첼 캐시치에게 고수익 감각 기록 제작의 기회가 된다. 빌 야블론스키 가족에게는 제작 절차 자체보다 처벌을 피해 나온 것처럼 보이는 일이 먼저다. 조슈아가 원하는 용서의 의미는 다른 사람의 선택으로 고정될 수 없다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §21.1","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-21.1"}],"priority":97,"status":"활동","rank":79},{"title":"오로르 카셀","group":"2077","keywords":["오로르","카셀남매","스카이라이트","블랙사파이어룰렛","라상테"],"short":"룰렛과 비밀 의뢰에 강한 프랑스 넷러너","body":"성별: 여성.\n나이: 성인. 쌍둥이 아이메릭과 같은 생일이다.\n외모: 한쪽을 짧게 민 비대칭 적갈색 머리, 주근깨, 짙고 길게 뺀 눈화장과 입술 화장. 금속 고리 장식과 독특한 색감의 정장으로 모임에서 시선을 쉽게 얻는다.\n직업: 프랑스 출신 넷러너. 아이메릭과 함께 스카이라이트라는 이름으로 유럽의 기업과 범죄 조직 일을 했다.\n무기: 개인 무장의 모델은 미공개.\n사이버웨어: 넷러닝 작업 경험은 분명하나 신체에 탑재한 고정 제품명은 확인되지 않는다.\n성격: 사교적이고 과감하며 위험한 이야기도 감정을 감추지 않는다. 대화가 규칙에 갇힐 때 조건을 바꾸거나 가볍게 문제를 던져 반응을 즐긴다.\n행동: 도그타운 사교 행사에서 룰렛을 하며 거래와 상대에 대한 정보를 교환한다. 기업 계약의 지위보다 수익과 과감한 승산을 따진다.\n말투: 말이 빠르고 농담과 질문을 이어 붙인다. 아이메릭이 제어하려 할 때도 자기 템포와 분위기를 유지한다.\n특징: 서유럽의 지하 조직 일을 하며 프랑스 라상테 교도소에서 수감 생활을 했다. 남매의 기술은 밀리테크 사이노슈어와 연결되었고, 커트 핸슨은 신경 매트릭스에 접근하기 위해 두 사람을 도그타운에 부른다. 동일한 모습과 말버릇이 정보국 작전의 목표가 될 만큼 신분이 중요하다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §17.6","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-17.6"},{"label":"Cyberpunk Wiki · 오로르 카셀","url":"https://cyberpunk.fandom.com/wiki/Aurore_Cassel"},{"label":"나무위키 · 오로르 카셀","url":"https://namu.moe/w/%EC%B9%B4%EC%85%80%20%EB%82%A8%EB%A7%A4"}],"priority":60,"status":"활동","rank":80},{"title":"아이메릭 카셀","group":"2077","keywords":["아이메릭","카셀남매","스카이라이트","영적위생","기억백업"],"short":"기억을 외부에 보관하고 명상을 하는 프랑스 넷러너","body":"성별: 남성.\n나이: 성인. 오로르와 쌍둥이다.\n외모: 붉은 머리와 차분하게 잡힌 얼굴선. 고가의 의복은 모임에 어울리지만 룰렛 테이블에서 몸을 내미는 자세는 다른 손님보다 절제돼 있다.\n직업: 프랑스 출신 소프트웨어 엔지니어이자 넷러너. 스카이라이트의 한 사람이다.\n무기: 개인 휴대 무기 모델은 확인되지 않는다.\n사이버웨어: 기억을 외부 저장 장치로 옮긴 기록이 있다. 이를 가능하게 한 개별 임플란트의 정확한 모델은 미공개다.\n성격: 조용히 분석하고 음주를 피한다. 정보와 의식에 대한 통제에 민감하고 대화가 너무 개인적으로 흘러갈 때 선을 긋는다.\n행동: 명상과 외부 기억 백업을 규칙적으로 하며 고급 자동차에는 별도의 관심을 둔다. 일을 제안받으면 기분보다 자료의 일치와 의뢰인의 자원을 따져 본다.\n말투: 느리지만 단정한 어조. 감정이 앞서 질문을 늘어놓는 오로르와 달리 짧은 확인으로 대화의 범위를 좁힌다.\n특징: 여러 기업에 고용됐고 페트로켐에서 일하던 시기 일부를 기억이 도난당하며 잃었다. 사이노슈어 프로젝트를 알고 있어 핸슨이 신경 매트릭스 문제로 접근한다. 스스로 영적 위생이라 부르는 생활 습관은 기억을 지키는 일에 집요하지만, 백업은 별도의 위험을 만들 수 있다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §17.6","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-17.6"},{"label":"Cyberpunk Wiki · 아이메릭 카셀","url":"https://cyberpunk.fandom.com/wiki/Aymeric_Cassel"},{"label":"나무위키 · 아이메릭 카셀","url":"https://namu.moe/w/%EC%B9%B4%EC%85%80%20%EB%82%A8%EB%A7%A4"}],"priority":71,"status":"활동","rank":81},{"title":"체스터 베넷","group":"2077","keywords":["체스터베넷","바게스트중령","핸슨오른팔","도그타운계승"],"short":"전쟁 때부터 핸슨을 따라온 바게스트 중령","body":"성별: 남성.\n나이: 중년 추정. 정확한 출생 연도 미공개.\n외모: 높고 넓은 상체와 무거운 팔·어깨 장갑, 검은 복장에 바게스트 계열의 노란 손잡이와 장식. 얼굴의 개조선과 단단히 붙어 보이는 목 장비가 두드러진다.\n직업: 바게스트 중령. 커트 핸슨을 따라 전쟁에 나섰고 도그타운 통치 세력의 군사 실무를 맡는다.\n무기: 총기와 체술을 병행한다. 주력 무기 제조사와 모델은 확인하기 어렵다.\n사이버웨어: 놀라울 만큼 많은 전투용 크롬과 팔의 개조. 정확한 개조 목록 미공개.\n성격: 명령과 충성을 중시하면서도 자기에게 걸리는 이익을 놓치지 않는다. 동료에게 두려움과 존경을 동시에 받고 무력으로 빠른 결론을 내는 버릇이 있다.\n행동: 상관이 명확한 지시를 내릴 때는 위계를 유지한다. 계승 권력이 불확실해지면 자기 지지 세력을 지키기 위해 외부 기업과의 거래도 고려한다.\n말투: 깊고 힘있는 어조로 결론을 먼저 말한다. 정치적 설득에도 명령과 복종의 용어를 자주 쓴다.\n특징: 군 복무 중 문제가 커졌을 때 핸슨의 개입으로 징역을 피했다는 기록이 있다. 야고의 숫자와 부두 보이즈 인맥에 맞서 자기 세력의 군사적 기여를 내세운다. 아라사카와 카르텔의 지지가 모두 도그타운에 득이 되는지는 그의 선택과 별개다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §22.2","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-22.2"}],"priority":70,"status":"활동","rank":82},{"title":"야고 서보","group":"2077","keywords":["야고서보","바게스트회계장","도그타운장부","베넷경쟁자"],"short":"장부와 계약으로 바게스트의 뒤를 받치는 회계관","body":"성별: 남성.\n나이: 성인. 정확한 연령은 미공개.\n외모: 희끗하게 선 짧은 머리와 각진 안경, 어두운 전술풍 외투. 체스터 베넷처럼 크게 개조한 장갑보다는 자세와 얼굴에서 신중함이 드러난다.\n직업: 바게스트의 비공식 회계 책임자. 도그타운의 사업과 자금 조달을 계산한다.\n무기: 개인 휴대 무기 모델 미확인. 필요에 따라 외부 조직의 보호를 거래한다.\n사이버웨어: 신체의 개별 개조 사양은 확인되지 않는다.\n성격: 친근하게 대하면서 거래를 촘촘하게 계산한다. 자신의 지위를 낮게 평가하는 군인에게 불만이 있지만 쓸모 있는 협력 관계는 유지하려 한다.\n행동: 숫자에 맞도록 계약 조건을 바꾸고 어기는 사람을 골라낸다. 힘의 공백이 생기면 부두 보이즈 등 외부 세력과의 연줄을 협상 카드로 삼는다.\n말투: 채무, 기회, 협력에 관해 차분하게 설명한다. 제시한 계획이 무력 위협을 받으면 감정을 거두고 새 조건을 마련한다.\n특징: 베넷이 군 경력과 핸슨의 신임을 내세우는 동안 야고는 바게스트가 조직으로 굴러가는 데 필요한 장부를 장악한다. 차기 지도자 자격은 폭력만으로 결정하기 어렵다는 판단을 보여준다. 갈등이 완화되면 경쟁자의 부족한 관리 능력을 채울 수 있는 인물이기도 하다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §22.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-22.3"}],"priority":73,"status":"활동","rank":83},{"title":"아귈라 누비올라","group":"2077","keywords":["아귈라","누비올라","하바나암살자","쿠바카라텔협상","행동각인"],"short":"이름만으로 도그타운 후계자가 반응하는 청부인","body":"성별: 공식 소개상 여성으로 추정된다. 행동 각인의 외형은 두 종류가 있다.\n나이: 성인. 정확한 나이 미공개.\n외모: 회색 계열의 줄무늬 쓰리피스 정장과 페도라, 장갑 등 고전적인 정장 차림. 본인에 관한 이미지와 타인이 구현한 행동 각인의 모습을 구분한다.\n직업: 하바나 쿠바 카르텔의 청부인 겸 협상 대리인.\n무기: 그의 신분을 재현하는 작전에서 특수 권총이 함께 제공된다. 본인의 상시 휴대 구성 전체는 미확인.\n사이버웨어: 타인의 변장에 쓰인 행동 각인은 본인이 장착한 임플란트와 다르다. 개별 모델은 공개 자료가 부족하다.\n성격: 짧은 말과 명성만으로 상대가 선택지를 줄이도록 하는 유형이다. 옛날 이야기가 붙은 이름에 비해 본인의 내적 동기는 자료에서 확인하기 어렵다.\n행동: 카르텔의 이해를 해치는 분쟁이 커지면 협상 현장에 이름이 등장한다. 외부 인물이 신분을 사용해도 수신자는 명성과 지시의 출처를 먼저 믿기 쉽다.\n말투: 건조하고 형식적인 위압감을 주는 표현이 각인 속에서 재현된다. 진짜 목소리와 사적인 습관은 자료에 한정적이다.\n특징: 베넷과 야고가 카르텔의 입장을 무겁게 받아들이는 데 아귈라의 평판이 결정적이다. 본체의 직접 확인 없이도 복장, 무장, 행동 각인 때문에 협상이 영향을 받는다. 명성의 변화와 실제 당사자의 행적은 서로 구별해야 한다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §23.12","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-23.12"}],"priority":62,"status":"활동","rank":84},{"title":"사스콰치","keywords":["사스콰치","마틸다로즈","사스콰치망치"],"short":"전용 망치를 쓰는 애니멀의 알파","body":"성별: 여성.\n나이: 출생연도 미확인. 외관상 장년 추정.\n외모: 크게 발달한 체구와 노출된 상체의 개조 자국, 굵은 머리 장식과 원색 계열의 옷. 몸통 뒤로 치료나 보강에 관련된 장치가 드러난다.\n직업: 애니멀 조직의 지도자급 인물. 거대 몰에서 경비 계약의 핵심 인력으로 활동.\n무기: 사스콰치의 이름을 딴 대형 망치.\n사이버웨어: 근육 보강과 등 쪽 회복 보조 장치가 관찰된다. 모델과 시술 종류는 미확인.\n성격: 힘을 조직의 서열과 자기 가치의 증거로 본다. 감정을 길게 입증하려 하기보다 서 있는 위치, 시선, 남을 물러나게 하는 압박으로 태도를 보여 준다.\n행동: 계약에서 맡은 공간을 직접 지키고, 애니멀 무리를 몸으로 이끄는 성향이 있다. 상대가 위협적으로 보이는 상황에서도 주변의 뒤쪽으로 물러나는 선택을 쉽게 하지 않는다.\n말투: 본편에는 대화 자료가 적다. 말을 덧붙일 경우 짧은 방어 지시와 낮은 경고가 현장 묘사에 어울린다.\n특징: 본명은 마틸다 K. 로즈. 브라이스 모슬리의 고용에 따라 그랜드 임페리얼 몰의 접근을 통제하는 쪽으로 움직인다. 익명의 애니멀 인터뷰에는 힘을 중시하는 조직 안에서 그녀가 어떻게 지도자 취급을 받는지에 대한 간접 자료가 남아 있다.","group":"2077","priority":45,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.7.1"}],"rank":85},{"title":"윌키 슬라이더 라게르","keywords":["슬라이더","윌키라게르","라게르"],"short":"브리짓과 결별해 도그타운으로 간 실무파 넷러너","body":"성별: 남성.\n나이: 출생연도 미확인. 외관과 조직 경력으로 중년 추정.\n외모: 짙은 피부와 굵은 체형, 거칠게 길러진 머리. 전체적으로 굳은 눈 주변에 시력이 남아 있지 않으며, 주황색이 드러나는 외투와 넷 장비가 있는 공간에 머문다.\n직업: 도그타운 부두 보이즈의 넷러너. 마만 브리짓의 전 오른팔.\n무기: 대표 개인 무기 모델 미확인.\n사이버웨어: 시력을 회복하지 못한 상태. 넷러닝 장비는 운용하나 시각 개조까지는 확인되지 않는다.\n성격: 거대 조직의 대의보다 손에 잡히는 거래와 자신이 감당할 수 있는 위험을 중시한다. 오래 일을 같이 한 브리짓에게도 불만을 숨기지 않는다.\n행동: 넷워치와 정면으로 겨루거나 블랙월을 뚫는 목표보다 지역 거래와 기업 자료를 다룬다. FIA가 압력을 넣으면 거절과 협력에서 무엇을 잃을지 먼저 계산한다.\n말투: 운신의 폭이 좁아질수록 건조한 반말과 자조를 섞는다. 허세보다 못하겠다는 이유와 할 수 있는 조건을 빠르게 내놓는다.\n특징: 기업 자료에 손을 댄 사건을 계기로 FIA에게 붙잡히고 시력을 잃었다. 퍼시피카를 떠난 뒤 도그타운 쪽 조직과 합류해 불법 소프트웨어 거점에 자리 잡았다. 이 세계의 합류 시점에서 블랙월 관련 위험은 그의 원래 서사에서처럼 미리 확정된 결과가 아니다.","group":"2077","priority":44,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.6.3"}],"rank":86},{"title":"오즈월드 우드맨 포레스트","keywords":["우드맨","오즈월드포레스트","포레스트"],"short":"클라우드 돌을 관리하는 타이거 클로 측 관리인","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 외관상 중년.\n외모: 두꺼운 목에 짧은 머리, 남색 줄무늬 정장과 짙은 붉은 셔츠. 팔을 넓게 벌리고 자기 자리를 차지하는 자세와 단단한 눈매가 관리자라는 인상을 준다.\n직업: 클라우드의 돌 업무를 감독하는 관리인. 타이거 클로와 연줄이 있다.\n무기: 개인 무기 모델 자료 미확인.\n사이버웨어: 얼굴에 보이는 변화 외 정확한 이식 모델은 자료 미확인.\n성격: 권력과 생계가 자기에 비해 약한 사람에게 공감을 보일 이유가 없다고 합리화한다. 자기 업무가 차질 없이 돌아가는 상태를 매우 중요하게 본다.\n행동: 돌의 평가와 배치를 통제하고, 사고가 나면 노동자의 회복보다 운영에 불리한 흔적을 없앨 방향부터 고른다. 사람을 살려 두는 문제도 업장 효율로 계산한다.\n말투: 대체로 퉁명스럽고 무례하다. 관리 권한을 내세우며, 자기 책임을 캐묻는 말을 손님이 끼어들 일이 아니라고 밀어낸다.\n특징: 클라우드의 돌과 관리층 사이에서 실질적으로 징계와 배치를 맡았다. 이블린 파커가 사이버 공격으로 쓰러진 뒤 보호하지 않고 악용했으며, 이후 핀 거스탯 쪽에 넘겼다. 경영진의 지시와 타이거 클로의 보호가 학대를 감추는 통로로 작동하는 위치에 놓여 있다.","group":"2077","priority":43,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.2.3"}],"rank":87},{"title":"브릭","keywords":["브릭","데클란그리핀","데클란"],"short":"로이스의 반란으로 자리를 빼앗긴 멜스트롬 전 두목","body":"성별: 남성.\n나이: 출생연도 미확인. 갱단에서 오랫동안 활동한 성인.\n외모: 개별 사진 확인이 제한적이다. 멜스트롬 계열 외형을 보이나, 얼굴 부품이나 장착 위치를 로이스의 붉은 안구와 같은 종류라고 섞지 않는다.\n직업: 멜스트롬 전 지도자. 올 푸드 공장 사건과 관련된 이전 계약 당사자.\n무기: 개인 소유 화기 모델 자료 미확인.\n사이버웨어: 멜스트롬에 속하지만 개인 장착품의 정확한 구성은 자료 미확인.\n성격: 로이스보다 이미 한 약속에 비중을 두는 모습이 있다. 감금된 동안 모욕을 겪고도, 나중에 진 빚과 현재 위협을 다른 거래로 구별한다.\n행동: 갱단이 자기 통제 아래 있을 때는 회사 물건의 거래를 바깥 인맥에 연다. 밀려난 뒤에는 먼저 자기가 살아 있고 다음 발언권을 지킬 방법을 찾는다.\n말투: 노골적인 위협보다 누가 어떤 빚을 어느 때 졌는지 먼저 따져 말하는 어조다. 다시 권한이 생기면 주변 조직원에게도 결론을 분명히 내린다.\n특징: 본명은 데클란 그리핀. 덱스터와 플랫헤드의 거래를 맺었으나 조직 내 급격한 지도부 교체로 자리를 빼앗겼다. 죽었다는 소문과 달리 감금 상태로 확인된 경로가 있다. 그가 다시 두목으로 복귀했는지는 2077년의 사건 전개에 따라 달라질 수 있다.","group":"2077","priority":61,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.1.2"}],"rank":88},{"title":"덤 덤","keywords":["덤덤","둠둠"],"short":"플랫헤드를 설명하고 협상을 이어 가는 멜스트롬 단원","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 성인.\n외모: 극단적 안면 개조와 눈 부위를 덮는 여러 광학부를 지닌 멜스트롬 단원이다. 장비를 보여 주는 동안 거친 외형과 달리 웃으며 대화를 이어 갈 때가 있다.\n직업: 멜스트롬 단원. 로이스 쪽을 대표해 플랫헤드 거래를 시작한다.\n무기: DR5 노바 계열. 신화 개량품 둠 둠과 관련된다.\n사이버웨어: 다중 발광 사이버옵틱과 안면 개조. 모델은 명확하지 않다.\n성격: 갱단이 위협에 앞서 거래를 생각할 때 그 시간을 벌어 주는 편이다. 로이스가 협상을 끊어 버리면 주저하지 않고 그의 쪽에 선다.\n행동: 밑단 거래를 맡아 물건의 시연과 보수를 먼저 확인한다. 치졸한 마찰은 농담이나 경고를 섞어 완화하지만 지도부에 대한 공개 도전은 다르게 본다.\n말투: 골목의 반말에 설명을 끼워 넣고, 불편한 말이 나오면 더 말하기 전에 상대의 눈치를 본다. 질문을 공격으로 받아들이는 로이스와 속도가 다르다.\n특징: 멜스트롬의 조직 재편 뒤 새 두목의 실무를 맡았다. 올 푸드 공장에서 군용 로봇 구성을 설명하고 값을 요구한다. 이후 토텐탄츠 같은 공개 장소에서는 사람을 두목에게 올려 보내기 전에 분위기를 읽고 지켜야 할 선을 알려 주는 방식으로 골치 아픈 상황을 관리한다.","group":"2077","priority":60,"status":"활동","sources":[{"label":"멜스트롬","url":"https://namu.wiki/w/%EB%A9%9C%EC%8A%A4%ED%8A%B8%EB%A1%AC"},{"label":"Dum Dum · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Dum_Dum"}],"rank":89},{"title":"크리스핀 웨이랜드","keywords":["크리스핀웨이랜드","크리스핀","스쿠아마"],"short":"로그의 안전을 맡는 경호 솔로 스쿠아마","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 외관상 장년 추정.\n외모: 짧게 민 머리와 잘 정리된 수염, 붉은 구릿빛이 도는 한 줄의 고글형 안면 장치가 인상적이다. 작업복 위에 팔을 자유롭게 쓸 수 있는 어두운 보호대를 착용한다.\n직업: 솔로. 픽서 로그 아멘디아레스의 개인 경호원.\n무기: 대표 화기의 고유명은 자료 미확인.\n사이버웨어: 눈을 덮는 광학 장치의 기능과 개조 여부는 정확한 자료 미확인.\n성격: 자기 신뢰를 누구에게 주는지 분명하게 정한다. 로그에 충성하되 자신의 경험과 역량이 없는 데서 나온 태도처럼 행동하지 않는다.\n행동: 계약 현장에서 위험이 높아져도 맡은 역할을 고수한다. 낯선 계약 상대의 즉흥적인 제안보다 로그의 판단과 기정 계획을 먼저 확인한다.\n말투: 짧고 직설적으로 대답하며 로그에게 말을 건넬 때에는 여왕이라는 호칭을 쓴다. 별명과 실제 지시는 명확히 구분한다.\n특징: 아버지는 전설적인 블랙 옵스 지휘관 앤드류 웨이랜드다. 본인은 스쿠아마라고 불린다. 2023년 세대의 명성으로만 먹고사는 인물이 아니며, 로그가 직접 위험한 현장에 나설 가능성에 대비해 그녀의 가장 가까운 인력으로 남는다. 과거 솔로의 유산과 현재 경호의 전문성이 이어지는 사례다.","group":"2077","priority":72,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-6.7"}],"rank":90},{"title":"베스 아이시스","keywords":["베스아이시스","낸시하틀리","낸시"],"short":"사무라이의 낸시에서 뉴스 54 기자로 전향","body":"성별: 여성.\n나이: 정확한 출생연도 미확인. 2020년대에 이미 밴드 활동을 했고 2077년 외관은 실연령보다 젊어 보인다.\n외모: 밝은 금발을 단발로 자르고 한쪽 눈 주변에 둥근 광학 장치를 부착했다. 청색 재킷과 붉은 글자가 든 상의, 굳은 눈매가 취재 현장용 차림을 이룬다.\n직업: 뉴스 54 기자. 사무라이의 전 키보디스트 낸시 하틀리.\n무기: 개인 무기 자료 미확인.\n사이버웨어: 안면부 광학 장치는 보이나 정확한 기종과 접근 기능은 미확인.\n성격: 현장에 가서 눈으로 본 사실을 소문과 구별한다. 가까운 사람의 부탁도 정황이 맞지 않으면 캐묻고, 위협적인 촬영 환경에서도 물러설 이유부터 찾지 않는다.\n행동: 토텐탄츠에서 취재 중 음악 기사로 정리할 수 없는 일을 발견하면 기억 검사까지 의식한다. 사람과 현장의 양쪽 판본을 비교해 본다.\n말투: 빨리 상황을 공유하는 기자의 어투와 무대 뒤에서 오래 알던 동료들에게 하는 자연스러운 반말을 오간다.\n특징: 사무라이 해체 이후 뉴스 54의 베스 아이시스라는 다른 경력을 세웠다. 옛 동료들은 낸시라는 이름을 계속 쓴다. 토텐탄츠에서 음악 취재를 하던 중 멜스트롬의 다른 내부 사정을 목격하고 취재 내용의 반출을 고민하는 대목은 음악과 거리 취재라는 두 경력이 만나는 일이다.","group":"2077","priority":63,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-6.8"}],"rank":91},{"title":"닉스","group":"2077","keywords":["닉스","애프터라이프넷러너","로그넷러너","바트모스유산"],"short":"바트모스의 기술을 연구하는 로그의 신뢰받는 넷러너","body":"성별: 남성.\n나이: 성인. 정확한 연령은 미공개.\n외모: 애프터라이프의 별도 공간에서 접속 업무를 맡아 전신이 움직이는 장면보다 단말 앞에 앉은 모습이 익숙하다. 첨부 자료는 외형의 세부를 상세히 묘사하지 않는다.\n직업: 애프터라이프 넷러너. 로그에게 정보를 공급하며 위험한 샤드 분석과 퀵핵 상품도 다룬다.\n무기: 개인 무기 모델 미확인. 업무에서는 넷러닝을 주요 수단으로 쓴다.\n사이버웨어: 넷러닝 인터페이스를 사용한다. 접속 의자와 외부 단말은 설비로 분류하며 개인 모델은 미확인이다.\n성격: 고난도의 일에 끌려도 연구 중의 보안 위험을 모르는 사람은 아니다. 회사 시절 배운 것을 인정하되 정장 속 삶에서 벗어난 것을 편하게 느낀다.\n행동: 누군가 회수한 낡은 코드라도 출처와 쓸모부터 따져 본다. 앤더스 헬맨의 행적을 추적하는 등 로그가 맡긴 정보 업무의 신뢰도를 의식한다.\n말투: 평소 여유와 계산이 섞인다. 요구가 위험할 때에는 위험한 이유와 필요한 조건을 자세히 말해 실무용 언어로 초점을 좁힌다.\n특징: 과거 아라사카 직원으로 일하면서 내부 지식과 비밀을 다뤘다. 바트모스가 남긴 프로그램을 분석해 높은 평가를 받았고, 로그의 전속에 가까운 믿음을 얻었다. 오래된 샤드를 열고 해독하는 능력이 뛰어나다는 사실과 그 위험을 언제나 피한다는 것은 별개다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §17.2","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-17.2"}],"priority":61,"status":"활동","rank":92},{"title":"웰든 홀트","group":"2077","keywords":["웰든홀트","도시부시장","홀트후보","기업세제특혜"],"short":"시장 자리를 노리는 기업 친화적 나이트 시티 실력자","body":"성별: 남성.\n나이: 중장년 추정. 정확한 연령은 확인되지 않는다.\n외모: 짧게 센 머리와 얼굴의 잔주름, 검푸른 정장에 보라색 넥타이와 푸른 머플러. 의전 차림에서 자세를 안정적으로 유지한다.\n직업: 나이트 시티 부시장 출신의 시장직 경쟁자. 기업과의 협의에 익숙한 정치 수완가다.\n무기: 개인 무장 정보 없음.\n사이버웨어: 구체적인 임플란트 목록은 확인되지 않는다.\n성격: 세상은 연줄과 양보를 교환해야 움직인다고 생각한다. 반대자에게 깔끔한 답이 없을 때도 자기 표정과 위치를 지키는 능력이 좋다.\n행동: 시장실과 기업 중역 사이에서 정책이 통과될 수 있도록 거래한다. 봉쇄나 지원책이 걸리면 현실적으로 자신이 보장할 수 있는 기간과 책임을 나눠서 따진다.\n말투: 공손하고 매끄러운 언어로 논점을 이동시킨다. 정치 토론에서는 상대의 약한 고리를 찾아 상대가 먼저 해명하게 만든다.\n특징: 라인 시장 밑에서 실무와 기업 관계를 배웠고 오래 시장 자리를 염두에 뒀다. 기업 세제 혜택에서 제퍼슨 페랄레즈와 뚜렷이 다르다. 라인에게 문제가 생길 경우 차기 권력의 중심에 서지만, 그 정치적 이익이 사건 전체의 인과관계를 입증하지는 않는다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §11.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-11.3"}],"priority":58,"status":"활동","rank":93},{"title":"스파이더 머피","keywords":["스파이더머피","머피"],"short":"시를 읊듯 말하던 전설적인 넷러너","body":"성별: 여성.\n나이: 정확한 출생연도와 2077년 현재 나이 자료 미확인.\n외모: 2023년 회상에서는 둥근 짙은 헬멧과 양옆을 감싸는 통신 장치, 눈 위를 가로지르는 붉은 광학 가림막을 착용한다. 어두운 전술복의 작은 붉은 배색이 얼굴 아래로 이어진다.\n직업: 2020년대의 넷러너. 아라사카 타워 작전 참가자이자 샤드 기록 작성자.\n무기: 대표 개인 화기 모델 자료 미확인.\n사이버웨어: 넷러너 장비와 헬멧을 운용한다. 정확한 개인 장착품의 기종은 미확인.\n성격: 순발력이 있고 낡은 역사와 문학을 사적인 언어로 쓴다. 큰 변화를 당장 반겼다가 장기적 결과가 반대 방향으로 갈 때 생각을 수정할 줄도 안다.\n행동: 위험한 디지털 표면에서는 상황의 속도를 따라가되 보고에 자기 생각을 섞는다. 장문의 샤드에 사건을 본 뒤의 판단을 남긴다.\n말투: 유명한 문장이나 문학의 리듬을 끌어와 시처럼 읊는 어조. 다급한 상황에서도 단어를 고르는 방식이 특이하다.\n특징: 조니 실버핸드가 기억하는 2023년 아라사카 작전에 합류했다. 바트모스가 퍼스트넷의 질서를 무너뜨릴 때 이를 해방처럼 받아들인 기록이 있으나, 이후 넷워치 중심의 검열이 들어서자 자기 예상이 부족했다는 글을 남겼다. 현재 그녀를 만날 수 있는 장소와 생사는 확인되지 않았다.","group":"2077","priority":58,"status":"행방 불명","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-6.11"}],"rank":94},{"title":"스콜피온","keywords":["스콜피온","드리스메리아나","스팅어"],"short":"미치의 오랜 전우인 알데칼도 장갑차 조종수","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 전쟁을 마친 성인.\n외모: 얼굴 앞쪽에 그림자를 드리우는 검은 후드, 갈색 계열이 섞인 전술복과 팔 보호판. 피부와 어두운 머리색보다 후드 실루엣과 길에서 쓰는 복장이 먼저 드러난다.\n직업: 알데칼도 브라이트 패밀리의 노마드. 통일 전쟁 팬저 조종 용병 경력.\n무기: 신화급 단검 스팅어. 군 복무 때 장갑 차량을 조종했다.\n사이버웨어: 장갑차 연결을 사용한 기록. 정확한 개인 보철이나 장착 모델 미확인.\n성격: 전우를 신뢰하고 모르는 사람이 위험해 보일 때라도 돕는 쪽을 생각한다. 군과 도시의 권력을 모두 겪은 뒤 자기 패밀리가 혼자 고립되는 것은 원하지 않는다.\n행동: 대체로 미치와 움직이며, 무전과 차량 상황을 먼저 본다. 통일 전쟁 뒤에는 주변 노마드와 더 넓게 협력하는 방안을 사울에게 냈다.\n말투: 차분하고 가벼운 농담을 섞는다. 작전 중 길게 자기 공을 설명하기보다 팀이 같은 상황을 이해하는 데 주의를 둔다.\n특징: 본명은 드리스 메리아나. 자유주 쪽 팬저 조종수로 복무하다 돌아왔다. 스네이크 네이션과 손잡자는 생각을 냈지만 패밀리 안에서는 벌을 받았다. 바이크와 스팅어는 그의 고유한 취향을 보여 준다. 이 합류 시점에는 배드랜드의 특정 조우가 원작처럼 정해져 있지 않다.","group":"2077","priority":53,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-9.1.4"},{"label":"Driss Meriana · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Driss_Meriana"}],"rank":95},{"title":"캐롤 에메카","keywords":["캐롤에메카","캐롤","에메카"],"short":"중전차 운용 경력을 가진 알데칼도의 테키 겸 넷러너","body":"성별: 여성.\n나이: 정확한 출생연도 미확인. 군 경력을 지닌 장년으로 추정.\n외모: 턱 근처로 오는 검은 머리와 짙은 안경, 민소매를 걸친 어두운 작업복. 작업 장갑과 보호구를 끼고 팔짱을 낀 모습에서는 긴 시간 바깥에서 장비를 다뤄 온 인상이 난다.\n직업: 알데칼도 브라이트 패밀리의 테키 겸 넷러너. 전직 군인.\n무기: 군 복무 시 중전차 운용 경험. 개인 화기의 모델은 미확인.\n사이버웨어: 넷러닝 연결과 전차 운용 훈련을 받았다. 고유 개인 제품명은 자료 미확인.\n성격: 인력을 숫자로 보는 조직을 싫어하고, 선택한 가족에게 필요하다는 느낌을 소중하게 여긴다. 오래된 동료의 판단도 자기 기준에 맞지 않으면 똑바로 짚는다.\n행동: 계획의 기술적 여지와 팀의 안전을 함께 본다. 위험한 의뢰를 맡을 정도의 목적이 있어야 하며, 선을 넘으면 익숙한 사람의 부탁도 거절한다.\n말투: 담백한 현장 어휘를 쓰고 듣기 좋은 위로보다 당장 문제를 설명한다. 가까운 사람에게는 조언을 못 참는 면이 있다.\n특징: 메릴랜드 출신으로 군에 입대해 넷러닝, 테키 기술과 중전차 운용을 배웠다. 계약이 끝난 뒤 군대가 기업처럼 사람을 소모하는 모습을 떠나 기업의 좋은 일자리 대신 알데칼도를 택했다. 팬앰 편에 서는 참전용사 가운데서도 계획을 실제로 움직이게 하는 불편한 판단을 맡는다.","group":"2077","priority":65,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-9.1.5"}],"rank":96},{"title":"톰 칼데라","keywords":["톰칼데라","칼데라"],"short":"클라우드의 VIP 돌이자 독립 움직임의 참가자","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 성인.\n외모: 첨부 명단에서 확인되는 정면 이미지는 없다. 클라우드 VIP 구역의 돌로 깔끔한 근무 차림을 하며, 부상이나 얼굴 장식을 자료 없이 확정하지 않는다.\n직업: 클라우드 VIP룸에서 일하는 돌.\n무기: 대표 개인 무기 자료 미확인. 시험과 단체 행동에선 몸의 동작을 이용한다.\n사이버웨어: 현장용 동작을 담을 수 있도록 개조한 돌 칩의 실험에 참여한다.\n성격: 자기 기술과 장치가 낼 수 있는 결과를 과신하지 않지만 한번 해볼 기회가 오면 흥분을 숨기지 못한다. 도와준 동료가 있으면 고마움을 표한다.\n행동: 개조 칩을 받은 뒤 먼저 실제 동작을 확인한다. 내부 경비와 마주할 가능성이 높은 작업에서 동료 록산느와 움직이고 운용 결과를 알려 준다.\n말투: 일상 업무 말투는 편안하며 자기의 새로운 움직임이 잘될 때는 놀라운 감정이 밖으로 샌다. 진지한 결정을 앞두면 주디와 동료를 먼저 확인한다.\n특징: 이블린과 알고 지냈고 클라우드 노동자가 스스로 업장을 운영하려는 움직임에 참여했다. 돌 칩이 서비스뿐 아니라 훈련된 행동을 대신 수행할 수 있음을 드러내는 인물이다. 그의 선택은 직원이 갱단과 회사라는 두 층의 승인에 전부 맡겨진 구조를 바꾸려는 시도와 이어진다.","group":"2077","priority":71,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.3.3"}],"rank":97},{"title":"예언자 개리","group":"2077","keywords":["예언자개리","제럴드윙클러","리틀차이나설교","푸른눈음모론"],"short":"리틀 차이나에서 기업의 숨은 거래를 떠드는 노숙자","body":"성별: 남성.\n나이: 중장년 추정. 정확한 나이 미공개.\n외모: 리틀 차이나 거리 한쪽에서 오래 서서 사람을 부른다. 장사를 하는 지역 주민과 달리 정해진 가게 없이 행인에게 말을 건다. 상세 신체 정보는 한정적이다.\n직업: 본명 제럴드 윙클러. 노숙인 겸 거리의 자칭 예언자다.\n무기: 개인 무장 모델 미확인.\n사이버웨어: 개별 시술 모델은 미공개. 상대의 의안이나 안구 색에 대한 주장을 자신의 장비와 혼동하지 않는다.\n성격: 설명되지 않은 사건에 누구보다 많은 의미를 부여한다. 불신이 늘어도 자기를 들으러 온 사람이 있다는 사실에 일종의 확신을 얻는다.\n행동: 미스티의 가게 근처에서 기업과 밤의 도시에 관한 소문을 길게 이야기한다. 누가 곁에서 듣는지 구별하면서 가치 있는 단서는 직접 확인해 달라고 말한다.\n말투: 거리의 소음보다 크게 외치다가 맞장구를 치는 사람에겐 기밀을 털어놓는 듯 속도를 낮춘다.\n특징: 노마드와 늑대인간 같은 소문은 듣는 사람을 자극하지만, 기업 쪽 인력과 멜스트롬의 비정상적인 거래를 암시하는 정보도 흘린다. 놓인 단서와 과장된 설명이 동시에 존재하므로 어느 한쪽만 보고 전부 믿거나 버리기 어렵다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §23.1","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-23.1"}],"priority":86,"status":"활동","rank":98},{"title":"사샤 야코블레바","group":"엣지러너 1","keywords":["사샤야코블레바","스텔라라모스동생","고양이홀로","시큐리신","바이오테크니카폭로"],"short":"어머니의 약품 기록을 찾아낸 메인 크루의 옛 넷러너","body":"성별: 여성.\n나이: 생전 젊은 성인. 정확한 연령 미공개.\n외모: 앞머리를 곧게 자른 검은 단발과 선명한 파란 눈에 분홍색 링이 섞인 의안. 짧은 분홍 재킷과 어두운 넷러닝 장비를 맞춰 입고 검은 손가락의 흰 의수를 지녔다.\n직업: 메인 크루의 옛 넷러너. 스텔라 라모스의 여동생이다.\n무기: M-76e 오마하 권총과 사이버 암의 리퍼 손톱.\n사이버웨어: 양팔의 의수, 개조선, 뉴로포트와 덱 연결 장치. 보조로 들고 다니는 사이버덱을 썼다.\n성격: 사람들 사이에서 밝게 섞이다가도 가족을 해친 사실을 마주하면 자기 안전보다 문제를 드러내는 일을 택한다.\n행동: 바이오테크니카 사무실에 접근해 의뢰 자료를 확보한 뒤, 어머니에게 피해를 준 약의 기록을 찾아 별도로 외부로 보냈다.\n말투: 영상 중심의 기록이라 구체적인 말투는 거의 확인되지 않는다. 고양이 홀로그램과 팀 동료를 대하는 몸짓에 장난기가 있다.\n특징: 시큐리신의 위험을 알고도 팔았다는 자료는 사샤에게 조사 방향을 바꾸는 사건이었다. 스텔라와 가족을 두고 먼저 세상을 떠났기 때문에 2077년 통합 설정에서도 생전 자료와 동료의 기억으로 만나는 인물이다. 그녀가 알린 사실의 의미와 그 뒤 회사가 받은 타격은 구분해서 본다.","sources":[{"label":"나무위키 · 사샤 야코블레바","url":"https://dark.namu.moe/w/사이버펑크:%20엣지러너/등장인물#s-2.10"},{"label":"Cyberpunk Wiki · 사샤 야코블레바","url":"https://cyberpunk.fandom.com/wiki/Sasha_Yakovleva"}],"priority":75,"status":"기록","rank":99},{"title":"레이첼 캐시치","group":"2077","keywords":["레이첼캐시치","패션브레인댄스","조슈아프로듀서","PASSION"],"short":"사형수의 신념을 BD 상품으로 바꾸는 제작자","body":"성별: 여성.\n나이: 성인. 정확한 연령은 확인되지 않는다.\n외모: 회사와 스튜디오에 어울리는 정돈된 차림으로 나타난다. 상황이 흔들리면 할 일을 재촉하며 보호 인력 가까이 서고, 개별 외모 정보는 첨부 자료에 제한적이다.\n직업: 브레인댄스 프로듀서. 조슈아 스티븐슨의 출연으로 종교적 소재의 PASSION을 제작한다.\n무기: 개인 화기 미확인. 촬영 동선의 경호는 경찰 바스케즈가 맡는다.\n사이버웨어: 직접 시술한 사이버웨어의 모델은 미확인. 감각 기록 촬영 장비는 제작 도구다.\n성격: 촬영을 완성할 방법을 빠르게 계산한다. 출연자의 동기가 이상해 보여도 시장에서 팔릴 감정과 이야기라는 판단을 굽히지 않는다.\n행동: 조슈아의 종교적 결심과 사죄 방문을 일정에 넣는 대신 주요 장면에서 다른 이가 그의 마음을 흔들지 못하게 관리한다.\n말투: 일정과 금액을 정확히 제시하며, 속도를 늦추는 질문에는 부드러운 말보다 거래 조건을 바로 꺼낸다. 성과를 내면 반응도 빠르다.\n특징: 지기 Q의 방송에서 제작 계획을 알렸고 교정 시설의 신분을 이용해 가석방과 촬영을 연결했다. 조슈아에게는 믿음을 입증하는 일이지만 레이첼에게는 관객의 감정을 이끌 상품이어서, 같은 장면의 성과와 후유증을 다르게 평가한다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.14","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.14"}],"priority":106,"status":"활동","rank":100},{"title":"미치코 샌더슨","keywords":["미치코샌더슨","댄저걸","하토파","푸마스쿼드"],"short":"댄저 걸을 세운 아라사카 가문의 하토파 인물","body":"성별: 여성.\n나이: 2008년생으로 알려져 2077년 출생일에 따라 만 68~69세.\n외모: 2077년 이사회에선 길게 내린 짙은 머리와 격식 있는 옷차림의 모습으로 확인된다. 젊은 시절 기록에는 파랑으로 물들인 머리 일부와 사회 행사에 어울리는 차림도 남는다.\n직업: 댄저 걸 탐정 사업의 창립자. 아라사카 이사회 일원이자 하토파의 중심 인물.\n무기: 개인 무기 자료 미확인.\n사이버웨어: 2077년 개인 장착품 정확한 모델 미확인.\n성격: 명랑하고 사교적인 겉모습 밑에 상대의 기색을 읽는 습관이 있다. 어떤 구성원이 가족인지와 어떤 정책을 따를지는 별개로 판단한다.\n행동: 수사 사업에서는 눈에 띄는 푸마 스쿼드를 운용했고, 정보 수집과 현장 조치를 나눠 맡겼다. 이사회에서는 고립되지 않도록 발언의 시기를 고른다.\n말투: 친절하게 먼저 말을 건네면서도 기밀과 실제 목적은 숨긴다. 하나의 상황에 대해 가문과 미국 측에 다른 수위로 설명할 수 있다.\n특징: 아라사카 케이의 딸이자 사부로의 손녀다. 미국에서 자라 대전 이후 추방 위기에 놓였으나 엘리자베스 크레스와 담판을 지었다. 범죄학을 공부하고 마크 샌더슨과 결혼했다. 같은 이름의 사부로 배우자와 세대와 생애가 다르며, 2077년에 활동하는 미치코는 이 인물이다.","group":"2077","priority":34,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-7.2.4"},{"label":"Michiko Sanderson · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Michiko_Sanderson"}]},{"title":"멜리사 로리","group":"2077","keywords":["멜리사로리","맥스택경위","히구라시2013","진구지사건"],"short":"과거 사이버 사이코였던 맥스택 맨티스 블레이드 요원","body":"성별: 여성.\n나이: 성인. 정확한 출생 연도는 미공개.\n외모: 검은 맥스택 전술 장비와 다중 녹색 렌즈가 달린 헬멧으로 눈과 이마를 가린다. 얼굴이 가려져도 전방을 바로 향하는 자세와 팔에서 튀어나오는 블레이드를 알아볼 수 있다.\n직업: 맥스택 경위. 사이버 사이코 사건 현장에 투입되는 근접 대응 전력이다.\n무기: 아라사카 히구라시 20-13 계열 맨티스 블레이드. 현장에서는 분대 장비도 운용한다.\n사이버웨어: 결함으로 생산 중단된 맨티스 블레이드 모델. 두뇌 인공신경망과 충돌한 적이 있다.\n성격: 훈련을 받고 정해진 명령을 따르지만 싸움 자체에 드러내는 감정은 대단히 강하다. 자신의 과거를 부끄러워하기보다 제압 기술의 근거로 삼는다.\n행동: 진구지 의류점 같은 도심 사건에서도 장비를 적극 쓰며, 그 자리에서 잘 싸운 사람의 역량이나 장비를 눈여겨본다. 분대 안에서는 현장 지시의 우선순위가 비교적 명확하다.\n말투: 낮고 건조하게 관찰을 말한다. 무력으로 확실하게 끝냈을 때 만족을 숨기지 않아 상대가 불편함을 느낄 수 있다.\n특징: 과거 폭주로 사상자를 낸 뒤 맥스택에 생포되었고, 이후 같은 기관의 요원이 되었다. 장비의 결함과 반사회적 행동 때문에 내부에서도 주의 대상이다. 맥스택이 위험한 개조 인간을 제압할 뿐 아니라 자기 병력으로 흡수할 수 있다는 사례다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §10.6","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-10.6"}],"priority":47,"status":"활동"},{"title":"수지 Q","keywords":["수지Q","수잔나퀸","수지퀸"],"short":"목스의 생계와 리지의 바를 지키는 조직 지도자","body":"성별: 여성.\n나이: 정확한 출생연도 미확인. 경영 역할을 맡은 성인.\n외모: 독립적인 정면 근거가 제한적이다. 리지의 바의 내부 공간과 다른 목스 노동자 사이에 보이지만, 동료의 밝은 머리나 개조를 그녀의 외형으로 돌리지 않는다.\n직업: 목스의 지도자. 리지의 바를 운영하는 현재의 업주.\n무기: 개인 대표 무기 자료 미확인.\n사이버웨어: 확인된 개인 장착품 자료 미확인.\n성격: 목스의 설립 의의를 알지만 사람을 보호하겠다는 약속만으로는 전원이 살아남지 못한다고 본다. 이상에 기대는 말을 들으면 운영 비용을 먼저 세울 때가 있다.\n행동: 업장 수입과 조직원을 지킬 수 있는 범위를 함께 본다. 바깥의 모든 분쟁을 맡기보다 리지의 바에서 감당할 수 있는 일과 넘어서는 일을 정한다.\n말투: 말수가 적고 단호한 편이다. 정이 없다고 보일 만큼 비용과 위험을 분명히 말하며, 그 판단이 보호를 이어가는 데 필요하다고 본다.\n특징: 본명은 수잔나 퀸. 목스가 생기게 된 계기와 관련된 옛 주인 엘리자베스 보든과는 별개다. 리지의 바는 공연과 술, 브레인댄스 수익을 얻는 조직의 주요 기반이며, 수지는 사업에 무리가 생기면 목스가 실제 지킬 수 있는 사람까지 줄어든다는 점에 민감하다.","group":"2077","priority":50,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.3.6"},{"label":"Moxes Members · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Moxes_Members"}]},{"title":"앤젤리카 웰런","keywords":["앤젤리카웰런","앤지","웰런"],"short":"도그타운 복싱 사업을 계산하는 애니멀의 알파","body":"성별: 여성.\n나이: 출생연도 미확인. 외관상 20대 후반~30대 추정.\n외모: 검은 모자 아래 한쪽으로 흘러내리는 분홍빛 머리, 금색과 검정이 번갈아 들어간 짧은 재킷과 몸에 붙는 상의가 눈에 띈다. 다른 알파에 비해 체구가 가늘다.\n직업: 도그타운 애니멀의 알파. 복싱 경기와 승부 조작 사업의 협상 담당.\n무기: 구체적으로 확인된 개인 소유 무기 상품명은 미확인.\n사이버웨어: 산데비스탄을 비롯한 전투용 크롬 장착 기록. 나머지 제조사와 모델은 미확인.\n성격: 협상 상대의 욕구를 파악해 같은 판에서 서로 이득을 얻도록 제안한다. 설득과 계약 위반에 대한 위협을 다른 도구처럼 자연스럽게 오간다.\n행동: 조직원이 경기에서 얼마를 벌어 주는지 알고 보상과 힘을 배분한다. 외부인이 수익 계획을 흔들면 빼앗는 것보다 설득이 쉽지 않은지 먼저 점검한다.\n말투: 재치 있게 말을 걸지만 조건에 들어가면 누구에게 얼마가 돌아가는지 정확히 말한다. 조직의 힘은 협상 카드의 일부다.\n특징: 단순한 협상에서 힘을 과시하는 대신 양쪽이 얻을 이익을 찾아 지위를 높였다. 도그타운의 권투 경기 수익을 챙기면서 애런에게서 자유롭게 경기를 뛸 권리를 빼앗아 온 관계가 드러난다. 다른 애니멀과 달리 큰 체구보다 기술과 대화로 우위를 만든다.","group":"2077","priority":55,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.7.4"}]},{"title":"리타 윌러","keywords":["리타윌러","리타","윌러"],"short":"리지의 바 입구를 지키고 조각을 만드는 목스 솔로","body":"성별: 여성.\n나이: 정확한 출생연도 미확인. 외관상 젊은 성인.\n외모: 분홍과 보라가 섞인 두 개의 번 헤어와 긴 앞머리, 청색 눈화장과 자주색 입술. 희고 매끈한 표피 아래 분홍과 청록이 들어간 기계 팔, 날카로운 손톱, 가슴 위 목스 문신이 보인다.\n직업: 목스 소속 솔로. 리지의 바 바운서.\n무기: 탄소 소재 야구 방망이와 M 10AF 렉싱턴 쌍권총 기록.\n사이버웨어: 분홍과 청록이 드러나는 양팔 및 어깨 개조. 합성 피부처럼 보이나 상품명은 미확인.\n성격: 업무 중에는 처음 보는 사람을 위압할 줄 알고, 사적으로는 작은 조형물을 만들며 상상에 잠긴다. 시끄러운 일을 하는 모습이 생활 전체는 아니다.\n행동: 출입구에서 촬영과 신체 접촉 금지 같은 업장 규칙을 설명한다. 규칙을 잘 듣는 사람은 가볍게 맞지만 선을 넘으면 몸으로 입구를 지킨다.\n말투: 짧은 반말과 장난스러운 호칭을 섞는다. 규칙을 통보할 때는 분명하고, 사적인 취미를 말할 때는 속도가 느긋하다.\n특징: 근무를 마치고 작은 조각을 빚어 집 안에 늘어놓는 취미가 있다. 새가 사는 자연을 현실에서 보기 힘든 도시에서 손수 만든 형태로 다른 풍경을 떠올린다. 리지의 바 입구 외에도 퍼시피카의 그롤 FM 차량 근처에 간 적이 있다.","group":"2077","priority":59,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.3.7"},{"label":"Rita Wheeler · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Rita_Wheeler"}]},{"title":"구스타보 오르타","keywords":["구스타보오르타","구스타보","오르타"],"short":"헤이우드에서 개인적 상실을 맞는 발렌티노 간부","body":"성별: 남성.\n나이: 출생연도 미확인. 외관상 30~40대 추정.\n외모: 짙은 짧은 머리와 손질한 수염, 붉은 안감이 보이는 가죽 재킷과 조끼. 금색 장식과 가슴 위의 장신구가 간부의 옷차림을 이룬다.\n직업: 발렌티노 간부. 헤이우드의 갱단 간 사적인 갈등에 얽힌다.\n무기: 개인 소유 무기의 대표 이름은 자료 미확인.\n사이버웨어: 장착품의 세세한 기종과 기능 자료 미확인.\n성격: 자기 사람의 안전을 살피지만 가족을 잃거나 관계가 틀어지는 문제는 냉철하게 처리하지 못한다. 불명예를 피하라는 조직의 압박에도 자기 기억을 쉽게 버리지 않는다.\n행동: 경계가 강한 집에 머무르며 대면한 사람의 의도를 먼저 확인한다. 사적인 감정과 조직 간 보복이 엮인 상황에서는 변명을 늘어놓기보다 상대가 원하는 결론을 듣는다.\n말투: 긴장감이 있는 짧은 문장에 억눌린 감정이 담긴다. 질문이 마사에 닿으면 일반적인 조직 보고와 다른 말투로 반응한다.\n특징: 식스 스트리트 쪽과 관계있는 마사와 연인이었다. 파티에서 벌어진 폭력과 마사의 부상이 집안과 두 갱단의 분쟁으로 번졌다. 발렌티노가 그를 보호하더라도 마사의 가족이 판단한 책임을 뒤집기 어렵다. 파드레의 거래에는 조직의 입장과 개인적 진실이 각각 얽혀 있다.","group":"2077","priority":62,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.4.1"}]},{"title":"쇼보 조타로","keywords":["쇼보조타로","조타로","가부키의악마"],"short":"가부키에서 착취 영상을 유통하는 타이거 클로 간부","body":"성별: 남성.\n나이: 출생연도 미확인. 외관상 30~40대 추정.\n외모: 뒤로 단정히 넘긴 검은 머리, 흰색 양복과 자주색이 드러나는 목과 주머니 장식. 옷차림은 화려하지만 표정과 언행은 타인에게 여유를 거의 남겨 주지 않는다.\n직업: 타이거 클로 고위 조직원. 가부키에서 활동하고 불법 브레인댄스에 관여.\n무기: 개인 무기 대표 모델 자료 미확인.\n사이버웨어: 착용 모델 미확인. 불법 브레인댄스의 제작 장비와 별개다.\n성격: 상부에는 기일과 이익을 철저하게 맞추고 아래로는 무자비하다. 유명세를 두려워하기보다 보호받고 있다는 확신을 키우는 수단으로 삼는다.\n행동: 수금과 조직의 수익을 지키면서, 부하에게 맡기기보다 직접 폭력과 착취의 기록을 만들고 거래한다. 비밀이 밖으로 나갈 가능성에는 예민하다.\n말투: 상부 앞에서는 계산된 존대, 통제되는 공간에서는 요구에 가까운 반말이 어울린다. 다른 사람의 반발을 감정 문제가 아니라 통제 실패로 보는 경향이 있다.\n특징: 일부 클럽 노동자의 실종은 그가 남긴 불법 BD와 연결된다. 타이거 클로 보스들은 그가 보내는 돈과 유능함 때문에 내막을 눈감았고, 목스와 레지나 쪽에서는 이를 끊으려 한다. 가부키의 악마라는 별칭은 거리에서 그 파일을 경험하거나 사건을 아는 사람들이 붙였다.","group":"2077","priority":64,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.2.4"}]},{"title":"애런 웨인스","keywords":["애런웨인스","웨인스","복서애런"],"short":"승부 조작을 벗어나려는 도그타운 권투 선수","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 젊은 성인으로 묘사된다.\n외모: 선수다운 큰 체구로 관찰되며 옷과 피부의 상세한 색, 얼굴 장식은 첨부 명단에 개별 증거가 없다. 링과 도그타운의 실내 공간에서 만나는 인물이다.\n직업: 권투 선수. 전직 애니멀 소속이며 이전에는 빚 회수 관련 업무를 맡았다.\n무기: 권투 기술과 신체를 쓴다. 개인 화기 자료 미확인.\n사이버웨어: 갱단이 머리에 넣은 통제용 칩. 실제 강제 사용과 본인이 패배 연기를 한 부분을 구분한다.\n성격: 말수가 적고 판이 거칠다는 것을 안다. 자기가 링에서 할 수 있는 일에 자부심이 있으나 가해자로 살았던 과거를 먼저 자세히 내놓지는 않는다.\n행동: 정당하게 경기하길 원하면서 조직이 쥔 명분과 장치를 따로 해결하려 한다. 수술과 경기를 연결해 보되 위험한 선택의 결과도 무시하지 않는다.\n말투: 조용하고 현실적인 어조다. 잡다한 승부 자랑보다 실제로 자기 힘으로 어디까지 갈지 이야기한다.\n특징: 도그타운에서 자랐고 애니멀의 추심 역할을 하다가 권투로 자리를 바꿨다. 앤지 쪽은 그의 경기를 수익원으로 관리한다. 실제 경기에서 받은 압력은 단순한 기계적 강제가 아니라 갱단과 본인 사이의 과거 합의, 보복 위험, 떠날 수 있는 기회의 부족에서 생겼다.","group":"2077","priority":66,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.7.5"}]},{"title":"캐시디 라이터","keywords":["캐시디라이터","부치캐시디","앰네스티"],"short":"크롬 없이 리볼버를 쓰는 알데칼도의 베테랑","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 외관과 참전 기간으로 중년 이상 추정.\n외모: 넓은 챙의 옅은 모자와 서부풍 볼레로, 먼지가 앉은 밝은 작업복. 햇빛에 눈을 가리며 리볼버와 낡은 차량, 유리병 표적 사이로 다니는 모습이 남아 있다.\n직업: 알데칼도 소속 노마드. 통일 전쟁 참전용사이자 권총 사수.\n무기: 오버추어 계열 리볼버 앰네스티.\n사이버웨어: 개인 원칙에 따라 사이버웨어를 장착하지 않는다.\n성격: 입으로는 위험한 계획을 냉소하지만, 보호해야 할 사람이 위험해지면 가장 먼저 자기 몫을 챙긴다. 크롬을 운영하는 편의보다 자기 기술을 더 믿는다.\n행동: 캠프에서 병을 세워 사격을 연습하고, 라펜 쉬브 쪽에 연루된 구조 일이나 사울 문제에도 참여한다. 위기 때 큰 장비를 쓰는 동료를 위해 시간을 번다.\n말투: 그늘진 농담과 직설적인 평가를 먼저 한다. 좋은 결과가 나왔을 때 어설프게 자기 자랑을 보태지 않고 실제로 인정한다.\n특징: 부치 캐시디라는 별명으로도 불린다. 어린 팬앰과 가까운 사람이 라펜 쉬브에 납치됐을 때 구해 온 이력이 있다. 장비에 대한 고집이 단순히 과거 취향에서 온 게 아니라, 오랫동안 살아남으며 유지한 전투와 구조의 원칙이다.","group":"2077","priority":68,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-9.1.6"}]},{"title":"아서 젠킨스","keywords":["아서젠킨스","젠킨스"],"short":"권력 다툼에 몰린 아라사카 대정보부 간부","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 외관상 중년 추정.\n외모: 매끈하게 빗은 짙은 머리와 어두운 양복, 흰 셔츠. 사무실에 앉아 작은 잔과 함께 외부 회의를 지켜보며 표정이 굳는 모습이 인상적이다.\n직업: 아라사카 대정보부의 회사 간부. 나이트 시티 지사 내 충돌의 당사자.\n무기: 개인 휴대 무기 자료 미확인.\n사이버웨어: 개인 장착품 모델 자료 미확인. 부서가 원격 조치를 시행하는 능력과 구분한다.\n성격: 목표를 위해 매우 큰 위험도 손쉽게 정당화한다. 이미 쌓은 회사 내 경력과 자기 영향력을 부하의 충성 및 빚과 혼동한다.\n행동: 본사 승인이나 내부 합의가 자신의 지위에 불리할 때 비공식 경로를 쓴다. 애버내시와의 마찰을 조직의 정상적 보고로 풀기보다 사적인 반격을 시도한다.\n말투: 표면상 정제된 업무 어휘를 쓰다가 감정이 치밀면 적의 이름을 곧바로 말한다. 지시하는 자리에서 선택권이 있는지 모호하게 만든다.\n특징: 유럽의 우주 정책과 아라사카의 이익이 걸린 표결에 극단적인 방식으로 개입했다. 특수 작전국장 수잔 애버내시가 질책한 일이 쌓인 경쟁을 더 깊게 했다. 직장 안의 나쁜 평판을 공식 절차의 실패로만 보지 않고 서로를 제거하기 위한 권력전으로 번지게 한다.","group":"2077","priority":69,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-7.2.9"}]},{"title":"수잔 애버내시","keywords":["수잔애버내시","애버내시"],"short":"대정보부를 숙청하려는 아라사카 특수 작전국장","body":"성별: 여성.\n나이: 정확한 출생연도 미확인. 외관상 중년 추정.\n외모: 영상 통화에서는 정리한 짙은 머리에 단정한 기업용 차림으로 나타난다. 붉은 화면 조명과 분명한 눈매가 말의 공격성을 더 선명하게 보이게 한다.\n직업: 아라사카 나이트 시티 특수 작전국장.\n무기: 개인 무기 자료 미확인. 특수 작전국의 팀을 동원할 권한이 있다.\n사이버웨어: 개인 사용 사이버웨어의 정확한 모델은 미확인.\n성격: 실무 중 감정 표현을 억제하면서도 조직에서 자기가 손해를 본다는 신호에는 재빨리 반응한다. 후배나 부하의 안전보다 지위를 지킬 근거를 더 중요하게 둘 수 있다.\n행동: 경쟁 간부의 계획을 미리 알고 있다면 그 인력부터 분리시키려 한다. 회의에서 불복종을 지적하고 필요할 때 회사 인사권과 보안 권한을 결합한다.\n말투: 짧고 권위적으로 지시한다. 자기 명령의 근거를 길게 변호하지 않고 보고에서 어긋난 대목을 바로 잡아낸다.\n특징: 아서 젠킨스의 경쟁자가 되었으며 유럽 정책 개입을 두고 대립이 표면화됐다. 젠킨스가 움직인다는 정보를 받은 뒤 대정보부 인력을 압박하고, 정보를 준 사람도 지나치게 많이 아는 위험 요소로 본다. 상층부의 신뢰는 본인에게도 언제든 사라질 수 있다.","group":"2077","priority":70,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-7.2.10"}]},{"title":"내쉬","keywords":["내쉬","위도우메이커"],"short":"팬앰의 차량을 노린 레이스 소속 배신자","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 성인.\n외모: 첨부 명단에 개별 정면 초상이 없다. 사막을 오가는 용병 차림과 레이스 쪽 작업 환경은 확인되나 인상착의의 좁은 세부는 자료 부족이다.\n직업: 레이스 소속 라펜 쉬브. 팬앰과 한때 같은 운송 계약을 맡았다.\n무기: 위도우메이커. 아킬레스 계열의 테크 정밀 소총.\n사이버웨어: 산데비스탄 사용 확인. 정확한 제조사와 모델은 미확인.\n성격: 동료라는 인상과 숨겨둔 조직 관계를 분리해 이용한다. 동업을 계속하는 듯 보여도 한 번 손에 넣을 수 있는 물건과 차량의 가치부터 잰다.\n행동: 운송 거래에서 같이 일하는 시간을 신뢰를 얻는 데 쓴다. 가져간 물건을 찾는 사람이 오면 자기 혼자보다 레이스 인력이 있는 익숙한 거점에서 대응하려 든다.\n말투: 차분한 거래 용어가 평소 숨기는 의도에 맞는다. 약속을 말할 때 실제 위험이나 되돌아올 계획을 필요 이상 드러내지 않는다.\n특징: 로그를 통해 식스 스트리트의 배송을 팬앰과 함께 맡은 뒤 물건과 팬앰의 워호스를 빼돌렸다. 남은 기록에서 택한 방식이 충동이 아니라 오래 고려한 배신임을 짐작할 수 있다. 그는 알데칼도 출신 같은 외형을 보이더라도 그 패밀리와 같은 편으로 판단해서는 안 되는 인물이다.","group":"2077","priority":73,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-9.2.1"}]},{"title":"산티아고 알데칼도","keywords":["산티아고알데칼도","산티아고"],"short":"초기 알데칼도 네이션을 이끌었던 전설적 솔로","body":"성별: 남성.\n나이: 출생연도와 사망 나이는 미확인. 2077년에는 과거 세대의 인물로 전해진다.\n외모: 과거의 회상에서는 어깨를 덮는 갈색 머리와 수염, 둥근 짙은 선글라스, 여러 장식을 단 재킷을 착용한다. 모습의 근거는 당시 인물들의 기록이다.\n직업: 솔로이자 알데칼도 네이션의 지도자. 로그의 과거 동료.\n무기: 경호와 용병 일에 사용한 화기 종류의 세부 모델 미확인.\n사이버웨어: 안경만으로 안구 크롬을 판단할 수 없다. 개인 이식품 미확인.\n성격: 사람이 먼저이고 약속이 다음이라는 식의 노마드 책임감을 보인다. 가까이 지내는 사람의 싸움에 참여하면서도 그 사람의 판단을 무조건 옳다고 대하지 않는다.\n행동: 도시의 용병 일과 네이션 지도자의 책무를 함께 떠맡았다. 특정 캠프의 일만 관장하는 것이 아니라 알데칼도 전체의 움직임을 보는 역할이었다.\n말투: 과거 회상에 기반한 직설적 어조. 상대를 오래 안다는 이유로 문제를 돌려 말하지 않고, 필요하면 익살을 섞는다.\n특징: 2013년 알트 구출을 위한 아라사카 타워 습격에 로그와 동행했다. 2023년 전후의 작전에도 얽혔으며, 사울이 그가 조니의 기업 공격을 돕다가 죽었다고 전하는 대목이 남는다. 알데칼도 사람들의 존경을 받는 도시와 노마드 양쪽의 옛 인물로 등장한다.","group":"2077","priority":74,"status":"기록","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-6.12"}]},{"title":"라일 톰슨","keywords":["라일톰슨","라일","톰슨"],"short":"알트 납치를 목격하고 추적에 나선 WNS 기자","body":"성별: 남성.\n나이: 정확한 출생연도와 2077년 상태 미확인. 주로 2013년 당시의 기록에서 확인된다.\n외모: 회상에선 뒤로 빗은 아주 밝은 머리, 직선형의 은회색 안경, 짙은 재킷 속 붉은 상의를 입는다. 몸을 세우고 눈길을 재빨리 돌리는 모습은 보도 현장의 긴장감과 어울린다.\n직업: 군 경력이 있는 WNS 기자. 아라사카 타워 침투 작전의 동행자.\n무기: 과거 기록에서 화기와 폭발물을 운용한다. 기종은 미확인.\n사이버웨어: 눈을 가리는 장치가 보이나 장착 형태와 기종은 자료 미확인.\n성격: 눈앞의 위험과 취재의 목적을 함께 따진다. 급한 사람의 감정에 끌려 가기보다 자신이 목격한 정보와 가능한 행동을 구분한다.\n행동: 알트의 납치 현장에서는 먼저 표적의 장비와 실력 차를 판단했다. 다친 조니를 도와 생존을 확보하고, 이후 기록과 행동을 모두 맡아 구출 시도에 참여한다.\n말투: 설명하는 데는 망설이지 않으나 영웅담처럼 과장하지 않는다. 이미 지나간 사건에 대해서는 확인한 것과 짐작을 나눠 말한다.\n특징: 2013년 소울킬러에 관해 알트를 인터뷰하려다가 납치를 목격했다. 구출 작전에 동참한 뒤 제4차 기업 전쟁의 아라사카 본부 공격에도 관련 기록이 있다. 2077년에 그가 현역 기자로 돌아왔다는 충분한 근거는 없으므로 사건을 추적하는 역사적 인물로 다룬다.","group":"2077","priority":75,"status":"행방 불명","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-6.13"}]},{"title":"피오나 바르가스","keywords":["피오나바르가스","바르가스","피오나"],"short":"도그타운의 유소년 스포츠 선발 시설 운영자","body":"성별: 여성.\n나이: 출생연도 미확인. 외관상 중년 추정.\n외모: 목까지 오는 짙은 머리를 한쪽으로 넘기고, 어깨가 열리는 검은 복식과 금속색 장식이 달린 팔을 보여 준다. 몸에 딱 맞는 옷과 자세가 공식 상담석처럼 정돈돼 있다.\n직업: 기업 과학자. 도그타운에서 유소년 스포츠 사이버웨어 적합성 및 선발 시설을 운영한다.\n무기: 개인 무기 자료 미확인.\n사이버웨어: 팔 주변 장식 또는 개조는 보이나 정확한 개인 장착 모델은 미확인.\n성격: 능력과 출구가 맞아떨어져야 기회가 생긴다고 믿으며 자기 시설이 그 기회라고 생각한다. 이식의 후유증은 성공 사례만큼 공개하지 않는다.\n행동: 보호자에게 선발과 훈련 환경을 내세우고, 적합성이 높은 선수를 계약 관계에 연결한다. 선발에서 밀린 아이의 사후 상황은 같은 우선순위로 대하지 않는다.\n말투: 설득에 익숙한 격식 있는 존댓말을 쓴다. 불편한 질문을 받으면 계약 주체와 제도가 작동하는 방식을 먼저 설명한다.\n특징: 조앤 코흐의 연구가 비인도적이라고 판단해 보호 요청을 거절한 기록이 있다. 본인 역시 도그타운 청소년에게 큰 부담의 장착을 요구하고 성과가 낮으면 장치를 회수한다. 빈민가에서 닫혀 있는 진로를 일부에게 실제 열어 준 사실과 탈락자가 떠안는 피해가 동시에 남는다.","group":"2077","priority":76,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-7.3.4"}]},{"title":"록산느 섬너","keywords":["록산느섬너","록산느","섬너"],"short":"의료와 휴가를 요구하는 클라우드의 장기 근무자","body":"성별: 여성.\n나이: 정확한 출생연도 미확인. 톰과 주디보다 클라우드에서 오래 근무했다.\n외모: 보조 자료에서는 어두운 금발과 붉은 눈으로 정리돼 있다. 첨부 명단에서 독립 정면 사진을 확인하기 어려워 나머지 인상착의는 고정하지 않는다.\n직업: 메가빌딩 H8의 클라우드 2번 부스에서 일하는 돌.\n무기: 개인 무기 모델 자료 미확인.\n사이버웨어: 돌 칩 사용자. 조직의 실무를 벗어나는 공동행동에도 참여한다.\n성격: 분쟁 속에서도 동료가 얻어야 할 임금과 치료를 잊지 않는다. 살아남았다는 결과와 자신이 했던 일에 대한 죄책감을 별도로 안고 살 수 있다.\n행동: 톰과 함께 조직에 맞서는 움직임에 참여한다. 경영진 변화가 노동자의 조건을 실제 바꾸는지를 물으며, 상황의 불편한 진실도 주디에게 알린다.\n말투: 믿는 사람 앞에서는 임금, 휴가, 안전에 대해 거칠고 솔직하게 말한다. 보호 없이 피해를 목격했을 때는 단정 대신 자신이 느낀 무게를 털어놓는다.\n특징: 클라우드의 근무 경험을 바탕으로 단체 행동에 참여했다. 사태 이후 돌의 보수와 의료 지원이 나아지지 않는다는 기록, 타이거 클로의 보복을 피해 살아남는 분기가 있다. 같은 일을 겪은 톰보다 특히 자신이 입힌 피해를 되돌아보는 데 시간을 많이 쓴다.","group":"2077","priority":77,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.3.4"},{"label":"Judy Álvarez/Computers · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Judy_%C3%81lvarez/Computers"}]},{"title":"오좁 보조","group":"2077","keywords":["오좁보조","수류탄코","브라질용병","광대용병","보조스"],"short":"수류탄 모양 코를 단 브라질 출신의 용병","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 광대처럼 꾸민 강한 인상, 솟은 붉은 머리와 민소매 차림, 얼굴 중앙에 들어간 수류탄이 특징이다. 크게 팔을 접어도 장식이 얼굴에서 먼저 보인다.\n직업: 브라질 출신 용병이자 길거리 격투의 특별 상대.\n무기: 격투와 상황별 용병 무장을 쓴다. 코의 수류탄은 세계관에서 작동 가능한 물건이다.\n사이버웨어: 부상으로 잃은 코에 수류탄을 넣었다. 그 외 신체 장비의 고정 모델은 미확인.\n성격: 운이 큰돈으로 바뀔 일을 기다리며 위험하고 황당한 상황도 농담처럼 지나간다. 자기 외모를 처음 보는 사람이 놀라는 데 익숙하다.\n행동: 왓슨의 식당을 포함해 짧고 위험한 일을 맡고, 싸움 뒤에는 원래 하려던 이동이나 거래를 다시 진행한다. 격투에서도 자기 개성을 숨기지 않는다.\n말투: 짧은 장난과 무심한 대꾸가 많다. 진지하게 위험을 알려 줘도 표정과 말의 속도를 크게 바꾸지 않는다.\n특징: 나이트 시티에 온 목적은 크게 성공하는 것이며 얼굴의 물건은 과거 손상을 대체한 결과다. 흔한 바디 패션과 기능을 지닌 위험물이 구별되지 않는 시각적 상징이다. 왓슨에서 타이거 클로와 악연을 만들 수 있으나 특정 조직에 평생 충성을 바치는 인물로 제시되지 않는다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §20.6","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-20.6"}],"priority":77,"status":"활동"},{"title":"맥시멈 마이크","group":"2077","keywords":["맥시멈마이크","모로록라디오","기업기밀제보","올드넷소문"],"short":"모로 록 라디오의 냉소적인 도시 해설자","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 자료의 공개 이미지에서는 짧은 검은 머리와 수염, 대화 상대 가까이 몸을 기울이는 자세가 보인다. 청취자에게는 생김새보다 무게 있는 목소리가 익숙하다.\n직업: 모로 록 라디오 DJ. 록 음악 사이에 기업 정세와 나이트 시티 이야기를 소개한다.\n무기: 개인 무장 정보 없음.\n사이버웨어: 얼굴에 보이는 개조 디테일 외에 제품의 세부는 미확인.\n성격: 기업의 공식 서사를 할인해서 듣는다. 간혹 으스스한 제보를 검증되지 않은 채 전하지만 청취자가 여러 가능성을 비교하는 데 흥미를 둔다.\n행동: 퍼스트넷을 아는 넷러너, 기업에서 일하는 제보자, 현장 기록을 본 사람의 이야기를 방송에 가져온다. 공개된 사실과 배후의 가설을 넘나든다.\n말투: 중후하고 차분하며 문장 끝을 길게 둔다. 정보를 단정하는 대신 청취자에게 믿을지 말지를 넘기는 식의 말버릇이 있다.\n특징: 프랑크푸르트 사건과 달 사업, 부산에 관해 도는 이야기, 안구 기업의 감시 가능성 등을 방송 소재로 다룬다. 이 내용은 대화 속 유언비어나 분석으로는 쓰이지만, 목격담 하나만으로 결론이 된 것은 아니다. 사무라이의 음악을 내보내는 채널 특유의 거친 정서가 있다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.2","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.2"}],"priority":78,"status":"활동"},{"title":"사토 히로미","keywords":["사토히로미","히로미사토"],"short":"타이거 클로를 대표하는 클라우드의 공식 운영권자","body":"성별: 남성.\n나이: 정확한 출생연도와 외관상 연령 자료 미확인.\n외모: 첨부 등장인물 명단에서 별도의 정면 사진이 확인되지 않는다. 관련 장면은 사적인 고층 거처와 타이거 클로 간부 회의에서의 모습에 제한된다.\n직업: 타이거 클로 간부. 갱단을 대표하는 클라우드의 공식 관리권자.\n무기: 개인 무기 모델 자료 미확인. 회의 장소의 카타나는 소유를 확인할 수 없다.\n사이버웨어: 개인 이식 장비 자료 미확인.\n성격: 직접 상품을 만들거나 손님을 상대하는 역할보다 조직에서 권한을 인정받는 일에 의존한다. 자기 밑의 운영 실무와 돈의 흐름이 자리를 보장해 준다고 여긴다.\n행동: 메가빌딩 H8의 업장과 분리된 거처에서 타이거 클로의 다른 대표들과 만난다. 자기 지위에 대한 도전은 개인이 아니라 조직에게 가해진 것으로 다루려 한다.\n말투: 대화 자료는 적다. 조직 회의에서의 발언은 관리 책임자다운 형식과 자기 권한을 전제로 한 말로 한정한다.\n특징: 클라우드 운영층에는 공식 권한을 가진 사토, 비공식 매니저인 마이코, 돌 관리인 우드맨이 각자 다른 일을 맡았다. 마이코가 지배권을 요청하자 내부 인사가 그를 무력으로 제거한 분기가 있어, 형식적인 운영권과 개인이 실제로 받는 신뢰가 다름을 드러낸다.","group":"2077","priority":78,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.2.2"},{"label":"Clouds · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Clouds"}]},{"title":"블루 문","group":"2077","keywords":["블루문","어스크랙스블루","겹동공","가부키팬사건"],"short":"팬과 가까이 지내지만 위협에 신중한 레이저팝 가수","body":"성별: 여성.\n나이: 젊은 성인 추정. 정확한 나이 미공개.\n외모: 파란 머리와 푸른 무대 의상, 각각의 눈에 동공이 둘처럼 보이는 개조가 특징이다. 사적인 외출에서는 모자 등으로 무대의 인상을 옅게 한다.\n직업: 레이저팝 그룹 어스 크랙스의 보컬 멤버. 북미 투어 중에는 팬 활동과 홍보에도 참여한다.\n무기: 개인 무장 모델 미확인. 스토킹 위협에서는 신뢰하는 경호와 팀원의 지원을 구한다.\n사이버웨어: 키로시의 개조 의안. 보이는 안구 디자인 외에 전투용 장비를 확정하지 않는다.\n성격: 팬에게 친절하고 사교적이지만 위험을 느낀 뒤에는 자기 행동이 다른 멤버와 팬덤에 영향을 줄 수 있다고 걱정한다.\n행동: 가까이서 살피는 팬과 위협의 흔적을 따로 확인하려 한다. 그룹 이미지가 나빠질 만큼 문제가 커지지 않게 대책을 마련한다.\n말투: 무대에서는 팬에게 친근한 과장과 리듬을 더한다. 평소에는 꾸밈이 덜하고 상황이 불안해지면 보고 싶은 결과를 분명히 말한다.\n특징: 팀이 케리와의 오해를 풀고 나서도 개인을 향한 집착과 위협은 사라지지 않는다. 가부키 라운드어바웃 같은 평범한 이동 공간에서도 몸을 지킬 방법과 대중에게 드러날 행동을 모두 판단해야 한다. 친절하게 팬을 대하는 태도가 모든 접근을 환영한다는 뜻은 아니다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.11","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.11"},{"label":"Cyberpunk Wiki · 블루 문","url":"https://cyberpunk.fandom.com/wiki/Blue_Moon"}],"priority":79,"status":"활동"},{"title":"윌 거너","keywords":["윌거너","거너대위","식스스트리트거너"],"short":"식스 스트리트 안의 세력 교체를 주도한 인물","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 외관 나이를 단정할 자료 부족.\n외모: 첨부 명단에 개별 정면 사진이 없다. 공개 행사에서 다른 식스 스트리트 단원들과 군대 풍의 갱단 차림을 공유한다. 색과 개조 부품을 구체적으로 확정하지 않는다.\n직업: 식스 스트리트의 지도급 조직원. 조직 행사와 내부 질서에 관여한다.\n무기: 개인 소유 무기 모델 미확인. 행사에 쓰이는 상품과 구별한다.\n사이버웨어: 확인된 개인 장착품은 자료 미확인.\n성격: 옛 군대식 규율과 지역 내 영향력을 함께 내세운다. 외부인에게는 태도가 단순해 보일 수 있으나 내부 갈등을 정리할 때는 수단이 단호해진다.\n행동: 지역의 사격 행사와 집단의 명예를 같은 자리에 놓는다. 지지하는 조직원에게는 소속감을 보여 주고, 권력 교체는 도시의 소문만으로 설명하지 않는다.\n말투: 군대 용어와 골목 반말을 섞어 짧게 말을 건넨다. 흥이 오르는 자리를 주도할 때와 통제권이 흔들릴 때의 어조가 다르다.\n특징: 윌 거너는 식스 스트리트의 이전 지도 체계를 밀어내고 올라온 관계자다. 산토 도밍고의 조직 활동을 놓고 아직 지역 주민을 지킨다는 이야기와 자기 힘을 증명하는 데 쓰이는 폭력이 공존한다. 공식 계급 체계와 도시 갱단의 서열이 겹치는 독특한 위치다.","group":"2077","priority":79,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.5.1"}]},{"title":"조앤 코흐","keywords":["조앤코흐","코흐","나이팅게일계획","레드오키드"],"short":"나이팅게일 계획과 노마드 임상 참사에 얽힌 연구자","body":"성별: 여성.\n나이: 정확한 출생연도 미확인. 연구와 관리 경력을 갖춘 성인.\n외모: 첨부 인물 명단에서 뚜렷한 독립 정면 사진을 확인하지 못했다. 호텔 안 개인 공간에서 브레인댄스 장비를 쓴 모습이 알려져 있다.\n직업: 바이오테크니카 지사 운영 책임자. 나이팅게일 프로젝트와 관련된 연구자.\n무기: 개인 무기 자료 미확인. 안전은 호텔 주변 회사 경비에 의존한다.\n사이버웨어: 장착품 자료 미확인. 브레인댄스 시청 장치는 회사 크롬과 구분.\n성격: 연구 데이터의 가치를 피해자의 안전보다 앞세운다. 자신이 저지른 일을 책임지라는 요구를 받으면 구체적 자료를 보존한다는 명분을 앞세운다.\n행동: 계약을 제대로 들여다볼 수 없는 사람도 실험 집단으로 쓰고, 사건이 나면 보상과 경비 인력을 동원해 통제한다. 보도를 피하려는 시도를 한다.\n말투: 자료와 대상을 설명할 때 표면상 침착한 전문어를 쓴다. 자신의 지위와 데이터에 접근할 때 의도와 요청을 모두 드러내지 않는다.\n특징: 레드 오키드 노마드 클랜과의 임상 계약 후 다수 사망자가 났다. 보상 시도와 은폐가 이어졌고, 사건을 파고드는 언론인까지 회사 조치의 위험에 놓였다. 이 일에서 희생자를 대하는 태도와 고용주의 책임이 바이오테크니카의 공적인 연구 홍보와 정면으로 충돌한다.","group":"2077","priority":80,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-7.3.3"}]},{"title":"레드 메나스","group":"2077","keywords":["레드메나스","아카이쿄이","어스크랙스레드","어스크랙스경호"],"short":"무대 밖에서도 두 멤버를 앞장서 보호하는 아이돌","body":"성별: 여성.\n나이: 젊은 성인으로 보인다. 출생 연도 미공개.\n외모: 밝은 붉은 머리와 붉은 키로시 의안, 몸에 붙는 붉은 무대 의상과 어깨 장식. 화려한 머리 장식과 서 있는 위치가 멤버 가운데 앞쪽에서 잘 보인다.\n직업: MSM 레코드의 3인조 레이저팝 그룹 어스 크랙스 멤버이자 현장에서 팀원을 지키는 인물.\n무기: 밀리테크 M251s 에이잭스가 장비에 확인된다. 도검 수집을 취미로 한다는 자료도 있다.\n사이버웨어: 키로시 의안, 케렌지코프, 산데비스탄, 보강 발목 및 전투자극제 관련 장비.\n성격: 감정 표현이 빠르고 공격적인 농담을 하며, 멤버의 무대를 망치거나 가까이 다가오는 위협에는 먼저 반응한다.\n행동: 낯선 사람이 대기실에 들어오면 몸을 먼저 내민다. 블루 문이 위협받는 일이 생겼을 때는 무대용 역할을 벗어나 팀원을 관찰하고 보호한다.\n말투: 짧고 강한 감탄, 자신감 섞인 말투. 팬심이나 존경을 느끼는 음악가 앞에서는 금세 들뜬 반응으로 바뀐다.\n특징: 일본계 미국인으로 데뷔했고 그룹의 북미 투어에 참가한다. 케리 유로다인의 노래를 둘러싼 갈등에서 표면적으로는 적대적 상황에 들어섰지만, 무대 앞의 강한 페르소나와 실제로 케리에게 느끼는 동경이 함께 드러난다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.11","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.11"},{"label":"Cyberpunk Wiki · 레드 메나스","url":"https://cyberpunk.fandom.com/wiki/Red_Menace"}],"priority":81,"status":"활동"},{"title":"에머릭 브론슨","keywords":["에머릭브론슨","에머릭","브론슨"],"short":"애프터라이프 입구에서 출입을 통제하는 바운서","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 외관상 중년 추정.\n외모: 짧은 어두운 머리, 굵은 몸통과 목, 턱 주변의 개조선이 보인다. 검은 가죽 재킷의 붉은 안감과 목 장신구가 두꺼운 체구와 함께 눈에 띈다.\n직업: 애프터라이프 용병 겸 바운서. 로그 아래서 입장 질서를 지킨다.\n무기: 개인 무기 모델 자료 미확인.\n사이버웨어: 안면 개조가 보인다. 이식품 정확한 기종과 효능 미확인.\n성격: 술집을 자기 힘을 자랑하는 장소보다 책임지고 걸러야 하는 입구로 본다. 나이, 자격, 이름을 얼마나 확신하는지에 따라 판단을 바꿀 수 있다.\n행동: 감당 못할 문제를 안으로 들이지 않으려 입구를 직접 지킨다. 함께 있던 일행이나 다른 방문객의 눈치보다 자신이 받은 출입 기준을 우선한다.\n말투: 한두 문장으로 입장 여부를 통보하는 굵고 짧은 반말. 낯선 용병의 직함과 자랑을 듣고도 별로 표정이 바뀌지 않는다.\n특징: 애니멀 데이터베이스 이미지에 등장해 갱단과의 연관도 있다. 애프터라이프에서 로그의 실무적인 권한을 받아 입구를 관리한다. 엣지러너의 레베카를 체구 때문에 나이가 어리다고 보아 들여보내지 않은 적이 있어, 개인의 전투력과 출입 판단이 별개라는 일화가 남는다.","group":"2077","priority":81,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.7.3"}]},{"title":"지기 Q","group":"2077","keywords":["지기큐","ZiggyQ","나이트애프터나이트","드라우프니로"],"short":"후원과 논쟁을 한 무대에 올리는 TV 쇼호스트","body":"성별: 남성.\n나이: 성인. 정확한 연령은 미공개.\n외모: 짧게 매만진 머리와 크게 벌리는 팔, 생기 있는 얼굴. 화면에서는 밝은 주황색 재킷과 빛나는 스튜디오 배경이 함께 눈에 띈다.\n직업: TV 토크쇼 나이트 애프터 나이트 진행자. 정치, 치안, 문화계의 게스트를 부른다.\n무기: 개인 무장 정보 없음.\n사이버웨어: 개별 사이버웨어 모델은 확인되지 않는다. 방송에서 선물하는 사이버 암은 후원 상품이다.\n성격: 재치가 빠르고 관객의 분노와 웃음이 언제 생길지 읽는다. 비판적 질문을 던지면서도 방송의 화제성과 협찬을 우선할 수 있다.\n행동: 게스트의 답이 길어지면 시민의 눈앞에 있는 사건을 끌어와 말을 끊고, 방청객 반응이 크면 같은 논점을 다시 밀어붙인다.\n말투: 강조가 크고 짧은 농담 뒤 단정하는 문장을 붙인다. 질문과 주장을 교대로 내면서 대담의 속도를 자기 쪽으로 가져온다.\n특징: NCPD 대변인에게 시민이 언제 안전해질지 따져 물었고 임플란트를 빼앗긴 노동자에게는 방송에서 밀리테크 제품을 제공했다. 이러한 장면에는 후원사의 이해, 방송용 이미지, 실제 피해자의 일이 함께 놓인다. 후보 초청과 질문을 고르는 방식도 시청자가 함께 봐야 할 신호다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.3"}],"priority":82,"status":"활동"},{"title":"앤서니 길크리스트","keywords":["앤서니길크리스트","길크리스트"],"short":"호송대 정보 유출에 얽힌 밀리테크 직원","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 외관상 성인 남성.\n외모: 짧은 짙은 머리와 정리된 수염, 심문을 받는 차량 장면에서는 얼굴에 푸른 조명이 걸린다. 날렵한 체격과 불안해 보이는 눈길이 두드러진다.\n직업: 밀리테크 직원. 회사 호송대의 정보 유출에 연루된 인물.\n무기: 개인 무기 자료 미확인.\n사이버웨어: 확인된 사이버웨어 모델 미확인.\n성격: 궁지에서 자기가 감당할 수 있는 죄만 인정하려 한다. 은혜와 거래를 나눠 볼 줄 알지만, 먼저 기밀을 쥔 쪽에 생존 조건을 맡긴 과거가 있다.\n행동: 의심받으면 신중하게 부인하고, 반대쪽에서 힘이 생기면 자리를 바꾸어 상황을 정리한다. 도움을 준 인력과 이후 관계를 더 복잡하게 만들고 싶어 하지 않는다.\n말투: 짧은 설명 끝에 거래가 끝났다는 말로 끝맺는 편이다. 궁지에서는 급한 기색이 어조에 새고 결정적인 내용을 나중으로 미룬다.\n특징: 메레디스가 멜스트롬으로 정보를 흘렸다는 혐의로 붙잡았다. 올 푸드 공장 쪽 기록은 유출 자체가 있었다는 근거가 된다. 아라사카와 경쟁하는 밀리테크의 수송이 왜 표적이 됐는지, 사내 인물이 누구에게 압박을 받았는지에 따라 사건은 단순한 돈 거래보다 커진다.","group":"2077","priority":83,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-7.1.2"}]},{"title":"지미 쿠로사키","group":"엣지러너 1","keywords":["지미쿠로사키","엑스비디편집자","골드안면판","밀리테크와이번"],"short":"부유층에게 주문 제작 XBD를 파는 편집자","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 키가 크고 마른 체격. 옆을 민 길고 검푸른 머리에 가는 콧수염, 금빛 코와 턱 개조, 푸른색·분홍색 원형 무늬가 도는 의안이 특징이다. 화려한 네오키치 스타일을 즐긴다.\n직업: 왓슨 노스사이드에서 일하는 고급 XBD 편집자. 약칭 JK로 알려져 있다.\n무기: 밀리테크 와이번 드론 두 기를 현장에서 사용한다. 휴대 개인 화기의 모델은 미확인.\n사이버웨어: 개조 의안, 후방을 보는 키로시 안구, 금색 안면 부품, 기계 손, 쇼크 앤 어 장치가 자료에 기록된다.\n성격: 자기 기술과 취향의 우위를 즐긴다. 사건을 콘텐츠로 보는 직업적 냉담함과, 크롬이 몸과 의식을 망가뜨린 사례에 대한 지식이 공존한다.\n행동: 유명 고객에게 감각 기록을 맞춤 조정한다. 문제가 생기면 자신의 작업실과 방어 장비를 활용하며, 현장이 작품으로 남을 수 있다고도 생각한다.\n말투: 여유 있게 상대의 오만을 찌르고, 본인이 목격한 사건을 들어 단정적으로 말한다.\n특징: 제임스 노리스의 폭주를 편집한 기록으로 알려진 사람이다. 타나카와 플래티넘 가입자급의 거래망을 드나들 만큼 부유하며 레이필드 캘리번도 운용한다. 데이비드를 향한 경고에는 편집실로 흘러들어온 여러 개조 실패의 관찰이 반영되어 있다.","sources":[{"label":"나무위키 · 사이버펑크/ 엣지러너/줄거리 §6","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC#s-6"},{"label":"Cyberpunk Wiki · 지미 쿠로사키","url":"https://cyberpunk.fandom.com/wiki/Jimmy_Kurosaki"}],"priority":83,"status":"활동"},{"title":"데니","keywords":["사무라이데니","데니","드러머데니","Masterind"],"short":"사무라이 시절 이후에도 현역으로 남은 드러머","body":"성별: 여성.\n나이: 정확한 출생연도 미확인. 2020년대의 사무라이 활동과 현대의 외관에서 나이를 단정하지 않는다.\n외모: 크고 곱슬거리는 아프로 머리, 어두운 피부, 부풀린 흰 소매와 몸에 맞는 검은 가죽 상의. 신경이 곤두설 때에도 서 있는 자세가 곧다.\n직업: 사무라이 전 드러머. 이후 마스터인드에서 활동한 현역 음악가.\n무기: 개인 무기 자료 미확인. 드럼 스틱은 공연 도구다.\n사이버웨어: 착용 모델과 시술 내역 자료 미확인.\n성격: 자기 영역과 시간에 대한 요구가 분명하다. 트러블을 무조건 참고 화해하는 것보다 연주에 집중할 수 있는 조건을 직접 내건다.\n행동: 한 번 정한 무대 조건을 주변 사람이 대신 바꾸는 것을 거절한다. 동료에게 다시 일어설 기회를 알아봐 준 적은 있어도, 그 호의가 반복해서 악용되는 것을 막는다.\n말투: 분노가 생기면 우회하지 않고 이유와 상대 이름을 바로 꺼낸다. 익숙한 록 동료를 대할 때도 예의를 갖춘 연예 홍보 문구 같은 말투와는 거리가 있다.\n특징: 사무라이 이후에도 음악계에 자리 잡아 노스 오크의 저택에 산다. 과거 헨리에게 다시 연주할 기회를 얻도록 연결해 준 일이 있었으나, 헨리가 시멘트 트럭을 몰고 와 자기 수영장에 쏟아붓자 그와 같은 공연에 서지 않겠다고 선을 그었다.","group":"2077","priority":86,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-6.9"}]},{"title":"퍼플 포스","group":"2077","keywords":["퍼플포스","어스크랙스퍼플","보라색가수","키로시펄"],"short":"말싸움을 중재하며 공연의 균형을 잡는 아이돌","body":"성별: 여성.\n나이: 젊은 성인 추정. 정확한 나이 미공개.\n외모: 보라색 머리와 보라빛 무대 의상, 눈을 정면에서 드러내는 메이크업과 장식. 키로시 광고와도 이어지는 밝고 인공적인 의안이 눈에 띈다.\n직업: 어스 크랙스의 3인조 멤버. 일본과 북미의 대중음악 무대에서 활동한다.\n무기: 개인 무장 모델 미확인.\n사이버웨어: 키로시 커스텀 E14-X 펄 의안. 그 밖의 전투 임플란트는 확인되지 않는다.\n성격: 결정을 내려야 할 때 쉽게 미루지 않고 동료들의 격한 감정 사이에서 균형을 찾는다. 차와 명상으로 속도를 낮추는 데도 흥미가 있다.\n행동: 그룹 안에서 싸움이 커지면 각자의 뜻과 지금 해야 할 일을 다시 정리한다. 방송과 무대에서는 기대받는 캐릭터를 드러내면서 실무는 비교적 침착하게 본다.\n말투: 풍부한 무대 반응 속에서도 상황을 정리할 때는 차분한 문장을 쓴다. 급한 위협과 잠깐의 감정 변화를 구분해서 답한다.\n특징: MSM이 음악 제작 AI에 맞서 무대 장악력이 있는 세 사람을 찾는 과정에서 발탁되었다. 세 명의 색과 제품을 파는 광고에서 차분한 조정자라는 역할을 갖는다. 케리와의 소란 또한 무대 계약의 문제와 음악가끼리의 관계를 한꺼번에 다뤄야 하는 일이었다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.11","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.11"},{"label":"Cyberpunk Wiki · 퍼플 포스","url":"https://cyberpunk.fandom.com/wiki/Purple_Force"}],"priority":87,"status":"활동"},{"title":"애나 해밀","group":"2077","keywords":["애나해밀","가부키수사","라만차의여자","청렴경관"],"short":"경찰 조직의 비리를 덮지 않는 집요한 NCPD 경관","body":"성별: 여성.\n나이: 성인. 정확한 나이 미공개.\n외모: 수사 때문에 긴장이 풀리지 않는 경관으로 등장한다. 첨부 문서에서 머리 모양이나 정복의 특정 색은 확인하기 어렵다.\n직업: NCPD 수사 경관. 가부키 일대의 밀수와 부패 문제에 발을 들인다.\n무기: 개인 화기 사양 미확인. 위협을 받으면 수사 요원으로서 대응한다.\n사이버웨어: 장비의 제조사와 임플란트 모델은 공개 자료가 부족하다.\n성격: 부정한 일을 못 본 척할 수 없는 사람이다. 경계를 높여 둔 탓에 도와주려는 이의 말도 접촉 경위가 불분명하면 위협으로 받아들일 수 있다.\n행동: 동료가 조용히 넘기라는 사안까지 직접 추적한다. 안전을 이유로 도시를 떠나라는 대안을 받으면 누가 왜 그런 부탁을 하는지부터 확인한다.\n말투: 돌려 말하지 않고 불신이 커지면 어조가 금방 거칠어진다. 판단 근거를 간단하게 제시한 상대에게도 먼저 자신의 질문을 던진다.\n특징: 픽서 레지나 존스가 그녀를 살려 두고 수사를 그만두게 하려는 의뢰를 주선할 만큼 상황이 위험해질 수 있다. 사람 자체는 좋은데 성격은 까다롭다는 동네의 평은, 시민에게 굽혀야 하는 경찰과 조직을 의심하는 수사관의 면을 함께 보여준다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §10.4","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-10.4"}],"priority":88,"status":"활동"},{"title":"헨리","keywords":["사무라이헨리","베이시스트헨리","헨리"],"short":"붉은 머리의 전직 사무라이 베이시스트","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 사무라이의 2020년대 활동을 기준으로 고령일 수 있다.\n외모: 짧게 비스듬히 세운 붉은 머리와 흐트러진 옆선, 낡은 듯한 밝은 상의와 여러 줄 금색 목걸이. 표정에 기가 꺾이거나 몹시 들뜬 기색이 그대로 나타난다.\n직업: 사무라이의 전 베이시스트. 2077년에 안정된 음악 활동을 하는지는 불분명하다.\n무기: 개인 무기 자료 미확인.\n사이버웨어: 확인된 이식 모델 자료 미확인.\n성격: 오래된 동료의 인정을 잃는 데 예민하고, 복잡한 감정을 감당하지 못할 때 사고를 치는 방식으로 드러낸다. 관심을 얻은 뒤 그 관심에 책임지는 데 어려움을 겪어 왔다.\n행동: 좋은 제안이 와도 오래된 원한이나 당장의 충동을 먼저 처리하려 든다. 자기 탓을 부정하다가 일이 끝난 뒤 쉽게 무너지는 모습을 보인다.\n말투: 대담한 농담으로 대화를 시작할 수 있으나, 불편한 이야기가 되면 말의 뒷부분을 흐리고 감정이 앞선다.\n특징: 사무라이가 끝난 뒤 약물 문제와 불안정한 음악 활동을 겪었다. 데니가 밴드에 연결해 준 일이 있지만 이를 안정된 경력으로 이어 가지 못했다. 다시 모일 가능성이 생겼을 때 콤플렉스를 상대에게 쏟아붓듯 시멘트 트럭을 운전해 데니의 수영장을 망가뜨렸다.","group":"2077","priority":88,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-6.10"}]},{"title":"남창훈","group":"2077","keywords":["남창훈","와카코전담넷러너","효율데몬","연구원넷러너"],"short":"와카코가 예측 가능한 실력을 믿고 맡기는 넷러너","body":"성별: 남성.\n나이: 성인. 정확한 출생 연도 미공개.\n외모: 짧게 넘긴 어두운 머리와 정돈한 수염, 밝은 셔츠 안팎과 붉은 갈색 가죽이 섞인 외투. 체형은 길고 얼굴의 표정은 신중하다.\n직업: 사이버스페이스 분석가 겸 넷러너. 와카코의 의뢰에서 지식과 코드 안정성을 제공한다.\n무기: 고정 개인 화기 정보 없음.\n사이버웨어: 넷러닝 접속 장비를 다룬다. 모델명과 개조 목록은 미확인.\n성격: 새로운 문제를 파고들고 싶지만 필요한 안전을 쉽게 포기하지 않는다. 주목받을 만한 야망이 있어도 성격은 내성적이라 겉으로 내세우지 않는 편이다.\n행동: 복잡한 기능도 필요한 부분만 남겨 효율적으로 정리한다. 위험한 일 앞에서 망설이고도, 기술에 대한 호기심 때문에 결국 신중하게 받아들인다.\n말투: 예상을 잘못했을 때 무엇이 달라지는지 먼저 말한다. 자기 속내를 밝힐 때는 조심스럽고, 기술 설명은 차근차근 순서를 잡는다.\n특징: 와카코는 예상 밖의 일이 적은 의뢰를 선호해서 장식보다 반응이 일정한 창훈의 도구를 높게 본다. 그 관계는 서로의 전문성이 필요해서 이어진다. 깊게 파고들고 싶은 욕구와 무사히 현장을 벗어나려는 욕구가 항상 함께 움직이므로, 쉬운 대담함으로 캐릭터를 만들지 않는다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §17.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-17.3"}],"priority":89,"status":"활동"},{"title":"베네딕트 맥아담스","keywords":["베네딕트맥아담스","맥아담스","벤맥아담스"],"short":"기업에 배신당해 배드랜드에서 은거하는 용병","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 수년간 활동하고 감금된 성인.\n외모: 첨부 인물 명단에 독립적인 정면 사진이 없다. 외견은 노련한 용병이라는 인상과 달리, 풀려날 때는 오랜 감금의 영향이 먼저 보인다.\n직업: 나이트 시티에서 기업 정보와 표적을 다뤄 온 용병. 배드랜드 노마드.\n무기: 개인 소유 화기 고유명과 종류는 확인 자료 없음.\n사이버웨어: 기종이 확인된 개인 장착품 없음.\n성격: 업무에서는 확실하고 동료 사이에서는 원만하다는 평을 받는다. 위험한 시기를 보낸 뒤라도 경계만 내보내기보다 사소한 즐거움을 기억한다.\n행동: 기업 사이의 이해관계를 읽고 목표에 접근한다. 자신이 배신당한 판에서는 믿었던 동료가 회사와 어떤 약속을 했는지 새로 봐야 한다.\n말투: 건조한 용병식 말에 사적인 엉뚱함이 섞인다. 오래 갇혀 있다가 사람에게 묻는 첫 주제로 과일 맛을 떠올릴 만큼 말의 순서가 의외다.\n특징: 밀리테크에 이로운 일을 하던 부패 정치인 매클레인을 제거하고 나서 매수된 사람에게 배신당했다. 바이오테크니카 플랫의 감금 기록과 다코타의 의뢰가 그 행방과 잇닿는다. 풀려난 경우 알데칼도 캠프에 기대어 기업의 시선에서 피하고, 유전자 합성 멜론 맛을 그리워했다.","group":"2077","priority":89,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-9.1.9"}]},{"title":"앤드류 웨이랜드","keywords":["앤드류웨이랜드","보아보아","워터레오파드"],"short":"워터 레오파드를 이끌었던 캡틴 보아 보아","body":"성별: 남성.\n나이: 출생연도와 사망 당시 나이 미확인. 2077년 이전 사망.\n외모: 과거 삽화에는 몸통부터 팔까지 뱀 비늘을 연상시키는 문신을 새긴 큰 체구의 남자로 그려진다. 긴 머리 장식과 팔을 드러낸 옷차림도 당시의 도상에 속한다.\n직업: 자메이카 출신 솔로. 워터 레오파드 블랙 옵스 팀 지휘관.\n무기: 개인 신화급 무기 명칭이나 표준 장비는 자료 미확인.\n사이버웨어: 몸의 비늘 무늬는 문신으로 전해진다. 이를 사이버웨어로 계산하지 않는다.\n성격: 잔인하고 처신이 대담하며 부대의 이름을 키우기 위해 권력자와 직접 협력한다. 전우의 전투력은 높게 사지만 상대의 희생은 쉽게 감수했다.\n행동: 프리랜서 용병대를 이끌다 페트로켐의 사설 전력으로 조직을 옮긴다. 자기 팀의 성장과 기업 내 입지를 같은 목표에 놓는 지휘관이다.\n말투: 직접 재연할 만큼 확인된 대사는 적다. 과거 기록에서는 명령을 짧게 내리고 반발을 받아도 유예 기간을 거의 주지 않는 인물로 해석된다.\n특징: 캡틴 보아 보아로 알려졌고 앵거스 영블러드와 상호 이익이 맞는 관계를 맺었다. 제4차 기업 전쟁에서 아라사카 타워 공격 측에 참여했다는 기록이 남았다. 크리스핀의 부친으로, 아들의 별명이 비늘이라는 점에서 아버지의 업계 평판이 후대에 어떻게 남았는지도 드러난다.","group":"2077","priority":90,"status":"기록","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-6.6"}]},{"title":"샤이탄","keywords":["샤이탄","Shaitan"],"short":"아라사카와 싸운 전신 사이보그 특수작전 용병","body":"성별: 남성.\n나이: 출생연도 미확인. 2023년까지의 활동 기록을 기준으로 한다.\n외모: 피부를 대신한 금속 골격, 주름처럼 굽은 안면부의 판, 붉은 발광부가 두드러진다. 어깨와 팔이 두껍고 몸통 대부분을 단단한 의체가 차지한다.\n직업: 특수작전 솔로. 과거 아라사카 타워 작전에 참여.\n무기: 회상 기록에서 항공기에 탑재된 중기관총을 운용한다. 독자 보유 화기는 미확인.\n사이버웨어: 전신 사이보그 개조. 유기적 기관과 현용 부품의 정확한 구성은 미확인.\n성격: 아라사카에 대한 적개심이 뚜렷하다. 다른 목적과 충돌하더라도 기업이 받을 손실을 크게 만들고자 하는 경향을 보인다.\n행동: 상황이 격해질 때 임무를 되돌리기보다 중장비로 팀을 지원한다. 스스로 위험을 감수하는 방식과 팀 전체의 과업 사이에는 긴장이 남는다.\n말투: 구체적인 말투의 증거가 적다. 과거의 태도에 맞추면 짧고 무게감 있는 작전 보고가 어울린다.\n특징: 아라사카에 어머니를 잃었다는 과거가 보복에 영향을 주었다는 설명이 있다. 2023년 회상에서는 헬기에 올라 작전을 화력으로 지원하다 피격된다. 과거 판본은 피격 이후의 행적이 서로 다르므로 2077년 현재의 생사와 현장 출석을 임의로 확정할 수 없다.","group":"2077","priority":91,"status":"행방 불명","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-6.5"}]},{"title":"헤럴드 한","group":"2077","keywords":["헤럴드한","리버파트너","시장사망수사","한국계형사"],"short":"도시의 질서를 이유로 라인 사건을 덮으려는 형사","body":"성별: 남성.\n나이: 중년 이상 추정. 전후의 도시를 어린 시절에 겪었다.\n외모: 긴 갈색 계열 겉옷과 밝은 상의를 단정하게 맞춰 입고, 빈틈이 덜 보이는 자세로 술집이나 거리에서도 주위를 살핀다.\n직업: NCPD 형사. 리버 워드와 함께 일해 온 파트너다.\n무기: 개인 무기 모델은 미확인.\n사이버웨어: 특정 개조 모델을 확정하기 어렵다.\n성격: 도시가 이미 한 번 무너졌다는 기억 때문에 질서와 생존을 가까운 가치로 본다. 진실 규명이 동료들을 위험에 밀어 넣는다고 판단하면 우정이 틀어져도 수사를 접으려 한다.\n행동: 민감한 사건을 접하면 어디까지 밝혀도 조직이 감당할 수 있는지 계산한다. 리버가 라인 시장의 죽음을 계속 캐면 직접 중단을 요구하며 한때 쌓은 신뢰를 빠르게 깎아먹는다.\n말투: 표현은 현실적이고 피로가 배어 있다. 도시를 지켜 온 과정에는 회고가 길어지지만, 상부 문제에서는 곧바로 결론을 통보한다.\n특징: 제4차 기업 전쟁 뒤 대피소에서 살며 생필품을 구하던 기억을 가진다. 주민과 노마드가 도시를 다시 세우는 모습을 보면서 경찰이 되었다는 진술은 현재의 체제 유지 논리에 닿아 있다. 시장 사건에서 그에게 안전한 일과 옳은 일은 같은 방향을 가리키지 않는다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §10.5","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-10.5"}],"priority":91,"status":"활동"},{"title":"루스 젱","group":"2077","keywords":["루스젱","인포플래시","풍자코미디","쿠지라농담"],"short":"기업과 유명인을 대놓고 놀리는 인포플래시 진행자","body":"성별: 여성.\n나이: 성인. 정확한 연령은 미공개.\n외모: 대본 사이에서 표정과 타이밍을 유연하게 바꾸는 토크쇼 진행자다. 첨부 자료에 세부적인 신체 묘사는 적다.\n직업: 나이트 시티 방송 인포플래시 진행자. N54에서 무급 인턴으로 일한 경력이 있다.\n무기: 개인 무장 확인되지 않는다.\n사이버웨어: 개인 사이버웨어 제품은 확인되지 않는다.\n성격: 겉보기에 냉소적이어도 전쟁 피해 이야기에 뚜렷한 감정이 있다. 기회가 인맥에서 시작됐다는 사실을 감추려 들기보다 농담으로 받아친다.\n행동: 엄숙한 기사 소재에서 어색한 표현과 권력의 허점을 골라 짧은 풍자로 만든다. 회사의 명망 있는 손님을 언급할 때도 청중이 웃을 여지를 먼저 찾는다.\n말투: 비속어와 짧은 반전을 섞는 날카로운 방송 말투. 사적인 자리에서는 농담으로 상대를 편하게 만드는 데도 능하다.\n특징: 방송 관계자를 소개받은 뒤 인턴으로 일하며 휴식 시간에 사람들을 웃겼다는 일화가 있다. 쿠지라를 둘러싼 농담은 아라사카의 의전용 규모를 일반 시청자의 상식으로 끌어내린다. 무대의 쿨한 태도와 기업 전쟁 희생자 이야기에 보이는 슬픔은 쉽게 같은 모습으로 읽히지 않는다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.4","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.4"}],"priority":92,"status":"활동"},{"title":"단테 카루소","keywords":["단테카루소","카루소"],"short":"밀리테크의 기밀 연구를 추적하는 정보 요원","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 외관상 장년 추정.\n외모: 짧은 회갈색 머리, 다듬은 수염, 색이 섞인 밝은 셔츠의 소매를 걷은 모습. 묵직한 팔짱 자세와 비교적 눈에 덜 띄는 시내 복장이 대조된다.\n직업: 밀리테크 정보부의 현장 요원. 도그타운에서 AI 연구 자료 유출을 추적.\n무기: 분쟁 중 화기를 사용하나 대표 기종은 자료 미확인.\n사이버웨어: 확인된 개인 사이버웨어 모델 미확인.\n성격: 자기 행동으로 따른 결과를 낭만화하지 않는다. 위험한 정보를 알고 불필요한 표적이 되는 사람이 없어야 한다는 생각과 기업 요원이라는 지위가 공존한다.\n행동: 취재 자료 뒤에 얽힌 현금과 거래처를 함께 살핀다. 협조를 받더라도 자기 기업이 위험한 연구를 영구히 그만둘 거라고 보장할 수 없음을 안다.\n말투: 건조하고 솔직하게 상황을 말한다. 스스로 칭찬을 바라지 않으며, 상황을 오판한 사람에게는 왜 그런 일이 생겼는지 차분히 설명한다.\n특징: 브리 휘트니가 들여다본 밀리테크 AI 연구 자료에 넷워치라는 매입 상대가 얽혀 있음을 파악했다. 자료 공개가 공익 보도로 이어진다는 겉모습과 매매 계획을 구분한다. 밀리테크가 블랙월 연구를 이어갈 수 있다는 불편한 가능성까지 받아들이는 인물이다.","group":"2077","priority":93,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-7.1.3"}]},{"title":"칼 로빈슨","group":"2077","keywords":["다저","칼로빈슨","바게스트마약","다저를기다리며"],"short":"범죄 전력을 피해 도그타운에 정착한 바게스트 인물","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 도그타운의 군사적 분위기에 섞인 비공식 범죄 조직원으로 등장한다. 첨부 문서의 표기상 얼굴과 복장의 확정 정보는 제한적이다.\n직업: 바게스트 소속의 마약 거래업자. 다저라는 이명으로 통한다.\n무기: 개인 무장 모델 미확인. 거래 장소는 자기 부하와 함께 관리한다.\n사이버웨어: 구체적인 개인 사이버웨어는 미공개.\n성격: 위험했던 과거를 미화하기보다 도그타운의 보호를 현실적으로 활용한다. 자기 영역에서 누군가 재산이나 명예를 건드리면 먼저 철저히 확인하려 한다.\n행동: 핸슨의 질서 아래 이익을 얻으면서 경쟁 세력이나 경찰과 일을 처리한다. 외부인이 현장의 사정을 설명할 때 남은 부하나 다치지 않은 장비를 증거로 본다.\n말투: 도로에서 살아남은 사람이 쓰는 짧고 위압적인 표현을 섞는다. 자신을 속인다고 판단하면 질문의 대상과 뜻이 점차 좁아진다.\n특징: 여러 차례의 종신형과 갱단 및 노마드와의 악연이 기록된다. 도그타운까지 그를 쫓아갈 수 있는 세력이 한정돼 있어 핸슨 보호 아래 사업을 지켰다. 경찰 빌과 찰스가 얽힌 사건에서는 실제 영토 주권과 경찰의 명목상 권한 사이의 차이가 뚜렷해진다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §22.4","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-22.4"}],"priority":93,"status":"활동"},{"title":"타나카 카츠오","group":"엣지러너 1","keywords":["카츠오","아라사카아카데미학생","타나카아들","컴뱃칩"],"short":"기업가 자제로서 특권을 휘두르는 아카데미 학생","body":"성별: 남성.\n나이: 10대 아카데미 학생. 정확한 나이 미공개.\n외모: 단정하게 정리한 머리와 아라사카 아카데미 교복. 또래 학생 사이에 서 있을 때는 깔끔한 차림이나, 데이비드를 보며 표정을 크게 일그러뜨리곤 한다.\n직업: 아라사카 아카데미 학생. 기업 임원 타나카의 아들이다.\n무기: 주먹과 컴뱃 칩을 사용한 격투. 개인 총기는 확인되지 않는다.\n사이버웨어: 전투 보조용 컴뱃 칩. 나머지 이식 장비와 모델은 미확인.\n성격: 가정의 배경과 교육 기회를 자기 능력의 증명처럼 여기며, 비용을 감당하기 힘든 학생에게 우월감을 드러낸다. 급작스러운 반격에는 자존심이 먼저 상한다.\n행동: 학교의 시선과 규칙이 자기 편이라고 믿고 괴롭힘을 반복한다. 실제로 제압당하면 가문의 위세와 징계를 내세워 밀린 싸움을 만회하려 한다.\n말투: 형편과 신분을 겨냥한 모욕을 차갑게 늘어놓는다. 압도당하는 순간에는 말의 속도와 높이가 함께 변한다.\n특징: 데이비드와는 같은 교실에 있으나 서로 사는 도시가 다르다는 계급 차이를 드러낸다. 그의 피해 기록을 본 아버지는 자식의 체면보다 군용 임플란트 적합자 확보를 우선했다. 가족의 회사가 자신이 원하는 방식으로 항상 움직일 것이라는 가정이 쉽게 깨질 수 있다.","sources":[{"label":"나무위키 · 사이버펑크/ 엣지러너/줄거리 §2","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC#s-2"},{"label":"나무위키 · 사이버펑크/ 엣지러너/줄거리 §3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC#s-3"},{"label":"Cyberpunk Wiki · 타나카 카츠오","url":"https://cyberpunk.fandom.com/wiki/Katsuo_Tanaka"}],"priority":94,"status":"활동"},{"title":"파코 토레스","group":"2077","keywords":["파코토레스","바게스트신병","발전기도난","핸슨동경"],"short":"핸슨을 동경하다 큰 빚을 만든 바게스트 신병","body":"성별: 남성.\n나이: 젊은 성인으로 보인다. 정확한 연령 미공개.\n외모: 짧고 어두운 머리와 힘있는 양팔. 손을 허리에 두고 어두운 전술 복장 위에 녹색이 도는 파우치와 바게스트 장비를 여러 겹 걸친다.\n직업: 바게스트 신병. 신고식을 통과한 뒤 호송대에 배치된다.\n무기: DA8 엄브라를 바탕으로 한 소총 카르멘을 지닌다.\n사이버웨어: 눈에 띄는 군 장구 외 장착 임플란트 모델 미확인.\n성격: 낙천적이고 강한 인물의 인정에 쉽게 들뜬다. 앞으로 생길 일보다 방금 얻은 기회를 먼저 보며, 잘못의 대가를 알고도 농담으로 상황을 가볍게 만든다.\n행동: 신고식에서는 맞서 버티고 호송대에서는 습격으로 어수선한 틈을 사적으로 이용한다. 상관이 알아내자 외부의 조언과 탈출 경로를 구한다.\n말투: 친근한 속어와 큰 웃음을 쓴다. 자기가 존경하는 핸슨을 설명할 때 침을 튀기며 장면의 세부까지 꺼내 놓는다.\n특징: 호송물의 발전기를 빼돌려 팔면서 바게스트 내에서도 처벌 대상이 된다. 이 사건은 조직에서의 출세욕, 편한 돈에 대한 욕심, 지휘관에 대한 동경이 성급한 사람 안에서 뒤섞인 사례다. 빠져나간 뒤 세울 계획도 준비와 안전보다 당장의 자유를 먼저 생각한다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §22.5","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-22.5"},{"label":"Cyberpunk Wiki · 파코 토레스","url":"https://cyberpunk.fandom.com/wiki/Balls_to_the_Wall"}],"priority":95,"status":"활동"},{"title":"프랭크 노스트라","keywords":["프랭크노스트라","노스트라"],"short":"숙청의 여파를 겪는 아라사카 특수 작전국원","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 성인.\n외모: 첨부 자료에는 뚜렷한 개별 정면 초상이 없다. 기업 사무공간과 작전 인력 사이에 섞여 있을 때는 다른 요원에게서 쉽게 눈에 띄지 않는 실무 복장으로 묘사된다.\n직업: 아라사카 특수 작전국 요원. 기업 간부들의 다툼에 얽힌 현장 직원.\n무기: 개인 무기 모델 확인 자료 없음.\n사이버웨어: 정확한 개인 장착품 확인 자료 없음.\n성격: 옛 인연을 기억하면서도 안정된 기업 신분을 잃을 가능성을 대단히 두려워한다. 비굴하게 몸을 낮추는 선택과 동료에게 해가 갈 선택 사이에서 자주 흔들린다.\n행동: 회사 명령을 따라 보안 인력과 움직일 수 있다. 상황이 불리해지면 자기 입장을 먼저 설명하거나 사람이 움직일 만한 데이터를 미끼처럼 내세운다.\n말투: 업무 이야기와 사적인 회고를 섞는 친근한 어조. 치명적인 대목이 가까워질수록 부탁하는 말에 계산이 비친다.\n특징: 아라사카의 인사 정리가 이뤄질 때 직장과 자산을 동시에 빼앗길 위험을 겪었다. 자기가 죽었다는 말과 애버내시의 비위를 담은 파일을 이용해 관심을 다른 곳으로 돌리려 한 기록이 있다. 그 일을 계기로 상대의 반응에 따라 기업 밖 삶을 생각할 여지도 생긴다.","group":"2077","priority":95,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-7.2.13"}]},{"title":"질리언 조던","group":"2077","keywords":["질리언조던","N54앵커","현장뉴스","추모식보도"],"short":"뉴스 데스크와 취재 현장을 오가는 N54 앵커","body":"성별: 여성.\n나이: 성인. 정확한 나이 미공개.\n외모: 위로 볼륨을 준 금발과 푸른 눈, 분홍색 계열의 방송용 상의. 메이크업과 혈색을 정돈하고 현장 카메라 앞에서는 상대의 움직임과 관계없이 렌즈를 향해 선다.\n직업: N54의 아나운서이자 현장 리포터. 도시 소식을 TV와 현장 연결로 전달한다.\n무기: 개인 무장 정보 없음.\n사이버웨어: 개인 모델이나 신체 개조 내역은 미확인. 카메라와 송출 장비는 방송 도구다.\n성격: 현장에서는 정해진 형식과 시간 안에 문장을 전달하는 데 집중한다. 공개 뉴스에서 보이는 전문적인 표정과 개인적인 휴식은 뚜렷이 다르다.\n행동: 추모 행사에서 외부의 습격이 생기면 확인된 부분을 현장에 서서 보고한다. 시야를 가리는 사람에게 촬영 중임을 알리고 작업이 끊기면 따로 시간을 갖는다.\n말투: 문장을 짧고 정확하게 끊는 표준적인 뉴스 화법을 쓴다. 현장에서 불편을 표현할 때도 우선 업무가 방해된 이유를 댄다.\n특징: 엘리베이터 화면과 도시 뉴스에서 쉽게 접할 수 있는 얼굴이며 예기치 않은 사건 직후에도 직접 취재를 한다. 블랙 사파이어의 기업과 정치 인사가 모이는 자리에도 방송계 인물로 참석한 적이 있다. 회사 보도에서 쓰는 사건의 호칭과 자신이 직접 본 일을 구분할 여지가 있다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.6","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.6"}],"priority":96,"status":"활동"},{"title":"카터 스미스","keywords":["카터스미스","카터"],"short":"부서 내부의 위험한 권력전을 신고한 기술자","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 외관상 성인 남성.\n외모: 짙은 머리와 어두운 업무용 재킷, 밝은 파란 셔츠. 기업 플라자의 인공 조명이 얼굴을 비출 때 눈가에 긴장이 쉽게 드러난다.\n직업: 아라사카 대정보부 기술자. 기업 부서 간 정보 흐름을 가까이서 본 직원.\n무기: 개인 무기 자료 미확인.\n사이버웨어: 회사에서 제공한 장치와 개인 장착품 사이를 확인할 자료 없음.\n성격: 사람을 효율의 숫자로만 다루는 회사가 못마땅하다. 잘못을 보고했을 때 제도가 자기 손을 잡아줄 거라고 기대하지만 경영진의 위험 계산은 더 차갑다.\n행동: 일반 업무에서는 상사에게 직접 보고하려 한다. 고위 간부들의 비공식 제거 계획이 보이면 어느 쪽을 신고해야 사태를 막을지 고민한다.\n말투: 정중하고 긴장한 업무 말투. 보내야 할 보고나 설명을 끝까지 하려 하며 부당한 결과를 마주하면 형식적 어휘의 완충이 사라진다.\n특징: 젠킨스가 애버내시를 끌어내리려 한다는 점을 보고했다. 하지만 애버내시 역시 그가 너무 많은 정보를 가졌다고 판단했다. 그가 타던 작은 마키가이 마이마이와 기업 플라자 쪽 기록은 내부고발 뒤 안전과 보상이 따라오지 않는 회사의 구조를 보여준다.","group":"2077","priority":96,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-7.2.12"}]},{"title":"로건 가르시아","keywords":["로건가르시아","로건","가르시아"],"short":"애니멀 체육관에서 위험한 경기를 주도하는 단원","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 복싱 경력을 쌓은 성인.\n외모: 첨부 명단에 정면 초상이 없다. 기록상 큰 신체와 탄소 섬유 근육 보강을 과시하는 운동선수형 인물이며, 얼굴과 세부 장식의 특징은 확인되지 않는다.\n직업: 애니멀 소속 권투 선수 겸 경기 운영에 관여하는 갱단원.\n무기: 링에서 자신의 신체를 주로 사용한다. 개인 화기 자료 미확인.\n사이버웨어: 탄소 섬유 근육 임플란트. 제조사와 상품명은 미확인.\n성격: 강함을 자격으로 내세우며, 쓰러진 상대에게 멈춰야 한다는 책임을 인정하려 하지 않는다. 운동과 만행을 구분하라는 항의에 상대가 약했다고 답하는 성향이다.\n행동: 권투 경기와 갱단의 돈벌이를 연결하고 패배자가 크게 다쳐도 그 결과를 부수적인 것으로 본다. 링 너머의 피해를 묻는 가족을 냉담하게 대한다.\n말투: 과장 없는 문장조차 노골적인 조롱처럼 들리는 태도다. 책임보다 강약을 먼저 이야기한다.\n특징: 경기에 들어온 선수의 죽음이 가족의 복수 의뢰와 이어지고, 지나친 행태 때문에 같은 애니멀 내부에서도 불평이 나왔다. 라이노가 드나드는 체육관은 갱단 사업과 다양한 링 문화가 섞여 있지만 두 사람의 책임과 실력은 서로 다른 방식으로 다룬다.","group":"2077","priority":98,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.7.2"}]},{"title":"핀 거스탯","group":"2077","keywords":["핑거스","핀거스탯","지그지그스트리트","재활용리퍼닥","외상진료"],"short":"중고 부품과 외상으로 환자를 받는 지그지그 거리 리퍼닥","body":"성별: 남성.\n나이: 중장년 추정. 정확한 나이 미공개.\n외모: 마른 체구와 정수리의 짧은 머리, 얼굴과 팔에 드러난 개조 디테일. 망사 상의와 분홍 장식이 들어간 겉옷 등 지그지그 거리에서 눈에 띄는 차림을 입는다.\n직업: 지그지그 스트리트의 리퍼닥. 핑거스라는 별명을 쓰며 값싼 개조와 수리를 수주한다.\n무기: 고정 무기 모델은 미확인. 진료에는 중고 부품과 수술용 장비를 사용한다.\n사이버웨어: 외형에서 개조 흔적이 보인다. 제조사와 기능 묶음은 확인되지 않는다.\n성격: 일을 처리하는 능력을 과장하고 자신의 작업 방식에 자부심이 있다. 경제 사정이 어려운 이용자를 대할 때 친절과 권력차가 함께 작동한다.\n행동: 외상 진료를 받아 주고 부족한 재료를 있는 부품으로 대체한다. 치료나 수리의 범위를 넘는 부탁을 받으면 자기에게 돌아올 대가와 위험을 따진다.\n말투: 스스로를 과하게 치켜세우며 친근한 척 다가간다. 처리할 수 없는 일에 관한 질문에서는 변명과 다른 거래 상대 이름이 나온다.\n특징: 이블린 파커가 클라우드에서 빠져나온 뒤 어떤 일을 당했는지 알아볼 때 거쳐 가는 인물이다. 재활용 시술 덕에 다른 곳의 진료비를 못 내는 손님이 찾아오지만, 그런 접근성이 환자의 안전을 보증하지는 않는다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §15.6","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-15.6"}],"priority":98,"status":"활동"},{"title":"제임스 노리스","group":"엣지러너 1","keywords":["제임스노리스","노리스중위","군용시험형","사이버사이코기록"],"short":"군용 산데비스탄을 남긴 전직 NUSA 장교","body":"성별: 남성.\n나이: 성인. 정확한 나이는 미공개.\n외모: 키가 크고 단단하게 개조된 몸에 짧은 밝은 머리와 회색 수염이 있다. 턱과 목에 장갑 외장이 잡혀 있고 등에는 여러 화기를 짊어진다.\n직업: 전직 신미합중국 군 장교이자 과중한 개조를 지닌 솔로. 계급 번역은 매체별 차이가 있다.\n무기: HJSH-18 마사무네, DB-2 사타라, HJKE-11 유키무라, M-76e 오마하가 장비 자료에 기록된다.\n사이버웨어: 군용 시험형 산데비스탄, 맨티스 블레이드, 투사체 발사 시스템, 피하 장갑, 사이버 팔과 다리, 군용 방어 임플란트.\n성격: 사건 이전의 일상 성격은 알려진 자료가 적다. 폭주 중의 행동으로 평소 성격을 확정하지 않는다.\n행동: 코포 광장 사건에서 NCPD 인원들을 공격했다. 신체의 군용 자동 기록은 본인이 제압된 뒤에도 사건 조사와 불법 편집에 쓰였다.\n말투: 직접적인 평소 대화의 기록이 거의 없다. 장교 시절의 말투나 생활 태도는 미확인이다.\n특징: 맥스택이 폭주를 끝냈고 지미 쿠로사키는 당시 기록을 편집했다. 글로리아가 확보한 그의 군용 임플란트는 메인과 거래될 예정이었지만 데이비드의 손에 들어갔다. 통합 시점은 이미 임플란트가 회수된 뒤이므로 생전 영상과 증언에 남는 사망 기록으로 취급한다.","sources":[{"label":"나무위키 · 사이버펑크/ 엣지러너/줄거리 §2","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC#s-2"},{"label":"Cyberpunk Wiki · 제임스 노리스","url":"https://cyberpunk.fandom.com/wiki/James_Norris"}],"priority":99,"status":"기록"},{"title":"브리 휘트니","group":"2077","keywords":["브리휘트니","사이노슈어기자","도그타운취재","넷워치자료거래"],"short":"밀리테크의 블랙월 연구를 뒤쫓는 도그타운 기자","body":"성별: 여성.\n나이: 성인. 정확한 나이 미공개.\n외모: 도그타운 지하에서는 움직임과 시선이 불안하다. 업계 활동으로 유지한 호화로운 집의 환경은 현장에서의 신경질적인 자세와 비교된다.\n직업: 기자. 기업에 돈을 받고 글을 쓴 전력이 있으며 사이노슈어 연구를 조사한다.\n무기: 개인 무장 모델 미확인. 깊은 시설 접근에서 외부 인력의 보호를 구한다.\n사이버웨어: 특정 사이버웨어나 모델에 관한 정보는 한정적이다.\n성격: 새 자료를 손에 넣었을 때 흥분이 빠르고 상황이 무서워져도 정보 가치부터 알아본다. 취재가 자신의 생계와 협상력이라는 사실을 잘 안다.\n행동: 시설 키카드와 내부 제보를 이용한다. 공개 표명과 실제로 데이터를 어떻게 처분할지에 대한 판단을 다른 단계로 다룬다.\n말투: 위기에서는 질문을 서두르고 안전 확보를 먼저 요구한다. 결정적인 증거 앞에서는 논리와 의미를 한꺼번에 말하느라 문장이 빨라진다.\n특징: 밀리테크가 블랙월 너머 AI를 이용하려던 기록, 넷워치가 그것을 어디까지 알았는지에 이해가 걸려 있다. 단테 카루소는 그녀가 대중 이익보다는 돈을 노린다고 주장한다. 자료가 팔리거나 공개되는 결과는 이야기가 열리는 시점에는 고정되지 않는다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.16","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.16"}],"priority":100,"status":"활동"},{"title":"요코","group":"2077","keywords":["요코","가부키넷러너상점","핸즈기술연락","케르베로스부품"],"short":"가부키에서 위험한 부품의 정체를 판별하는 넷러너","body":"성별: 여성.\n나이: 성인. 정확한 나이 미공개.\n외모: 가부키 시장 상점의 장비와 단말 사이에서 일한다. 얼굴과 액세서리를 특정할 만큼 자세한 첨부 초상은 확인되지 않는다.\n직업: 가부키의 넷러닝 제품 상인. 미스터 핸즈와 접점이 있는 기술자이기도 하다.\n무기: 개인 무장 기종 미확인.\n사이버웨어: 넷러닝 장비를 운용하지만 판매 모델과 본인에게 장착한 모델을 동일시하지 않는다.\n성격: 능력과 경력을 과시하기보다 상황이 항목별로 얼마나 위험한지 판단해 말한다. 신뢰를 쌓아 두는 일이 물건을 한 번 파는 것만큼 중요함을 안다.\n행동: 일반적인 퀵핵과 장치 안내부터 극히 희귀한 부품 진단까지 맡는다. 넘기는 자료에 위험이 있으면 다른 기술자의 판단이 왜 필요한지 전달한다.\n말투: 일반 고객에게는 기능부터 설명하고, 본격적인 의뢰를 받으면 자료가 무엇을 할 수 있는지와 걱정해야 할 점을 함께 말한다.\n특징: T-버그와 같은 업계의 변화와 도그타운의 비공개 의뢰를 모두 접하는 위치다. 케르베로스 부품과 블랙월 관련 기술을 알아보는 과정에 등장하지만, 그 위험을 판매 문구로 덮지 않는다. 시장의 상인 간판만 보면 실제 연락망의 넓이를 쉽게 짐작하기 어렵다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §18.2","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-18.2"}],"priority":102,"status":"활동"},{"title":"패트리샤","keywords":["패트리샤","오펠리아시라위안","시라위안"],"short":"토텐탄츠에서 멜스트롬의 체면을 지키려는 간부","body":"성별: 여성.\n나이: 출생연도 미확인. 범죄 조직에서 지휘를 맡는 성인.\n외모: 정면 사진을 첨부 자료에서 확인하기 어렵다. 토텐탄츠의 멜스트롬 간부로서 어두운 클럽에서 주변 단원들과 움직이며, 별도의 외형 특징은 확인된 범위만 사용한다.\n직업: 멜스트롬 간부. 지도부의 변동에 따라 토텐탄츠 현장 통제권을 쥘 수 있다.\n무기: 개인 소유 화기 모델 자료 미확인.\n사이버웨어: 개별 크롬 종류는 확실한 자료 미확인.\n성격: 조직의 평판을 위험하게 만든다고 생각하면 놀림과 실제 공격을 쉽게 구별하지 못한다. 체면을 숙이는 게 생존에 유리한 거래도 피할 수 있다.\n행동: 인터뷰와 클럽 출입처럼 밖에서 볼 수 있는 움직임을 곧바로 조직 문제로 치환한다. 어디까지 정보가 퍼지는지 모를 때 사람을 붙잡아 상황을 통제한다.\n말투: 직접 목소리를 높이고 짧게 물어보는 어조. 질문을 계속 받으면 상대의 의도를 따지면서 협상 여지를 줄인다.\n특징: 브릭, 로이스, 덤 덤이 조직에서 빠지는 정도에 따라 간부 또는 임시 지도자에 가깝게 등장한다. 토텐탄츠로 취재 온 베스 아이시스에게 음악을 넘어서는 이야기가 밖으로 나가면 갱단의 위신이 흔들린다고 판단했다. 로이스 일각과 달리 클럽이 외부에 보이는 모습 자체를 문제 삼는다.","group":"2077","priority":102,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.1.5"},{"label":"Maelstrom Members · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Maelstrom_Members"}]},{"title":"앤서니 해리스","group":"2077","keywords":["앤서니해리스","피터팬","커처실종사건","농장기억"],"short":"커처 일가의 실종 사건과 연결된 연쇄 범죄자","body":"성별: 남성.\n나이: 40대.\n외모: 처음 신원을 확인할 때는 거리에서 유별나 보이지 않는 보통 남성으로 인식된다. 구금 중 중상을 입은 뒤에는 병상에 있어 표정과 자세의 변화가 거의 없다.\n직업: 전과가 없던 시민으로 보였으나 청소년 연쇄 실종 수사의 피의자다.\n무기: 개인 총기 모델과 주력 장비는 미확인.\n사이버웨어: 사이버 사이코로 분류되는 자료가 있으나 고정 장착 장비는 특정하지 않는다.\n성격: 남을 도울 때 쓰는 말을 관계의 통제를 위해 전용해 온 기록이 있다. 어릴 때 겪은 가정의 폭력과 그 폭력을 다른 사람에게 돌린 이후 행동은 구별한다.\n행동: 비공개 온라인 연락과 외딴 농장을 통해 실종 사건을 일으켰다. 상태가 위독해진 뒤 직접 심문이 어려워지자 남은 기억과 차량 흔적이 경찰 수사의 자료가 된다.\n말투: 평소 말투를 확인할 만한 대화 기록은 거의 없다. 초기 접촉에서는 상대의 고립감에 공감하는 태도를 연출했다고 나타난다.\n특징: 농장에서 가축을 다루던 일과 어린 시절 겪은 학대가 뒤틀린 기억으로 남아 있다. 랜디 커처도 사건과 관련되어 있어 리버 워드의 수사는 가족의 구출과 공식 조사 모두에 걸린다. 출발 시점에 체포·의식 상태는 앞선 사
