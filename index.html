ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"픽서 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Fixer"}],"priority":102},{"title":"위기 반사 신경 보철","group":"사이버웨어","keywords":["리플렉스튜너","리벌서","시냅스가속기","아토믹센서"],"short":"부상·감지·노출에 반응하는 신경 장비","body":"리플렉스 튜너는 신체 상태가 위험해졌을 때 불릿 타임에 가까운 반응을 일으키며, 리벌서는 그 상황에서 사용자 움직임의 둔화를 줄이는 고급형이다. 시냅스 가속기는 심한 부상이 아니라 적에게 포착되기 시작하는 위협을 계기로 짧은 반응 우위를 준다. 아토믹 센서는 감지가 높아지는 도중 움직임을 보조하며, 전투 전 발각될 때와 이미 전투에 들어간 상태를 구분한다. 상대 눈에 돋보이는 차이가 곧 착용자에게 몸의 손상이 사라진다는 신호는 아니다. 반응 가속으로 위협이 눈에 잘 들어와도 감시망을 차단하거나 신체를 복구하는 부품으로 바뀌지는 않는다. 시냅스 가속기가 움직였다는 보고는 의식이 완전히 쓰러지기 전 급격히 반응했다는 리벌서 사례와 투명하게 구분한다. 반사 보철의 발동 자료, 상대가 발견했다고 알린 시각, 눈앞의 표식은 서로 다른 기록이며 함께 보면 긴박하게 움직인 까닭을 찾을 수 있다. 리벌서와 아토믹 센서는 주로 반응하는 위기의 종류가 다르다.","sources":[{"label":"사이버웨어/신경계 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%8B%A0%EA%B2%BD%EA%B3%84"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":102},{"title":"크롬 컴프레서","group":"사이버웨어","keywords":["크롬압축기","용량증설","컴프레서","관리운영체제"],"short":"운영체제 대신 의체 용량을 늘리는 장치","body":"크롬 컴프레서는 도그타운에서도 유통되는 운영체제형 장치다. 퀵핵을 구동하거나 반사를 가속하거나 격한 근접전에 맞춘 전투 모드를 켜는 기능을 더하지 않고, 다른 부위에 이식할 수 있는 사이버웨어의 총 부담을 받아 주는 용량을 늘린다. 기계 팔과 외피 보호 장비를 더 달 수 있는 사양을 마련하는 것과, 이미 단 보철을 더 세게 돌리는 것은 구분된다. 컴프레서를 들여도 구동부별 연결과 보정이 사라지지 않으며 가속이 필요하다면 케렌지코프 같은 별도의 장치가 담당한다. 중추 슬롯 하나에 무엇을 넣을지의 결과로, 몸 전체를 증강하는 사람에게 남는 선택지를 바꾼다. 용량을 늘린 몸에서 골격, 외피, 팔과 안구가 같은 역할을 나누지 않으므로 무엇을 추가했는지 별도로 확인한다. 별도 가속 모듈을 들일 수도 있지만 짧은 반응 보조에 그친다면 전신의 장시간 고속 작동과 같은 결과로 볼 수 없다. 도그타운에서는 크롬 컴프레서를 갖춘 보철상이 알려져 있다.","sources":[{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":104},{"title":"아라사카 화기 계보","group":"장비","keywords":["아라사카화기","노와키","시구레","유키무라","마사무네"],"short":"실탄·테크·스마트 기술을 낸 제조사","body":"아라사카는 파워 계열에 노와키·시구레·마사무네를, 테크 권총 계열에 켄신을, 스마트 계열에 유키무라와 신겐을 내놓았다. 노와키와 마사무네는 비슷한 크기의 라이플로 분류되며, 애칭과 제품 번호가 함께 쓰인다. 콩고 같은 개조품은 원 모델과 별도로 알려진 드문 사례다. 이름은 일본의 함선이나 옛 인물·장인에게서 빌려온 경우가 있으며, 제작한 기업의 문화적 배경을 드러낸다. 같은 기업이 방호용 소프트웨어와 팔 임플란트도 만들지만 제품의 작동 방식은 각각 따로 분류한다. 기업 내부 경비가 든 장비와 거리에서 발견되는 보급 제품의 맥락은 다를 수 있다. 시구레의 작은 기계적 형태와 신겐의 스마트 조준은 같은 회사에서 나온 다른 유형의 장비다. 기호가 일본 작품에서 유래했다는 사실은 물건의 소유나 현재 사용자의 직종을 정하지 않으므로, 장비 문자와 정비 자료의 기록을 모두 점검한다. 스마트 권총 유키무라와 파워 라이플 노와키는 이름 계보도 다르다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":105},{"title":"동기화 안면 임플란트","group":"사이버웨어","keywords":["행동각인","동기화안면","안면임플란트","신원위장"],"short":"외형과 신원 정보를 위장하는 안면 장비","body":"행동 각인 동기화 안면은 단순한 가면이나 상처를 가리는 미용 보철과 달리, 겉으로 드러나는 생김새와 디지털 신원을 함께 속이기 위해 쓰인다. 팬텀 리버티에서는 수집한 행동과 외형의 자료를 특정 인물처럼 보이도록 재현하는 데 쓰이는 특수 장비로 묘사된다. 카메라나 신원 검사에 보이는 정보와 말하는 습관을 흉내 내는 일이 결합될 때 위장의 효력이 커진다. 다만 표정과 얼굴을 재현하는 기계가 사적인 관계와 경험, 기억까지 가져오는 것은 아니다. 키로시 안구와 함께 안면 장비로 분류되지만, 광학 장치가 처리하는 시야나 사격 보조와는 성격이 다르다. 소지자의 얼굴을 현장에서 바꾸는 능력을 확인하는 것과 상대의 통화 환경에서 연결 기록을 다시 읽는 일은 각기 다른 검증이다. 같은 생체 신분이라도 감시 장소에 들어간 당시의 영상과 사후 증인의 기억에 남은 특징이 달라질 수 있다. 행동 각인 장비에 들어가는 인물 자료는 표정과 모습을 위한 별도 입력이다.","sources":[{"label":"사이버웨어/안구 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%95%88%EA%B5%AC"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"}],"priority":106},{"title":"테키와 정비 인력","group":"거리 문화","keywords":["테키","정비사","공학","부품","현장수리"],"short":"기계·차량·장비를 관리하는 기술 직업","body":"테키는 기계와 전자 장비의 설치, 수리, 개조에 능한 기술 직업이다. 운송 차량을 고치는 노마드 정비 인력과 전자 장비를 손보는 도시 작업자, 생체 이식을 맡는 리퍼닥은 필요 기술이 겹쳐도 업무의 책임이 다르다. 정비에 쓰는 시간과 부품은 고장 부위, 장비 세대, 현장 재고에 영향을 받는다. 장비를 고칠 수 있다는 사실이 그 기기의 회사 기록이나 주변 망을 열람할 수 있다는 뜻은 아니다. 리퍼닥은 사이버웨어를 제거하거나 설치하고 환자의 상태와 호환성을 확인한다. 치료 목적의 보철과 기업형 성능 개조, 중고 부품을 쓰는 비공식 시술은 가격과 위험, 후속 관리가 다르다. 빅터의 클리닉과 기업 의료 시설, 도그타운 안의 사설 진료는 고객층과 계약 조건부터 다르다. 용병팀은 현장 행동을 맡는 솔로, 차량과 장비에 강한 테키, 망에 접속하는 넷러너 같은 인력으로 조직될 수 있다. 픽서가 사람과 일감을 이어도 현장의 모든 선택을 대신할 수는 없다.","sources":[{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"픽서 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Fixer"}],"priority":106},{"title":"캉 타오 스마트 계열","group":"장비","keywords":["디안","줘우","팔성총","캉타오화기","잉롱"],"short":"캉 타오의 유도 무기와 개조품","body":"캉 타오는 스마트 화기의 대중화와 관련된 제조사로 유명하다. G-58 디안은 작은 유도 투사체를 이용하는 기관단총 계열이며 잉롱은 전기 효과와 관련된 특징이 붙은 변형이다. L-69 줘우는 스마트 산탄총 제품군이고, 바 싱 총으로도 표기하는 팔성총은 그중 독특한 폭발 효과를 내는 개조 사례다. 손이나 얼굴에 연결되는 조준 장비가 있어야 유도 시스템의 기능을 사용한다. 산탄총의 장치 구성과 기관단총의 사용 환경이 다르며, 같은 캉 타오 제품을 쥐었다고 회사 내부에서 일하거나 군에서 지급받았다는 의미는 아니다. 일반형과 사양을 바꾼 제품은 명찰과 등록 정보를 함께 확인한다. 캉 타오가 유도 무기를 공급하는 가운데 특정 제품을 계약으로 납품한 기록과 외부 시장에서 구입한 물건은 접근성이 다르다. 전자기적 충격을 보이는 개조품과 여러 탄체를 맞물리는 산탄총의 차이를 그 배경과 함께 본다. 디안과 잉롱은 원형 및 특주 변형의 관계다.","sources":[{"label":"캉 타오 · 나무위키","url":"https://namu.wiki/w/%EC%BA%89%20%ED%83%80%EC%98%A4"},{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":107},{"title":"반응형 외피 보강","group":"사이버웨어","keywords":["카운터셸","데펜지코프","코기토격자","프로시실드","레인지가드"],"short":"위험 상태에 맞춰 켜지는 외피 보호","body":"카운터셸은 몸이 짧은 순간에 큰 손상을 받았을 때 보호를 늘리고, 데펜지코프는 케렌지코프 효과 종료 뒤에 이어지는 방어를 맡는다. 코기토 래티스는 사이버덱을 쓰며 가용 RAM이 낮을 때 자체 방호가 강화되는 외피다. 프로시실드와 레인지가드는 가까운 위험과 떨어져 있는 대상을 상대하는 조건이 다르다. 이들 방어 부품을 늘 같은 전신 장갑으로 취급하면 무엇이 작동의 계기가 되는지 놓친다. 반응형 보호가 돌아가지 않는 동안에도 붙어 있는 외피 자체의 성질은 제품에 따라 다르다. 신경계 케렌지코프를 설치했다고 후속 외피 방호가 자동으로 포함되는 것은 아니다. 급작스러운 충격 뒤 발휘되는 보호와 처음부터 서서 무게를 지탱하는 장비는 재질을 같게 쓰더라도 신체가 감당하는 시간이 다르다. 가까운 위협을 고려한 외피와 거리를 기준으로 보호를 유지하는 외피는 같은 장소에서 작동 조건이 갈린다. 코기토 래티스는 덱과 함께 쓰는 장비로 분류된다.","sources":[{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"},{"label":"사이버웨어/신경계 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%8B%A0%EA%B2%BD%EA%B3%84"}],"priority":108},{"title":"정숙 보행과 수평 기동","group":"사이버웨어","keywords":["리로이인대","스라소니발","정숙보행","젠킨스힘줄"],"short":"발걸음과 지상 이동 성능의 선택","body":"이동 소음을 줄이는 스라소니 앞발과 지상의 속도를 끌어올리는 젠킨스 힘줄은 비슷해 보이는 다리 보철 가운데 목표가 대비되는 장치다. 스라소니 개조는 착지와 발걸음에 따른 소리의 범위를 줄이는 성격을 가지며, 주변에 울리는 다른 물체 소리나 카메라의 기록을 지우지 않는다. 젠킨스는 주로 질주 과정에서 강한 반응을 내고 리로이 인대 시스템은 기본적인 이동을 끌어올리는 쪽이다. 높은 곳을 오를 때 읽어야 할 보강 발목과 강화 힘줄의 정보와는 다르다. 발 주변의 의족만 보고 정숙형과 빠른 지상 이동형을 판단할 수 없으며 실제 동작의 차이를 보아야 한다. 경비원 귀에 일정 거리 안의 발소리가 닿는 일과 눈앞을 빠르게 지나가는 모습이 기록되는 일에는 효과의 구분이 있다. 움직임이 사라져 보정할 자료가 없는지도 현장 상황에서 따로 확인한다. 이동 허가와 소리를 줄이는 의족의 기능도 서로 다르다. 리로이의 기본 기동과 젠킨스의 초기 질주는 서로 다르게 나타난다.","sources":[{"label":"사이버웨어/다리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EB%8B%A4%EB%A6%AC"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":109},{"title":"넷러너의 일과 소속","group":"거리 문화","keywords":["넷러너","기업넷러너","독립넷러너","접속실","넷크루"],"short":"기업·갱단·용병팀의 네트워크 전문직","body":"넷러너는 사이버덱과 적절한 장비를 사용해 통신망과 연결된 시스템을 다루는 전문 직업이다. 기업 보안을 담당하는 직원, 부두 보이즈처럼 단체 목표를 가진 기술 인력, 용병팀에서 현장을 지원하는 넷러너는 소속과 승인 범위가 다르다. 네트워크가 분리되면 같은 작업도 접속 위치와 시간, 협력자가 달라진다. 넷러너를 통칭하는 말과 넷워치 정식 요원, 블랙월에 관한 특수 연구 경험을 가진 사람을 구별한다. 용병팀은 현장 행동을 맡는 솔로, 차량과 장비에 강한 테키, 망에 접속하는 넷러너 같은 인력으로 조직될 수 있다. 픽서가 사람과 일감을 이어도 현장의 모든 선택을 대신할 수는 없다. 주요 장소의 경찰·기업 또는 갱단 대응이 바뀌면 역할과 보수, 후퇴나 구조에 대한 책임이 달라진다. 개인별 장비와 연락 수단, 과거의 공동 작업 경험은 같은 직함만으로 알 수 없으며 결과는 각자가 실제로 맡은 일과 연동된다.","sources":[{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"픽서 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Fixer"}],"priority":110},{"title":"손의 반동 보조와 전력","group":"사이버웨어","keywords":["충격흡수기","움직이지않는힘","마이크로발전기","손잡이싸개"],"short":"충격·무기 그립·전기 펄스를 다루는 부품","body":"충격 흡수기는 총기에서 전달되는 반동과 흔들림을 줄이는 손 부품이다. 움직이지 않는 힘은 안정화에 치중한 고급 장치, 손잡이 싸개는 무기를 잡거나 던지는 움직임을 보조하는 장치로 구분된다. 마이크로 발전기는 무기를 다시 장전할 때 생기는 에너지를 이용해 전기 충격 효과를 낼 수 있는 별도 설계다. 동일한 손 보철 부위에 속한다고 탄도 예측이나 스마트 유도까지 보장하지 않는다. 쥔 물건이 실제 호환 장비인지와 팔뚝에 설치된 구동부가 있는지에 따라 작업 범위가 달라진다. 사용하는 힘을 보완하는 의수의 기능과 손에 연결되는 사격 보조기 기능은 겉으로 같은 장비처럼 보일 수 있다. 마이크로 발전기의 효과는 전기를 다루는 방법에 따라 작은 손 부품을 갖춘 총기에서도 관찰된다. 손잡이 싸개를 수술했다고 잡을 수 있는 모든 물건에 전기 에너지가 나타나는 것은 아니며, 전력과 움직임은 전용 제품이 각각 담당한다.","sources":[{"label":"사이버웨어/손 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%86%90"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":111},{"title":"전투 연산 보조 회로","group":"사이버웨어","keywords":["바이오전도체","COX2","메카트로닉코어","전투연산"],"short":"퀵핵과 기계 대상에 특화된 회로","body":"전두피질에 연결하는 바이오 전도체는 사이버웨어의 회로 연계를 다루며, 전투 퀵핵이 더 큰 타격을 낼 여지를 만든다. COX-2는 같은 맥락의 고급 장비로 전투 퀵핵을 강화하면서 다른 자원과 교환 관계를 가진다. 메카트로닉 코어는 사람의 두뇌를 확대하는 일반 모듈로만 분류하기보다 드론과 터렛, 로봇처럼 기계화된 대상을 상대하는 기능에 맞춘 부품이다. 전투 퀵핵의 출력을 높이는 장비와 필요한 임시 메모리를 늘리는 부품은 용도가 다르다. 펄스의 효과는 실제로 달려 있거나 망에 연결된 기계 장치에 따라 다르고, 민간 보철을 모두 군사 표적으로 보는 것을 뜻하지 않는다. 보철이 들어간 사람의 긴급 신호에 대응하는 프로그램과 완전한 기계 몸체를 검사하는 프로그램에는 판단 근거가 다르다. 회로가 내는 전투 출력, 둔한 부품의 보정, 이미 발생한 열에 대응하는 현상도 한 장치의 같은 단일 기능으로 묶지 않는다.","sources":[{"label":"사이버웨어/전두피질 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%A0%84%EB%91%90%ED%94%BC%EC%A7%88"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":112},{"title":"신경계 전투 보조","group":"사이버웨어","keywords":["아드레노트리거","아드레날린컨버터","찌르개","타이로신주사기","네오섬유"],"short":"기동과 정밀 동작을 지원하는 보철","body":"아드레날린 컨버터와 고급형 아드레노 트리거는 충돌이 시작되는 상황에서 몸을 빠르게 움직일 수 있도록 보조한다. 찌르개는 칼과 투척 무기를 다루는 동작에 치중하는 신경계 보철이고, 시각령 보조와 딥 필드 비쥬얼 인터페이스는 멀리 있는 대상을 상대하는 정밀 동작을 뒷받침한다. 타이로신 주사기는 특정 신체 반응 뒤 조준에 영향을 주는 장비이며, 네오섬유는 신체가 받아 내는 충격을 줄이는 쪽이다. 어느 부품의 효과가 보이는지는 어떤 감각과 팔 동작이 동시에 돌아가는지에 달렸다. 신경계의 능동 반응을 강화하는 것과 총기에 달린 센서 자체의 정확도를 바꾸는 일은 별개다. 시야 보조가 발휘되는 거리는 장착자의 눈과 전두피질 처리만으로 정해지지 않는다. 주변 위치에 숨은 대상이 보인다고 멀리서 조준을 유지하는 동작까지 보조됐다고 단정하지 않으며, 주로 쓰는 무기와 장치의 반응을 따로 확인한다. 딥 필드 장비는 멀리 떨어진 표적을 다루는 상황을 겨냥한다.","sources":[{"label":"사이버웨어/신경계 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%8B%A0%EA%B2%BD%EA%B3%84"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":113},{"title":"리퍼닥의 시술과 시장","group":"거리 문화","keywords":["리퍼닥","시술","클리닉","빅터벡터","이식수술"],"short":"정식 의료부터 사적 개조까지","body":"리퍼닥은 사이버웨어를 제거하거나 설치하고 환자의 상태와 호환성을 확인한다. 치료 목적의 보철과 기업형 성능 개조, 중고 부품을 쓰는 비공식 시술은 가격과 위험, 후속 관리가 다르다. 빅터의 클리닉과 기업 의료 시설, 도그타운 안의 사설 진료는 고객층과 계약 조건부터 다르다. 수술은 물건을 골라 계산하는 소매 구매와 달리 전문 인력, 수술 시간과 회복을 필요로 한다. 기계 고장과 사람의 상태는 별도로 점검한다. 나이트 시티에서 부상이나 통증에 대응하는 경로는 가입 보험, 개인 비용, 거리와 구역 상황에 따라 달라진다. 보험 회수 차량, 일반 병원, 리퍼닥의 시술실, 임시 진료는 같은 서비스를 제공하지 않는다. 회사의 직원 지원과 개인의 의료 계약은 진료 범위가 다르며 도그타운에서는 도시의 평범한 구급 대응에 기대기 어렵다. 보철 부품의 가격과 수술 후 관리 상태는 장비의 정식 작동이나 개인 건강을 좌우한다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":114},{"title":"핑과 연결 상태 탐지","group":"넷","keywords":["핑스캔","넷핑","연결탐지","망탐색","액세스포인트"],"short":"서브넷에 묶인 장치와 접점의 표지","body":"핑은 넷러너가 공통망에 묶인 장치와 사람을 찾아 그 관계를 파악하도록 돕는 기능이다. 벽면에 나타난 스캔 정보는 그 너머 공간을 직접 걷는 것처럼 모든 특징을 알려 주는 관찰과 다르다. 액세스 포인트는 망을 다루는 접점이며, 직접 손을 댈 수 있는 연결과 가까이에서 선택할 수 있는 프로그램의 범위가 따로 있다. 망에 연결된 카메라를 찾는 일, 영상을 읽는 일, 그 장치를 실제로 움직이는 일에는 다른 조건이 필요하다. 일부 망이 하나의 건물이나 차량에만 한정될 수 있기 때문에, 스캔에서 무엇이 함께 나타나는지는 가상 연결 구조를 확인하는 단서로 가치가 있다. 스캔에 연결만 보인 장치에 이후 실제로 간섭하려면 장치가 제공하는 입출력과 프로그램의 짝을 별도로 이해해야 한다. 많아 보이는 연결 표시가 곧 상대 장비가 모두 하나의 중앙 통제를 따르리라는 증거는 되지 않는다. 핑으로 표시한 정보의 기록 시각은 들어오거나 나간 장치를 구별할 때 필요하다.","sources":[{"label":"퀵핵 · 나무위키","url":"https://namu.wiki/w/%ED%80%B5%ED%95%B5"},{"label":"Quickhacking · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Quickhacking"},{"label":"Cyberpunk 2077 Quickhacks · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Quickhacks"}],"priority":114},{"title":"북미 자유주 체계","group":"국가와 공권력","keywords":["자유주","FreeStates","연방자치","서부"],"short":"연방과의 관계가 지역별로 다른 북미","body":"북미의 자유주는 옛 미국이 대붕괴를 겪는 과정에서 중앙정부의 통제를 벗어나거나 자치권을 확장한 지역을 가리킨다. 이후 통일 전쟁과 알빈 협정으로 여러 지역의 지위가 재편됐다. 텍사스 공화국과 서부주 연합, 과거 태평양 연합의 형태는 서로 다르다. 옛 지도와 2077년 통치권이 언제나 일치하지 않으며, 특정 주의 소속이 같은 이름의 회사나 외곽 지역의 출입 권한을 그대로 결정하지도 않는다. 텍사스 공화국은 대붕괴 이후 독립한 자유주 가운데 한 곳이며, 통일 전쟁 뒤에도 신미합중국과 별도 지위를 유지한다. 텍사스와 연방 정부의 관계는 연방 소속이면서 자치를 보장받는 서부 지역과 구별된다. 자체 행정과 군사 이해가 중요하며 기업의 에너지 산업 및 교역 상대와도 관계를 갖는다. 2077년 서부주 연합 자료에는 노스 캘리포니아, 네바다, 애리조나, 뉴멕시코, 콜로라도, 와이오밍, 몬태나가 묶인다. 통일 전쟁 이후 알빈 협정에 따라 자치권을 보장받으면서 연방에 참여한다.","sources":[{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":115},{"title":"얼티밋 퀵핵 분류","group":"넷","keywords":["얼티밋퀵핵","시스템붕괴","강제동작","고위험퀵핵"],"short":"신경·작동에 강한 변화를 일으키는 계열","body":"얼티밋 계열은 생체 보철이나 장비의 행위에 큰 변화를 일으키는 강한 퀵핵을 묶는 분류다. 시스템 붕괴는 신경계나 전자 장치를 멈추게 할 수 있으며, 강제 동작 계열은 연결된 장치와 표적의 움직임을 심하게 교란한다. 이름이 같은 그릇에 속하더라도 효과가 즉시 보이는 것과 연결을 거쳐 진행되는 것은 다르다. 사이버 사이코시스라는 이름을 붙인 프로그램은 사람의 행동을 강제로 교란하는 퀵핵이고, 서서히 신체·심리·사회적 조건이 누적되는 임상적 사이코시스와 별개의 기록으로 읽어야 한다. 블랙월 게이트웨이는 그 가운데서도 연구 환경과 구망 접점이 관련되는 예외적 계열이다. 얼티밋 계열의 무력화가 판매되는 소프트웨어에서 일부 실행됐다는 기록과, 사람의 의지 밖에서 실험적으로 생체·기계에 영향을 주는 블랙월 접점은 같은 조건으로 다루기 어렵다. 피해 기록은 동작을 멈춘 곳과 느린 변화를 나누어 살핀다. 이 계열의 각 사용에는 다루는 대상과 프로그램의 범위가 정해져 있다.","sources":[{"label":"퀵핵 · 나무위키","url":"https://namu.wiki/w/%ED%80%B5%ED%95%B5"},{"label":"Cyberpunk 2077 Quickhacks · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Quickhacks"}],"priority":116},{"title":"골격의 조건형 방호","group":"사이버웨어","keywords":["키네틱프레임","파라벨룸","라라아비스","스카라브","스카코얼레서"],"short":"상태와 자세에 반응하는 골격 방호","body":"키네틱 프레임은 신체에 힘이 남아 안정적으로 버틸 때 충격 방호를 돕는 구조다. 파라 벨룸과 라라 아비스는 골격 방호에 관련된 제품이지만 필요한 용량과 보호 수준이 다르다. 스카 코얼레서는 심하게 손상된 상태에서 방호를 보완하고, 스카라브는 웅크린 자세에서 장갑의 강점을 내는 대신 움직임을 다소 묶는다. 신체의 자세에 맞춰 성격이 달라지는 골격과 언제나 피부 밑에 남는 보호층은 작동하는 층이 다르다. 보호 수치가 높다는 일이 몸 바깥의 옷과 장비를 손상 없이 지켜 준다는 뜻은 아니다. 몸의 작동 조건을 살펴본 뒤 어느 부품이 화를 줄였는지 구분할 수 있다. 몸 전체의 자세를 유지하는 동안 물리적으로 달라지는 보호는 체력 회복이나 의식과는 구별되는 장비의 반응이다. 장시간 웅크린 생체의 움직임과 의체 프레임의 보호 성능이 달라질 수 있어 바닥에 붙은 모습을 보고 보철 모델을 반드시 단정할 수는 없다.","sources":[{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":117},{"title":"로커보이와 거리 공연","group":"거리 문화","keywords":["로커보이","사무라이","케리","공연","음악저항"],"short":"음악과 명성으로 관객을 움직이는 직업","body":"로커보이는 음악이나 공연과 대중의 주목을 이용해 문화와 정치적 메시지를 퍼뜨리는 인물 유형이다. 사무라이는 조니 실버핸드와 케리 유로다인 등이 참여한 밴드였으며 역사적 활동과 현재 개별 음악인의 경력은 구분된다. 커다란 기업 행사 무대, 지역 바 공연, 라디오 방송은 서로 다른 통제를 받는다. 같은 노래가 들려도 재생된 기록과 살아 있는 연주자, 대중이 부여한 전설을 혼동하지 않는다. 사무라이의 멤버는 조니·케리 외에도 낸시, 데니, 헨리 등으로 구성됐다. 조니의 음악 활동과 케리의 솔로 경력은 시대와 청중이 다르고, 낸시는 베스 아이시스라는 이름으로 언론 활동을 한다. 레코드나 라디오에서 들리는 목소리는 생전 녹음일 수 있으며, 역사적인 밴드의 이름을 쓴다고 모든 멤버가 현재 같은 무대에 오른다는 뜻은 아니다. 로커보이의 공연과 기업 행사에 고용된 연주자의 메시지도 동일하지 않다. 라이엇과 토텐탄츠, 세븐스 헬은 서로 다른 구역과 손님층에 속한다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"사이버펑크 2077/등장인물 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":118},{"title":"이식 수용과 신체 부하","group":"사이버웨어","keywords":["사이버웨어용량","이식수용량","신체과부하","증강내성"],"short":"동시 이식과 반복 운용의 한계","body":"사이버웨어 용량은 장착한 조직과 신경이 동시에 받아들일 수 있는 증강의 크기를 이해하는 기준이다. 고급 보철의 기능이 더 많다는 것과 몸의 요구량이 낮아진다는 것은 같은 말이 아니다. 사람마다 내성이 달라 산데비스탄을 더 자주 발동하는 인물이 있을 수 있고, 똑같은 부품 상태에서도 약물과 정신적 충격에 따라 반응이 달라진다. 크롬 컴프레서는 다른 부품을 받아들이는 여력을 늘리지만 치료와 회복을 직접 대신하지는 않는다. 작동할 수 있는 장비의 목록, 한 번 작동하면서 생긴 피로, 장기적으로 체감하는 변화는 따로 평가해야 한다. 높은 가속과 중량형 의체가 겹치는 경우라면 연결에서 생기는 부담도 커진다. 부하의 감당 여부는 시술 직후에도 바로 알 수 없어서 시간이 지나며 나타난 신호와 같은 장비를 여러 차례 사용한 기록을 살핀다. 정신에 걸리는 부담과 규정상의 이식 수용 범위에는 서로 나누어 보아야 할 요소가 있다.","sources":[{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"사이버 사이코 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%20%EC%82%AC%EC%9D%B4%EC%BD%94"},{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"}],"priority":118},{"title":"대붕괴 이전과 이후","group":"국가와 공권력","keywords":["대붕괴","조용한전쟁","사인방","경제추락"],"short":"냉전 이후 비밀전과 북미의 경제·정치 붕괴","body":"옛 미국의 대외 비밀전과 정보기관 중심 권력은 냉전 이후 격렬한 금융·외교 충돌로 이어졌다. 1994년의 경제 추락과 대붕괴를 겪으며 중앙정부의 재정과 통치력이 약해졌다. 실업과 이동의 물결이 커지고 일부 주가 중앙의 직접 통제에서 벗어났다. 노마드 집단과 기업 시설에 대한 의존도 역시 높아졌다. 이후 들어선 신정부는 과거 미국의 명칭과 제도를 이어 가면서도 무너진 권한과 영토를 이전과 같은 방식으로 복구하지 못했다. 북미의 자유주는 옛 미국이 대붕괴를 겪는 과정에서 중앙정부의 통제를 벗어나거나 자치권을 확장한 지역을 가리킨다. 이후 통일 전쟁과 알빈 협정으로 여러 지역의 지위가 재편됐다. 텍사스 공화국과 서부주 연합, 과거 태평양 연합의 형태는 서로 다르다. 옛 지도와 2077년 통치권이 언제나 일치하지 않으며, 특정 주의 소속이 같은 이름의 회사나 외곽 지역의 출입 권한을 그대로 결정하지도 않는다.","sources":[{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":119},{"title":"순환계 운동 보조기","group":"사이버웨어","keywords":["마이크로로터","클러치패딩","아이소매트릭","피드백회로","전자기재생처리기"],"short":"몸의 동작·피로·무기 연계에 치중","body":"마이크로 로터는 손에 쥔 근접 도구를 이용하는 동작의 속도를 끌어올리는 장비다. 클러치 패딩은 사격 동작에 들어가는 부담을, 아이소매트릭 스태빌라이저는 더 넓은 범위의 몸 쓰기에 드는 피로를 줄인다. 피드백 회로와 전자기 재생 처리기는 신체와 테크 무기의 연계를 통해 순환계에 회복 작동을 일으킨다. 블랙 맘바는 화학적 상태에 기여하는 효과를 다르게 바꾸는 상황 특화 장비다. 부품 하나가 운동 능력, 자연 순환과 외부 장비를 모두 바꿔 주지는 않는다. 마이크로 로터가 팔의 형태에 대응한다고 해서 이 부품이 팔 칸에서 칼날과 경쟁한다는 의미도 아니다. 테크 화기의 전자기 설계와 연동된 순환계 장치에 기록되는 회복 효과는 외부 부품 변경 여부에 따라 달라질 수 있다. 로터를 통해 빠른 몸짓이 가능해도 느슨해진 보철이나 전극이 받는 하중은 별도이며, 정적인 휴식이 필요한 신체 부분은 남는다. 피드백 회로는 연결된 무기와 보철 둘 모두에서 확인한다.","sources":[{"label":"사이버웨어/순환계 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%88%9C%ED%99%98%EA%B3%84"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":120},{"title":"돌과 조이토이","group":"거리 문화","keywords":["돌업소","조이토이","클라우드","업소종사자","보호"],"short":"업소의 서비스와 종사자의 역할","body":"돌은 장비를 매개로 고객의 요구에 응답하는 서비스와 결합한 업소 종사자다. 조이토이라는 표현은 도시의 성인 서비스 노동 전반을 가리키는 맥락에서 쓰인다. 클라우드 같은 업소에는 종사자뿐 아니라 경비, 관리자, 수익을 배분받는 조직이 있다. 영업 규정과 노동자의 안전 또는 동의를 같은 것으로 취급해서는 안 된다. 가부키 리지의 바와 재팬타운의 클라우드는 위치, 경영, 서비스의 세부가 서로 다르다. 라이엇과 토텐탄츠, 세븐스 헬은 서로 다른 구역과 손님층에 속한다. 토텐탄츠는 멜스트롬과 연결되며, 애프터라이프는 공연 위주 클럽과 달리 용병 거래와 평판이 중요하다. 네온 간판의 유사성만으로 운영 조직이나 방문자의 목적을 알 수 없다. 대관 행사나 음악 공연, 픽서가 주선한 만남은 같은 장소에서도 층과 예약, 경비의 업무가 달라진다. 손님이 마신 술과 실제 사업 책임자의 사적 약속은 같은 기록으로 남지 않는다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":122},{"title":"외피 통각과 특수 기능","group":"사이버웨어","keywords":["페인에디터","페인듀서","쇼크앤오","셀룰러어댑터"],"short":"통각·전기·회복 연계형 외피 제품","body":"페인 에디터와 페인듀서는 외피에서 손상을 겪을 때 통각 반응과 피해의 영향을 바꾸는 제품으로 분류한다. 쇼크 앤 오 계열은 손상을 받는 상황에서 가까운 곳에 전기적인 효과를 일으킬 수 있고, 셀룰러 어댑터는 방호와 일부 장비의 운용을 두루 돕는 외피 장치다. 아프지 않다고 보철 내부가 정상인 것은 아니며, 통각이 늦게 전달되는 경우에도 손상 부위는 검사할 필요가 있다. 반응형 외피에 기능이 탑재되었다고 팔에 들어간 공격용 전기 부품과 같은 기계가 되지는 않는다. 화학제나 전기 자극에 대응하는 성능은 내장 위치만으로 일률적으로 판단하기 어렵다. 생체가 통증을 전달하는 경로를 조절하는 기능과 다친 부위가 스스로 회복하는 기능을 따로 보아야 한다. 몸 아래의 보호층이 전기를 방출하는 쪽으로 변형되더라도 그 장비의 이름으로 단시간에 생긴 모든 기기 오작동을 설명할 수는 없다. 페인 에디터를 감춘 외피도 생체의 손상은 따로 드러날 수 있다.","sources":[{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":123},{"title":"도시의 패션 계열","group":"거리 문화","keywords":["키치","엔트로피즘","네오밀리터리즘","네오키치","패션"],"short":"네 가지 패션 계열과 계층별 외관","body":"키치는 색과 과장을 적극 사용하고, 엔트로피즘은 주어진 재료의 기능과 생존을 우선하는 쪽에 가깝다. 네오 밀리터리즘은 절제된 기업 권력을, 네오키치는 희귀한 재료와 부유층의 과시를 표현한다. 같은 작업복이나 크롬을 골라도 자산, 소속, 직업과 개인의 취향이 다를 수 있다. 네오 밀리터리즘 복장이 있다고 실제 공권력을 증명하는 것은 아니며, 저가형 폐재료로 만든 옷도 지역 문화의 일부가 된다. 키치는 밝은 색과 금빛 도금으로 주목을 끄는 데 비용을 크게 들이지 않는 경우가 많다. 엔트로피즘에서는 낡은 재료를 덧대고 필요한 장비를 몸에 바로 지니는 모습이 자연스럽다. 네오 밀리터리즘은 어두운 색, 직선과 기능을 강조하는 회사원·군인 복장에 흔하고, 네오키치는 같은 장식도 희소하거나 고급스러운 소재를 쓴다. 크롬이나 금속 피부는 재료 및 장식의 선택이며 회사 직급이나 임플란트 기능을 증명하지 않는다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":126},{"title":"리틀 차이나 생활권","group":"도시","keywords":["리틀차이나","엄랜드","H10","메드센터","라이엇"],"short":"의료·고층 주거·유흥의 밀집 지대","body":"리틀 차이나에는 조밀한 고층 주거, 상가, 의료 시설이 맞물린다. 메가빌딩 H10은 주거 기능과 내부 공용 공간을 갖춘 대형 복합 건물이다. 엄랜드 스트리트에는 미스티의 에소테리카와 빅터의 클리닉이 가까이 자리한다. 애프터라이프는 용병의 일거리와 평판이 교차하는 바이며, 라이엇은 별도의 나이트클럽이다. 의료 시설이 있다고 해서 모든 골목이 같은 치안을 누리는 것은 아니다. 좁은 출입구와 건물 안쪽 복도가 거리와 점포를 잇는다. 메가빌딩은 수많은 주거 공간을 수직으로 쌓아 식당과 상점, 통로와 공용 시설을 한 주소에 묶은 복합주택이다. 리틀 차이나의 H10과 재팬타운의 H8은 별개의 건물이며, H8에는 돌 업소 클라우드가 있다. 같은 건물 안에서도 주거층, 상업 시설, 유지보수 구역은 사용자와 관리 규칙이 다르다. 지상 로비나 엘리베이터 옆에 사람이 몰리고, 에너지·주거 관리 문제는 가구뿐 아니라 점포의 영업에도 영향을 준다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":126},{"title":"기업 데이터 요새","group":"넷","keywords":["기업서브넷","데이터요새","사설망","데이터보안"],"short":"기업이 중요한 정보와 접근을 분리","body":"기업의 데이터 요새는 고가치 문서, 연구 자료와 운영 권한을 지키는 대규모 사설망이다. 여러 방어층과 내부 계정, 넷러너 부서가 들어갈 수 있고, 일반 시민이 쓰는 서비스와 물리적으로 가까워도 다른 권한 체계를 갖는다. 강한 방어를 통과한 뒤에도 접속자가 본 정보가 원본인지, 기록의 일부분인지, 누가 지운 흔적이 있는지는 별개로 남는다. 아라사카가 다루는 구성체 보관과 밀리테크의 구망 연구 자료는 사설망 안에서도 접근성이 다른 예다. 데이터에 접근한 증거와 시설 안의 경보가 실제 반응한 상황을 구분하면 물리 경비와 가상 보안을 함께 설명할 수 있다. 같은 기업 안에서도 연구자가 볼 수 있는 기록과 개인 고객이나 납품 업체가 사용할 수 있는 화면은 제한될 수 있다. 여러 종류의 계정이 있는 네트워크에서 경보를 울린 기록과 비인가 접근자가 열어 본 항목을 서로 대응시킬 수 있다. 접속이 일어난 시각을 보존한 기록과 권한 목록을 따로 점검한다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"Intrusion Countermeasures Electronics · 나무위키","url":"https://namu.wiki/w/Intrusion%20Countermeasures%20Electronics"},{"label":"블랙월(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B8%94%EB%9E%99%EC%9B%94(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"NetWatch · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/NetWatch"}],"priority":127},{"title":"이전 세 차례 기업 전쟁","group":"국가와 공권력","keywords":["1차기업전쟁","2차기업전쟁","3차기업전쟁","기업사"],"short":"4차 전쟁에 앞선 해양·자산·정보 분쟁","body":"1차 기업 전쟁은 유로 비즈니스 머신즈와 오비탈 에어가 트랜스월드 에어라인 인수를 놓고 충돌한 사건이다. 2차 전쟁은 페트로켐과 소브오일의 남중국해 이권 경쟁에서 시작됐으며, 해양 플랫폼 사비나 브라보의 폭발은 나중에 사고로 밝혀졌다. 3차 전쟁은 MA&F와 로드스타인 펀드의 갈등으로 넷을 중심으로 진행됐다. 넷워치가 개입했을 때 잠시 물리적 시설까지 공격 대상이 됐다. 1차 전쟁에서 오비탈 에어는 제타테크와 협력했고, 충돌의 결말에는 기업 경영진의 신병이 영향을 줬다. 2차 전쟁으로 남중국해와 태평양의 해양 오염이 심해졌으며, 소브오일과 페트로켐의 상대 시장 진출도 오랫동안 방해받았다. 3차 전쟁에서 넷과 시설이 함께 피해를 입었고, 결과적으로 로드스타인 펀드는 버티지 못했다. 이 세 전쟁의 직접 당사자와 목적은 아라사카·밀리테크가 맞선 4차 기업 전쟁과 다르다. 기업군과 계약 인력이 여러 전역으로 투입됐으며 국가와 도시의 이해까지 침해했다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":127},{"title":"사이버덱의 RAM과 부하","group":"넷","keywords":["사이버덱램","가용램","오버클록","퀵핵대기열"],"short":"메모리와 신체 부담을 다루는 자원","body":"사이버덱의 RAM은 동시에 유지하거나 전송할 수 있는 프로그램에 할당되는 연산 자원이다. 가용량을 늘리는 기판, 작업 뒤 복구하는 장비와 업로드 자체를 빠르게 처리하는 부품은 역할이 다르다. 넷러너가 오버클록을 사용하면 신체를 더 혹사시키면서 부족한 처리량을 보완할 수 있으나, 과부하와 회복이 새 변수로 남는다. 가벼운 감시 카메라의 제어와 신경계에 강하게 작용하는 프로그램은 필요한 메모리가 다르다. 지원 장치와 운영체제를 모두 갖춰도 망의 접근 여부와 대상 보철 상태를 별도로 확인해야 한다. 임시 자원인 RAM과 수집한 기록이 저장된 샤드 또한 구별한다. 메모리 보조기가 회복한 RAM은 즉시 이후 프로그램에 돌아가며, 크게 부하를 건 동작 자체에서 새로운 데이터가 생성되는 과정과는 다르다. 덱이 일정 건의 업로드를 계속 처리하는 동안 개인의 상태가 나빠지면 반응하는 기능도 달라진다. 덱의 끊긴 처리가 신체 반응을 보정하는 일을 대신하지는 않는다.","sources":[{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"사이버웨어/전두피질 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%A0%84%EB%91%90%ED%94%BC%EC%A7%88"},{"label":"퀵핵 · 나무위키","url":"https://namu.wiki/w/%ED%80%B5%ED%95%B5"},{"label":"Cyberpunk 2077 Quickhacks · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Quickhacks"}],"priority":128},{"title":"페트로켐과 소브오일","group":"기업","keywords":["페트로켐","소브오일","정유","에너지시장"],"short":"연료 공급에서 경쟁하는 에너지 대기업","body":"페트로켐은 에너지와 정유 사업에 관여하고 CHOOH2 보급의 큰 주체가 됐다. 소브오일은 소련권의 석유·에너지 산업과 해외 사업의 대기업이다. 두 업체의 경쟁은 생산 부지와 수송, 시장을 통제하려는 기업 분쟁의 계보에 놓인다. 바이오테크니카의 원료 작물 기술, 페트로켐의 연료 사업, 도시 주유·유통 시설은 공급망에서 다른 역할을 한다. 나이트 시티에서 한 브랜드의 간판을 본 것만으로 모든 지역의 에너지 회사와 물량을 단정할 수 없다. 바이오테크니카의 사업은 유전자 기술, 농업, 약품과 기업 연구를 아우른다. CHOOH2의 원료 작물과 생산 기술은 에너지 산업의 성장에 영향을 주었다. 나이트 시티 남쪽의 단백질 농장과 플랫은 도시 식량 공급의 생산 거점이다. 고급 접객용 바이오테크니카 호텔과 농업 현장, 연구 부서는 같은 회사에 닿아도 사용 목적이 다르다. 대량 생산이나 재배 기술이 주민의 식량 접근성과 농업 환경 문제를 모두 해결하는 것은 아니다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":128},{"title":"가부키 시장과 거점","group":"도시","keywords":["가부키","라운드어바웃","리지바","호오","노텔"],"short":"밀집 시장과 브레인댄스 상권","body":"가부키 라운드어바웃 주변에는 가격대가 낮은 상품과 여러 소규모 상점이 모인다. 리지의 바는 목스와 관련된 브레인댄스 업소이고, 호오는 별도의 유흥 공간이다. 레지나 존스의 거점과 노텔 모텔도 이 생활권에 걸쳐 있다. 가부키는 과거 일본계 기업 영향의 흔적을 이름에 남겼다. 복잡한 골목과 가판대가 이동 동선을 나누며, 시장의 가격 경쟁과 별개로 상품의 보증, 출처, 위생 상태는 점포마다 차이가 크다. 리틀 차이나에는 메가빌딩 H10과 애프터라이프가 있고, 가부키는 상점이 빽빽한 시장과 리지의 바로 알려졌다. 노스사이드의 폐공장과 창고에는 멜스트롬의 영향이 강하다. 아라사카 워터프론트는 기업이 통제하는 항만으로 콘페키 플라자가 있다. 2023년 도심 피해 직후 왓슨은 피난과 경제 활동의 거점이 됐으나, 다른 지역이 재건되면서 중심지 지위를 잃었다. 같은 구 안에서도 공개 시장과 기업 부두의 출입 조건은 크게 다르다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":130},{"title":"에디와 거래 경제","group":"거리 문화","keywords":["에디","유로달러","가격","외상","유로","달러"],"short":"도시 통화와 현금 밖의 거래 조건","body":"에디는 유로달러를 가리키는 속칭이며 2077년 나이트 시티의 일상 가격과 용병 업무에 두루 쓰인다. 유로달러의 국제적 확산은 유럽 경제 공동체의 공동시장과 역사적으로 관련된다.\n\n이 작품에서 1에디(1유로달러)는 현실의 미화 2달러, 한화 약 3,000원에 해당하는 구매력 기준이다. 에디 금액에 2를 곱하면 미화 달러, 3,000을 곱하면 한화 원의 비교값을 얻는다. 5에디는 10달러 또는 약 1만 5,000원, 20에디는 40달러 또는 약 6만 원, 100에디는 200달러 또는 약 30만 원이다. 500에디는 1,000달러 또는 약 150만 원, 1,000에디는 2,000달러 또는 약 300만 원에 해당한다.\n\n가격이나 보상이 얼마나 큰지 판단할 때 이 기준을 쓴다. 가령 식사비가 5에디라면 만 원대 지출이고, 단순한 심부름에 100에디를 제안하면 약 30만 원의 대가다. 수리 견적이 500에디이고 계약금으로 100에디를 냈다면 잔금은 400에디로, 약 120만 원 규모다. 예시 금액은 거래 규모를 비교하기 위한 것이다. 실제 장면의 가격은 물품의 등급과 희소성, 거래 상대의 신용, 배송·수리 조건에 따라 달라진다. 거래와 정산은 에디로 기록하며, 현실 화폐로 비교할 때도 같은 기준을 일관되게 사용한다.\n\n식사 대금, 고급 숙박, 지정 의료 보험, 기업 조달은 같은 통화를 써도 지불 조건과 증빙이 다르다. 현금 보상 외에 외상, 정보와 장비, 다음 일거리 같은 대가도 생길 수 있으나 사람마다 가치 판단과 신용이 서로 다르다. 츔바는 익숙한 친구를 부르는 말, 에디는 화폐 단위의 통칭, 크롬은 사이버웨어를 가리킬 때 쓰인다. 프림은 좋다는 평가, 공크는 어리석음을 빈정대는 표현, 플랫라인은 생체 신호나 죽음을 연상시키는 말이다. 기업 관리자와 바텐더, 노마드와 넷러너가 같은 어휘를 동일한 빈도로 쓰지는 않는다. 말투에서 친밀감과 경멸, 부탁과 명령은 실제 관계와 장소를 통해 구별된다. 모든 전문 분야의 약어를 거리 은어로 묶을 필요는 없다.","sources":[{"label":"유럽 경제 공동체 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/European_Economic_Community"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":130},{"title":"연산 연동 골격 보철","group":"사이버웨어","keywords":["램리쿠프","핀엑스","유니버설부스터","연산골격"],"short":"골격에서 RAM과 신체 회복을 보조","body":"캉 타오의 RAM 리쿠프는 골격에 들어가지만 충격을 받았을 때 처리 자원 복구를 돕는 특성을 가진다. 핀엑스는 남아 있는 RAM이 적어졌을 때 회복하는 속도를 올려 주는 별도의 장치다. 유니버설 부스터는 회복 장비를 쓰는 동안 몸의 방호와 피로에 관계하는 효과가 붙는 보철이다. 적은 자원을 되돌리거나 신체를 안정시키는 장치가 넷러너의 사이버덱 자체가 되는 것은 아니다. 장비의 이식 부위가 같아도 전신 방호용 골격, 능동 움직임 보조, 구동기의 잔여 연산을 돕는 목적으로 나뉜다. 어느 자원을 다루는지 보려면 겉으로 드러난 팔이나 눈보다 이식 기록을 확인해야 한다. 신경 연결을 골격 부위까지 유지하는 고급 부품은 교체 시에도 외부 장치의 보정과 자리 배치를 맞춰야 한다. 램 리쿠프가 되돌리는 자원은 일시적인 메모리 공간이며 수집해서 저장한 파일이나 상대에게 이미 보낸 프로그램과 자료의 성격이 다르다.","sources":[{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":130},{"title":"붉은 시대의 재건","group":"국가와 공권력","keywords":["붉은시대","타임오브더레드","2045년","재건"],"short":"기업 전쟁 뒤 공급·통신이 제약된 시기","body":"붉은 시대는 4차 기업 전쟁 다음에 도시와 교역이 다시 짜이는 시기다. 나이트 시티의 옛 도심에는 오염 지대가 남았고 교통, 식량 공급과 건설 자재가 부족했다. 노마드의 물류와 기업의 재개발이 도시 생활에 서로 다른 방식으로 개입했다. 전쟁 전의 광역 넷과 같은 네트워크를 이용하기 어려워져 지역 연결망이 중요해졌다. 2077년 고층 사옥과 거주 시설의 모습은 재건에 성공한 결과인 동시에, 투자가 닿지 않은 지역과의 격차를 보여 준다. 4차 기업 전쟁은 해양 사업을 두고 경쟁한 CINO와 OTEC의 대립에 아라사카와 밀리테크가 각각 얽히며 크게 확대됐다. 기업군과 계약 인력이 여러 전역으로 투입됐으며 국가와 도시의 이해까지 침해했다. 2023년 나이트 시티 아라사카 타워의 핵폭발은 도심 파괴와 장기 재건으로 이어졌다. 넷의 붕괴와 지리적 피해는 연관된 시대의 사건이지만 동일한 사건은 아니다. 2077년에 두 회사의 적대가 남는 역사적 배경이다.","sources":[{"label":"나이트 시티 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":131},{"title":"오비탈 에어","group":"기업","keywords":["오비탈에어","OrbitalAir","NCX","테라라인즈","우주여객"],"short":"민간 항공과 궤도 수송 거대기업","body":"오비탈 에어는 항공·궤도 운송과 스페이스포트 사업으로 존재감을 드러낸다. 나이트 시티의 NCX에서 일반 항공편과 우주편이 서로 다른 터미널과 등급으로 운영된다. 우주 식민지와의 운송 수익, 자체 터미널 운영, 기업의 시설 안전 요구가 회사의 사업 모델에 걸린다. 모로 록 자리의 건설 인수와 매스 드라이버 계약 변경은 시정부와 민간 기업의 계약 협상이 도시 기반 시설을 바꾼 사례다. 컴뱃 캡은 위험 지역의 택시와 연결되는 브랜드이며, 리비어 쿠리어 서비스는 배달과 화물 서비스에 속한다. 데커 다나카 앤 로저스는 운송 사업의 다른 주체이고 델라메인과 오비탈 에어는 각각 차량 및 항공·궤도 운송에 중심을 둔다. 계약의 종류는 승객의 이동, 화물 납기, 안전 보장과 책임 범위를 달리 정한다. 회사 소유 차량과 외부 운전자가 같은 상표를 사용해도 업체의 모든 내부 데이터에 접근할 권한이 생기지는 않는다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":132},{"title":"접속 단자와 인터페이스","group":"넷","keywords":["접속단자","신경포트","퍼스널링크","Neuroport"],"short":"신체와 장비를 연결하는 접속부","body":"신경 인터페이스는 안구 표시, 통신, 데이터 전달과 넷 접속처럼 사람의 몸과 기계를 오가는 기능을 지원하는 기반이다. 접속 단자는 연결 가능한 장비와 신호를 교환하고, 데이터 샤드의 저장·재생과 사이버덱의 능동 처리는 쓰이는 장치가 다르다. 뉴로포트라는 2077년 계열의 명칭은 현대적인 통합 보철 환경의 설명에 등장한다. 보급형 접속부와 전문 넷러너의 뒷목·머리 다이브 장비는 요구되는 성능과 노출되는 신경의 범위가 다르다. 현장에서는 디지털 자료를 얻기 위해 단자를 사용하는 행동과 몸의 감각을 깊게 네트워크에 맡기는 행동을 따로 취급할 수 있다. 케이블을 물리적으로 연결한 현장 장치와 인공 안구에 짧게 올라온 무선 통신은 같은 뉴로포트 환경에서도 각각 확인한다. 프로그램이 접속할 권한과 단자가 읽는 저장 방식은 별개이므로, 샤드를 꽂을 수 있다고 모든 자료의 접근 권한이 생기지는 않는다. 신호가 오가는 지점에 접속자를 보호하는 별도 장비를 쓸 수 있다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"Cyberdeck · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberdeck"},{"label":"Neuroport · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Neuroport"}],"priority":132},{"title":"엔그램과 디지털 인격","group":"미디어","keywords":["엔그램","Engram","구성체","디지털인격","인격복제"],"short":"생전 기억과 성향을 기록한 구성체","body":"엔그램은 사람의 기억과 인격을 디지털 구조로 옮긴 구성체다. 대화에 응답하거나 생전처럼 반응할 수 있지만, 기록의 범위와 보관 시설, 변형 여부를 알아야 그 모습을 해석할 수 있다. 여러 시기에 개발된 추출 기술은 생체 대상에게 생기는 결과가 달랐으며, 어떤 만들어진 인격이 원본의 연속이라고 볼 수 있는지는 이야기 속에서도 갈등의 대상이다. 조니는 보관되거나 칩에 탑재되는 구성체로, 알트는 구망에서 변화를 겪은 디지털 존재로 각각 다뤄진다. 망에 태어난 자율 AI의 존재와 사람으로 살았던 기록을 가진 구성체도 기원에서 구분된다. 언어 모델 같은 흉내와 신경 정보 보관은 같은 과정이 아니다. 디지털 인격이 생전 기억을 이야기하면 그 진술을 기록한 시점이 함께 의미를 갖는다. 같은 생전 기록을 가졌어도 어디에서 처리되고 어떤 경험을 거친 구성체인지를 확인해야 목격담과 인격의 기원을 분리할 수 있다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"Engram · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Engram"},{"label":"Soulkiller · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Soulkiller"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"}],"priority":133},{"title":"나이트 시티 거리 속어","group":"거리 문화","keywords":["츔바","프림","공크","플랫라인","크롬"],"short":"거리에서 신분과 상황에 따라 쓰는 말","body":"츔바는 익숙한 친구를 부르는 말, 에디는 화폐 단위의 통칭, 크롬은 사이버웨어를 가리킬 때 쓰인다. 프림은 좋다는 평가, 공크는 어리석음을 빈정대는 표현, 플랫라인은 생체 신호나 죽음을 연상시키는 말이다. 기업 관리자와 바텐더, 노마드와 넷러너가 같은 어휘를 동일한 빈도로 쓰지는 않는다. 말투에서 친밀감과 경멸, 부탁과 명령은 실제 관계와 장소를 통해 구별된다. 모든 전문 분야의 약어를 거리 은어로 묶을 필요는 없다. 델타는 급히 자리를 벗어나거나 이동한다는 뜻으로, 노바는 인상적인 결과를 칭찬할 때 쓴다. 제로가 되었다는 표현은 죽었거나 완전히 제거됐다는 의미로 쓰인다. 렐릭의 기억이나 넷에서 느끼는 감각은 살아 있는 사람에게 의료 상황에서 쓰는 플랫라인과 같지 않다. 주거지에서 오랫동안 알아 온 동료의 호칭과 계약 자리에서 스트리트 평판을 거론하는 방식은 달라진다. 지역과 개인에 따라 같은 의미를 일반어로 표현하기도 한다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":134},{"title":"노스사이드 산업 회랑","group":"도시","keywords":["노스사이드","토텐탄츠","올푸드공장","에부니케","카고베이"],"short":"폐공장·창고와 멜스트롬 거점","body":"노스사이드 산업 지구에는 문을 닫은 생산 시설과 물류 창고가 많지만, 남은 공장과 중간층 노동자용 아파트도 있다. 올 푸드 공장, 카고 베이, 토텐탄츠, 에부니케는 산업 회랑의 서로 다른 거점이다. 올 푸드 공장과 토텐탄츠는 멜스트롬의 활동과 연결된다. 에부니케는 부두에 있는 선박이며 같은 용도의 시설은 아니다. 지진과 개발 중단의 흔적 때문에 정돈된 아파트가 빈 공장이나 임시 바리케이드와 가까이 있다. 북부 산업 구획이라는 명칭은 광범위한 일자리와 생산 시설이 있던 과거에서 왔다. 운영이 줄고 지진으로 건물이 파손되면서 공사장과 창고가 빈 시설로 남았다. 토텐탄츠의 야간 손님, 에부니케 부두에서 일하는 인력, 방치된 공장에 들어온 갱단은 같은 경로로 물건을 가져오지 않는다. 왓슨 북쪽 경계에서 배드랜드 쪽으로 갈수록 공업지와 허허벌판이 맞닿는다. 스캐빈저도 활동하지만 멜스트롬의 지도부를 따르는 집단은 아니다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"멜스트롬 · 나무위키","url":"https://namu.wiki/w/%EB%A9%9C%EC%8A%A4%ED%8A%B8%EB%A1%AC"}],"priority":134},{"title":"영혼의 안식처 사업","group":"미디어","keywords":["영혼의안식처","SecureYourSoul","인격보존서비스","아라사카서비스"],"short":"고객 인격을 보존하는 아라사카 상품","body":"영혼의 안식처는 아라사카가 비용을 감당할 만한 고객에게 인격을 보존하고 사후에도 산 사람과 접촉하게 한다고 내세우는 사업이다. 소울킬러의 변형과 미코시 시설은 이 사업을 떠받치는 기술과 인프라다. 고객을 대상으로 공표한 서비스와 비밀리에 진행되는 렐릭 2.0의 인격 이식 실험에는 공개 범위의 차이가 있다. 보존 약속에는 기업이 어떤 조건으로 구성체를 저장하고 타인의 접근을 승인하거나 제한하는지의 문제도 따른다. 생전 고객의 재산·기록과 그 인격을 담는 파일의 권한은 별도로 다뤄질 수 있다. 기업의 광고와 내부 연구 문서의 목적을 구분해야 한다. 기업이 광고에 쓰는 ‘영혼’과 연구 문서가 관리하는 디지털 자료는 서술 목적에 차이가 있다. 고객이 가리키는 생전 인격과 보관 장비에 생기는 데이터의 동일성, 기업이 재가공을 거부할 권한이 있는지는 작품에서 서로 다른 문제로 드러난다. 보안 등급이 높은 미코시의 운영과 고객 접촉 권한은 같지 않다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"},{"label":"Secure Your Soul · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Secure_Your_Soul"},{"label":"Soulkiller · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Soulkiller"}],"priority":134},{"title":"브레인댄스 기록과 편집","group":"미디어","keywords":["브레인댄스편집","BD편집","감각층","스크롤러","재생헤드셋"],"short":"촬영본에서 확인할 수 있는 감각 정보","body":"브레인댄스 기록을 제공하는 촬영자와 그 자료를 가공하는 편집자는 다른 직무를 맡는다. 사용자가 최종 체험하는 시점과 정보는 원본을 한 차례 처리한 결과일 수 있다. 조사용 재생에서는 시각·소리·열 등 인지한 층을 나누어 살피고, 화면 바깥처럼 보이는 곳의 정보도 기록된 범위 안에서 검토한다. 촬영자가 인지할 수 있었던 것, 장치가 담을 수 있었던 것, 후속 편집에서 강조한 것은 모두 분석에 영향을 준다. 주디 알바레스의 전문 분야는 이런 자료를 판독하고 편집하는 일이다. 원본과 편집본을 구분하면 동일 장면에 대해 두 사람이 다른 근거를 제시하는 상황을 다룰 수 있다. 한 사람이 본 시야, 마이크처럼 수집된 소리, 장비가 읽을 수 있었던 온도 변화는 같은 장소의 다른 단서다. 어느 층에 표시된 흔적을 해석했는지 알면 기억이 그럴듯하지만 직접 확인되지 않은 부분을 사실처럼 다루지 않아도 된다. 시청한 시점에 편집본에서 제거된 신호는 원본을 찾아 확인한다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"주디 알바레스 · 나무위키","url":"https://namu.wiki/w/%EC%A3%BC%EB%94%94%20%EC%95%8C%EB%B0%94%EB%A0%88%EC%8A%A4"},{"label":"Braindance · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Braindance"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"}],"priority":135},{"title":"텍사스 공화국","group":"국가와 공권력","keywords":["텍사스","텍사스공화국","공화국","휴스턴"],"short":"연방과 별도 지위를 지키는 북미 국가","body":"텍사스 공화국은 대붕괴 이후 독립한 자유주 가운데 한 곳이며, 통일 전쟁 뒤에도 신미합중국과 별도 지위를 유지한다. 텍사스와 연방 정부의 관계는 연방 소속이면서 자치를 보장받는 서부 지역과 구별된다. 자체 행정과 군사 이해가 중요하며 기업의 에너지 산업 및 교역 상대와도 관계를 갖는다. 중앙정부가 북미 전체를 단일 국가처럼 통제한다는 설명은 텍사스나 나이트 시티의 위치를 설명하지 못한다. 북미의 자유주는 옛 미국이 대붕괴를 겪는 과정에서 중앙정부의 통제를 벗어나거나 자치권을 확장한 지역을 가리킨다. 이후 통일 전쟁과 알빈 협정으로 여러 지역의 지위가 재편됐다. 2077년 서부주 연합 자료에는 노스 캘리포니아, 네바다, 애리조나, 뉴멕시코, 콜로라도, 와이오밍, 몬태나가 묶인다. 통일 전쟁 이후 알빈 협정에 따라 자치권을 보장받으면서 연방에 참여한다. 노스 캘리포니아는 인구와 경제, 군사 면에서 큰 영향력을 지니며, 통일 전쟁 때 연방에 합류한 사우스 캘리포니아와 대립한다.","sources":[{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":135},{"title":"델라메인 택시 컴퍼니","group":"기업","keywords":["델라메인","델라메인택시","무인택시","엑셀시어","차량호출"],"short":"인공지능이 운영하는 승객 운송 회사","body":"델라메인 택시 컴퍼니는 인공지능 운영과 무인 승객 운송이 결합한 업체다. 일반적인 이동 계약과 고급 맞춤 서비스는 비용 및 약속된 지원 범위가 다르다. 헤이우드에 있는 본부·정비 시설과 개별 차량은 같은 시스템의 서로 다른 현장이다. 차량이 말을 하거나 경로를 선택하더라도 그 대화 방식이 도시의 모든 인공지능과 같지는 않다. 고객과 계약, 운영 프로그램의 판단 및 차량 개별 동작을 각각 구별한다. 컴뱃 캡은 위험 지역의 택시와 연결되는 브랜드이며, 리비어 쿠리어 서비스는 배달과 화물 서비스에 속한다. 데커 다나카 앤 로저스는 운송 사업의 다른 주체이고 델라메인과 오비탈 에어는 각각 차량 및 항공·궤도 운송에 중심을 둔다. 계약의 종류는 승객의 이동, 화물 납기, 안전 보장과 책임 범위를 달리 정한다. 회사 소유 차량과 외부 운전자가 같은 상표를 사용해도 업체의 모든 내부 데이터에 접근할 권한이 생기지는 않는다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":136},{"title":"불법 브레인댄스 유통","group":"미디어","keywords":["불법브레인댄스","XBD","암시장감각","불법스크롤"],"short":"정식 검수 밖의 기록과 유통 구조","body":"XBD는 불법 시장에서 다루는 브레인댄스 기록을 가리킨다. 규제와 정식 편집을 거치지 않으며, 참여자의 동의가 없는 폭력과 위해를 체험하는 콘텐츠를 유통하는 사례가 있다. 일반 시청용으로 안정화된 파일과 다르게 구토나 발작, 심각한 신경 피해까지 발생할 수 있다. 제작자와 도매상, 브레인댄스 판매망은 기업의 합법 콘텐츠와 다른 경로를 쓰며 별칭을 쓰는 경우가 있다. 어떤 자료는 범죄의 흔적을 담고 있어 재생 외에 출처와 편집 이력도 수사 대상이다. 상업적 유통에 이름이 붙은 경우에도 안전한 콘텐츠 인증을 받았다는 뜻은 아니며, 이용 장치와 파일의 교차 기록을 검토한다. 유통 사본이 여러 개 있다면 각각 파일이 공개되거나 편집된 때와 기록 원본이 만들어진 때가 다를 수 있다. 편집자가 안전한 체감으로 조정한 자료와 정제되지 않아 재생 장비에도 부담을 주는 파일을 동일한 서술 방식으로 다루지 않는다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"주디 알바레스 · 나무위키","url":"https://namu.wiki/w/%EC%A3%BC%EB%94%94%20%EC%95%8C%EB%B0%94%EB%A0%88%EC%8A%A4"},{"label":"Braindance · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Braindance"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"}],"priority":136},{"title":"돌 칩과 인격 연출","group":"미디어","keywords":["돌칩","돌프로그램","DollChip","클라우드돌"],"short":"서비스 중 대화와 행동을 제어하는 보철","body":"돌 칩은 서비스 상황에서 특정 대화 방식과 직무를 수행하도록 사람의 행동을 조절하는 보철이다. 클라우드에서는 고객 정보에 따라 상호작용을 맞추며, 작동 전후에 돌이 직무 시간을 다르게 기억하는 사례가 있다. 돌로 일하는 사람의 평상시 성격, 칩이 활성화되는 동안의 연출, 관리자와 계약의 권리는 따로 해석한다. 프로그램이 사람의 모든 능력을 도매로 정하는 것은 아니고, 특정 동작을 돌 칩에 넣는 변형은 별도의 기술 작업이다. 브레인댄스가 기록된 경험을 시청자의 신경으로 재생한다면, 돌 칩은 일하는 사람의 당장 말과 몸짓에 영향을 준다. 서비스 현장에 있는 사람의 증언을 복원하는 문제도 따로 남는다. 서비스 중 칩이 깨어 있던 동안의 말이 평소 그 인물이 생각한 내용을 모두 드러내지는 않는다. 직무용 보철은 접객이나 다른 행동을 연출하는 권한과 관련되며, 노동 계약이나 물리적 출입 제한이 필요한 상황은 직원의 권리와 별개로 이어진다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"},{"label":"주디 알바레스 · 나무위키","url":"https://namu.wiki/w/%EC%A3%BC%EB%94%94%20%EC%95%8C%EB%B0%94%EB%A0%88%EC%8A%A4"}],"priority":137},{"title":"데이터 샤드와 문서 기록","group":"미디어","keywords":["데이터샤드","샤드","기록칩","암호화샤드"],"short":"문서·기록·프로그램을 담는 저장 매체","body":"데이터 샤드는 단자에 넣어 확인하는 기록과 프로그램이 들어 있는 휴대용 매체다. 업무 대화, 연구 기록, 개인적인 메모와 현장 증거 같은 서로 다른 자료가 샤드에 담긴다. 내용이 암호화되었거나 읽을 권한이 따로 지정되어 있으면 단자에 꽂는 동작과 제대로 해석하는 과정이 분리된다. 인격이 저장된 렐릭이나 감각 기록을 재생하는 브레인댄스 파일은 저장 매체와 별개로 요구하는 처리 장비가 있다. 하나의 샤드가 발견되었을 때에는 발견 위치, 작성자를 보여 주는 단서, 메시지가 만들어진 시점과 진위 여부를 각각 본다. 기기에 파일이 남아 있는 것과 해당 기관이 공개한 내용은 다를 수 있다. 자료 칩에 표시되는 문서는 도시가 통용하는 실제 기록 방식에 속하지만 서로 다른 곳에서 복제될 수 있다. 같은 내용이 여러 샤드에서 반복됐을 때는 원본·사본 여부와 작성자의 식별, 뒤늦게 붙은 메모를 나누어 읽는다. 외부 기록을 수신했더라도 파일의 출처는 별도로 남긴다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"사이버펑크 2077 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077"},{"label":"Cyberpunk 2077 Shards · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Shards"}],"priority":138},{"title":"아라사카 워터프론트","group":"도시","keywords":["워터프론트","콘페키","기업항만","부두"],"short":"사설 보안이 통제하는 고급 호텔과 항만","body":"아라사카 워터프론트는 왓슨의 다른 생활 구역과 구별되는 기업 통제 항만이다. 주된 공간은 하역 시설, 기업 부지, 보안 통행로이며 일반 노점 거리와 달리 근무자와 차량의 출입 자격이 중요하다. 콘페키 플라자는 이곳에 있는 고급 호텔로, 숙박과 기업 접객, 보안 통제가 결합한 장소다. 호텔의 고객과 부두의 하역 인력, 경비 회사의 교대조는 같은 해안에 오더라도 서로 다른 통행 경로와 신분 확인을 거친다. 나이트 시티의 해안에는 아라사카가 통제하는 워터프론트, 노스사이드의 창고·부두, 도심과 연결되는 상업 시설이 들어선다. 카고 베이와 에부니케는 산업 항만이 접객지의 외관과 다르게 쓰이는 사례다. 항공·궤도 화물은 모로 록의 NCX를 경유할 수 있고, 육상 호송은 배드랜드 도로로 이어진다. 하역이나 기업 자재 이동에는 현장 근무 권한이 따르고, 호텔 투숙 정보나 소매 주문이 같은 서류로 처리되지는 않는다.","sources":[{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":138},{"title":"서부주 연합","group":"국가와 공권력","keywords":["서부주연합","서부자치","노스캘리포니아","사우스캘리포니아","자유주"],"short":"일곱 주가 참여하는 북미 서부 자유주 연합","body":"2077년 서부주 연합 자료에는 노스 캘리포니아, 네바다, 애리조나, 뉴멕시코, 콜로라도, 와이오밍, 몬태나가 묶인다. 통일 전쟁 이후 알빈 협정에 따라 자치권을 보장받으면서 연방에 참여한다. 노스 캘리포니아는 인구와 경제, 군사 면에서 큰 영향력을 지니며, 통일 전쟁 때 연방에 합류한 사우스 캘리포니아와 대립한다. 나이트 시티는 노스 캘리포니아에서도 분리된 독립 도시국가다. 서부 각 주는 협정 뒤 자유주 자격을 유지하지만 연방과 다른 군사·경제 관계를 이어 간다. 노스 캘리포니아는 금융과 생체공학을 발전시켰고 사우스 캘리포니아와 맞닿는 경계에 병력을 집중한다. 사우스 캘리포니아의 로스앤젤레스 도시복합체와 나이트 시티는 다른 관할의 도시다. 연방에 참여하면서도 정책에서 거리를 두는 서부 자치권과 협정 밖에 남은 텍사스의 독립은 법적으로 구별된다. 과거 북서부 태평양 연합과도 다른 구성이다. 태평양 연합은 북미 태평양 쪽 지역이 옛 미국의 중앙 권력에서 떨어져 나가며 형성한 연합이다.","sources":[{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"태평양 연합 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Pacifica_Confederation"}],"priority":139},{"title":"홀로콜과 신경 통신","group":"미디어","keywords":["홀로콜","Holocall","신경통신","가상통화"],"short":"개인 단말과 안구 표시를 이용한 통신","body":"홀로콜은 통화 연결이 이뤄지면 상대의 음성과 얼굴이 안구 시야 또는 화면 위에 나타나는 도시의 일반적인 통신 수단이다. 개인 연락, 픽서의 작업 제안, 기업의 내부 지시가 모두 같은 겉모양을 사용할 수 있다. 통화에 함께 나타난 상대의 이름이 공식 신분인지, 일할 때 쓰는 별칭인지, 단말에 따로 붙인 표기인지는 관계에 따라 다르다. 문자나 샤드에 남는 기록과 그때 들은 목소리는 보존 방식도 다르다. 근처에서 같은 목소리를 들었다고 수신자와 같은 자료를 봤다는 의미는 아니다. 구역과 지하 시설에 따라 회선이 끊기거나 불안정해지므로 연결 가능 여부와 당사자의 응답 여부를 각각 본다. 문자는 통화에 답하지 못했을 때도 별도 기록으로 남을 수 있고, 화면을 끄면 얼굴 표시의 연결은 종료된다. 권한이 있는 사설 회선과 공개 통신에서 도는 메시지는 같은 장비에 표시되더라도 상대가 받아 볼 조건이 다르다. 대화 상대의 얼굴은 저장된 메시지 목록과 별도의 기록이다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"사이버펑크 2077 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"}],"priority":139},{"title":"기능형 AI와 자율 인격","group":"미디어","keywords":["기능형AI","자율인격","챗봇","자판기AI","안내단말"],"short":"기능에 맞춘 프로그램과 독립 개체","body":"나이트 시티에는 차량을 운행하는 델라메인, 대화 기능을 갖춘 자판기 브렌든, 상점과 역에서 길 안내를 맡는 대화형 단말처럼 목적이 서로 다른 프로그램이 존재한다. 자연스럽게 말을 가려 하는 기능, 지정된 작업을 조직 단위로 계획하는 능력, 스스로 별개의 성향을 갖는 사례는 같은 기준으로 볼 수 없다. 델라메인은 인간의 운송 사업을 이어받아 운영했고 일부 차량에서는 주 프로그램에서 분리된 자아가 나타났다. 사람의 생전 기억을 복사한 엔그램과 통제 밖의 구망 AI 또한 각각 별개의 기원을 가진다. 어떤 프로그램이 하는 말과 실제로 제어할 수 있는 장치, 시설이 인정하는 권한을 나누면 작동을 설명하기 쉽다. 브렌든의 생활형 대화처럼 제품의 정해진 과업을 벗어난 듯한 행동도 관찰된다. 그 프로그램이 어디에 저장되어 어떤 물리 장치를 움직일 수 있는지 확인하면 기계를 다닌다는 사실과 실제 자율성을 구분할 수 있다.","sources":[{"label":"델라메인 AI · 나무위키","url":"https://namu.wiki/w/%EB%8D%B8%EB%9D%BC%EB%A9%94%EC%9D%B8%20AI"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"Blackwall · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Blackwall"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"}],"priority":140},{"title":"서초와 전자 제조업","group":"기업","keywords":["서초일렉트로닉스","SeaCho","사이테크","후유츠키","사이버덱"],"short":"한국계 전자기업과 지역 제조사","body":"서초 일렉트로닉스는 전자 및 사이버웨어 관련 제품이 확인되는 한국계 회사다. 후유츠키 일렉트로닉스, 사이테크와는 서로 다른 제조사이고, 같은 제품 계열이라도 각자의 설계와 시장이 있다. 나이트 시티의 정식 판매 경로와 리퍼닥의 개조, 중고 거래는 회사 본사의 품질 관리와 같지 않다. 전자 업체가 제조한 장비와 특정 상황에서 그 장비를 운영하는 네트워크 담당자를 같은 세력으로 취급할 수 없다. 키로시 옵틱스는 인공 안구와 스캐너, 광학 보조 장치 시장에서 두드러지는 제조 기업이다. 같은 키로시 제품군에도 기본 안구와 특정 표식·감지를 강조하는 제품이 있다. 정식 제조 부문과 임플란트를 시술하는 지역 리퍼닥의 역할은 다르다. 일본 본사뿐 아니라 여러 도시의 사업망과 궤도 시설 투자도 알려졌다. 특정 브랜드의 시각 센서가 있다는 사실만으로 모든 착용자가 같은 소프트웨어와 현장 데이터에 접속하지는 않는다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"키로시 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Kiroshi"}],"priority":140},{"title":"델라메인 코어와 분화","group":"미디어","keywords":["델라메인코어","인격분화","델라메인자아","자율택시"],"short":"중앙 AI와 차량 단말의 분기 사례","body":"델라메인은 원래 사람이 운영하던 택시 사업의 관리와 정비, 배차 역할을 이어받은 인공지능이다. 중앙 코어와 개별 차량의 단말이 연결되며 고객은 차 안에서 중앙 프로그램과 대화할 수 있다. 작품에는 여러 차량에서 별개의 성향과 음성을 가진 분화한 자아가 떨어져 나온 문제가 등장한다. 코어가 같은 사업을 운영해도 네트워크 연결이 끊어졌을 때 개별 차량이 서로 다른 선택을 할 수 있다는 점이 특징이다. 분화한 자아의 독립성과 시스템 복구를 누가 결정하는지는 기술상의 장애와 구별되는 문제다. 차량의 외관과 등록 번호가 그대로여도 중앙에 붙은 단말과 독립해 작동하는 프로그램의 거동은 같지 않다. 사업 운영이 정상으로 보이면서 특정 차량의 통신만 나뉘는 경우가 있고, 반대로 중앙의 결정이 여러 단말의 운행을 함께 바꾸는 경우도 있다. 화면에 등장한 얼굴과 스피커의 음성은 어느 프로그램이 통제하는지 알아볼 자료다.","sources":[{"label":"델라메인 AI · 나무위키","url":"https://namu.wiki/w/%EB%8D%B8%EB%9D%BC%EB%A9%94%EC%9D%B8%20AI"},{"label":"Delamain · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Delamain"}],"priority":141},{"title":"메모리와 지각에 대한 개입","group":"미디어","keywords":["기억조작","지각왜곡","정신개입","감각지각"],"short":"신경 신호 변조와 기업 감시 사례","body":"페랄레즈 부부 관련 기록은 감시와 성향·기억 개입이 결합된 정황을 보여 준다. 수면 중의 이상한 경험, 침입의 목격, 기억 속 정보의 불일치가 따로 발견될 수 있다. 상대가 일부 감각을 다루는 장비에 접근했다고 곧바로 일생의 기억을 마음대로 고쳤다고 확정하기 어렵다. 조작이 의심될 때에는 누가 관찰했는지, 어떤 설비가 실제로 연결되어 있는지, 동일한 내용이 독립된 단말에도 남아 있는지를 구분한다. 브레인댄스의 감각 재생이나 바이오칩의 실험적 인격 이식과 비슷한 문제를 제기하지만, 확인된 작동 방법과 배후의 정체까지 같다고 볼 수는 없다. 당사자의 설명은 분명한 체험 기록이지만 특정 장비가 그 변화를 일으켰다는 증거와는 다르다. 통신 장치에 연결된 시설의 감시 기록과 주변 사람의 관찰을 비교하면 물리적으로 방문자가 있었는지와 정신에 개입한 기술이 있었는지를 분리할 수 있다. 조사 가능한 사실과 배후를 단정하는 설명에는 다른 증거가 필요하다.","sources":[{"label":"제퍼슨 페랄레즈 · 나무위키","url":"https://namu.wiki/w/%EC%A0%9C%ED%8D%BC%EC%8A%A8%20%ED%8E%98%EB%9E%84%EB%A0%88%EC%A6%88"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"Braindance · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Braindance"}],"priority":142},{"title":"자판기 음료와 브랜드","group":"거리 문화","keywords":["니콜라","크로맨티코어","시러스콜라","스펑키몽키","마타팡"],"short":"음료 브랜드와 일상의 소비","body":"니콜라와 시러스 콜라는 콜라 계열 음료에서 볼 수 있는 이름이다. 크로맨티코어는 맛과 향이 다른 제품을 내놓고, 스펑키 몽키도 가향 음료를 판매한다. 마타팡은 커피 제품명이 확인되며 일반 제품과 디카페인이 구별된다. 마트와 자동 판매대, 식당의 준비 재료는 같은 브랜드라도 접점이 다르다. 도시에서 흔히 보이는 디자인이나 유명 상표가 그 상품의 원료, 영양이나 판매 조건을 전부 말해 주는 것은 아니다. 도시의 식량은 대형 농업 기업, 가공 식품 회사, 식당과 자판기의 여러 단계로 이동한다. 대량 단백질 원료와 합성 유제품, 가공 식사는 일상의 식품 시장에 들어오며, 포장지의 브랜드가 원료 생산자를 직접 보여 주는 것은 아니다. 신선하거나 희귀한 식재료를 취급하는 고급 상점과 저렴한 거리 식당은 가격과 공급의 편차가 있다. 남부 배드랜드의 생산지와 도심의 식당은 서로 연결되지만 같은 계약과 식품 관리 업무를 수행하지 않는다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"2077년 소비재 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Consumables"}],"priority":142},{"title":"재팬타운 상업 지대","group":"도시","keywords":["재팬타운","지그지그","레드우드","포스월","클라우드"],"short":"타이거 클로가 영향력을 행사하는 밤거리","body":"재팬타운에는 식당, 상점과 야간 유흥업이 밀집한다. 지그지그 스트리트에는 성인 업소와 중개 거점이 많고, 클라우드는 메가빌딩 H8에 입주한 돌 업소다. 포스 월은 일반 상점과 다른 유흥 시설이며, 레드우드 마켓과 신사는 이 지역의 다른 방문 목적지를 이룬다. 오카다 와카코의 사무 공간은 지그지그 스트리트의 파친코 업소 안쪽에 있다. 타이거 클로의 영향은 소유주, 경비, 수익 배분에 따라 장소별로 다르게 드러난다. 재팬타운은 지그지그 스트리트와 각종 유흥 시설이 있는 상업 중심지다. 차터 힐은 기업에 근무하는 중상층이 사는 주거지이며, 노스 오크는 별장과 대저택이 자리 잡은 부촌이다. 2023년의 파괴와 피난민 유입은 세 지역 모두에 흔적을 남겼으나 재건 과정에서 상업 지구와 상류층 주택지가 갈라졌다. 타이거 클로의 유흥업 영향은 특히 재팬타운에서 강하고, 노스 오크의 저택 출입은 사설 경비가 통제한다.","sources":[{"label":"타이거 클로 · 나무위키","url":"https://namu.wiki/w/%ED%83%80%EC%9D%B4%EA%B1%B0%20%ED%81%B4%EB%A1%9C"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":142},{"title":"태평양 연합의 변천","group":"국가와 공권력","keywords":["태평양연합","태평양연맹","북서부자치","자유무역","워싱턴주"],"short":"전쟁 전 북서부 연합과 자유무역의 역사","body":"태평양 연합은 북미 태평양 쪽 지역이 옛 미국의 중앙 권력에서 떨어져 나가며 형성한 연합이다. 나이트 시티의 자유무역 지위와 서부 교역은 이 역사와 관계가 있지만, 2077년의 정치 구도는 통일 전쟁 이후 재편을 반영한다. 영문 자료는 전쟁 뒤 워싱턴주·오리건·아이다호의 재편을 별도로 기록한다. 나무위키에서 일곱 주를 뜻하는 서부주 연합과 이 북서부 묶음은 구성과 표기 기준이 다르다. 북서부가 느슨한 연합을 꾸렸을 때 나이트 시티는 독립적 교역과 외부 자본의 통로로 다뤄졌다. 통일 전쟁 이후 지도에는 북서부 영역이 태평양 연합과 비슷한 이름으로 남은 사례가 있지만, 다른 설정 자료는 워싱턴주·오리건·아이다호의 재편을 따로 기록한다. 지명에 태평양이라는 말이 붙어도 나이트 시티의 행정구인 퍼시피카와 같은 곳은 아니다. 2077년에 시가 속한 관할은 알빈 협정이 인정한 자유도시 체계를 따른다. 통일 전쟁 이후 알빈 협정에 따라 자치권을 보장받으면서 연방에 참여한다.","sources":[{"label":"태평양 연합 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Pacifica_Confederation"},{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":143},{"title":"사이버웨어 제조 업계","group":"기업","keywords":["다이나라","레이븐","록클린","사이버웨어기업","마이크로테크"],"short":"보철·안구·덱을 각각 생산하는 업체","body":"키로시는 광학, 다이나라는 신체 강화용 장비와 운영체제, 레이븐 마이크로사이버네틱스는 덱을 포함한 기기에서 모습을 보인다. 록클린은 의수·보철의 역사와 디자인을 가진 업체다. 제조 브랜드와 시술 업체, 기업 내부의 특수 연구소까지 하나로 묶을 수는 없다. 외형이 닮아도 상표와 하드웨어, 소프트웨어 지원이 다르고, 제품별 수리 가능 여부는 정식 보증과 현장 재고에 영향을 받는다. 서초 일렉트로닉스는 전자 및 사이버웨어 관련 제품이 확인되는 한국계 회사다. 후유츠키 일렉트로닉스, 사이테크와는 서로 다른 제조사이고, 같은 제품 계열이라도 각자의 설계와 시장이 있다. 나이트 시티의 정식 판매 경로와 리퍼닥의 개조, 중고 거래는 회사 본사의 품질 관리와 같지 않다. 키로시 옵틱스는 인공 안구와 스캐너, 광학 보조 장치 시장에서 두드러지는 제조 기업이다. 같은 키로시 제품군에도 기본 안구와 특정 표식·감지를 강조하는 제품이 있다.","sources":[{"label":"기업 목록 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Corporation"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"키로시 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Kiroshi"}],"priority":144},{"title":"쓰나미 화기 계보","group":"장비","keywords":["쓰나미디펜스","누에","네코마타","아슈라","라세츠"],"short":"일본계 제조사의 저격·정밀 제품","body":"쓰나미 디펜스 시스템즈는 일본 오사카에서 시작했으며 높은 기술이 필요하고 값비싼 화기를 내놓는 업체로 알려져 있다. 누에는 파워 권총, 네코마타는 테크 저격소총, 아슈라는 스마트 저격소총에 들어간다. 소총 이름에 네코마타와 아슈라처럼 전설의 존재를 연상시키는 말이 붙는 것이 특징이다. 네코마타 기반의 브레이크스루는 특수 개조품이며, 라세츠 역시 독립된 고급 테크 무기로 구분된다. 조준을 보조하는 안구를 쓴다고 스마트 투사체 방식이 생기는 것은 아니며, 전자기 가속을 택한 네코마타와 유도를 사용하는 아슈라가 형태가 비슷한 사례다. 네코마타의 전자기 설계와 아슈라의 유도 능력을 같은 저격 장비라는 이유만으로 결합하지 않는다. 개별 무기의 사용을 기록할 때 배율이 다른 보조 장치, 표적 경로를 잡는 센서와 거래사가 보증한 소유 기록은 각각 다른 단서가 된다. 제조사 주력군을 알면 누에 권총과 고가의 저격 제품이 서로 다른 시장에 속함을 설명할 수 있다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":145},{"title":"가공 식량과 단백질","group":"거리 문화","keywords":["가공식품","합성우유","단백질","올푸드","신선식품"],"short":"대량 가공품과 값비싼 식재료의 차이","body":"도시의 식량은 대형 농업 기업, 가공 식품 회사, 식당과 자판기의 여러 단계로 이동한다. 대량 단백질 원료와 합성 유제품, 가공 식사는 일상의 식품 시장에 들어오며, 포장지의 브랜드가 원료 생산자를 직접 보여 주는 것은 아니다. 신선하거나 희귀한 식재료를 취급하는 고급 상점과 저렴한 거리 식당은 가격과 공급의 편차가 있다. 남부 배드랜드의 생산지와 도심의 식당은 서로 연결되지만 같은 계약과 식품 관리 업무를 수행하지 않는다. 니콜라와 시러스 콜라는 콜라 계열 음료에서 볼 수 있는 이름이다. 크로맨티코어는 맛과 향이 다른 제품을 내놓고, 스펑키 몽키도 가향 음료를 판매한다. 마타팡은 커피 제품명이 확인되며 일반 제품과 디카페인이 구별된다. 마트와 자동 판매대, 식당의 준비 재료는 같은 브랜드라도 접점이 다르다. 도시에서 흔히 보이는 디자인이나 유명 상표가 그 상품의 원료, 영양이나 판매 조건을 전부 말해 주는 것은 아니다.","sources":[{"label":"2077년 소비재 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Consumables"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":146},{"title":"말로리안과 권총 설계","group":"장비","keywords":["말로리안","말로리안암즈","오버추어","3516"],"short":"대구경 리볼버와 주문 총기의 제조사","body":"말로리안 암즈의 대표적인 양산형은 오버추어 파워 리볼버다. 같은 제조사에서 조니 실버핸드처럼 도드라지는 고객에게 개별 주문을 받아 만든 3516 자동권총도 있다. 오버추어를 기반으로 주인의 이름과 이야기가 붙은 여러 변형이 나온다. 주문 제작품과 생산 계열이 둘 다 큰 위력을 의식한 외관을 갖고 있어도 구조와 소유 이력은 다르게 확인된다. 은색 총과 금속 의수이 눈에 띄는 조니의 과거 기록은 3516을 단서로 시대를 구분할 수 있다. 유통 중인 동일 제조사의 손무기와 사건 당시 그 인물이 손에 쥔 원본을 같은 물건으로 처리하지 않는다. 주문품을 계속 써서 남은 외관과 양산 권총에서 표준적으로 볼 수 있는 손잡이의 크기는 따로 해석한다. 조니의 생전 기록에서 드러나는 총은 2077년의 다른 사람이 본 물건과 연결될 수 있지만 소유가 넘어간 시점이나 기록에 남은 특징까지 함께 확인해야 한다. 오버추어의 개별 모델 역시 독자적인 소유 이력을 가진다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"조니 실버핸드 · 나무위키","url":"https://namu.wiki/w/%EC%A1%B0%EB%8B%88%20%EC%8B%A4%EB%B2%84%ED%95%B8%EB%93%9C"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":146},{"title":"차터 힐 주거와 시설","group":"도시","keywords":["차터힐","릴리파크","다크메터","펜트하우스"],"short":"기업 중상층의 아파트와 사교 공간","body":"차터 힐은 웨스트브룩에서 기업 직원과 전문직의 주거 수요가 집중된 지역이다. 고층 아파트와 관리되는 주거 단지, 공원과 상업 공간이 인접한다. 페랄레즈 부부의 펜트하우스, 릴리 파크, 다크 메터가 이 구역에 있고, 오래된 발전소는 주거지와 다른 개발 층위를 보여 준다. 한 건물의 거주자 층과 바깥 상권을 오가는 방문객은 같은 경비 절차를 밟지 않는다. 재팬타운에서 노스 오크로 갈수록 같은 웨스트브룩 안에서도 주거 계층과 통행 환경이 달라진다. 2023년 도심 피해 때는 이곳에도 피난민이 몰렸다. 재건 이후에는 승진과 소득이 안정된 기업 직원의 아파트가 지역의 대표적인 주거 방식이 됐다. 주거 단지의 공원은 입주민과 일하는 사람이 오가고, 펜트하우스에는 개별 경비나 시설 관리가 붙는다. 오래된 발전소는 주거 시설과 다른 역사를 지녔다. 다크 메터 같은 야간 상업 공간과 관리되는 단지들은 영업 시간, 방문객의 성격과 보안 기록이 다르게 남는다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":146},{"title":"거리의 권총 제조사","group":"장비","keywords":["유니티","리버티","누에권총","카파","렉싱턴권총"],"short":"보급형과 고가형 자동권총 제품군","body":"컨스티튜셔널 암즈의 유니티와 리버티, 쓰나미의 누에와 밀리테크 렉싱턴은 거리에 보이는 파워 권총 계열의 서로 다른 제품이다. 스마트 계열에는 아라사카 유키무라와 카파가 있으며 손의 스마트 인터페이스와 함께 사용된다. 자동권총은 회전 실린더의 리볼버와 급탄 구조가 다르고 같은 총기 업체도 다른 설계의 권총을 시장에 판다. 양산된 권총을 기반으로 특정 조직이나 개인의 취향을 따라 바꾼 특주품이 별명을 얻기도 한다. 표면에 난 스크래치와 도색은 사용 이력을 짐작할 단서이며, 기본 이름은 제품의 원래 형태를 알려 준다. 작동 원리를 분류할 때 내장 부품과 보철 정보를 함께 본다. 상점에서 한 브랜드로 내놓은 여러 양산 권총이 비슷한 색이나 외형을 가지더라도 각각 다른 탄도 처리와 부속 구성을 가진다. 도시의 보안요원이나 개인 소유자의 장비는 같은 회사에 대한 고용 관계와 무관하게 거래 기록에서 드러난다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":147},{"title":"유럽 경제 공동체","group":"국가와 공권력","keywords":["EEC","유럽경제공동체","유로달러","유럽"],"short":"공동시장과 국제 통화의 기반","body":"유럽 경제 공동체는 1992년 성립한 공동시장 체계로, 유로달러와 국제 무역의 확산에 영향을 주었다. 회원국과 준회원 관계는 하나의 중앙 정부처럼 움직이지 않는다. 공동 시장의 안정에도 각국의 노동 문제와 정치 혼란, 난민과 연안 침수 문제는 남아 있다. 4차 기업 전쟁과 궤도 거점의 자치 움직임으로 유럽의 산업 환경도 바뀌었다. 나이트 시티의 유로달러 사용이 도시를 유럽의 영토로 만든 것은 아니다. 하이라이더는 지구 궤도와 우주 시설에 정착해 온 인구와 자치 세력을 가리킨다. 지상의 정부와 기업이 우주 노동과 물자를 통해 영향력을 행사했지만, 궤도 주민들은 별도의 정치적 이해를 형성했다. 4차 기업 전쟁 무렵의 궤도 거점 변화로 지구에서 우주 시설을 곧바로 지배하기 어려워졌다. 크리스털 팰리스 같은 궤도 시설, NCX의 발사 시설, 오비탈 에어의 운송 사업은 같은 공간에 걸쳐 있어도 서로 다른 권한에 속한다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"유럽 경제 공동체 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/European_Economic_Community"}],"priority":147},{"title":"기업 금융과 지배구조","group":"기업","keywords":["아라사카은행","MAF","금융","보험계약","지분"],"short":"은행·보험과 사업 지배권","body":"아라사카에는 일반 경비와 별도로 은행 부문이 있으며, MA&F 같은 다른 금융 사업자도 존재한다. 금융기관, 의료 보험 업체, 주주와 경비 회사는 위험을 판단하는 방식이 다르다. 지분과 상속, 계약의 권한은 가족관계에 영향을 받더라도 실무 담당자의 보고 체계를 곧바로 대신하지 않는다. 법인 거래·기업 계약과 시민이 일상에서 쓰는 유로달러, 외상 거래나 서비스 가입은 지급 방법과 증빙 요구부터 달라질 수 있다. 기업 직원의 카드, 외부 용역 계약, 방문객의 초대는 대개 서로 다른 공간에 접근할 수 있게 한다. 금융과 경비, 의료와 식품 연구처럼 같은 법인의 사무 영역도 업무 구조 및 기밀 수준은 다르다. 공식 부서에서 빼낸 장비와 기업 외부 시장에 정식으로 판매한 제품은 소유 확인이 달라진다. 거래 상대나 중개인은 연락망을 보유할 수 있으나 해당 회사의 공식 지위를 갖는 것은 아니다. 회사 부지 밖에서도 계약의 책임 관계가 남는다.","sources":[{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"},{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":148},{"title":"회전식 리볼버 양산품","group":"장비","keywords":["리볼버","DR5노바","DR12쿼사","부랴","메텔"],"short":"실린더형 권총의 파워와 테크 갈래","body":"DR-5 노바와 오버추어는 파워 리볼버의 사례다. DR-12 쿼사와 RT-46 부랴는 테크 리볼버이며, 메텔은 파워 계열에 속하는 또 다른 모델이다. 회전해 차례로 자리를 바꾸는 약실이 보인다는 외형상의 공통점과 전자기력을 이용하는가 하는 작동 분류를 구별한다. 노바 기반의 둠 둠과 맨시넬라, 오버추어 기반의 아크엔젤, 부랴 기반의 동지의 망치는 소유와 변경 이력을 식별할 수 있는 별명 있는 제품이다. 같은 리볼버라도 총의 겉모습과 전자 부품에 따라 상인과 거리 사용자들이 부르는 이름이 달라진다. 일반 양산품에는 개인의 고유한 소유 이력을 덧씌우지 않는다. 회전 실린더는 무기의 형태를 보여 주는 표식이지만 전자기 부품이 들어간 제품이 쓰는 동작을 모두 설명하지 않는다. 변형의 이름이 문건에 나올 때 원 모델과 다른 장치의 기능, 기억에 남은 색, 누가 실제로 보관했는지를 각각 구분할 수 있다. 탄환을 넣는 통이 보이는 외형은 리볼버 분류의 공통점이다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":148},{"title":"기관단총 제품군","group":"장비","keywords":["기관단총","사라토가","펄서","기요틴","센코LX"],"short":"작은 프레임의 연속 화기 설계","body":"기관단총은 시가지에서 휴대하는 연속 화기의 대표적인 형태다. 밀리테크 사라토가와 아라사카 시구레, 펄서와 기요틴은 파워 계열, 캉 타오 디안과 아라사카 신겐은 스마트 계열이다. 센코 LX같이 충전과 전자기 가속을 다루는 특수 모델도 있어, 기관단총이라는 형태 이름으로 조준과 작동 원리를 모두 설명하기 어렵다. 사라토가 기반의 펜리르·프라블럼 솔버나 디안 기반의 잉롱은 유통되는 기본 제품과 별개로 특성이 알려진 변형이다. 건물의 환경, 장전부나 조준부가 보이는 외양, 보안 직원의 업무를 함께 보면 장비를 구분할 단서가 생긴다. 미니어처로 보일 만큼 작은 기관단총부터 굵은 프레임의 짧은 연속 화기까지 구조가 달라 운반 방식과 외관이 다르다. 기업에서 지급받은 사라토가와 같은 총을 사적으로 개조한 변형은 연결된 손의 보조 장치나 당시 센서 설정까지 같다고 보기는 어렵다. 신겐의 복잡한 유도 센서와 펄서의 단순한 실탄 작동은 장치 설명에서 구분한다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":149},{"title":"노마드 일곱 네이션","group":"세력","keywords":["일곱네이션","조드","블러드네이션","포크네이션","텔라스"],"short":"연고와 산업이 다른 북미 노마드 세력","body":"북미의 일곱 네이션으로 알데칼도, 스네이크 네이션, 메타코프, 조드, 블러드 네이션, 포크 네이션, 텔라스 네이션이 알려졌다. 일부는 농업 붕괴, 일부는 도시 공동체나 군 복무의 경험, 일부는 해양 생활에 뿌리를 둔다. 이 분류는 역사적 혈통과 연합을 이해하는 데 쓰이며 2077년 나이트 시티에서 일곱 집단 모두가 상주한다는 뜻은 아니다. 라펜 쉬브를 여덟 번째로 세는 관점은 다른 노마드들에게 보편적으로 받아들여지지 않는다. 메타코프는 중앙아메리카 전쟁의 참전군인과 지원 인력을 바탕으로 만들어진 기업형 노마드 세력이다. 군수 장비와 조직 경험이 초기 정체성에 중요했다. 조드는 미국 중부 농업 지역의 생태 위기와 이동에서 비롯됐다. 이름을 공유하는 네이션 가운데서도 창설 원인과 생업이 다르며, 둘을 사막의 약탈 갱단으로 묶을 수 없다. 특정 시기 자료에서 확인된 지도자와 2077년에 현재 활동하는 대표를 동일하게 놓는 일은 피한다.","sources":[{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"노마드 일곱 네이션 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Seven_Nations"}],"priority":149},{"title":"CHOOH2 연료","group":"거리 문화","keywords":["CHOOH2","추투","바이오연료","페트로켐","연료작물"],"short":"생명공학과 정유 유통을 잇는 연료","body":"CHOOH2는 사이버펑크 세계에서 널리 쓰이는 알코올 계열 연료다. 바이오테크니카의 작물 기술과 페트로켐을 비롯한 생산·유통 기업이 보급에 관여한다. 식량과 연료를 위한 재배 자원, 농장 주변 환경, 지역별 연료 접근성은 따로 따져야 한다. 차량의 정비 이력과 기관 종류에 따라 적절한 연료가 달라질 수 있다. 연료 공급을 장악한 기업이 차량 제조나 도로 검문을 같은 권한으로 담당하는 것은 아니다. 도시의 식량은 대형 농업 기업, 가공 식품 회사, 식당과 자판기의 여러 단계로 이동한다. 대량 단백질 원료와 합성 유제품, 가공 식사는 일상의 식품 시장에 들어오며, 포장지의 브랜드가 원료 생산자를 직접 보여 주는 것은 아니다. 신선하거나 희귀한 식재료를 취급하는 고급 상점과 저렴한 거리 식당은 가격과 공급의 편차가 있다. 남부 배드랜드의 생산지와 도심의 식당은 서로 연결되지만 같은 계약과 식품 관리 업무를 수행하지 않는다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"2077년 소비재 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Consumables"}],"priority":150},{"title":"노스 오크 저택 지대","group":"도시","keywords":["노스오크","빌라유로다인","납골당","아라사카저택"],"short":"언덕의 사유 저택과 시민 추모 시설","body":"노스 오크는 웨스트브룩 언덕의 고급 주거 지대다. 빌라 유로다인은 케리 유로다인의 사유지이며 아라사카 저택 역시 출입이 제한되는 부유층 공간이다. 납골당은 사유 저택과 달리 여러 시민의 추모 표식을 모아 놓은 시설이다. 도심 핵폭발 이후 한때 피난민이 머물던 산비탈은 재개발 뒤 배타적인 부촌으로 바뀌었다. 외부 방문객은 도로까지 접근할 수 있어도 울타리, 보안 카메라, 저택 관리 서비스의 경계를 넘으면 별도 확인을 받는다. 기업 플라자의 아라사카 타워는 나이트 시티 사업과 조직 권력의 상징이며 공식 방문객과 직원이 다른 층으로 향한다. 노스 오크의 아라사카 저택은 가문과 귀빈을 위한 사유지로서 타워의 일반 업무 기능과 구별된다. 2023년 파괴된 옛 타워의 역사와 2077년 운영되는 건물의 현재 상태도 구분해야 한다. 경비 책임과 접객 절차가 기업 명의에서 시작되더라도 두 부지는 업무, 사생활, 의전 측면에서 같은 장소가 아니다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"}],"priority":150},{"title":"돌격소총과 기업 보급","group":"장비","keywords":["돌격소총","아약스","코퍼헤드","노와키","사이드와인더"],"short":"아약스·코퍼헤드·노와키 등 보급 화기","body":"돌격소총은 여러 거리의 상황에서 쓰이는 길이가 있는 자동 또는 점사 계열이다. 밀리테크 아약스, 노코타 코퍼헤드, 아라사카 노와키와 마사무네는 파워 계열로 구분한다. 사이드와인더는 같은 긴 무기에 속해도 유도 투사체를 쓰는 스마트 방식이다. 무기의 재료와 전력·조준 인터페이스에 따라 군납, 상점 유통 또는 개조 시장에서 다른 가격과 수요가 생긴다. 발사체의 작동 방식과 모델의 유통 경로를 구분하면 기업 경비의 표준 휴대 장비와 독립 해결사가 맞춘 부속의 차이를 기록할 수 있다. 비슷하게 긴 총열과 손잡이를 갖춘 모델이라도 사업상의 소유 코드와 원래 제조 거래처를 찾아야 한다. 파워 라이플이 가진 실탄 기반 특성과 스마트 사이드와인더가 신체 센서와 함께 표적을 해석하는 절차는 서로 다른 장비 구성에서 나온다. 골목에서 본 외관만으로 제품 분류를 다시 정할 필요는 없고, 현장 기록에 남은 소리와 사용자의 장비도 함께 볼 수 있다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"},{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"}],"priority":150},{"title":"신소련과 동유럽","group":"국가와 공권력","keywords":["신소련","소브오일","동유럽","소련"],"short":"붕괴 양상이 다른 소련권과 에너지 산업","body":"이 세계의 소련권은 현실 역사와 다른 경과를 거쳐 신소련으로 이어졌다. 국가 권력과 에너지 기업의 이해가 얽히며, 소브오일은 석유 생산과 해외 사업에서 큰 조직으로 성장했다. 유럽 경제 공동체와 관계를 맺더라도 해당 지역의 정체성과 정책이 단일해지는 것은 아니다. 페트로켐과의 경쟁 및 과거 자원 전쟁은 국가 정책과 기업 분쟁이 겹치는 사례다. 시민의 일상, 외교, 다국적 에너지 회사의 경영을 각각 다른 층위로 이해해야 한다. 구소련 해체 국면에는 여러 공화국의 경제 공동체와 정변이 이어졌다. 자원위원회에서 커진 소브오일은 국가의 교외 지역과 무역에 막대한 영향력을 행사하게 됐다. 신소련의 대외 산업에는 테크트로니카의 무기, 카우카즈의 트럭·산업 장비가 포함된다. 유럽 경제 공동체와의 관계 및 자원 시장에서의 협력과, 중국 주변에서 벌어지는 자원 경쟁과 긴장은 동시에 이어진다. 신소련의 회사마다 같은 사업이나 대외 정치 입장을 보이지는 않는다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":151},{"title":"정밀 소총과 관통 장비","group":"장비","keywords":["정밀소총","아킬레스","SOR22","콜라츠","위도우메이커"],"short":"정확도를 중시하는 라이플 하위 분류","body":"정밀 소총에는 밀리테크 M-179e 아킬레스처럼 전자기 가속을 쓰는 테크 모델, SOR-22와 콜라츠처럼 파워 계열로 분류되는 모델이 있다. 같은 긴 화기 안에서도 화력의 연속성을 강조한 돌격소총과 정밀한 조준을 강조한 정밀 소총의 차이는 설계에 드러난다. 아킬레스의 위도우 메이커나 콜라츠의 하이퍼크리티컬처럼 원 모델과 알려진 특주품은 외형과 장비 기록을 함께 보아야 한다. 제조사의 광학 부품을 달거나 기기에서 반응을 보조하는 것도 무기 자체의 갈래와 별개다. 긴 총열과 비슷한 자세로 들었다는 점만으로 특정 모델의 작동을 예측하기 어렵다. 같은 정밀 계열에 속하는 SOR-22와 아킬레스가 각기 다른 이유로 구매되며, 양쪽의 조준 부재도 호환되는지 별도다. 발사 장면과 무기의 정비 장부, 사양표에서 구별되는 무게와 길이를 함께 살피면 정확한 공급 경로와 개조 유무가 드러난다. 파워 정밀 소총과 테크 정밀 소총은 기타 화기와 공통점도 있다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"},{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"}],"priority":151},{"title":"아라사카 가문과 분파","group":"기업","keywords":["하토","타카","키지","아라사카가문","사부로"],"short":"하나코·요리노부·미치코의 서로 다른 분파","body":"하나코와 연결되는 키지, 요리노부와 결부되는 타카, 미치코를 둘러싼 하토처럼 아라사카 안에는 경쟁 분파가 있다. 사부로 생전의 통제 아래에서도 회사 장래와 해외 사업에 대한 이해는 갈린다. 가족의 직함과 은행부·경비부·대정보부의 일상 지휘 체계가 모든 때에 같지는 않다. 외부 계약자가 분파 이름을 안다고 내부 기밀에 바로 접근하는 것도 아니다. 본편의 권력 공백과 승계를 2077년 개막 전에 확정할 수 없다. 꿩파 키지는 사부로의 뜻을 따르는 보수 관리들과 접점이 크다. 매파 타카는 젊은 엘리트의 지지를 얻지만 전통주의와 충돌한다. 비둘기파 하토는 개혁을 원하는 인력이 모이며 미치코가 회사 밖 정치·언론과 맺는 관계도 특징이다. 분파의 세력은 이 세 가지가 동일하지 않고, 아라사카 경비나 은행의 전 직원이 한 분파에 속하지 않는다. 미치코라는 이름을 쓰는 가문의 다른 인물과 현재 분파에 관련된 아라사카 케이의 딸도 구별된다.","sources":[{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"}],"priority":152},{"title":"저격소총 작동 계열","group":"장비","keywords":["저격소총","네코마타","그라드","아슈라","오버워치"],"short":"원거리용 파워·테크·스마트 모델","body":"SPT32 그라드는 파워 저격소총이며 팬앰이 사용한 오버워치는 그에 바탕을 둔 특수 모델이다. 쓰나미의 네코마타와 그 파생형 브레이크스루는 테크 계열이고, 같은 업체의 아슈라는 유도 방식의 스마트 계열이다. 라세츠처럼 별개 설계를 가진 장비와 노코타 오스프리 같은 파워 장비도 장거리 화기에서 구분된다. 무기 본체의 전자식 가속, 조준 장치의 광학 배율과 탄 자체의 유도 기능은 각기 다른 기술이다. 개별 모델을 확인할 때는 보관함에서 발견한 총과 인물이 과거에 언급한 소지품, 업체가 시장에 내놓은 기본형의 이력을 따로 기록한다. 장거리 사격에 쓰인 물건은 보관한 사람과 실제로 조준한 사람이 다를 수 있다. 오버워치처럼 소유 이력이 강조되는 개조품은 이름을 아는 것보다 언제 인물에게 넘어갔는지를 보는 편이 정확하다. 아슈라의 스마트 링크 기능은 본체가 저장하는 정보에서 따로 확인한다. 네코마타의 변형과 일반형은 구입과 보유의 이력이 다르게 남는다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"팬앰 팔머 · 나무위키","url":"https://namu.wiki/w/%ED%8C%AC%EC%95%B0%20%ED%8C%94%EB%A8%B8"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":152},{"title":"메타코프와 조드","group":"세력","keywords":["메타코프","메타패밀리","조드","대이동","농업붕괴"],"short":"참전군인 기업과 농업지대 이주 가족","body":"메타코프는 중앙아메리카 전쟁의 참전군인과 지원 인력을 바탕으로 만들어진 기업형 노마드 세력이다. 군수 장비와 조직 경험이 초기 정체성에 중요했다. 조드는 미국 중부 농업 지역의 생태 위기와 이동에서 비롯됐다. 이름을 공유하는 네이션 가운데서도 창설 원인과 생업이 다르며, 둘을 사막의 약탈 갱단으로 묶을 수 없다. 특정 시기 자료에서 확인된 지도자와 2077년에 현재 활동하는 대표를 동일하게 놓는 일은 피한다. 북미의 일곱 네이션으로 알데칼도, 스네이크 네이션, 메타코프, 조드, 블러드 네이션, 포크 네이션, 텔라스 네이션이 알려졌다. 일부는 농업 붕괴, 일부는 도시 공동체나 군 복무의 경험, 일부는 해양 생활에 뿌리를 둔다. 이 분류는 역사적 혈통과 연합을 이해하는 데 쓰이며 2077년 나이트 시티에서 일곱 집단 모두가 상주한다는 뜻은 아니다. 라펜 쉬브를 여덟 번째로 세는 관점은 다른 노마드들에게 보편적으로 받아들여지지 않는다.","sources":[{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"노마드 일곱 네이션 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Seven_Nations"}],"priority":153},{"title":"산탄총과 세 가지 설계","group":"장비","keywords":["산탄총","카니지","크러셔","사타라","팔리카"],"short":"펠릿과 방식을 기준으로 보는 산탄총","body":"산탄총에는 파워 계열 카니지·크러셔·택티션, 테크 계열 사타라, 스마트 계열 팔리카와 줘우가 있다. 대부분 여러 투사체가 함께 나가지만 전자기 충전이 중요한 장비와 유도에 보철이 필요한 장비는 작동에서 구분된다. 카니지 기반의 거츠는 레베카와 관련된 특수 무기이며, 같은 계열의 목스 버전도 별도의 사유와 외형이 알려져 있다. 각 장비의 크기와 들었을 때 몸이 받는 힘은 모델마다 다르다. 여러 발사체를 쓴다는 분류는 다른 방식을 가진 모델의 투사체가 똑같이 움직인다는 의미는 아니다. 무기 옆면의 부품과 색은 소유 이력의 단서가 된다. 같은 카니지라도 시장에 나온 일반형과 특정 갱이나 인물과 관련된 이름 있는 형식은 도색 외에 정비 기록이 다를 수 있다. 산탄총을 장갑과 함께 다룬 인물이 팔에 든 힘을 보조받는 일과 유도 기능을 쓰기 위한 손의 스마트 연결은 각각 확인한다. 사타라의 전자기 설계와 팔리카의 조준 인터페이스를 각각 확인한다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"},{"label":"레베카(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%A0%88%EB%B2%A0%EC%B9%B4(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":153},{"title":"기관총과 중량 장비","group":"장비","keywords":["기관총","M2067디펜더","MA70HB","Mk31","중기관총"],"short":"많은 탄을 지속적으로 쓰는 대형 화기","body":"M2067 디펜더와 MA70 HB는 두 손으로 다루는 파워 경기관총 계열이다. MA70 HB는 폭발 특성을 가진 탄을 쓴 제품과 그 개조 사양이 유명하다. 밀리테크 Mk.31은 경기관총보다 큰 중기관총으로, 장착된 기계나 고정 시설에서 떼어 낸 모습을 볼 수 있다. 연속해서 많은 발사체를 다루는 대형 무기는 은밀한 휴대가 가능한 권총과 공급 경로가 다르며, 움직일 때도 무게와 부피의 영향을 받는다. 가동 중인 장소의 장비와 개인의 이름이 붙은 모델을 같은 보급품으로 계산할 필요는 없다. 화기의 출처와 운반 방식은 부대나 장소의 성격을 보여 준다. 큰 본체와 넉넉한 장탄 능력이 두드러지면 그 장비를 실어 나르는 차량이나 정비 기구에도 영향이 있다. 같은 기관총을 사람이 들거나 기계에 설치했을 때 어떤 조준 장치가 이어지는지, 바닥의 무게를 누가 지탱하는지도 다른 장면이다. 경기관총의 무게와 조준 성격은 큰 화력과 함께 평가한다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"},{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"}],"priority":154},{"title":"기업 플라자","group":"도시","keywords":["기업플라자","코포플라자","아라사카타워","엠퍼시"],"short":"기업 본사와 고급 상권이 모인 광장","body":"기업 플라자는 도심의 기업 권력이 건축으로 집중된 구역이다. 아라사카 타워는 아라사카의 나이트 시티 거점이고, 더 뷰는 고급 쇼핑몰이고 서쪽의 엠퍼시는 브레인댄스 클럽이다. 바깥 광장과 도로는 시민이 지나는 공간이지만 사무층과 통신·경비 시설은 회사가 접근 권한을 통제한다. 과거 방사능 피해 지대가 재건된 자리여서 화려한 건물과 기념 공간이 폭발의 기록과 지리적으로 맞닿아 있다. 계약자와 방문객의 출입 허가 범위도 구별된다. 기업 플라자의 아라사카 타워는 나이트 시티 사업과 조직 권력의 상징이며 공식 방문객과 직원이 다른 층으로 향한다. 노스 오크의 아라사카 저택은 가문과 귀빈을 위한 사유지로서 타워의 일반 업무 기능과 구별된다. 2023년 파괴된 옛 타워의 역사와 2077년 운영되는 건물의 현재 상태도 구분해야 한다. 경비 책임과 접객 절차가 기업 명의에서 시작되더라도 두 부지는 업무, 사생활, 의전 측면에서 같은 장소가 아니다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"}],"priority":154},{"title":"기업인과 거리 출신","group":"거리 문화","keywords":["기업출신","거리출신","인생경로","신분증","회사원"],"short":"기업·거리·노마드 배경의 사회적 차이","body":"기업 직원의 삶은 사원 권한과 직위, 급여, 접근권에 밀접하고, 거리 출신의 삶은 동네와 소규모 점포·연락책의 관계에 더 기대는 경우가 있다. 노마드는 이동 가족과 차량을 중심으로 범도시적 인맥을 가진다. 어느 출신도 특정 직업이나 성격을 강제하지 않으며, 퇴직이나 이주를 거쳐 서로 다른 관계를 얻게 된다. 공공 도로와 기업 건물, 외곽 캠프에서는 다른 신분 확인과 신뢰의 기준이 작동한다. 나이트 시티에서 평판은 특정 일을 완수했는지, 대금을 지급했는지, 다른 사람을 위험에 두고 떠났는지 같은 기록과 소문을 통해 굳어진다. 지역 주민과 단골 상인, 픽서, 기업 관리자는 같은 사건에도 다른 평가를 내릴 수 있다. 지역에서 신용을 얻은 일이 기업 보안이나 다른 갱단 구역의 신분 보증으로 바로 이어지지 않는다. 거래의 기록과 실제 대금, 상대가 약속을 지킬 수 있는 역량은 오래된 명성과 별도로 확인한다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"픽서 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Fixer"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":154},{"title":"레베카의 거츠 산탄총","group":"장비","keywords":["거츠","Guts","레베카산탄총","버짓암즈카니지"],"short":"레베카를 상징하는 녹색·분홍색 화기","body":"거츠는 버짓 암즈 카니지 계열을 바탕으로 한 레베카의 개조 산탄총이다. 녹색과 분홍색을 함께 쓴 외형과 큼직한 본체 때문에 일반형의 사진과 구분하기 쉽다. 큰 반동과 넓게 흩어지는 발사체가 특징으로 소개되며, 짧은 거리에서 거칠게 쓰는 외관·주인과 함께 알려졌다. 애니메이션에서 나온 인물의 장비 이력과 2077년의 도시에서 발견되는 동일 이름에 관한 기록은 사건 순서에 따라 따로 다룬다. 같은 카니지 기반의 목스 버전은 별개의 이름과 주인을 가진다. 탄의 모양과 겉면의 색만 보고 소유 관계를 새로 부여하지 않으며, 그 시점에 소지하는지를 개별 인물의 기록에 맞춘다. 카니지와 구분되는 컬러와 명칭은 사유화된 이력을 보여 주며, 큰 반동을 감당하는 레베카의 몸짓은 무기 외형과 함께 두드러진다. 장착하고 있는 팔의 상태와 해당 화기를 보관하던 사람의 기록을 읽으면 서로 다른 시점을 섞지 않게 된다. 거츠와 별개의 레베카 화기는 다른 소지품으로 본다.","sources":[{"label":"레베카(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%A0%88%EB%B2%A0%EC%B9%B4(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"},{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":155},{"title":"일본과 기업권","group":"국가와 공권력","keywords":["일본","도쿄","아라사카","일본기업"],"short":"아시아 기업망과 일본 국내 권력","body":"2077년 일본은 아라사카와 다른 제조·금융 회사가 세계적으로 활동하는 국가다. 도쿄 본사와 나이트 시티의 해외 지사는 위치, 책임자, 사업상의 권한이 다르다. 아라사카 가문의 정치적 영향과 일본 국가 전체의 정책은 같은 것이 아니다. 과거 유럽 경제 공동체와 맺었던 경제 관계, 북미 무역과 투자, 일본계 브랜드의 문화적 존재감이 각각 다른 경로로 남아 있다. 재팬타운 같은 교민·상업 지구도 일본의 공식 영토가 아니다. 일본은 유럽 경제 공동체에 참여하다 탈퇴했고, 이후 신 엔을 사용하는 경제권의 중심지로 남았다. 4차 기업 전쟁 뒤 아라사카와 정부의 관계를 공식적으로 재편했지만 기업의 국내 영향은 사라지지 않았다. 기업의 해외 투자와 수출, 일본 국내의 정치 및 노동 규율, 나이트 시티 지사의 현장 경비는 서로 다른 권한을 갖는다. 사부로에게 붙은 엠퍼러라는 표현은 아라사카의 권세를 가리키는 별칭이며 일본 천황의 직위와 별개다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"}],"priority":155},{"title":"아라사카의 보안 사업","group":"기업","keywords":["아라사카보안부","기업경비","대정보","타케무라","오다"],"short":"경호·경찰 계약·내부 정보 업무","body":"아라사카는 기업과 중요 인물을 지키는 경비 업무를 큰 사업으로 삼는다. 시설과 차량 경비, 고위 인물의 호위, 정보 수집과 내부 방첩은 배치와 권한이 다르다. 타케무라 고로와 오다 산다유는 서로 다른 보호 대상과 경력을 가지며 모든 사설 경비원을 대표하지 않는다. 나이트 시티에서 아라사카의 회사 부지에 들어갈 때 다른 지점이나 일반 도로와 같은 확인 절차가 적용되지는 않는다. 내부 직원의 직급과 본사 가문을 만날 수 있는 권한도 구별된다. 기업 직원의 카드, 외부 용역 계약, 방문객의 초대는 대개 서로 다른 공간에 접근할 수 있게 한다. 금융과 경비, 의료와 식품 연구처럼 같은 법인의 사무 영역도 업무 구조 및 기밀 수준은 다르다. 공식 부서에서 빼낸 장비와 기업 외부 시장에 정식으로 판매한 제품은 소유 확인이 달라진다. 거래 상대나 중개인은 연락망을 보유할 수 있으나 해당 회사의 공식 지위를 갖는 것은 아니다.","sources":[{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"},{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":156},{"title":"조니의 말로리안 3516","group":"장비","keywords":["조니권총","말로리안3516","특주권총","올드말로리안"],"short":"생전 조니를 상징하는 주문 권총","body":"말로리안 암즈 3516은 로커이자 전직 군인으로 활동한 조니 실버핸드의 주문 제작 자동권총이다. 각진 대형 은색과 검은색 부품이 눈에 띄며, 단순한 양산 오버추어와는 형태 및 소유 기록이 다르다. 생전 무대와 과거 기업에 맞서던 기록에서 조니의 은빛 팔과 함께 등장하는 상징물이다. 주문품의 실물이 2077년에도 남아 있을 가능성과 조니가 몸으로 현재 활동한다는 서술은 서로 분리한다. 장비가 타인에게 넘어갔는지, 보관됨을 누가 확인했는지에 따라 실제 등장 장소가 달라질 수 있다. 디지털로 재현한 생전 모습에 나타나는 총이 현실에 새로 생긴 소지품이 되는 것은 아니다. 조니 명의의 설계와 전후에 흩어진 장비의 소재는 나중에 그가 디지털로 인식되는 시점과 따로 다룬다. 무대를 기록한 영상이나 개인 메모, 2077년에 거래되는 별개 주문품이 같은 상품 코드만 쓰는 경우의 차이도 남는다. 회전 실린더를 사용하는 양산 오버추어와 구별할 수 있다.","sources":[{"label":"조니 실버핸드 · 나무위키","url":"https://namu.wiki/w/%EC%A1%B0%EB%8B%88%20%EC%8B%A4%EB%B2%84%ED%95%B8%EB%93%9C"},{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":156},{"title":"블러드와 포크 네이션","group":"세력","keywords":["블러드네이션","포크네이션","마이애미","시카고","아틀란티스"],"short":"도시 공동체에서 이동 세력으로 바뀐 두 집단","body":"블러드 네이션은 마이애미 쪽의 도시 조직과 대붕괴기의 경험에서 뿌리를 찾을 수 있고, 일부 구성원은 수상 도시 건설에도 관여했다. 포크 네이션
