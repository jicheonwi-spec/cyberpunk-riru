은 시카고를 중심으로 한 도시 조직과 관계망을 바탕으로 노마드 사회에 들어왔다. 두 네이션은 도시의 기존 조직 구조가 이동하는 사회에서도 형태를 달리해 살아남을 수 있음을 보여 준다. 계보가 갱단에서 나왔다는 이유만으로 모든 가족의 생업과 2077년 선호를 똑같이 판단할 수 없다. 텔라스 네이션은 해양 생활을 기반으로 한 노마드 세력이다. 도로의 트럭 행렬과 달리 선박, 수상 거주지와 항만의 접점에서 이야기가 전개된다. 외부 당국이 해양 노마드를 해적으로 뭉뚱그려 부르는 기록과, 실제 각 공동체가 수행하는 이동·생업은 구별된다. 항만 기업의 부두, 오비탈 에어의 항공·우주 수송, 해양 노마드의 이동은 같은 운송 시장에 닿아도 서로 다른 조직과 통행 조건을 갖는다.","sources":[{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"노마드 일곱 네이션 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Seven_Nations"}],"priority":157},{"title":"에레보스와 구망 장비","group":"장비","keywords":["에레보스","Erebus","사이노슈어무기","블랙월무기"],"short":"자율 AI 연구의 무기화 사례","body":"에레보스는 밀리테크의 사이노슈어 기술과 관련이 있는 특수 기관단총이다. 작동이 평범한 화기의 탄도에 머무르지 않고 조건을 만족할 때 대상의 전자 장비와 신경에 블랙월 관련 효과가 나타난다. 이런 동작이 보고되었다는 사실과 그 원리를 운용자가 모두 이해한다는 주장은 구별한다. 칸토는 신경과 연결하는 사이버덱, 에레보스는 본체를 손으로 다루는 화기여서 접점이 각각 다르다. 시설 자료가 희소하며, 연구용 핵심 부품과 도시에 유통되는 양산 장비 사이에는 접근성·위험도의 큰 차이가 있다. 자율 AI가 관여한 기기의 말을 기업의 공식 안전 절차로 받아들이는 것은 위험하다. 소리가 나는 화기 고유의 기능과 신경에 전달되는 이상 반응은 물리적 발사 부분과 연구 기원의 장치를 각각 보아야 한다. 도그타운에서 특수 장비의 이름을 들었다는 사실만으로 같은 기체나 구성 부품을 어디서나 구할 수 있지는 않다. 에레보스의 기원으로 사이노슈어의 시설 자료가 언급된다.","sources":[{"label":"블랙월(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B8%94%EB%9E%99%EC%9B%94(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"사이버웨어/운영체제 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%9A%B4%EC%98%81%EC%B2%B4%EC%A0%9C"},{"label":"Cynosure · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cynosure"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":157},{"title":"다운타운 밤거리","group":"도시","keywords":["다운타운","세븐스헬","진구지","일렉트릭오르가슴"],"short":"호텔·부티크와 영업시간이 다른 유흥가","body":"다운타운은 기업 플라자의 본사 구역과 달리 호텔, 고급 상점, 식당, 나이트클럽의 비중이 크다. 진구지는 의류점이고 바이오테크니카 호텔은 체류 시설이다. 세븐스 헬은 전직 용병이 시작한 바, 일렉트릭 오르가슴은 별도의 클럽이다. 비슷한 네온 간판이라도 시설마다 가격대와 손님층, 경비와 예약의 기준이 다르다. 업무 시간이 끝나면 회사원, 접객 종사자, 관광객과 야간 경비의 이동이 교차한다. 무대와 VIP 공간에는 일반 손님이 직접 드나들 수 없다. 도심은 기업 플라자와 다운타운으로 나뉜다. 기업 플라자에는 아라사카 타워와 여러 본사, 고층 업무 시설이 몰려 있다. 다운타운에는 호텔과 의류점, 고급 클럽이 섞여 있어 근무 시간과 심야의 사람 흐름이 다르다. 2023년 핵폭발로 황폐해진 핵심부는 제염과 재개발을 거쳤다. 지상의 광장과 보행 공간, 연결 통로와 고가 교통, 건물 안의 사설 경비가 같은 장소 안에서도 서로 다른 접근 환경을 만든다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":158},{"title":"실종자와 납골당 기록","group":"거리 문화","keywords":["납골당","실종","추모","유품","기록"],"short":"도시의 추모와 사망 사실을 찾는 경로","body":"노스 오크의 납골당에는 여러 시민과 유명 인물을 기리는 표식이 남아 있다. 공식 수사 자료, 오랜 지인의 증언, 유품이나 추모 표식은 서로 다른 형태의 기록이다. 추모의 존재가 사망의 전말을 완전히 증명하지 않으며, 살아 있는지 확인되지 않은 사람과 이미 사망한 사람을 같은 상태로 단정해서는 안 된다. 가족의 사적인 기억과 언론의 보도, 기업의 내부 문서는 같은 사건에서 서로 다른 부분을 드러낼 수 있다. 픽서는 지역 인맥에서 정보를 모으고 언론인은 취재와 공개를 통해 다른 청중에게 전달한다. 회사 내부 문서, 경찰의 현장 보고, 데이터 샤드의 기록과 거리에서 들은 소문은 접근 경로와 검증 가능성이 다르다. 정보는 거래를 성사시키거나 상대의 판단을 바꾸는 자산이 되지만 기록된 내용의 진술 시점과 누가 남겼는지를 확인해야 한다. 방송이나 단말에 표시된 하나의 메시지만으로 증언 사이의 모순이 해소되지는 않는다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"나이트 시티 경찰국 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0%20%EA%B2%BD%EC%B0%B0%EA%B5%AD"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"픽서 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Fixer"}],"priority":158},{"title":"장비 등급과 신화 분류","group":"장비","keywords":["장비등급","신화무기","Iconic","특주장비","개조형"],"short":"양산 장비와 소수 변형의 분류","body":"신화 장비라는 분류에는 일반 모델을 개조한 물건과 원래 별도의 양산형이 없는 제품이 모두 들어간다. 색과 모양, 각인, 특정 인물의 사용 기록과 함께 기본형에 없는 성질이 붙는다. 희귀한 장비라는 표시와 재료 및 부품의 등급은 서로 다른 정보이므로, 예전에 이름난 무기가 그 시점의 모든 최신 양산품보다 우수하다고 단정하지 않는다. 일반형의 구조를 물려받은 경우에도 세부 기능과 부속 호환, 정비 이력이 다를 수 있다. 장비상의 색상과 수치는 제품 간 비교를 쉽게 하는 메뉴 표식이므로, 도시의 무기상이 쓰는 이름이나 회사의 품질 표기와 넓은 뜻에서 분리한다. 길거리의 통칭에 붙은 의미가 기업의 품질 분류보다 물건의 소문을 더 잘 전달하는 경우도 있다. 구입 당시의 품질, 사용하면서 생긴 개조 흔적과 특정 소유자에게 귀속된 자료를 함께 읽으면 두 이름을 같은 표로 섞지 않는다. 제품 분류와 도색의 특수성은 서로 독립된 단서가 될 수 있다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Iconics · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Iconics"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":158},{"title":"개조형 XMOD2 계열","group":"장비","keywords":["XMOD2","개조슬롯","제한변형","무기개조"],"short":"설계를 바꾸기 쉬운 일부 신화 장비","body":"X-MOD2 표기가 붙는 변형은 개조 부품을 활용할 수 있도록 설계를 수정한 신화 계열이다. 아킬레스와 MA70 HB, 기요틴, 야구 방망이 등 서로 다른 형태에 같은 표기가 붙은 사례가 있다. 이름이 같다는 점은 구조 변경을 위한 제품 전략을 가리키며, 탄약이나 부속까지 모두 같은 장비를 뜻하지 않는다. 장착 부품의 이력과 구입 당시의 기본 구성은 각각 확인한다. 일반 개조 슬롯, 교체 가능한 광학 부속, 몸에 이식하는 조준 보조기는 서로 다른 층에서 작업하는 장비다. 개조품의 일련번호와 부품 조합에 손을 거친 흔적이 남는다. 양산 총에서 광학 부속만 바꾼 흔적과 내부의 기본 구조를 바꾼 결과는 수리 기록의 서로 다른 줄을 차지할 수 있다. 특정 플랫폼을 최적화한 사양과 일반 상인에게 나온 표준형은 동일한 차대나 외형을 공유하더라도 내부 부품 선정에서 갈린다. 무기별로 호환되는 부품이 각각 정해져 있어 X-MOD2 표기는 범용 규격과 구분한다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"},{"label":"Cyberpunk 2077 Attachments and Modifications · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Attachments_and_Modifications"},{"label":"Cyberpunk 2077 Iconics · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Iconics"}],"priority":159},{"title":"중국과 캉 타오","group":"국가와 공권력","keywords":["중국","캉타오","군수수출","테크노아시아"],"short":"중국권 산업과 스마트 무기 시장","body":"중국의 정치·경제는 사이버펑크 연표의 국가 변화와 함께 움직였으며, 2077년 나이트 시티에는 중국계 기업의 제품과 직원이 진출했다. 캉 타오는 독자적인 기업 경영과 군수 산업을 둔 스마트 무기 업체다. 일본의 아라사카, 북미의 밀리테크와 경쟁에 참여하지만 사업 목표와 제품군은 일치하지 않는다. 중국의 국가 정책, 도시의 중국계 생활권, 캉 타오의 나이트 시티 거점과 기술 계약은 서로 다른 층위에서 취급한다. 연표에는 1990년대 중국의 내전, 주변국과의 군사 협력과 갈등, 4차 기업 전쟁 무렵 홍콩의 파괴가 포함된다. 2077년에는 전략 자원과 주변 권역을 두고 신소련 등과 경쟁하는 국가로 기록된다. 나이트 시티 도심의 캉 타오 지사는 이런 큰 산업권의 해외 기업 거점이다. 리틀 차이나는 현지의 생활·상업 구역이므로 회사 지사나 중국 정부의 행정 구역처럼 처리할 수 없다. 회사의 상표나 제품 모델로 출신 국가의 국적도 판단할 수 없다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"캉 타오 · 나무위키","url":"https://namu.wiki/w/%EC%BA%89%20%ED%83%80%EC%98%A4"}],"priority":159},{"title":"아라사카 사업 부서","group":"기업","keywords":["무기제조부","은행부","사이버웨어제품부","일반제조부","접객"],"short":"은행·제조·시술 상품과 접객 사업","body":"아라사카의 무기 제조와 사이버웨어 제품, 일반 제조·식품·광고는 부서별 제품군이 다르다. 은행부의 금융 거래, 콘페키 플라자의 접객, 사설 경비와 대정보 업무도 대외 관계가 서로 다르다. 일반 판매 제품을 산 소비자가 회사 내부 기술의 연구 내역을 볼 수 있는 것은 아니다. 도쿄 본사, 나이트 시티 타워, 산업 단지, 호텔 간에는 같은 이름을 달아도 시설 내부의 업무와 담당자가 나뉜다. 기업 직원의 카드, 외부 용역 계약, 방문객의 초대는 대개 서로 다른 공간에 접근할 수 있게 한다. 금융과 경비, 의료와 식품 연구처럼 같은 법인의 사무 영역도 업무 구조 및 기밀 수준은 다르다. 공식 부서에서 빼낸 장비와 기업 외부 시장에 정식으로 판매한 제품은 소유 확인이 달라진다. 거래 상대나 중개인은 연락망을 보유할 수 있으나 해당 회사의 공식 지위를 갖는 것은 아니다. 회사 부지 밖에서도 계약의 책임 관계가 남는다.","sources":[{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"},{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":160},{"title":"제작 사양서와 장비 유통","group":"장비","keywords":["제작사양서","장비유통","무기상","장비부품","총기제작"],"short":"같은 설계의 제작본과 거래품 구분","body":"무기상에서 사거나 기업이 지급한 장비, 인수한 사양서에 따라 제작한 장비는 제조 번호가 비슷해도 유통의 배경이 다르다. 사양서에는 특정 모델이나 변형을 만드는 데 필요한 구성이 기록되고, 시장에서 구하는 완성품은 조립된 부속과 보관 상태를 함께 물려받는다. 의뢰 보수로 받은 이름 붙은 장비는 시중의 동일 계열 양산품과 소유 이력이 다르다. 판매자가 가진 개조품과 쓰다 버린 군수품의 신뢰성을 비교할 때는 품질과 부속의 구분, 출처를 함께 보아야 한다. 부속을 갈았다고 제작사의 상표나 기록이 다른 물건이 되는 것은 아니므로 정비 흔적도 남는다. 출처를 확인할 수 있는 납품 증표가 있더라도 그 부품이 사건 당시에 달려 있던 상태는 별도의 기록이다. 구매한 지 얼마 되지 않은 새 장비와 회사가 회수한 오래된 물품은 사용할 수 있는 부속과 도시의 정비망이 달라질 수 있다. 제작 사양으로 남은 물건과 누군가 이미 사용한 완성품의 상태는 각각 확인한다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":160},{"title":"무기 부착물과 내부 개조","group":"장비","keywords":["총기부착물","스코프","소염기","개조부품","무기슬롯"],"short":"외부 부속과 내부 특성 변경의 차이","body":"광학 조준기, 총구 부속, 내부의 특성 변경 부품은 모두 무기 성능에 영향을 주지만 설치 대상과 기능이 다르다. 조준기는 보여 주는 화면을 바꾸고, 총구 부속은 발사 때의 겉으로 드러나는 특성에 관여한다. 내부 개조는 탄이 취하는 성격이나 연동 효과를 바꾸는 사례가 있다. 제품에 따라 스코프 단자 자체가 다른 경우가 있고, 스마트 무기에는 손·안구와 연결되는 별도 조준 장비가 들어간다. 현장에서는 부착물이 찍힌 사진만으로 기본 무기와 교체된 내부 부품을 모두 확인하기 어렵다. 정비 이력에서 기계가 어떤 방식으로 변했는지 찾아볼 수 있다. 외관을 다시 칠한 흔적과 총열 위에 광학 조준 경통을 달았던 물리적인 흔적은 서로 다른 통로로 남는다. 신화 변형이 기본형보다 더 많은 개조를 허용하는 경우와 조립 규격이 봉해진 경우를 각각 해당 제품의 자료에서 확인한다. 조준경의 교환 흔적과 내부 구조의 변경은 제품 등록과 별도 정비 자료에서도 확인한다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"Cyberpunk 2077 Attachments and Modifications · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Attachments_and_Modifications"}],"priority":161},{"title":"텔라스 해양 노마드","group":"세력","keywords":["텔라스","해양노마드","수상거주","해상운송"],"short":"도로 대신 바다를 생활 기반으로 삼는 네이션","body":"텔라스 네이션은 해양 생활을 기반으로 한 노마드 세력이다. 도로의 트럭 행렬과 달리 선박, 수상 거주지와 항만의 접점에서 이야기가 전개된다. 외부 당국이 해양 노마드를 해적으로 뭉뚱그려 부르는 기록과, 실제 각 공동체가 수행하는 이동·생업은 구별된다. 항만 기업의 부두, 오비탈 에어의 항공·우주 수송, 해양 노마드의 이동은 같은 운송 시장에 닿아도 서로 다른 조직과 통행 조건을 갖는다. 블러드 네이션은 마이애미 쪽의 도시 조직과 대붕괴기의 경험에서 뿌리를 찾을 수 있고, 일부 구성원은 수상 도시 건설에도 관여했다. 포크 네이션은 시카고를 중심으로 한 도시 조직과 관계망을 바탕으로 노마드 사회에 들어왔다. 두 네이션은 도시의 기존 조직 구조가 이동하는 사회에서도 형태를 달리해 살아남을 수 있음을 보여 준다. 계보가 갱단에서 나왔다는 이유만으로 모든 가족의 생업과 2077년 선호를 똑같이 판단할 수 없다.","sources":[{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"노마드 일곱 네이션 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Seven_Nations"}],"priority":161},{"title":"광학 조준기 제품 분류","group":"장비","keywords":["광학조준기","그랜드스탠드","클리어뷰","칸노네","프로스펙타"],"short":"거리별 시야와 호환 규격을 가르는 부속","body":"단거리용과 장거리용 스코프, 저격용 광학 장비는 표적을 또렷이 보는 거리와 조준 화면의 구성이 다르다. 밀리테크 칸노네 미니와 타입 2067은 단거리용으로, 그랜드스탠드와 클리어뷰는 장거리용으로 분류된다. 프로스펙타와 칸노네 맥스는 저격용 광학 계열이다. 광학 표시 때문에 무기의 투사체가 자동으로 표적을 따라가는 것은 아니며, 그런 일을 맡는 스마트 센서와 손 링크는 별도 부류다. 확대가 잘되는 안구를 장착했을 때도 총에 맞는 광학 부속의 접근성과 장착 규격은 그 모델의 물리적인 조건을 따른다. 짧은 조준경이 보이는 외관을 근거로 발사 계열을 단정하기는 어렵다. 조준경으로 멀리 볼 때 확보되는 광학 정보와 표적의 움직임에 따라 링크가 계산하는 정보는 다른 경로다. 손에 붙는 탄도 보조 부품이 가까운 벽을 표시했다고 속이 들여다보이는 것은 아니며, 경통의 성능과 표시의 근원은 장비 모델에 달렸다.","sources":[{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Attachments and Modifications · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Attachments_and_Modifications"}],"priority":162},{"title":"시민의 의료 접근","group":"거리 문화","keywords":["의료접근","리퍼닥","보험등급","클리닉","미트왜건"],"short":"응급 회수·병원·보철 치료의 구분","body":"나이트 시티에서 부상이나 통증에 대응하는 경로는 가입 보험, 개인 비용, 거리와 구역 상황에 따라 달라진다. 보험 회수 차량, 일반 병원, 리퍼닥의 시술실, 임시 진료는 같은 서비스를 제공하지 않는다. 회사의 직원 지원과 개인의 의료 계약은 진료 범위가 다르며 도그타운에서는 도시의 평범한 구급 대응에 기대기 어렵다. 보철 부품의 가격과 수술 후 관리 상태는 장비의 정식 작동이나 개인 건강을 좌우한다. 리퍼닥은 사이버웨어를 제거하거나 설치하고 환자의 상태와 호환성을 확인한다. 치료 목적의 보철과 기업형 성능 개조, 중고 부품을 쓰는 비공식 시술은 가격과 위험, 후속 관리가 다르다. 빅터의 클리닉과 기업 의료 시설, 도그타운 안의 사설 진료는 고객층과 계약 조건부터 다르다. 수술은 물건을 골라 계산하는 소매 구매와 달리 전문 인력, 수술 시간과 회복을 필요로 한다. 기계 고장과 사람의 상태는 별도로 점검한다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":162},{"title":"웰스프링스와 해안","group":"도시","keywords":["웰스프링스","불워크","해안상권"],"short":"헤이우드에서 번화한 해안 주거·상업지","body":"웰스프링스는 헤이우드 서쪽 해안 쪽에 놓인 비교적 잘 관리되는 상업·주거지다. 수변의 상점과 음식점, 큰 건물과 보행 공간이 이어진다. 불워크는 이 지역에서 확인되는 장소이며 동쪽 비스타 델 레이의 소규모 생활 상권과 풍경이 다르다. 보다 정돈된 겉모습에도 주변 헤이우드의 조직과 도시 치안이 동시에 영향을 준다. 해안 상권을 오가는 손님, 근무자, 주거 단지 입주민의 이동 경로와 기대하는 경비 수준은 구별된다. 웰스프링스는 서쪽의 해안 상권과 비교적 정돈된 주거가 두드러진다. 글렌에는 시청과 상업 공간, 엘 코요테 코호가 있다. 비스타 델 레이는 작은 점포와 생활 시장, 낙후된 건물의 밀도가 높다. 발렌티노의 연고와 가족 관계가 일상 거래에 영향을 주며, 일부 경계 지역에서는 식스 스트리트의 압력도 느껴진다. 도심에 닿는 구역과 남동쪽 골목의 건물 상태 및 공권력 접근성 차이가 헤이우드의 큰 특징이다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":162},{"title":"소음기와 총구 부속","group":"장비","keywords":["소음기","타이판","세투스","스트릭스","총구부속"],"short":"총기 종류별로 호환되는 외부 장비","body":"타이판과 세투스, 스트릭스 같은 소음기는 총구에 부착되는 장비의 종류다. 총구 화염과 소리, 반동이나 조준 안정에 관여하는 다른 부속은 무기가 가진 규격과 호환 범위가 다르다. 스마트·테크 계열의 발사 방식은 특정 파워 모델과 같은 총구 부속을 허용하지 않는 경우가 많다. 소리를 줄이는 장비를 사용한 흔적이 있어도 가까운 움직임이나 표면 충격, 영상에 남은 것은 개별 증거로 남는다. 외부 부속은 무기의 기본 제조사나 동작 원리를 일괄해서 바꾸기보다 현장에서 드러나는 특정 성능에 차이를 만든다. 사용 기록을 확인하는 데에는 본체와 부착 부품을 따로 식별하는 것이 중요하다. 총구에 붙은 제품의 길이와 모양은 감시 영상에서도 직접 볼 수 있으나 내부의 효과는 제조사의 표기나 구입 자료와 대조한다. 소리가 작게 기록된 이유에는 주변 소음과 거리가 포함되어 외장에 달린 물건을 함께 확인하는 것이 중요하다.","sources":[{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Attachments and Modifications · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Attachments_and_Modifications"}],"priority":163},{"title":"한반도와 전자산업","group":"국가와 공권력","keywords":["한반도","한국","서초일렉트로닉스","전자산업"],"short":"한국의 설정과 나이트 시티의 한국계 기술","body":"작중 한국은 제2차 한국전쟁 뒤 통일됐으나 4차 기업 전쟁을 거치며 다시 갈라졌고, 2070년 무렵 재통일됐다. 주요 도시로 서울·평양·인천이 거론되며, 부산은 4차 기업 전쟁 당시 사고 이후 봉쇄된 지역으로 전해진다. 자동화 설비가 여전히 부산에서 가동된다는 이야기는 방송 출연자도 의심하는 소문이다. 서초 일렉트로닉스는 한국계 전자·사이버웨어 기업으로 나이트 시티에서 제품을 판매한다. 평양은 부산의 기능이 사라진 뒤 위상이 커졌고 인천은 대외 교역과 연결된다. 통일 뒤 군 경력 집단이 사회 상층부에 진출했다는 설정이 있다. 서울 중심의 국가 기관과 군수 협력, 서초 일렉트로닉스가 만든 민간 전자제품은 각각 국가·군·기업의 다른 활동이다. 일본과의 교역이 이어져도 과거 기업 전쟁에서 어느 회사를 지원했는지는 별개다. 부산의 피해 규모와 기계 운용 상태는 게임 속 기록과 방송에서 전해지는 서술을 구분한다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":163},{"title":"밀리테크의 군수 물류","group":"기업","keywords":["군수물류","밀리테크보급","스타우트","길크리스트","부품계약"],"short":"군수 제조부터 재고와 책임 조사까지","body":"밀리테크에는 무기 제조와 군사 계약 외에 보급·수송, 정보, 경비, 내부 조사 계통이 있다. 공식 장비의 반출과 거래 과정에는 책임자와 계약 서류가 붙는다. 메레디스 스타우트와 앤서니 길크리스트가 얽힌 물류 문제는 회사 안에서 정보와 책임이 정치적 도구가 될 수 있음을 보여 준다. 도난 장비를 쓴 거리 집단과 정식 부대는 같은 회사 지휘를 받지 않는다. 프로젝트의 기밀성과 현장 인력의 위험 부담도 별도로 결정된다. 밀리테크는 군수 제조와 무장 경비, 계약 병력을 보유한 대기업이다. 신미합중국과의 긴밀한 조달·인력 관계는 통일 전쟁에서 연방과 함께 움직인 이력에서 드러난다. 아라사카와는 과거 대규모 기업 전쟁의 경쟁자다. 2077년에도 물류와 내부 감사, 비밀 프로젝트, 경비가 나뉘어 움직인다. 메레디스 스타우트가 처리하는 회사 내부 문제와 국가 지도부의 외교 결정은 같은 일이 아니다. 도그타운의 바게스트는 현재의 밀리테크 부대와 구별된다.","sources":[{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":164},{"title":"특수 개조품의 용도","group":"장비","keywords":["팍스","파이어크래커","월펀처","해카토미","세버런스"],"short":"실탄·테크·스마트·날붙이용 부품","body":"팍스는 무기의 효과를 비살상 제압에 맞추는 개조품이다. 특별한 코어와 연결되는 개조로는 파워용 파이어크래커와 테크용 월펀처, 스마트용 해카토미, 근접 무기용 세버런스가 있다. 파이어크래커는 폭발 효과가 있는 탄, 월펀처는 충전형 무기의 장벽 관통, 해카토미는 명중 시 퀵핵과 연계되는 효과에 집중한다. 세버런스는 날붙이 등 근접 장비가 내는 손상에 관계한다. 서로 같은 코어 연구에서 비롯될 수 있어도 받아들이는 본체와 나타나는 현상이 다르다. 단일 장비에 붙은 이름만으로 같은 고급 부품이 여럿 달려 있다고 판단하기 곤란하다. 키메라 코어에서 파생된 개조품의 전자적 능력은 그 이전에 같은 회사가 판매하던 기본형과 기록의 성격이 다르다. 팍스의 목적인 제압과 열이나 관통에 관계하는 부품의 목적은 따로 기록하며, 금속 부분에 붙은 제조사 표시는 호환성을 알아보는 출발점이다. 같은 밀리테크 코어에서 유래한 부품끼리도 호환 대상은 다르다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버펑크 2077/장비/총기 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84/%EC%B4%9D%EA%B8%B0"},{"label":"Cyberpunk 2077 Attachments and Modifications · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Attachments_and_Modifications"}],"priority":164},{"title":"브라이트 패밀리","group":"세력","keywords":["브라이트패밀리","사울","팬앰","알데칼도캠프","스콜피온"],"short":"배드랜드에서 물류와 자치를 지키는 가족","body":"사울 브라이트가 이끄는 알데칼도 패밀리는 배드랜드에서 이동 캠프와 차량을 바탕으로 활동한다. 사울이 고정 계약과 장기 생존에 무게를 둘 때 팬앰은 기업에 의존하는 방식과 개인의 자유를 놓고 반발할 수 있다. 미치와 스콜피온은 전쟁 경험과 기계 작업으로 가족 내부와 연결된다. 가족의 노선에 이견이 있어도 캠프의 안전, 자원, 차량 정비는 공동의 과제다. 네이션과 이 패밀리의 현재 지도부는 같은 범위가 아니다. 알데칼도는 후안 알데칼도가 이끈 로스앤젤레스의 도시 노동자와 공동체에서 출발한 오래된 노마드 네이션이다. 북미의 여러 패밀리가 이름을 공유하며, 나이트 시티 배드랜드에는 사울 브라이트의 패밀리가 활동한다. 이동, 호송, 차량 수리, 협상과 공동 자원 관리가 생존에 중요하다. 사회가 가족 중심이어도 기업 계약을 둘러싼 구성원의 판단은 갈라질 수 있다. 레이스 같은 라펜 쉬브와 공동 혈통 또는 같은 종류의 무장 집단이라 가정할 수 없다.","sources":[{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"알데칼도 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Aldecaldos"}],"priority":165},{"title":"장비의 네 피해 속성","group":"장비","keywords":["물리피해","열피해","전기피해","화학피해","상태이상"],"short":"기초 충격과 열·전기·화학 반응","body":"장비가 외부에 만드는 피해는 물리, 열, 전기, 화학의 네 가지로 설명된다. 물리는 충격·절단과 같은 손상, 열은 화상과 발열, 전기는 감전 및 기계 정지, 화학은 중독 같은 지속 상태와 이어질 수 있다. 특정 부위가 가해진 충격을 견디는 정도는 장갑, 재료와 보철 방식에 따라 다르다. 탄을 흔드는 총기와 연결을 교란하는 퀵핵, 몸 안에 든 팔 장비에서 비슷한 색이나 결과가 관찰될 수 있어 피해의 외양만으로 출처를 정하기는 어렵다. 하나의 모델이 다양한 물리적 기능을 가진 경우에는 장착된 변형과 그 장비가 당시 실제로 일을 했는지를 검사한다. 부상에 관계한 흔적을 좁힐 때 피부 아래에 피하 장갑이 있거나 회복 부품이 즉시 움직였는지도 살핀다. 불꽃을 본 증언과 실제로 어떤 장치가 열을 발생시켰는지에 관한 기계의 기록이 서로 다르면 별개의 단서로 남긴다. 기계가 받은 EMP 효과와 사람의 시야가 잠시 흐려진 결과는 시간과 부위가 다르게 기록될 수 있다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"},{"label":"사이버웨어/팔 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%ED%8C%94"}],"priority":165},{"title":"근접 무기의 구조 분류","group":"장비","keywords":["근접무기","블레이드","둔기","투척무기","근접장비"],"short":"날붙이·타격체·투척용 장비의 구분","body":"근접 장비는 날을 이용하는 카타나와 마체테, 무게로 충격을 전하는 방망이와 해머, 손에서 놓아 보내는 칼과 도끼 등으로 나뉜다. 투척 기능을 갖춘 장비가 다 날이 없다는 뜻은 아니고, 분류 기준에 조작 방식과 날의 유무가 함께 걸쳐 있다. 팔에 수납되는 맨티스 블레이드와 고릴라 암즈는 비슷한 거리에서 작동하지만 몸 안에 고정되어 있는 사이버웨어다. 거리에서 급히 든 공구와 장인이 따로 만든 칼의 성능과 거래 출처도 다를 수 있다. 외형에 같은 재료를 두르더라도 타격과 절삭을 위해 잡는 방식이 달라 보철과 발의 각도, 체격이 영향을 준다. 날이 달린 물건을 손에 쥐었을 때의 도달 범위와 발로 지면을 지지한 상태는 전신에 달린 부품의 동작과 연관된다. 공구가 평소부터 무기 판매점에 유통했는지, 근무 현장에서 즉석으로 가져온 것인지도 거리 기록에서 구분한다. 부피가 큰 타격 도구와 길게 뻗어 나오는 내장 칼날에는 보관과 휴대 방식의 차이도 있다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"},{"label":"사이버웨어/팔 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%ED%8C%94"}],"priority":166},{"title":"글렌과 시청권","group":"도시","keywords":["글렌","시청","엘코요테코호","라카트리나","엠버스"],"short":"시청과 지역 공동체의 접점","body":"글렌에는 나이트 시티 시청과 공공 공간이 있고, 지역 상점과 고급 접객 시설이 함께 있다. 엘 코요테 코호는 웰즈 가족과 헤이우드 주민의 접점인 바다. 라 카트리나, 엠버스, 파드레의 거점은 각기 다른 고객과 목적을 가진 장소다. 시청은 도시의 공식 행정과 선거 정치가 작동하는 기관이며, 주변 바와 상점은 지역 관계와 소문이 돌고 도는 생활 기반이다. 두 권력층이 같은 거리에서 만나도 같은 담당자나 승인 경로를 거치지 않는다. 엘 코요테 코호는 글렌에서 웰즈 가족과 지역 주민의 관계가 드러나는 바다. 마마 웰즈와 재키의 생활권에 있는 장소로, 비즈니스 축의 고급 클럽과 달리 오래 찾아온 손님과 친척의 기억이 쌓인다. 주변 사람들의 만남과 추모, 술자리와 연락이 가능한 공간이며, 같은 글렌의 엠버스나 시청과는 성격이 다르다. 여러 세대가 공유하는 단골 관계는 갱단의 직급이나 기업 계약만으로 설명되지 않는다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":166},{"title":"도시의 정보 거래","group":"거리 문화","keywords":["연락책","정보거래","기자","데이터샤드","소문"],"short":"거리 소문·기업 자료·언론의 접점","body":"픽서는 지역 인맥에서 정보를 모으고 언론인은 취재와 공개를 통해 다른 청중에게 전달한다. 회사 내부 문서, 경찰의 현장 보고, 데이터 샤드의 기록과 거리에서 들은 소문은 접근 경로와 검증 가능성이 다르다. 정보는 거래를 성사시키거나 상대의 판단을 바꾸는 자산이 되지만 기록된 내용의 진술 시점과 누가 남겼는지를 확인해야 한다. 방송이나 단말에 표시된 하나의 메시지만으로 증언 사이의 모순이 해소되지는 않는다. 노스 오크의 납골당에는 여러 시민과 유명 인물을 기리는 표식이 남아 있다. 공식 수사 자료, 오랜 지인의 증언, 유품이나 추모 표식은 서로 다른 형태의 기록이다. 추모의 존재가 사망의 전말을 완전히 증명하지 않으며, 살아 있는지 확인되지 않은 사람과 이미 사망한 사람을 같은 상태로 단정해서는 안 된다. 가족의 사적인 기억과 언론의 보도, 기업의 내부 문서는 같은 사건에서 서로 다른 부분을 드러낼 수 있다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"픽서 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Fixer"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"나이트 시티 경찰국 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0%20%EA%B2%BD%EC%B0%B0%EA%B5%AD"}],"priority":166},{"title":"카타나 특주품과 소유","group":"장비","keywords":["사토리","진추마루","뱌코","츠메토기","카타나"],"short":"알려진 주인과 사건에 얽힌 카타나","body":"사토리와 네한은 아라사카 사부로의 이름에 연관된 칼들이다. 진추마루는 오다의 일과 연결되며, 츠메토기는 전기 효과로 알려진 일본도다. 뱌코는 도약을 쉽게 하는 균형이 특징이고, 스캘펄은 산데비스탄과 연결해 설명되는 개조 장비다. 같은 일본도 형태여도 칼집, 담긴 이력과 기계적 보강이 같지는 않다. 칼날 표면에 열과 빛이 나타나는 에라타처럼 작업 방식에 따라 뚜렷이 보이는 변형도 있다. 현재 칼을 쥔 인물이 사건 당시에도 그 칼의 주인이었는지는 소유 기록으로 확인하며, 다른 시대의 사진에 비슷한 칼이 나타난다는 사실은 물건 이력의 단서에 머문다. 특정 칼날이 앞선 사건에서 접촉한 재료와 손상 흔적을 기록할 수 있다. 산데비스탄이 함께 돌아야 두드러지는 성질이 있는 스캘펄과, 보철과 별개로 자체 발열하는 에라타를 구분하면 주인이 무엇을 사용했는지도 더 정확히 설명된다. 가운데가 넓은 칼집과 원래 목적이 드러나는 칼의 장식도 소유의 단서다.","sources":[{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"},{"label":"Cyberpunk 2077 Iconics · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Iconics"},{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"}],"priority":167},{"title":"하이라이더 연맹","group":"국가와 공권력","keywords":["하이라이더","궤도연맹","우주노동자","크리스털팰리스"],"short":"궤도 주민의 자치와 지상 세력의 관계","body":"하이라이더는 지구 궤도와 우주 시설에 정착해 온 인구와 자치 세력을 가리킨다. 지상의 정부와 기업이 우주 노동과 물자를 통해 영향력을 행사했지만, 궤도 주민들은 별도의 정치적 이해를 형성했다. 4차 기업 전쟁 무렵의 궤도 거점 변화로 지구에서 우주 시설을 곧바로 지배하기 어려워졌다. 크리스털 팰리스 같은 궤도 시설, NCX의 발사 시설, 오비탈 에어의 운송 사업은 같은 공간에 걸쳐 있어도 서로 다른 권한에 속한다. 유럽 우주 의회의 오닐 정거장 건설 현장은 위험한 노동과 심한 통제를 겪었다. 정거장 노동자들이 이에 반발해 시설을 장악했고, 유럽 우주 의회와의 결별 과정은 7시간 전쟁으로 알려졌다. 연맹은 자치를 인정받았으나 궤도의 모든 주민과 기업을 같은 정권 아래 두지는 않는다. 지상 기업의 민간 우주편, 정거장 일자리, 하이라이더가 가진 주거와 정치적 권리는 나이트 시티의 공항 권한과 구분된다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"유럽 경제 공동체 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/European_Economic_Community"}],"priority":167},{"title":"민간 군수 제조사","group":"기업","keywords":["쓰나미디펜스","말로리안","켄다치","컨스티튜셔널","노코타"],"short":"전문화한 군수 공급 시장","body":"쓰나미 디펜스 시스템즈, 말로리안 암즈, 컨스티튜셔널 암즈, 노코타 매뉴팩처링, 켄다치는 각기 다른 제품으로 군수 시장에 존재한다. 일부는 고급 총기 또는 맞춤 주문, 일부는 생산 규모나 산업 소재, 일부는 칼날 같은 특화 시장으로 구별된다. 같은 판매점에서 물건을 판다고 기업들이 군대처럼 단일 지휘를 갖지는 않는다. 밀리테크와 아라사카의 정식 조달, 지역 소매의 재고, 출처가 불분명한 중고품은 다른 시장이다. 버짓 암즈, 다라 폴리테크닉, 로스토빅, 테크트로니카, 미드나이트 암즈는 군수 제조 업계에서 서로 다른 설계와 판매 경로를 갖는다. 버짓 암즈의 저가 지향 제품은 값비싼 소량 주문 제작품과 같은 고객을 겨냥하지 않는다. 다른 업체는 군과 전문 사용자용 제품으로 구별되기도 한다. 제조사와 실제 장비 소유 조직, 구매자의 합법적 승인 여부는 구별된다. 회사 소개에는 대표 상품의 종류와 시장을 함께 적어야 한다.","sources":[{"label":"기업 목록 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Corporation"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":168},{"title":"장검과 절삭 장비 종류","group":"장비","keywords":["에라타","레이저마체테","컷오매틱","볼코다브","마체테"],"short":"칼날과 특수 절삭 공구의 용도 차이","body":"카타나 형태의 에라타는 열을 드러내는 날을, 테크트로니카 레이저는 굵은 마체테형 칼날을 가진 장비다. 볼코다브는 레이저 계열의 특이한 열 효과로 알려진 변형이다. 컷오매틱은 버짓 암즈에서 유통한 동력 절삭기형 장비이며, 평범한 마체테·쿠크리와 달리 움직이는 부품이 뚜렷하다. 칼의 길이와 단단함이 비슷해도 무게, 발열, 동력이 필요한지, 작업 흔적이 어떤지를 따로 본다. 이름이 붙은 개별 개조품은 기본 설계의 장점과 이미 들고 있는 몸의 증강이 함께 드러난다. 몸에서 펼치는 맨티스 블레이드는 발끝의 위치와 팔의 움직임에 의존하는 내장 설계다. 한 회사의 제품 이름이 칼날의 특성을 보여 주더라도 그 칼이 보관 중에 자체적으로 발열하는지, 사용한 뒤에 바닥에 흔적을 남겼는지는 작동 이력을 확인한다. 절삭기에 필요한 동력과 손목이 감당하는 무게는 일반 장검의 재료와 구분된다. 동력이 꺼진 절삭기와 상시 날을 유지하는 칼은 장비 상태를 따로 본다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"},{"label":"Cyberpunk 2077 Iconics · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Iconics"}],"priority":168},{"title":"도그타운 바게스트 통치","group":"세력","keywords":["핸슨","베넷","야고","스타디움","지휘체계"],"short":"군 경력·물자 장사와 장벽의 군정","body":"바게스트의 최고 권위는 핸슨에게 있으며 체스터 베넷과 야고 서보는 군사와 사업에서 서로 다른 영향력을 보인다. 다저와 현장 부대, 일반 시장 상인도 각각 다른 권한을 가진다. 조직은 급여와 장비, 리퍼닥의 지원을 제공하며 대가로 복종을 요구한다. 검문 통행은 장벽 외부의 NCPD 배지나 도시의 민간 계약만으로 확보되지 않는다. 본편의 승계 후보와 역할은 참고할 수 있지만 통합 연표에서는 핸슨의 사망과 후임을 미리 확정하지 않는다. 바게스트는 통일 전쟁에서 활동한 커트 핸슨의 밀리테크 출신 부대가 핵심이었다. 정전 뒤에도 퍼시피카 일부를 떠나지 않고 도그타운을 지배했다. 옛 군인뿐 아니라 새 지원병, 용병과 다른 조직 출신이 들어온다. 스타디움과 검문소, 물자 거래, 현장 순찰을 직접 통제하며 나이트 시티 경찰의 일상적인 지휘를 받지 않는다. 대령과 부하들의 명령 체계가 거리 장사, 시장의 중개, 계약으로 출입하는 외부 인력에 여러 방식으로 작용한다.","sources":[{"label":"바게스트(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B0%94%EA%B2%8C%EC%8A%A4%ED%8A%B8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":169},{"title":"둔기와 충격 보조 도구","group":"장비","keywords":["둔기","전기곤봉","카나보","사스콰치해머","코튼마우스"],"short":"도구·곤봉·대형 해머의 계열","body":"전기 곤봉은 전원을 갖춘 제압 장비의 예이며, 코튼마우스처럼 특수 효과를 더한 모델도 있다. 카나보와 야구 방망이, 사스콰치의 해머는 두 손으로 다루는 부피와 무게가 있는 장비 사례다. 쇠파이프와 쇠지레처럼 원래 용도가 따로 있던 물건도 현장에서는 타격용 도구로 사용된다. 기계 팔이 몸의 무게를 받아 내며 던지는 힘과 도구 자체의 질량은 각각 타격에 관여한다. 어떤 전기 지팡이는 제압을 의도하고, 강한 타격이 남으면 물리적인 손상이 함께 나타날 수 있다. 개조품의 도색과 제품 브랜드가 이름으로 굳어진 경우에는 근접 기능과 소유자를 구별한다. 무거운 해머는 소유자의 자세와 힘이 크게 실리는지에 영향을 받는다. 전기 장비로 제압한 상황에서도 기기가 사람의 신경에 왜 반응했는지, 다른 보철에 영향을 주었는지 여부는 당시 전기 효과와 물리적 접촉을 함께 살핀다. 한 손으로 다루는 곤봉과 몸의 움직임을 크게 쓰는 양손 둔기는 취급 목적이 다르다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"},{"label":"Cyberpunk 2077 Iconics · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Iconics"}],"priority":169},{"title":"비스타 델 레이 생활권","group":"도시","keywords":["비스타델레이","디키트위스터","멜카도소노라","델라메인본부"],"short":"낙후된 주거와 시장·서비스 거점","body":"비스타 델 레이는 헤이우드 동쪽 생활권으로, 도시 중심과 가까운 곳에도 낡고 작은 건물이 몰린다. 멜카도 소노라는 재래식 상업 공간이며, 디키 트위스터는 지역의 유흥 업소다. 델라메인 본부는 차량 운행과 회사 기능이 결합한 시설이어서 주변 노점과 영업 방식이 다르다. 발렌티노의 영향과 구역 경계의 긴장이 공존한다. 거리 상인에게 보이는 공개 공간과 회사의 차량 정비 구역은 출입 자격과 감시 방식이 서로 다르다. 웰스프링스는 서쪽의 해안 상권과 비교적 정돈된 주거가 두드러진다. 글렌에는 시청과 상업 공간, 엘 코요테 코호가 있다. 비스타 델 레이는 작은 점포와 생활 시장, 낙후된 건물의 밀도가 높다. 발렌티노의 연고와 가족 관계가 일상 거래에 영향을 주며, 일부 경계 지역에서는 식스 스트리트의 압력도 느껴진다. 도심에 닿는 구역과 남동쪽 골목의 건물 상태 및 공권력 접근성 차이가 헤이우드의 큰 특징이다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":170},{"title":"중고 크롬과 장물","group":"거리 문화","keywords":["중고크롬","장물","밀수품","정식보증","불법시장"],"short":"출처·소유권·안전성이 다른 판매 경로","body":"중고 사이버웨어는 소유자가 교체하면서 내놓았거나 사기업과 교역망에서 재판매된 장비일 수 있다. 스캐빈저가 피해자에게서 빼낸 부품이나 기업 창고에서 흘러나온 장물은 따로 다루어야 한다. 거리 시장과 정식 판매점, 리퍼닥의 구형 재고는 보증과 수리, 호환 확인 방식이 다르다. 물건을 넘겨받았다는 사실이 특수 장비를 작동시킬 허가나 이전 소유자의 계정 권한을 자연스럽게 넘겨주지는 않는다. 리퍼닥은 사이버웨어를 제거하거나 설치하고 환자의 상태와 호환성을 확인한다. 치료 목적의 보철과 기업형 성능 개조, 중고 부품을 쓰는 비공식 시술은 가격과 위험, 후속 관리가 다르다. 나이트 시티에서 부상이나 통증에 대응하는 경로는 가입 보험, 개인 비용, 거리와 구역 상황에 따라 달라진다. 보험 회수 차량, 일반 병원, 리퍼닥의 시술실, 임시 진료는 같은 서비스를 제공하지 않는다. 회사의 직원 지원과 개인의 의료 계약은 진료 범위가 다르며 도그타운에서는 도시의 평범한 구급 대응에 기대기 어렵다.","sources":[{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":170},{"title":"투척용 칼과 도끼","group":"장비","keywords":["카이켄","네한","블루팽","헤드헌터","아가우"],"short":"작은 휴대물과 특수 투척 장비","body":"카이켄과 네한은 날이 짧은 투척용 무기이며, 네한은 사토리와 소유 기록 및 고유 효과가 연계된다. 블루 팽은 독성 관련 특성이 있는 칼이고, 헤드헌터는 펑크나이프를 바탕으로 한 개별 변형이다. 토마호크와 아가우처럼 도끼나 도구에 가까운 투척물도 있으며 아가우는 충격파가 특징인 예외적인 사양이다. 생체의 손을 떠난 장비에서 보이는 일과 근접한 상태에서 손에 쥔 채 쓰는 동작은 다르다. 쓰는 사람의 기술과 손에 연결된 보조 장비, 도구의 상태가 달라서 광고에서 보이는 기능을 모두 갖췄는지 따로 판단한다. 작은 칼은 같은 제품 통칭 아래에서도 시중의 평범한 물건과 특정 이름이 붙은 변형이 드러난다. 토마호크의 물리적 충격과 아가우의 특수 효과를 기록할 때는 실물의 흔적과 따로 입수한 제조 기록을 비교한다. 무기를 떨어뜨린 장소와 회수한 장소도 다른 단서이며, 추적에 쓰이는 모든 장비가 원래 소유자를 바로 증명해 주지는 않는다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"},{"label":"Cyberpunk 2077 Iconics · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Iconics"}],"priority":170},{"title":"남극과 극지 자원","group":"국가와 공권력","keywords":["남극","극지","자원기지","환경"],"short":"극지 개발과 지상 환경 변화","body":"남극은 사이버펑크 세계의 국제 자원과 환경 문제에 등장하는 장소다. 각국과 기업의 극지 이용은 나이트 시티가 직접 영유하는 사업으로 나타나지 않는다. 해수면 변화와 연안 피해는 북미뿐 아니라 유럽 등 다른 권역의 이주, 보험, 물류에 영향을 남긴다. 극지 개발, 해양 플랜트, 연료 생산, 궤도 수송은 세계적 공급 사슬에 들어가지만 서로 다른 기술과 시장을 필요로 한다. 남극의 세부 도시 행정이나 인구는 2077년 자료에서 확실히 확인되지 않는다. 네트워크 뉴스 54의 작중 보도는 2067년부터 이어진 남극 개척과 그 과정의 오염을 언급한다. 뉴스가 정착 사업의 번영을 내세우더라도 개척에 관여한 나라나 회사는 공개 자료만으로 특정하기 어렵다. 보도의 비교 수치와 실제 행정 관할은 별개의 문제다. 거주 가능한 시설의 공급에는 외부 운송과 기반 장비가 필요하지만, 얼음과 추위에 노출되는 극지의 생활권을 나이트 시티 배드랜드의 도로망과 동일하게 볼 수 없다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":171},{"title":"시야·신호 보조 수류탄","group":"장비","keywords":["섬광탄","연막탄","정찰수류탄","EMP수류탄","교란장비"],"short":"감시·가시성·기계에 영향을 주는 장비","body":"섬광탄은 시야를 흔드는 빛을, 연막탄은 시선을 막는 연기를 발생시킨다. 정찰 수류탄은 범위 안의 인원이나 대상을 확인하는 데 쓰이는 보조 장비이고, EMP 계열은 전자 장치와 보철에 큰 영향을 줄 수 있다. 개별 물품마다 식별 가능한 표식이나 유통사가 붙고 비슷한 형태라도 대상이 다른 모델이 있다. 기계가 멈췄다는 결과와 인공 안구를 낀 사람이 일시적으로 눈을 제대로 못 쓴다는 결과도 성격이 다르다. 시설 경보와 카메라에 어느 현상이 남았는지, 직접 목격한 사람은 어디에 있었는지 구분한다. 장치에 남은 물질과 기록은 사용된 장비의 계통을 찾는 단서다. 서로 다른 두 장비가 같은 곳에 사용됐을 때는 순간적인 밝은 빛과 장시간 머무는 연기의 범위, 기계가 연결을 끊은 시기를 따로 기록한다. 근처에서 작동한 안구 보철과 카메라가 같은 광경을 남기지 않을 수 있기 때문이다. 정찰 도구가 남긴 근거리 스캔과 현장 영상의 범위는 어긋날 수 있다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":171},{"title":"보급형 무기 제조사","group":"기업","keywords":["버짓암즈","다라폴리테크닉","로스토빅","테크트로니카","미드나이트암즈"],"short":"거리와 계약 시장의 서로 다른 가격대","body":"버짓 암즈, 다라 폴리테크닉, 로스토빅, 테크트로니카, 미드나이트 암즈는 군수 제조 업계에서 서로 다른 설계와 판매 경로를 갖는다. 버짓 암즈의 저가 지향 제품은 값비싼 소량 주문 제작품과 같은 고객을 겨냥하지 않는다. 다른 업체는 군과 전문 사용자용 제품으로 구별되기도 한다. 제조사와 실제 장비 소유 조직, 구매자의 합법적 승인 여부는 구별된다. 회사 소개에는 대표 상품의 종류와 시장을 함께 적어야 한다. 쓰나미 디펜스 시스템즈, 말로리안 암즈, 컨스티튜셔널 암즈, 노코타 매뉴팩처링, 켄다치는 각기 다른 제품으로 군수 시장에 존재한다. 일부는 고급 총기 또는 맞춤 주문, 일부는 생산 규모나 산업 소재, 일부는 칼날 같은 특화 시장으로 구별된다. 같은 판매점에서 물건을 판다고 기업들이 군대처럼 단일 지휘를 갖지는 않는다. 밀리테크와 아라사카의 정식 조달, 지역 소매의 재고, 출처가 불분명한 중고품은 다른 시장이다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"기업 목록 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Corporation"}],"priority":172},{"title":"파쇄·열·화학 투척물","group":"장비","keywords":["파쇄수류탄","가시수류탄","소이수류탄","몰로데츠","휴대투척물"],"short":"충격·열·화학 효과를 나누는 장비","body":"F-GX 파쇄 계열은 충격과 파편을 남기는 일반적인 투척 장비다. 밀리테크 CHAR는 열이 강한 소이 계열이며, 몰로데츠는 화학적 유해 효과가 있는 장비로 분류된다. GASH는 일반 파편과는 다른 빛줄기 효과를 특징으로 하는 개별 제품이다. 비슷한 크기의 통이라고 주변 장치가 같은 방식으로 오작동하거나 인체가 입는 손상까지 같지는 않다. 시야를 가리거나 적을 찾아 주는 정찰 계열은 효과의 목적부터 다르다. 사고나 폭력의 현장에서 어떤 제품이 있었는지는 가스·빛·기기 정지·물리 충격의 흔적과 목격 기록을 같이 확인한다. 같은 기능을 이름 없이 묶어 부르는 경우에도 물건의 제조명과 제품군을 구분한다. 화학 효과를 남기는 물질과 파편을 남긴 충격의 구분은 부상, 수리와 시설을 다시 개방하는 판단에 영향을 준다. 이름이 알려진 제조사 제품이라도 현장에서 확인한 사양과 출처는 기록한다. 유통 시장에서 쓰는 이름과 제조사의 표기는 별도 기록에 남는다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Weapons · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Weapons"}],"priority":172},{"title":"맥스닥과 바운스백","group":"장비","keywords":["맥스닥","바운스백","응급회복장비","흡입제","주사제"],"short":"회복 효과와 투여 방식이 다른 휴대품","body":"맥스닥은 흡입형, 바운스백은 주입형 휴대 응급 회복품으로 구분된다. 맥스닥은 즉각적인 회복을, 바운스백은 처음의 효과와 이어지는 회복을 함께 두는 계열이다. 장치가 몸 안에 연결되는 혈액 펌프는 이런 휴대품과 달리 손을 들어 직접 투여하는 동작 없이도 작동할 수 있다. 바이오 모니터는 몸의 위기를 읽어 다른 회복 장비가 움직이도록 제어하는 쪽이다. 종류별로 신체가 받는 반응과 의료상의 용도가 다르며, 애니메이션에서 쓰이는 이식 부작용 억제 목적의 약과도 구분한다. 초기 응급 반응을 유지한 뒤 오래 회복해야 하는 조직의 손상은 별도로 남는다. 몸이 스스로 하는 회복 과정에 개입하는 보조품은 최근 이식 수술이나 투약 기록에 따라 사용 상태도 달라진다. 전원을 켠 보철과 의료품을 함께 사용했을 때 자동 작동을 감지하는 것과 어떤 약제가 실제로 들어갔는지를 구별한다. 회복 보조기의 신호에 따라 같은 응급품이 몸에 곧장 들어가는 경우도 따로 기록한다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"사이버웨어/순환계 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%88%9C%ED%99%98%EA%B3%84"},{"label":"Cyberpunk 2077 Consumables · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Consumables"}],"priority":173},{"title":"멜스트롬 파벌과 거점","group":"세력","keywords":["덤덤","패트리샤","브릭","로이스","올푸드"],"short":"지도권 경쟁과 산업 구역의 거점망","body":"로이스와 브릭의 지도권은 멜스트롬 전체가 일치된 조직이 아니라는 점을 보여 준다. 덤 덤은 내부 거래 현장과 접점이 있는 구성원이며 패트리샤도 독자 판단을 할 수 있다. 올 푸드 공장 같은 산업 시설은 물건과 현장 인력이 모이는 장소이고, 토텐탄츠 클럽의 손님과 내부 관리자는 같은 자격이 아니다. 갱단의 명성, 지도자의 협상 조건, 개인 간의 충성은 구별된다. 기업이 만든 장비가 갱단의 손에 들어와도 정식 회사 지휘를 받지는 않는다. 왓슨 북부 공업권의 폐공장과 창고는 중고 기계와 장물, 정식 제조품이 교차할 물리적 거점을 제공한다. 멜스트롬은 과격한 크롬 도입과 관련 있지만 임플란트 사용자가 모두 조직원이 되는 것은 아니다. 정식 일련번호와 보증, 불법 판매자에게서 얻는 신분 불명의 제품은 같은 위험을 갖지 않는다. 외부 계약자의 물품, 내부 지도부가 소유한 장비, 조직원의 개인 이식은 별개의 거래 대상이다. 공장 출입구와 접객 장소의 공개성도 다르다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"멜스트롬 · 나무위키","url":"https://namu.wiki/w/%EB%A9%9C%EC%8A%A4%ED%8A%B8%EB%A1%AC"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":173},{"title":"나이트 시티 공연 공간","group":"거리 문화","keywords":["라이엇","토텐탄츠","세븐스헬","클럽","공연장"],"short":"무대와 경비, 소유가 다른 밤 문화","body":"라이엇과 토텐탄츠, 세븐스 헬은 서로 다른 구역과 손님층에 속한다. 토텐탄츠는 멜스트롬과 연결되며, 애프터라이프는 공연 위주 클럽과 달리 용병 거래와 평판이 중요하다. 네온 간판의 유사성만으로 운영 조직이나 방문자의 목적을 알 수 없다. 대관 행사나 음악 공연, 픽서가 주선한 만남은 같은 장소에서도 층과 예약, 경비의 업무가 달라진다. 손님이 마신 술과 실제 사업 책임자의 사적 약속은 같은 기록으로 남지 않는다. 돌은 장비를 매개로 고객의 요구에 응답하는 서비스와 결합한 업소 종사자다. 조이토이라는 표현은 도시의 성인 서비스 노동 전반을 가리키는 맥락에서 쓰인다. 클라우드 같은 업소에는 종사자뿐 아니라 경비, 관리자, 수익을 배분받는 조직이 있다. 영업 규정과 노동자의 안전 또는 동의를 같은 것으로 취급해서는 안 된다. 가부키 리지의 바와 재팬타운의 클라우드는 위치, 경영, 서비스의 세부가 서로 다르다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":174},{"title":"아로요 산업 시설","group":"도시","keywords":["아로요","인더스트리얼파크","교도소","레드더트"],"short":"공장·발전 설비·수감 시설의 산업권","body":"아로요에는 발전과 생산 시설, 오래된 공장 잔해, 대형 기업의 전용 경비 구역이 섞여 있다. 아라사카 인더스트리얼 파크는 운영 경계를 가진 기업 시설이고, NC 교도소는 별도의 수감 시설이다. 레드 더트와 같은 바는 작업을 마친 사람과 거리 인력이 들르는 사적 공간이다. 같은 산업 도로라도 교도소와 자재 반입구, 영업 중인 점포는 출입 규정이 일치하지 않는다. 배수로와 물류 도로, 폐시설의 철책은 시가지 교통을 산업 구조에 맞춰 가른다. 아로요는 발전소와 공장, 아라사카 인더스트리얼 파크 같은 산업 시설이 모인 지역이다. 란초 코로나도는 노동자 주거와 상업 시설이 있는 교외형 지구로, 회사가 개발한 주택 단지의 영향이 남아 있다. 오래된 산토 도밍고는 4차 기업 전쟁의 핵심 피해 지대에서 떨어져 있어 피난민 정착지와 재건 산업의 기반이 됐다. 2077년에 운영 중인 작업장과 방치된 공장은 한 지구 안에 공존한다.","sources":[{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":174},{"title":"일시 증강 보급품","group":"장비","keywords":["옥시부스터","램졸트","스태미나부스터","용량부스터","블랙레이스"],"short":"특정 능력 유지와 생리적 대가","body":"휴대형 부스터에는 수중 환경에 쓰이는 옥시 부스터, 가용 RAM을 지원하는 램 졸트, 피로 회복을 돕는 스태미나 부스터, 무게를 다루는 용량 부스터가 있다. 지속 시간이나 작용하는 신체 조건은 각각 다르고 머리나 골격에 영구히 이식된 부품과 구별된다. 블랙 레이스처럼 거리에서 유통되는 약물에는 강한 신체·정신 반응과 사회적 위험이 따른다. 의료용 흡입제에 적힌 이름과 검은 시장의 부호가 비슷해도 같은 성분이나 공급망으로 단정하지 않는다. 한 부스터의 효과가 끝난 뒤 나타난 증상과 장기적인 크롬 부작용의 원인을 따로 기록한다. 수중에서 장비를 쓰는 한정 조건과 같은 기능에 대한 약제가 지속되는 시간은 보철의 시술 위치를 읽는 일과 다르다. 일할 동안 짧게 쓰는 용품을 계속 복용했을 때의 결과나 제품이 암시장에 들어온 이력을 살필 경우 현재 몸에 남은 부담을 별도로 본다. 장시간 쓰는 부스터가 체내에 남기는 부담은 제품별로 다르다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Consumables · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Consumables"},{"label":"사이버웨어/순환계 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%88%9C%ED%99%98%EA%B3%84"}],"priority":174},{"title":"경찰 순찰과 교통","group":"국가와 공권력","keywords":["순찰과","교통순찰","도보순찰","경찰배지"],"short":"신고 접수와 거리·도로의 초동 대응","body":"NCPD 순찰과는 담당 구역의 도보 경계와 교통 감시, 신고에 대한 초기 대응을 담당한다. 소수 인원이 일상 범죄 현장에 먼저 도착할 수 있으나 중무장 조직과 장기 대치하는 것은 전술 조직의 임무다. 도보 순찰과 교통 순찰은 마주치는 사건 유형과 담당 동선이 다르다. 동네의 치안 우선순위에는 예산, 인력, 기업 후원이 영향을 준다. 출동 시간과 경비 규모는 지역과 사건의 위험에 따라 일률적이지 않다. NCPD는 나이트 시티의 경찰 조직으로, 순찰과·수사과·전술과가 서로 다른 현장에 대응한다. 나이트 코프의 후원과 아라사카·밀리테크 같은 대기업의 힘이 경찰이 행사할 수 있는 권한에 영향을 준다. 인력·예산 부족, 부패, 과중한 사건 업무가 있더라도 모든 대원이 같은 태도를 보이지는 않는다. 기업 관할 구역과 도그타운은 일반 시가지와 다른 접근 조건을 갖는다. 중무장 사건과 사이버 사이코 사건에는 전문 전력이 투입된다.","sources":[{"label":"나이트 시티 경찰국 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0%20%EA%B2%BD%EC%B0%B0%EA%B5%AD"}],"priority":175},{"title":"방탄 외투와 작업복","group":"장비","keywords":["방탄외투","방탄마스크","보호조끼","넷러너복","작업복"],"short":"일상 복장과 기능성 보호 장구","body":"나이트 시티의 복장은 머리와 얼굴 보호구, 외투, 작업복과 신발을 조합한다. 장식만을 위한 제품이 많지만 방탄 조끼, 얼굴 보호 장비나 특수 작업복 가운데 외부 충격 또는 특정 작업을 지원하는 제품도 있다. 방호 사이버웨어는 몸 안에 들어가는 층이며, 보호복의 기능과 옷을 갈아 입을 때 바뀌는 외형은 각각 다르다. 같은 직업의 사람이라도 기업이 지급한 유니폼을 입었는지, 거래용 보호복을 개인이 고쳤는지에 따라 형태가 달라진다. 안면 마스크의 장치와 화면 위 스캔이 보이는 키로시 안구, 생체 환경에 닿는 보호 섬유의 역할을 따로 기술한다. 합성 소재가 옷깃이나 어깨에 붙은 것만으로 해당 보철의 성능까지 드러나지 않는다. 작업복의 호흡 부속, 넷러너가 몸을 연결할 때 쓰는 단자, 의체 쪽에서 몸 안으로 들어간 보호층은 서로 다른 곳에서 정비된 기록을 남긴다. 전문 장비가 달린 외투를 입더라도 시술된 외피나 골격 사양은 각자의 의료 기록에 있다.","sources":[{"label":"사이버펑크 2077/장비 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%9E%A5%EB%B9%84"},{"label":"Cyberpunk 2077 Clothing · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Clothing"},{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"}],"priority":175},{"title":"트라우마 팀과 미트왜건","group":"기업","keywords":["미트왜건","REO","트라우마팀","비상수송","의료시장"],"short":"계약 등급과 비용이 다른 민간 의료 운송","body":"나이트 시티의 응급 구조 시장에는 트라우마 팀뿐 아니라 R.E.O. 미트왜건 같은 별도 업체가 있다. 출동 권역과 서비스 대상, 장비 수준, 비용 및 계약의 약속 범위는 업체마다 다르다. 타 기업의 경비나 시 경찰이 현장에 같이 있어도 누가 응급 환자를 계약에 따라 인수할 수 있는지는 별개다. 정기 보험 상품과 현장에서 개인이 호출한 지원은 결제와 우선순위가 같지 않다. 리퍼닥의 시술은 이들의 구급·운송과 역할이 다르다. 트라우마 팀 인터내셔널은 가입자에게 응급 의료와 위험 지역에서의 회수 서비스를 제공한다. 의료 인력과 구조용 공중 차량, 현장 안전을 맡는 인력이 하나의 계약에 묶인다. 계약의 지속 여부와 서비스 범위, 지역 상황이 출동에 영향을 준다. 거리에서 부상자가 발견됐다고 모두 같은 우선순위로 회수되지는 않는다. 트라우마 팀의 현장 경호는 환자를 인수하기 위해 쓰이며 경찰의 수사 지휘권을 대신하지 않는다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 경찰국 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0%20%EA%B2%BD%EC%B0%B0%EA%B5%AD"}],"priority":176},{"title":"플랫헤드 정찰 플랫폼","group":"장비","keywords":["플랫헤드","Flathead","MT0D12","거미드론","정찰로봇"],"short":"좁은 시설에 들어가는 다족 정찰기","body":"플랫헤드는 밀리테크가 만든 소형 다족 로봇이다. 조종자와 연결된 상태에서 사람의 손발이 쉽게 닿지 않는 협소한 시설에서 관찰과 원격 작업을 수행한다. 카메라를 켜는 건물의 시스템과 이동하는 로봇의 센서, 시설 장치에 기계적으로 연결하는 동작이 각각 다른 단계를 이룬다. 사람의 몸이 가상공간 속으로 들어가는 넷 다이브와 달리 기계가 현실 공간에서 진입하고, 조작자는 그 정보를 따로 받아 본다. 밀리테크 제품이라는 사실과 지금 명령을 내려 쓰는 사람의 신분이 다를 수 있다. 로봇의 작은 몸체가 모든 방어를 무력화하거나 스스로 상황을 판단하는 수준까지 보여 주지는 않는다. 플랫헤드의 센서와 시설에 손을 대는 작은 구동기는 명령을 보낸 사람의 몸과 떨어져 있다. 조작 화면에 표시된 영상과 가까이에서 기계가 실제로 접근할 수 있는 공간을 구별하면 로봇이 통과한 경로가 현장 기록에서도 분명하게 드러난다. 본체에 달린 카메라는 시설의 고정 카메라와 이동 방향이 다르다.","sources":[{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"},{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"Militech · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Militech"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":176},{"title":"밀리테크 중전투 플랫폼","group":"장비","keywords":["키메라","미노타우르","그리핀","와이번","전투드론"],"short":"중형 보행기와 다른 규모의 전투 기계","body":"밀리테크의 전투 기계에는 키메라 같은 대형 무인 플랫폼, 미노타우르 같은 보행형 장비, 그리핀과 와이번 등의 비행 드론이 있다. 키메라는 사람이 직접 들고 움직이는 장비보다 큰 센서와 장갑, 무장을 가진 유형으로 팬텀 리버티의 지하 시설에서 등장한다. 기계가 낡아 방치되어 있던 시간과 실제로 다시 움직이기 시작한 원인은 별개의 기록이다. 명령 수단에는 내장 소프트웨어와 원격 조작이 있고, 외부 자율 AI가 연결된 경우 뜻하지 않은 행동으로 이어질 수 있다. 회수한 코어와 본체의 운용 가치는 다르며 코어에 연관된 무기 개조 사례도 별도로 확인된다. 무거운 본체는 어느 장소에서 보관할 수 있는지가 작동 능력 자체와 별도의 문제다. 비행형 드론과 보행형 플랫폼은 시야에서 들어오거나 공격을 세우는 방식이 다르고, 회수된 코어를 거래하는 일은 본체를 완전하게 복구하는 작업과 구분한다. 시설에 묶인 지원 장비와 독립적으로 비행하는 드론의 임무는 각각 정해진다.","sources":[{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"},{"label":"Militech · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Militech"},{"label":"Cynosure · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cynosure"}],"priority":177},{"title":"타이거 클로의 업소","group":"세력","keywords":["클라우드","업소경비","돌칩","우드맨","마이코"],"short":"운영자·경비·노동자가 얽힌 재팬타운 사업","body":"클라우드는 재팬타운 메가빌딩 H8 안에 있는 돌 업소다. 운영 관리자와 타이거 클로 쪽 수익·경비 인력, 돌과 기술자는 일과 위험을 다르게 분담한다. 우드맨과 마이코 같은 인물은 같은 공간에 연관돼도 조직의 모든 권력을 공유하지 않는다. 지그지그 스트리트의 다른 시설에는 서로 다른 사업주와 중개망이 있다. 신분과 계약을 보이는 손님 응대와 시설 업무 기록, 수익의 배분 구조는 공개된 간판만으로 확인하기 어렵다. 타이거 클로는 웨스트브룩 특히 재팬타운의 유흥업과 상업권에 깊게 얽힌 조직이다. 문신, 일본도와 오토바이, 일본계 간판과 업소가 거리에서 자주 연결된다. 돌 업소나 바의 영업, 보호비, 경비와 부동산 수익은 구성원과 연계자의 서로 다른 이해다. 아라사카와의 인맥이나 거래 의혹은 회사 전체의 일괄 지시와 구분한다. 와카코는 지역 중개에 영향력이 큰 픽서이지만 업소의 관리자나 모든 클로의 지휘관으로 취급할 수 없다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"타이거 클로 · 나무위키","url":"https://namu.wiki/w/%ED%83%80%EC%9D%B4%EA%B1%B0%20%ED%81%B4%EB%A1%9C"},{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":177},{"title":"란초 코로나도 생활권","group":"도시","keywords":["란초코로나도","트레일러파크","정신건강센터","트리플익스트림"],"short":"노동자 주택과 교외 공공 시설","body":"란초 코로나도에는 아로요의 일터로 이동하는 주민이 사는 단독형 주택과 트레일러 거주지, 상가가 퍼져 있다. 회사가 개발한 주택 단지는 일자리와 거주 여건의 연결을 강화한다. 나이트 시티 정신건강센터와 트리플 익스트림 체육관은 이 지역의 서로 다른 이용 시설이다. 인근 댐과 큰 도로는 시가지와 배드랜드 쪽을 잇는다. 정원과 낮은 울타리로 정돈된 단지가 있는 한편, 모든 거주자가 동일한 임대 조건과 사회 서비스를 누리지는 않는다. 아로요는 발전소와 공장, 아라사카 인더스트리얼 파크 같은 산업 시설이 모인 지역이다. 란초 코로나도는 노동자 주거와 상업 시설이 있는 교외형 지구로, 회사가 개발한 주택 단지의 영향이 남아 있다. 오래된 산토 도밍고는 4차 기업 전쟁의 핵심 피해 지대에서 떨어져 있어 피난민 정착지와 재건 산업의 기반이 됐다. 2077년에 운영 중인 작업장과 방치된 공장은 한 지구 안에 공존한다. 식스 스트리트는 이 생활권에서 영향력을 행사한다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":178},{"title":"용병팀의 직무 구성","group":"거리 문화","keywords":["용병팀","크루","현장지원","협상","위험수당"],"short":"직군과 계약 범위가 다른 현장 팀","body":"용병팀은 현장 행동을 맡는 솔로, 차량과 장비에 강한 테키, 망에 접속하는 넷러너 같은 인력으로 조직될 수 있다. 픽서가 사람과 일감을 이어도 현장의 모든 선택을 대신할 수는 없다. 주요 장소의 경찰·기업 또는 갱단 대응이 바뀌면 역할과 보수, 후퇴나 구조에 대한 책임이 달라진다. 개인별 장비와 연락 수단, 과거의 공동 작업 경험은 같은 직함만으로 알 수 없으며 결과는 각자가 실제로 맡은 일과 연동된다. 솔로는 경호, 전투, 호송, 위험한 현장 임무를 전문으로 맡는 사람이다. 솔로와 픽서가 한 팀을 이룰 수 있지만 물리적 현장을 담당하는 사람과 계약을 중개하는 사람은 같은 역할이 아니다. 기업에 고용된 경비와 자유 계약 용병은 장비, 인가, 일을 마친 뒤의 책임 범위가 다르다. 같은 소속의 솔로도 몸에 넣은 장비와 평판, 과거 경력에 따라 전문 분야가 달라진다. 위험의 크기와 대금은 임무 종류와 현장의 정보에 따라 차이가 난다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"픽서 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Fixer"}],"priority":178},{"title":"케르베로스 시설 기계","group":"장비","keywords":["케르베로스","Cerberus","사이노슈어로봇","시설정비기"],"short":"사이노슈어 지하 시설에서 변질된 장비","body":"케르베로스는 사이노슈어 시설에 남아 있던 큰 기계다. 시설의 운영과 정비를 맡았던 장비가 구망 계열의 존재에 점유되면서 인간을 상대하는 위협으로 바뀌는 사례로 묘사된다. 본체가 언제부터 유지 보수 기능을 하던 것인지와 해당 사건에서 누가 동작을 지시했는지는 따로 읽는다. 장비가 다족으로 이동한다는 점은 작고 사람이 제어하는 플랫헤드와 같아 보여도, 통제권과 출입할 수 있는 범위가 다르다. 같은 밀리테크 설계인 키메라와 비교해도 원래 맡은 일·시설 안에서 보이는 행동이 구분된다. 무인 기계를 물리적으로 살릴 수 있다는 사실과 지휘권을 되찾는 일은 별개다. 시설에서 발견된 부품과 움직이는 기체는 기록상의 역할이 다르며, 표지가 같은 기계마다 같은 판단을 하는 것은 아니다. 오래된 설비의 관리 시스템과 들어온 인공지능의 행위가 어떻게 동시에 보였는지는 시설의 자체 기록을 함께 확인한다. 기계가 사용하는 감각의 범위는 통제 주체와 별도로 확인한다.","sources":[{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"},{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"Militech · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Militech"},{"label":"Cynosure · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cynosure"}],"priority":178},{"title":"경찰 수사과와 증거","group":"국가와 공권력","keywords":["수사과","형사","감식","살인수사","풍속수사"],"short":"증거와 관할에 묶인 사복 경찰의 업무","body":"NCPD 수사과는 사복 형사와 감식 인력을 두고 살인, 폭력과 풍속 관련 사건 등을 맡는다. 살인수사는 대량 사건과 기업 관련 범죄를 조사하지만 인력 부족이나 증거 공백으로 결론을 내기 쉽지 않다. 약물·도박·밀매를 다루는 팀은 다른 보고 경로와 단서를 따른다. 도심의 카메라와 감식 드론, 대면 증언과 구두 정보는 신뢰도가 서로 다르다. 기업 사유지에서의 공식 수사는 회사 경비와 법적 관할의 문제를 동반한다. NCPD 순찰과는 담당 구역의 도보 경계와 교통 감시, 신고에 대한 초기 대응을 담당한다. 소수 인원이 일상 범죄 현장에 먼저 도착할 수 있으나 중무장 조직과 장기 대치하는 것은 전술 조직의 임무다. 도보 순찰과 교통 순찰은 마주치는 사건 유형과 담당 동선이 다르다. 동네의 치안 우선순위에는 예산, 인력, 기업 후원이 영향을 준다. 출동 시간과 경비 규모는 지역과 사건의 위험에 따라 일률적이지 않다.","sources":[{"label":"나이트 시티 경찰국 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0%20%EA%B2%BD%EC%B0%B0%EA%B5%AD"}],"priority":179},{"title":"사이버웨어 감시 장비","group":"장비","keywords":["보철검사","군용스캐너","보안스캐너","임플란트식별"],"short":"신호·외형·장비 기록을 통한 식별","body":"시설 출입 시 신원과 주변 장비를 확인하는 감시 체계에는 카메라, 판독 단말, 보안 요원의 시각 임플란트가 포함된다. 기계 팔의 단단한 외형이나 전자 신호가 드러나도 검사 장치가 안에 있는 모든 부품의 모델명과 등록 정보를 즉시 알아낸다는 뜻은 아니다. 얼굴 위장, 등록된 이동 권한, 장비가 보이는 외형은 각각 다른 점검 대상이다. 맥스택처럼 위험한 보철 사용자에 대응하는 조직의 장비와 일반 사무 시설의 안내용 단말도 처리 목적이 다르다. 촬영되는 위치와 시야 밖 기계의 연결 상태가 달라서 현장에 영업용 스캔 기록과 폐쇄 시설의 통신 기록을 구분해서 남긴다. 어느 회사에서 보철을 구했는지와 지금 그 보철을 이용해 출입하려는 사람의 신분은 별도 판독 대상이다. 안구로 본 외형, 신원 단말의 응답, 감시 서버가 접근 시간별로 남긴 기록을 맞춰야 보안 장비가 알려 준 범위를 알 수 있다. 등록 신호가 읽혔다고 검사될 수 있는 모든 물건이 확인된 것은 아니다.","sources":[{"label":"사이버웨어/안구 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%95%88%EA%B5%AC"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"},{"label":"MaxTac · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/MaxTac"}],"priority":179},{"title":"기업 식품 제조와 소매","group":"기업","keywords":["올푸드","가부토","카바얀푸드","카피탄칼리엔테","두한이네"],"short":"대량 식품과 거리 식당의 공급망","body":"올 푸드 같은 대형 제조 브랜드와 카피탄 칼리엔테, 가부토, 카바얀 푸드, 두한이네 4유로달러 버거샵 같은 이름은 나이트 시티의 식품 시장을 구성한다. 대량 가공 식품과 테이크아웃 메뉴, 독립 노점, 직장 식당은 생산 방식과 가격대가 다르다. 바이오테크니카의 단백질 생산은 식당 영업과 다른 공급 단계에 해당한다. 올 푸드 공장이라는 지명에 남은 시간이 소비자가 오늘 받는 기업 상품의 유통 상태와 늘 일치하지는 않는다. 바이오테크니카의 사업은 유전자 기술, 농업, 약품과 기업 연구를 아우른다. CHOOH2의 원료 작물과 생산 기술은 에너지 산업의 성장에 영향을 주었다. 나이트 시티 남쪽의 단백질 농장과 플랫은 도시 식량 공급의 생산 거점이다. 고급 접객용 바이오테크니카 호텔과 농업 현장, 연구 부서는 같은 회사에 닿아도 사용 목적이 다르다. 대량 생산이나 재배 기술이 주민의 식량 접근성과 농업 환경 문제를 모두 해결하는 것은 아니다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":180},{"title":"메트로 노선과 환승","group":"이동","keywords":["메트로노선","메모리얼파크역","알렉산더역","H10역","퍼시피카역"],"short":"2077년 역과 연결 지역","body":"2077년 여객 열차는 A부터 E까지 다섯 가지 색 노선에서 총 19개 역을 운행한다는 안내가 있다. 일부 노선은 워터프론트의 아이젠하워 스트리트와 왓슨의 메드센터를 공유하고, 알렉산더 스트리트는 다운타운 접근에 쓰인다. 기업 광장의 메모리얼 파크와 헤이우드의 콩그레스 스트리트는 여러 방면의 연결점이다. 메가빌딩 H10에서 웨스트브룩 방면과 맞물리는 선이 있고, 퍼시피카 경기장과 산토 도밍고의 H7을 지나는 노선도 있다. 순환 형태와 종착역이 있는 노선은 한 바퀴 돌아오는 방식이 다르다. 예전 계획의 표기나 자료에서 본 노선 수와 현재 탑승 안내는 자료 성격에 맞춰 읽는다. 차창으로 시티 센터의 높이 솟은 건물들을 보는 열차와, 헤이우드 안의 여러 동네를 거치는 순환선은 같은 역에서 갈아탈 수 있다. 퍼시피카 경기장에는 다른 방향에서 오는 B선과 C선이 연결된다. 메모리얼 파크와 같은 환승 지점의 접근로는 도로 건너편에 있을 수 있다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"Night City Area Rapid Transit · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City_Area_Rapid_Transit"},{"label":"NCART Network · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/NCART_Network"}],"priority":180},{"title":"도시 도로와 외곽 간선","group":"이동","keywords":["순환도로","하이웨이101","인터스테이트9","외곽간선","검문소"],"short":"도심 도로망과 배드랜드 연결","body":"나이트 시티에는 도시 지구를 잇는 순환 도로와 외곽으로 나가는 주요 고속도로가 있다. 인터스테이트 9와 하이웨이 101은 광역 접근에 사용되며, 고가 연결과 교차로 사이에는 보행자와 화물을 위한 별도의 통로가 형성된다. 기업 광장 주변의 깔끔한 도로와 물류창고에 붙은 산업 도로, 배드랜드에서 만나는 포장되지 않은 길이 같은 운송망 안에 이어진다. 도시 경계에서 통행 조건이 달라지는 경우에는 도로 표지나 입구의 사람을 확인한다. 좁은 골목으로 갈아타거나 짐을 분리해 싣는 선택은 출입 허가와 차량 크기의 영향을 받는다. 지도에 이어진 선이 모두 같은 시간에 열려 있는 도로는 아니다. 다리를 건너야 접근하는 워터프론트와 대형 건물 사이를 걸어서 오가는 도심은 통행 시간대와 출입 방식이 다르다. 트럭이나 노마드 행렬이 도시 외곽에 닿는 기록에서는 우회해 지나가는 간선과 각 지구의 진입로를 따로 확인한다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"Night City · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"},{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":181},{"title":"아이티계 퍼시피카 공동체","group":"세력","keywords":["아이티","코스트뷰","크레올","세레니티교회"],"short":"이주민 생활권과 부두 보이즈의 접점","body":"퍼시피카의 아이티계 공동체는 고향의 재난과 이주, 중단된 해안 개발이 쌓인 역사와 연결된다. 크레올어와 가게, 교회 같은 일상의 공간은 기술 집단이나 갱단 활동만으로 설명되지 않는다. 부두 보이즈가 강한 영향력을 갖더라도 모든 주민이 넷러너나 조직원은 아니다. 코스트 뷰의 세레니티 성서 교회는 지역 관계의 중요한 접점이다. 이주 공동체의 자치와 외부인의 정보 부족, 넷워치와 특정 조직의 경쟁은 서로 다른 사건에 영향을 준다. 2077년 퍼시피카의 부두 보이즈는 아이티계 공동체와 연결된다. 마만 브리짓은 넷과 블랙월에 대한 목표를 가진 지도자이며, 플래시드는 외부 접촉과 현장 임무에 주로 보인다. 교회와 지역 거점의 생활 공간은 넷러너의 장비와 접속 공간과 구별된다. 과거 같은 명칭을 쓴 조직과, 도그타운의 윌키 라게르 쪽 인맥을 모두 동일한 지휘 아래 두지 않는다. 지역 사회의 주민 전원이 갱단의 계획이나 넷러닝 능력을 공유하지 않는다.","sources":[{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":181},{"title":"거리의 평판과 신용","group":"거리 문화","keywords":["평판","신용거래","용병명성","연고","단골"],"short":"일과 대금 이력이 만드는 관계","body":"나이트 시티에서 평판은 특정 일을 완수했는지, 대금을 지급했는지, 다른 사람을 위험에 두고 떠났는지 같은 기록과 소문을 통해 굳어진다. 지역 주민과 단골 상인, 픽서, 기업 관리자는 같은 사건에도 다른 평가를 내릴 수 있다. 지역에서 신용을 얻은 일이 기업 보안이나 다른 갱단 구역의 신분 보증으로 바로 이어지지 않는다. 거래의 기록과 실제 대금, 상대가 약속을 지킬 수 있는 역량은 오래된 명성과 별도로 확인한다. 픽서는 지역 인맥에서 정보를 모으고 언론인은 취재와 공개를 통해 다른 청중에게 전달한다. 회사 내부 문서, 경찰의 현장 보고, 데이터 샤드의 기록과 거리에서 들은 소문은 접근 경로와 검증 가능성이 다르다. 정보는 거래를 성사시키거나 상대의 판단을 바꾸는 자산이 되지만 기록된 내용의 진술 시점과 누가 남겼는지를 확인해야 한다. 방송이나 단말에 표시된 하나의 메시지만으로 증언 사이의 모순이 해소되지는 않는다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"픽서 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Fixer"}],"priority":182},{"title":"에어로다인과 도심 비행","group":"이동","keywords":["에어로다인","AV기체","제타테크아틀라스","서베이어","엑스칼리버"],"short":"수직 이동에 쓰이는 고급 비행체","body":"에어로다인은 도로를 거치지 않고 수직 이착륙이 가능한 기체로, 도시에서는 기업 수송과 긴급 대응에 이용된다. 제타테크 아틀라스는 트라우마 팀과 방송기관 등에서 사용되고, 서베이어는 캉 타오나 맥스택에 관련된 사례가 있다. 레이필드 엑스칼리버는 고급 승객 이동을 겨냥한 AV 계열이다. 같은 비행 형태여도 환자와 의료 시설을 싣는 기체, 중무장 인원을 보낸 기체, 사적으로 운영한 승객용 모델의 내부가 다르다. 지상에서 봤을 때 소음이나 도색이 비슷하더라도 조종 인원·등록 주체·착륙 지점에 따라 임무를 구분한다. 옥상 시설과 건물 주변의 공역은 도시의 이동과 연결된다. AV가 내려오는 기업 시설에는 비행체가 크기와 임무에 맞는 착륙 구역이 필요하다. 바닥 근처에서 떠 이동하는 바실리스크 같은 장갑차도 있지만, 건물 높이로 비행하는 에어로다인의 운용과 탑승 인원의 목적은 따로 본다. 서베이어의 운용 기구는 택시용 비행 기체와 구별된다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"Aerodyne · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Aerodyne"},{"label":"Zetatech · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Zetatech"},{"label":"Cyberpunk 2077 Vehicles · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Vehicles"}],"priority":182},{"title":"코스트 뷰의 거점","group":"도시","keywords":["코스트뷰","그랜드임페리얼몰","세레니티","매그레브"],"short":"폐몰·교회·터널이 남은 해안 구역","body":"코스트 뷰에는 미완성 휴양지 개발의 흔적과 생활 공동체가 둘 다 남아 있다. 그랜드 임페리얼 몰은 대규모 상업 개발의 잔재로, 점거한 세력에 따라 내부의 쓰임이 변한다. 세레니티 성서 교회는 부두 보이즈와 공동체의 관계가 드러나는 접점이다. 매그레브 터널은 상업 시설과 별개로 옛 교통 개발의 흔적이다. 해안의 겉보기 접근성과 건물 안에 있는 장비, 경비와 출입자의 권한은 장소마다 다르다. 퍼시피카의 호화 관광 개발은 통일 전쟁 무렵 자금이 빠져나가며 멈췄다. 코스트 뷰에는 그랜드 임페리얼 몰과 교회가 있고, 웨스트 윈드 에스테이트에는 해안 주거지와 호텔이 있다. 부두 보이즈는 아이티계 공동체와 깊은 관계를 두고 활동한다. 미완성 건축물과 빈 복합 시설에는 다른 세력도 진입한다. 도그타운은 퍼시피카 안에 있으나 바게스트가 외부와의 통행을 별도로 관리하므로 코스트 뷰의 권력 관계를 그대로 적용할 수 없다.","sources":[{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":182},{"title":"응급 항공 이송 장비","group":"이동","keywords":["의료AV","트라우마수송기","환자이송기","항공의료"],"short":"응급팀을 싣는 비행체와 환자 수송","body":"2077년의 트라우마 팀은 제타테크가 만든 아틀라스 AV를 사용한다. 의료진과 환자를 위한 공간, 승무원의 비행 통제, 지상 위협에 대응하는 보안 인력은 같은 기체의 서로 다른 기능이다. 환자에게 접근하더라도 차에 태우기 전의 응급 처치와 안전한 곳으로 옮겨 의료 시설에 인계하는 일은 순서가 갈린다. 과거 판본의 AV-4 계통과 2077년의 아틀라스 사례는 시기별로 구분한다. 일반 택시와 달리 기체가 움직이는 조건에는 보험과 출동 요청, 환자의 확인과 현장 접근성 같은 요소가 따른다. 같은 기체 제품이 다른 기업에 공급됐다고 응급 의료 기능까지 같지는 않다. 아틀라스의 본체가 어느 기관의 것으로 쓰였는지 확인하기 위해서는 외장의 표식과 환자를 맡은 팀의 운항 기록이 함께 필요하다. 같은 제타테크 제품을 방송국이 뉴스 취재에 쓸 경우 안에 싣는 인원과 장비의 구성은 의료편과 크게 달라진다. 응급 처치 장비는 차체가 아닌 의료편의 준비 물품으로도 확인된다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"Trauma Team · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Trauma_Team"},{"label":"Zetatech · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Zetatech"}],"priority":183},{"title":"전술과와 폭동 대응","group":"국가와 공권력","keywords":["전술과","특수기동대","SWAT","폭동진압"],"short":"일반 순찰을 넘어선 현장 경찰력","body":"NCPD 전술과는 순찰대가 감당하기 어려운 중무장 총격이나 인질 사건, 대규모 군중 통제 상황에 개입한다. 특수기동대는 장비와 기동력을 요구하는 고위험 사건을 처리하고 폭동 진압팀은 차단과 비살상 통제를 중심으로 훈련된다. 맥스택은 그중에서도 위험한 사이버 사이코 사건에 특화된 조직이다. 전문 부대가 온다는 사실만으로 민간인의 안전이나 사건의 독립 수사가 보장되지는 않으며, 사건 종류에 따라 경찰 내부의 보고 경로가 다르다. 맥스택은 NCPD의 정예 부대이자 고위험 사이버 사이코 사건을 상대하는 전문 전력이다. 고성능 사이버웨어와 중무장 장비, 독자성이 큰 현장 지휘가 다른 경찰 부서와 구별된다. 강한 제압 능력과 함께 과잉 진압과 책임 회피 논란이 따라다닌다. 일부 요원이 과거 사이버 사이코 사건에 연루된 사례와 조직 전체를 둘러싼 소문은 구별된다. 체포와 사살은 서로 다른 결과이며, 일반 교통 단속에 호출되는 순찰대가 아니다.","sources":[{"label":"맥스택 · 나무위키","url":"https://namu.wiki/w/%EB%A7%A5%EC%8A%A4%ED%83%9D"},{"label":"나이트 시티 경찰국 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0%20%EA%B2%BD%EC%B0%B0%EA%B5%AD"}],"priority":183},{"title":"오비탈 에어 우주 운송","group":"이동","keywords":["오비탈에어","우주공항","우주운송","우주왕복선","발사터미널"],"short":"도시와 궤도를 잇는 상업 교통","body":"오비탈 에어는 지상 우주공항에서 궤도 방향의 상업 운송을 맡는 기업이다. 나이트 시티의 우주공항은 도시 내 AV를 승차하는 시설과 성격이 달라 접수, 보안과 발사 통제가 별도의 단계로 이뤄진다. 공항에 도착하는 것과 실제로 우주선에 탑승할 수 있는 권한에는 차이가 있다. 화물과 승객의 신원, 출발 시각을 확인하는 시설이 있으며 우주 이동은 기업 재산과 국가 기관의 이해관계가 겹칠 수 있다. 송소미의 상황처럼 우주공항이 등장하는 사건에서도, 시설에 가려는 목적과 오비탈 에어가 공적으로 유지하는 이동 서비스는 다르게 읽는다. 도심 항공 이동과 궤도 교통에는 각각 다른 기체가 쓰인다. 달을 향하는 항공편이나 궤도 관광 시설을 향하는 일부 노선은 같은 공항에 떠 있어도 필요한 이동 시간과 꾸리는 물자가 다르다. 특정 목적지의 승객 서류와 지상의 시설이 운영하는 검색 구역은 각각 확인할 대상이다. 우주공항은 나이트 시티 바깥의 궤도 시설로 연결되는 기반이다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"},{"label":"Orbital Air · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Orbital_Air"},{"label":"Night City · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"}],"priority":184},{"title":"운송 계약 회사들","group":"기업","keywords":["컴뱃캡","리비어쿠리어","데커다나카","물류기업","차량호송"],"short":"택시·우편·화물에 특화된 교통 기업","body":"컴뱃 캡은 위험 지역의 택시와 연결되는 브랜드이며, 리비어 쿠리어 서비스는 배달과 화물 서비스에 속한다. 데커 다나카 앤 로저스는 운송 사업의 다른 주체이고 델라메인과 오비탈 에어는 각각 차량 및 항공·궤도 운송에 중심을 둔다. 계약의 종류는 승객의 이동, 화물 납기, 안전 보장과 책임 범위를 달리 정한다. 회사 소유 차량과 외부 운전자가 같은 상표를 사용해도 업체의 모든 내부 데이터에 접근할 권한이 생기지는 않는다. 델라메인 택시 컴퍼니는 인공지능 운영과 무인 승객 운송이 결합한 업체다. 일반적인 이동 계약과 고급 맞춤 서비스는 비용 및 약속된 지원 범위가 다르다. 헤이우드에 있는 본부·정비 시설과 개별 차량은 같은 시스템의 서로 다른 현장이다. 차량이 말을 하거나 경로를 선택하더라도 그 대화 방식이 도시의 모든 인공지능과 같지는 않다. 고객과 계약, 운영 프로그램의 판단 및 차량 개별 동작을 각각 구별한다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":184},{"title":"유흥업 노동과 목스","group":"세력","keywords":["리지보든","목스","업소노동","타이거클로"],"short":"영업장 보호와 노동 안전을 둘러싼 권력","body":"리지 보든의 죽음을 계기로 모인 목스의 보호 활동은 유흥업 종사자에 대한 폭력과 착취에 대응하는 데서 출발했다. 리지의 바는 기술자와 경비, 운영자와 접객 노동자가 같은 공간에서 가족과 다른 형태의 연대를 이룬 곳이다. 타이거 클로와의 마찰은 조직 간 통제권에 닿지만 피해자와 종사자가 어떻게 회복하고 일할지는 별도의 문제다. 유흥업소가 모두 목스의 보호를 받고, 모든 보호가 무료로 제공되는 것은 아니다. 목스는 업주와 손님, 폭력에 노출되는 유흥업 종사자의 관계 속에서 만들어졌다. 리지 보든의 죽음과 타이거 클로에 대한 반발이 결성의 역사에 중요하며, 리지의 바는 왓슨 가부키의 활동 거점이다. 수지 Q와 리타 윌러, 주디 알바레스는 같은 공간과 연관되지만 운영과 경비, 브레인댄스 기술의 역할이 나뉜다. 손님과 일반 종사자, 조직 핵심 인력이 같은 지시 체계를 따르는 것은 아니다. 대외적인 보호 명분과 업소 운영의 여유도 다르다.","sources":[{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":185},{"title":"크리스탈 팰리스 궤도 시설","group":"이동","keywords":["크리스탈팰리스","궤도호텔","우주리조트","궤도교통"],"short":"부유층의 체류 시설과 궤도 기업 서비스","body":"크리스탈 팰리스는 지구 궤도에 조성된 대형 시설로, 부유한 이용자를 위한 호텔·오락과 체류 공간을 갖춘다. 우주 교통망의 이용 조건에는 지상 비행체나 도시 열차와 다른 요금과 접근 권한이 따른다. 오비탈 에어와 유럽의 우주 기관은 이런 궤도 사업과 운행을 지원한 기록이 있다. 지상 공항에서 장치와 승객이 지나가는 절차, 목적지의 체류 허가, 시설 안에서 기업이 관리하는 공간은 별도의 일이다. 외벽과 기압 같은 시설 조건이 사람의 일상 이동에 영향을 주어, 지상 도로에서처럼 자유롭게 걸어 들어가는 장소로 묘사하지 않는다. 운영자와 이용자의 사회적 지위 차이도 같은 장소에 드러난다. 귀중한 인원과 재산을 운송하는 기업에는 노선과 현지의 안전이 모두 중요하다. 궤도 호텔에 들어가는 데 필요한 운항 증표와 시설의 다른 층에 들어갈 수 있는 권한은 반드시 동일하지 않으며, 지상에서 연락한 사람과 별도 절차가 있다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"Orbital Air · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Orbital_Air"},{"label":"Night City · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"}],"priority":185},{"title":"델라메인 택시와 서비스","group":"이동","keywords":["델라메인택시","엑셀시어","고급택시","자동운전택시"],"short":"AI가 운영하는 예약 수송","body":"델라메인은 중앙 AI가 관리와 차량 운행, 배차를 맡는 나이트 시티의 운송 회사다. 콜에 응답하는 얼굴과 승객을 태우는 차는 같은 서비스에 속하지만 차량 단말과 회사 중앙 코어는 구분된다. 엑셀시어는 고급 맞춤 서비스이며 차량의 보호 기능과 별도 요구 사항까지 계약에 포함되는 사례다. 동일한 차체가 이동 중인 모든 사람에게 같은 조건을 제공하는 것은 아니다. 사람이 운전하는 택시와 달리 고객은 단말의 음성과 화면을 통해 일정과 이동 요구를 주고받는다. 차량이 기사 없이 움직이는 작동과 자기 주장을 갖고 분화된 인격이 특정 차를 제어하는 문제는 다른 층이다. 보호 옵션을 계약한 승객과 사전에 예약한 명단에 없는 사람이 차에 다가올 때 서비스의 판단은 서로 다를 수 있다. 차량의 목적지가 어느 곳인지와 중앙 AI가 보내는 배차, 차 안 감시 기록을 함께 보면 별도의 인격 문제와 구분할 수 있다. 승객용 차체와 제어에 쓰이는 AI의 연결 상태를 각각 살핀다.","sources":[{"label":"델라메인 AI · 나무위키","url":"https://namu.wiki/w/%EB%8D%B8%EB%9D%BC%EB%A9%94%EC%9D%B8%20AI"},{"label":"Delamain · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Delamain"},{"label":"Cyberpunk 2077 Vehicles · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Vehicles"},{"label":"Night City · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"}],"priority":186},{"title":"웨스트 윈드 해안","group":"도시","keywords":["웨스트윈드","피스티스소피아","해안주거"],"short":"호텔 잔해와 퍼시피카 주민 생활권","body":"웨스트 윈드 에스테이트는 퍼시피카의 해안 쪽 주거 지구이며 호텔 피스티스 소피아가 남아 있다. 호텔과 바다 전망은 관광 개발 구상의 흔적이지만, 2077년 이 일대의 일상은 현지 상업과 주거, 훼손된 기반 시설을 중심으로 이어진다. 코스트 뷰의 몰·교회와 달리 해안 주거와 숙박 시설이 장소의 인상을 규정한다. 인접한 도그타운의 장벽이 보이더라도 그쪽 시장과 출입 통제가 여기에도 동일하게 적용되지는 않는다. 왓슨의 메가빌딩, 차터 힐의 기업 직원용 아파트, 노스 오크의 대저택, 란초 코로나도의 기업 개발 주택은 같은 도시에서도 기능과 관리 방식이 다르다. 퍼시피카에는 중단된 재개발과 노후 시설이 남고, 배드랜드 바깥길에는 트레일러 정착지가 있다. 집의 가격과 지위뿐 아니라 교통편, 공공 경비, 계약 기간, 수리 서비스를 같이 봐야 한다. 기업 사택의 고용 안정과 생활환경은 회사와 주거지를 분리해 판단하기 어렵다는 사실을 보여 준다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":186},{"title":"레이필드 고급 차량","group":"이동","keywords":["레이필드","캘리번","에어론다이트","귀네비어","레이필드엑스칼리버"],"short":"스포츠카·기함·프리미엄 AV","body":"레이필드는 고급 스포츠카와 리무진, 그리고 고급 에어로다인을 생산하는 영국 계열 제조사다. 캘리번은 낮고 빠른 스포츠카의 이미지를 강조하며, 에어론다이트 귀네비어는 브랜드의 기함인 고급 도로 차량이다. 엑스칼리버는 도로를 달리는 두 모델과 달리 비행체로 분류한다. 표준형 모델과 외장이나 설계를 바꾼 머크모빌·모드레드 같은 변형은 따로 취급한다. 유리와 안쪽 표시를 결합한 크리스털돔, 외장색을 바꿔 보여 주는 크리스털코트는 각각 다른 차량 기술이다. 기업 임원과 수집가의 소유 기록을 연관시킬 때도 브랜드를 안다는 것과 소유 증거가 있다는 것을 구분한다. 레이필드 스포츠카가 실제로 어린 운전자에게 넘어가거나 도시에 드물게 들어온 기록이 있다 해도, 같은 회사의 수입 사양이 모두 그 사건과 연결되지는 않는다. 기함의 고급스러운 좌석 배치와 스포츠형의 낮은 차체를 모델의 목적과 함께 본다. 에어론다이트는 레이필드의 도로용 기함으로 분류된다.","sources":[{"label":"Cyberpunk 2077 Vehicles · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Vehicles"},{"label":"Rayfield · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Rayfield"},{"label":"Night City · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"}],"priority":187},{"title":"연방군과 계약 전력","group":"국가와 공권력","keywords":["신미군","연방군","군수계약","참전용사"],"short":"국가 군대와 밀리테크의 중첩","body":"신미합중국의 정규 전력과 밀리테크의 계약 전력은 인력·장비·조달에서 가깝지만 동일한 법적 주체는 아니다. 통일 전쟁에서는 기업 군수와 연방 지휘가 같은 목표를 위해 움직였다. 정전 뒤 병력의 철수와 재배치 문제는 핸슨이 도그타운을 유지하는 역사적 조건이 됐다. 전쟁을 끝낸 정부 협상과 현장 부대의 생존 판단은 서로 다른 정보에 기초한다. 전직 군인이 갱단에 들어가도 이전 군의 명령 체계가 자동으로 이어지지는 않는다. 통일 전쟁은 마이어스 정부가 서부 자유주에 대한 연방의 영향력을 되찾으려 시작한 전쟁이다. 신미합중국군과 밀리테크가 연방 쪽을 지원했고, 아라사카의 개입은 나이트 시티를 둘러싼 힘의 균형에 영향을 주었다. 2070년 알빈 협정으로 전쟁이 끝났고 일부 자유주는 일정한 자치를 보전하는 틀 안에서 연방에 가까워졌다. 나이트 시티는 독립 도시 지위를 유지했으며, 도그타운에는 정전 뒤에도 떠나지 않은 군대의 흔적이 남았다.","sources":[{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":187},{"title":"차량 유리와 가변 도장","group":"이동","keywords":["크리스털돔","크리스털코트","트윈톤","차량도장"],"short":"탑승자 가림과 외장 색 표시 기술","body":"크리스털돔은 일부 고급 차량의 창과 연관된 기술로, 차량 바깥에서 탑승자를 보기 어렵게 하면서 안쪽의 시야는 제공한다. 크리스털코트는 차량이 가동 중일 때 물리적으로 새로 칠하지 않아도 차체 색을 다른 색으로 보여 주는 외장 기술이다. 레이필드 기술과 키로시의 트윈톤을 결합한 일부 차량에서는 가변 색상 기능이 확대된다. 같은 제조사의 모든 모델이 똑같은 버전을 적용받은 것은 아니고 특수 사양과 현재 차량의 표시 상태를 봐야 한다. 바깥에서 다른 색으로 보이더라도 차의 차대 번호와 외형 전체, 따로 붙인 장치까지 한꺼번에 바뀌는 기능으로 취급하지 않는다. 옆에 선 사람이 탑승자의 얼굴을 읽을 수 있는지와 도로 감시 장치가 해당 색을 기록했는지는 다른 문제다. 특수 창의 표시에 영향을 주는 빛의 조건, 운영 차량의 재도장 이력과 변색 기능이 켜져 있는 시간대를 구분한다. 가변 외장 색과 비슷한 방식의 창면 표시를 각각 별도 제품으로 확인한다.","sources":[{"label":"Cyberpunk 2077 Vehicles · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Vehicles"},{"label":"Rayfield · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Rayfield"},{"label":"사이버웨어/안구 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4/%EC%95%88%EA%B5%AC"}],"priority":188},{"title":"해양 기업과 자원 경쟁","group":"기업","keywords":["CINO","OTEC","해양기업","해양채굴","사업권"],"short":"기업 전쟁을 촉발한 해양 사업 경쟁","body":"CINO와 OTEC의 대립은 해양 사업권과 기업 경쟁에 뿌리를 둔다. 계약 싸움이 무력 분쟁으로 번지면서 아라사카와 밀리테크의 개입이 4차 기업 전쟁을 확대했다. 해저 설비와 운송망, 기업 부두, 자원 채굴 투자는 방위 계약과 별개의 경제적 가치가 있다. 2077년 도시의 항구에서 일어난 모든 분쟁을 당시 CINO·OTEC의 당사자 갈등과 동일시할 수 없다. 전쟁의 발단과 끝에 남은 세력 관계를 구별해야 한다. 페트로켐은 에너지와 정유 사업에 관여하고 CHOOH2 보급의 큰 주체가 됐다. 소브오일은 소련권의 석유·에너지 산업과 해외 사업의 대기업이다. 두 업체의 경쟁은 생산 부지와 수송, 시장을 통제하려는 기업 분쟁의 계보에 놓인다. 바이오테크니카의 원료 작물 기술, 페트로켐의 연료 사업, 도시 주유·유통 시설은 공급망에서 다른 역할을 한다. 나이트 시티에서 한 브랜드의 간판을 본 것만으로 모든 지역의 에너지 회사와 물량을 단정할 수 없다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":188},{"title":"도시형 소형·보급 차량","group":"이동","keywords":["아처헬라","아처쿼츠","마이마이","마키가이","시티카"],"short":"도시 주행과 보급형 차체","body":"아처 헬라는 나이트 시티에서 눈에 띄는 보급형 차량으로 사양에 따라 다른 용도로 유통된다. 같은 아처의 쿼츠는 더 작은 스포츠 차체 계열과 연관되며, 밴디트나 사이드와인더처럼 개조된 변형도 있다. 마키가이 마이마이는 협소한 도시 도로와 주차 구획에서 눈에 띄는 작은 차다. 시경에 등록된 차가 민간 양산 모델을 바탕으로 할 수 있고, 차량의 번호와 외관, 실제로 안에 보관된 화물은 각각 조사할 정보다. 도시의 고층 주차 구획에서 유용한 크기와 배드랜드 노면에 필요한 내구성·화물 공간은 같은 장점으로 볼 수 없어 소형 차량의 구입 이유도 달라진다. 마이마이처럼 좁은 틈을 지나는 데 맞춘 차량과 헬라를 기초로 한 시경 사양은 도시 안에서 오가더라도 다른 차체와 업무를 가리킨다. 제조사가 제공한 개인용 차량을 이미 다른 사람의 규격으로 고쳤는지는 소유주 이력과 차량의 외형으로 확인한다. 소형차 사이에서도 필요한 적재 공간과 회전 반경이 다르다.","sources":[{"label":"Cyberpunk 2077 Vehicles · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Vehicles"},{"label":"Guns and Horses · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Guns_and_Horses"},{"label":"Night City · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"}],"priority":189},{"title":"멜스트롬과 외부 계약","group":"세력","keywords":["크롬거래","부품시장","불법이식","무장창고"],"short":"폐공단에서 벌어지는 크롬과 밀수 거래","body":"왓슨 북부 공업권의 폐공장과 창고는 중고 기계와 장물, 정식 제조품이 교차할 물리적 거점을 제공한다. 멜스트롬은 과격한 크롬 도입과 관련 있지만 임플란트 사용자가 모두 조직원이 되는 것은 아니다. 정식 일련번호와 보증, 불법 판매자에게서 얻는 신분 불명의 제품은 같은 위험을 갖지 않는다. 외부 계약자의 물품, 내부 지도부가 소유한 장비, 조직원의 개인 이식은 별개의 거래 대상이다. 공장 출입구와 접객 장소의 공개성도 다르다. 로이스와 브릭의 지도권은 멜스트롬 전체가 일치된 조직이 아니라는 점을 보여 준다. 덤 덤은 내부 거래 현장과 접점이 있는 구성원이며 패트리샤도 독자 판단을 할 수 있다. 올 푸드 공장 같은 산업 시설은 물건과 현장 인력이 모이는 장소이고, 토텐탄츠 클럽의 손님과 내부 관리자는 같은 자격이 아니다. 갱단의 명성, 지도자의 협상 조건, 개인 간의 충성은 구별된다. 기업이 만든 장비가 갱단의 손에 들어와도 정식 회사 지휘를 받지는 않는다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"멜스트롬 · 나무위키","url":"https://namu.wiki/w/%EB%A9%9C%EC%8A%A4%ED%8A%B8%EB%A1%AC"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":189},{"title":"도그타운 시장과 사교","group":"도시","keywords":["스타디움","블랙사파이어","헤비하츠","도그타운시장"],"short":"요새화된 거래소와 권력자의 접객 시설","body":"EBM 페트로켐 스타디움의 시장은 도그타운 물류가 사람에게 보이는 대표적 접점이다. 반입되는 거래품과 상인이 집중되며 바게스트 검문이 인접한다. 블랙 사파이어는 핸슨이 큰 모임을 여는 경비가 강한 시설이다. 헤비 하츠는 피라미드형 외관의 클럽이며 미스터 핸즈의 접촉 장소와 연결된다. 공개 장사, 초대장에 따른 사교, 픽서의 사적 중개는 세 시설에서 서로 다른 사람과 정보를 끌어들인다. 도그타운의 버려진 퍼시피카 NCPD 경찰서는 이전 공권력의 흔적이며, 경관이 공식적으로 치안을 수행하는 현역 거점은 아니다. 테라 코그니타에는 중단된 관광·전시 개발의 폐건물이 있고, 크레스 스트리트 일대에는 집과 은신처가 이어진다. 무너진 구조체나 남은 근무 시설의 용도는 세력 이동에 따라 바뀐다. 거대한 개발 잔재 사이에 바게스트 검문과 상인들의 거리가 섞이면서 한 골목을 사이에 두고 동선과 감시 수준이 달라진다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"바게스트(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B0%94%EA%B2%8C%EC%8A%A4%ED%8A%B8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":190},{"title":"소형 화물과 이동 생활차","group":"이동","keywords":["손톤콜비","갈레나","매키나우","메리맥","손톤차량"],"short":"픽업 개조와 외곽 생활의 기반 차량","body":"손톤은 콜비와 갈레나, 매키나우, 메리맥을 비롯한 차량을 공급한다. 콜비는 캠퍼나 화물을 다루는 사양이 있고, 갈레나는 작은 차체를 바탕으로 한 여러 개조 차량이 있다. 매키나우는 외곽이나 짐을 다루는 차량을 설명할 때 자주 거론되며, 비스트와 사구아로 등 이름이 붙은 변형은 원래의 양산형과 따로 찾는다. 메리맥 차체에도 고유한 변형 사양이 있다. 차대와 구동 계통을 공유해도 수납 공간, 실제 적재 상태, 노마드가 바꾼 부품에 따라 작업에 쓸 수 있는 범위가 달라진다. 사막의 먼지와 부품 조달은 도심에서 사는 새 차의 조건과 다르다. 캠퍼 사양이 짐칸을 덮어 화물 공간을 확보해도 그 차에서 무거운 의체나 기업 장비를 감당할 수 있는지는 적재 상태가 좌우한다. 매키나우를 개조해 이름을 붙인 차량이 노마드 집단에 보이는 경우에는 양산 모델의 모양과 실제로 달린 외장 등의 기록을 나눈다. 래리모어는 매키나우를 바탕으로 짐칸의 덮개를 달리한다.","sources":[{"label":"Cyberpunk 2077 Vehicles · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Vehicles"},{"label":"Guns and Horses · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Guns_and_Horses"},{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"Night City · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"}],"priority":190},{"title":"계약 의료와 시 치안","group":"국가와 공권력","keywords":["트라우마팀","구급","보험","의료계약","회수"],"short":"부상자의 구조와 치안 권한의 경계","body":"트라우마 팀은 보험·서비스 계약에 따라 응급 의료와 현장 회수를 제공하는 업체다. NCPD의 법 집행, 맥스택의 고위험 제압과 작업 목적이 다르며 동일한 신고에도 같은 목표로 움직이지 않는다. 보험 등급과 서비스 권역, 진입 위험에 따라 회수 가능한 범위가 달라진다. 미트왜건 같은 별도 사업자도 있어 계약 의료가 한 회사만으로 이뤄지지는 않는다. 임시 클리닉, 리퍼닥, 병원과 공중 구조 차량의 역할을 구분한다. 트라우마 팀의 구조가 우선순위로 삼는 건 가입 고객의 회수와 치료다. 경찰은 현장을 통제하고 피해·증거를 수집하며, 의료 회사가 들고 온 장비는 이 목적을 대신하지 않는다. 도그타운에서는 일반 시 치안과 보험상의 구조가 모두 제약되고 바게스트와 별도 관계가 필요하다. 미트왜건의 가격대와 계약 또한 트라우마 팀의 플래티넘 플랜과 다르다. 환자의 신체 이식물과 보험 등급, 현장 통행이 가능한지를 각각 확인해야 한다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 경찰국 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0%20%EA%B2%BD%EC%B0%B0%EA%B5%AD"}],"priority":191},{"title":"쿼드라의 스포츠 차체","group":"이동","keywords":["쿼드라","타입66","터보알","스포트R7","재블리나"],"short":"도시 스포츠카와 외곽 개조형","body":"쿼드라의 타입-66과 터보-R, 스포트 R-7은 주행 이미지와 차체가 서로 다른 스포츠 계열이다. 타입-66의 어벤저와 재블리나, 크툴루는 같은 제품군 안의 서로 다른 형태로 알려져 있다. 터보-R에는 740과 별개의 외관을 갖춘 변형이 유통되고, R-7에는 별칭이 붙은 쿠페 사양이 여럿 있다. 타이어, 보강재, 차체의 외관을 바꾼 경우에는 도심 운용을 겨냥한 상태와 배드랜드의 긴 운행을 준비한 상태를 구분한다. 높은 속도를 강조하는 홍보와 실제로 가득 실은 화물 무게에서 느끼는 운전감은 다르다. 이름에 붙은 숫자와 별칭은 차체를 분류하는 단서로 이용된다. 메인과 같은 인물의 이동에서 쓰인 타입-66이나 로그가 보유한 차량은 개인의 이력이 별도로 남는다. 스포츠 제품군을 바탕으로 고친 차가 도심을 달리는 다른 버전과 비슷해도 차량 안팎에 실을 수 있는 장비나 뒷부분의 보강은 각각 확인한다. 별칭이 붙은 타입-66의 소유주와 출고 상태는 각각 기록한다.","sources":[{"label":"Cyberpunk 2077 Vehicles · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Vehicles"},{"label":"Guns and Horses · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Guns_and_Horses"},{"label":"Night City · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"}],"priority":191},{"title":"뉴스와 방송사","group":"기업","keywords":["네트워크54","WNS","DMS","인콰이어러","언론사"],"short":"기업 뉴스와 현장 보도의 공급망","body":"NC 인콰이어러, 네트워크 뉴스 54, 디버스 미디어 시스템, 월드 뉴스 서비스는 나이트 시티와 연결되는 서로 다른 언론 사업자다. 방송 뉴스와 지역 인쇄물, 토크쇼, 기업 보도 자료는 발행 방식과 수익원, 취재 과정이 다르다. 회사 경비나 정치인과의 관계에 따라 화면에 나오는 정보가 달라질 수 있다. 방송에 등장하는 진행자, 독립 기자, 편집권을 쥔 조직이 같은 책임을 지는 것은 아니다. N54에서는 질리언 조던이 등장하며, 베스 아이시스는 이 회사에서 기자로 일한다. 네트워크 뉴스 54는 연방과 밀리테크에 유리한 보도를 하는 편이고, 아리프 이크발이 알려진 WNS는 아라사카와 자유주에 더 우호적이다. DMS는 연방 전역에서 방송하는 별도 회사다. 나이트 시티를 중심으로 취재하는 인콰이어러는 독립언론으로 분류된다. 두 미디어의 주장이 엇갈리면 기사, 발표자, 당시의 후원 및 취재 범위를 따로 볼 필요가 있다.","sources":[{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":192},{"title":"미즈타니 시온과 개조형","group":"이동","keywords":["미즈타니","시온MZ2","시온코요테","시온사뭄","시온타르가"],"short":"미즈타니의 도로와 외곽 스포츠 모델","body":"미즈타니 시온에는 MZ1·MZ2처럼 도시에서 볼 수 있는 모델과 타르가 차체형이 있다. 코요테와 사뭄, 본레커처럼 이름을 붙인 개조형도 유통되며, 일부는 외곽을 오가는 사람과 조직이 쓰는 차량으로 알려져 있다. 도심형 시온의 낮고 매끈한 외관과 개조형의 보강은 같은 제조사의 차를 서로 다른 길에 맞춰 쓴다는 점을 보여 준다. 중고차에서 보이는 장식과 원래 제품의 차대, 변경을 한 사람의 부품 조달 경로는 모두 다른 정보다. 출고된 모델 이름만 가지고 지금 장착한 장비를 정해 버리기보다 사건에 등장한 형태를 명시한다. 하나의 차량을 여러 곳에서 빌려 쓰는 경우 현재 소유권도 확인한다. 보강된 차체가 거친 노면에 맞춰지는 것과 사람의 체형이나 짐에 맞게 내부를 바꾸는 일은 다른 필요다. 코요테가 들어온 공급 경로와 외장만 닮은 모델을 누가 수리했는지 기록하면 도시와 배드랜드의 차량을 같은 상태로 취급하지 않는다.","sources":[{"label":"Cyberpunk 2077 Vehicles · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Vehicles"},{"label":"Guns and Horses · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Guns_and_Horses"},{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":192},{"title":"도시·외곽 오토바이","group":"이동","keywords":["쿠사나기","야이바","아폴로","브레넌","나자레"],"short":"경량 바이크와 스포츠 모델","body":"야이바 쿠사나기는 낮고 덮인 외관을 갖춘 스포츠 바이크 계열로, 아카시타 등 특수 도장이 붙은 변형도 있다. 브레넌 아폴로는 도시와 외곽을 오가는 모습이 모두 나타나며, 스카우트나 바게스트 사양처럼 목적이 다른 타입이 있다. 아치 나자레는 와이어와 기계 부분이 드러나는 차체의 고급형으로 알려져 있고, 재키 웰즈와 관련된 나자레의 소유 이력은 양산품과 따로 읽는다. 오토바이는 좁은 차로에 편리하지만 동승, 장비 운반, 먼지를 받는 운행은 자동차와 조건이 다르다. 차량 앞의 표식이 비슷해도 배급과 개조 상태가 달라진다는 점을 이동 기록에 남긴다. 한 사람이 빠르게 지나가는 바이크를 봤다는 기록이 있어도 계열명, 정확한 도장, 운전자가 누구였는지는 다른 단서다. 쿠사나기의 짧은 차체와 아폴로의 외곽용 사양은 차선이 좁은 도심과 모래가 있는 도로에서 각각 다른 흔적을 남길 수 있다. 외곽 개조형은 타이어와 보강재에서 순정형과 차이가 날 수 있다.","sources":[{"label":"Cyberpunk 2077 Vehicles · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Vehicles"},{"label":"Night City · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"},{"label":"사이버펑크 2077/스토리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EC%8A%A4%ED%86%A0%EB%A6%AC"}],"priority":193},{"title":"배드랜드 호송 문화","group":"세력","keywords":["노마드호송","수리캠프","도로권","정비","트럭"],"short":"가족 단위로 운영하는 차량·물류 생활","body":"배드랜드에서 장거리 물자 운송은 연료와 정비, 출발 전 점검, 길과 통행료에 대한 정보에 의존한다. 크고 작은 차량이 같은 캠프와 이동로를 쓰며, 수리 기술과 물자를 가진 가족의 역할이 크다. 노마드의 합법적 운송과 밀수, 레이스의 약탈이 도로에서 맞물려도 운송의 목적과 대상은 다르다. 출입 절차는 무장과 차량 외관만으로 정해지지 않으며 회사 시설과 국경은 각자의 통제로 운영된다. 라펜 쉬브는 노마드 집단에서 심각한 배신이나 범죄 등으로 추방된 이들을 통칭하며, 레이스는 그 가운데 배드랜드에서 활동하는 대표적인 조직이다. 라펜이라고 모두 레이스 소속인 것은 아니다. 사울 브라이트가 이끄는 알데칼도 패밀리는 배드랜드에서 이동 캠프와 차량을 바탕으로 활동한다. 사울이 고정 계약과 장기 생존에 무게를 둘 때 팬앰은 기업에 의존하는 방식과 개인의 자유를 놓고 반발할 수 있다. 미치와 스콜피온은 전쟁 경험과 기계 작업으로 가족 내부와 연결된다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"알데칼도 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Aldecaldos"}],"priority":193},{"title":"기업·시경 장갑 차량","group":"이동","keywords":["장갑차량","헬하운드","아이언클래드","오버로드","마티코어"],"short":"경비·군수·시경용 특수 사양","body":"셰빌론 계열의 엠퍼러 아이언클래드와 빌레포트 코르테스 오버로드 같은 시경 사양은 동일한 차종의 민간 모델과 따로 분류한다. 밀리테크의 헬하운드, 마티코어와 베헤모스는 전술 인원과 큰 화물을 옮기는 군수 차종으로 거론된다. 도장과 회사 표식, 추가 장갑의 형태는 어느 기관에 납품되었던 차인지 알아볼 단서가 된다. 장갑을 더한 부피는 탑승 목적, 도로 제한, 정비 비용과 연결된다. 순찰차에 외관이 비슷한 고급차의 소유 관계는 등록 이력으로 확인하며, 도그타운에서 기업 표식을 그대로 쓴 차량이 현역 기업 명령을 따르는지 따로 살핀다. 교차로에 세워 둔 회사 장갑차와 실제로 시경이 지역을 순찰하는 차량은 작은 장갑 틈이나 외부 장비뿐 아니라 경비대가 있는 위치에서 구분해 기록한다. 차의 등록 상태와 내부 승무원이 지휘를 받는 계통까지 맞춰 봐야 각 차의 용도를 알 수 있다. 바게스트 차량은 물려받은 군납 기반과 현재의 통제 이력을 함께 본다.","sources":[{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"Cyberpunk 2077 Vehicles · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Vehicles"},{"label":"Militech · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Militech"},{"label":"Night City · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"}],"priority":194},{"title":"도그타운 개발 잔재","group":"도시","keywords":["피난처","옛경찰서","테라코그니타","크레스"],"short":"버려진 공공 시설과 미완성 개발 구역","body":"도그타운의 버려진 퍼시피카 NCPD 경찰서는 이전 공권력의 흔적이며, 경관이 공식적으로 치안을 수행하는 현역 거점은 아니다. 테라 코그니타에는 중단된 관광·전시 개발의 폐건물이 있고, 크레스 스트리트 일대에는 집과 은신처가 이어진다. 무너진 구조체나 남은 근무 시설의 용도는 세력 이동에 따라 바뀐다. 거대한 개발 잔재 사이에 바게스트 검문과 상인들의 거리가 섞이면서 한 골목을 사이에 두고 동선과 감시 수준이 달라진다. EBM 페트로켐 스타디움의 시장은 도그타운 물류가 사람에게 보이는 대표적 접점이다. 반입되는 거래품과 상인이 집중되며 바게스트 검문이 인접한다. 블랙 사파이어는 핸슨이 큰 모임을 여는 경비가 강한 시설이다. 헤비 하츠는 피라미드형 외관의 클럽이며 미스터 핸즈의 접촉 장소와 연결된다. 공개 장사, 초대장에 따른 사교, 픽서의 사적 중개는 세 시설에서 서로 다른 사람과 정보를 끌어들인다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"바게스트(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B0%94%EA%B2%8C%EC%8A%A4%ED%8A%B8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":194},{"title":"바실리스크 부양 장갑차","group":"이동","keywords":["바실리스크","Basilisk","부양장갑차","알데칼도장갑차"],"short":"밀리테크제 부양식 장갑 플랫폼","body":"바실리스크는 밀리테크의 부양 계통 장갑 플랫폼이다. 바퀴나 궤도가 지면을 따라 움직이는 일반 차와 외양·운용이 다르며, 승무원의 신경 인터페이스가 조종에 맞물리는 장면이 나온다. 팬앰과 알데칼도의 이야기에서 확보와 정비, 이후의 운용이 각기 다른 사건으로 나타난다. 장갑을 갖춘 차량 한 대가 있었다는 단서와 부대가 정식 보급했다는 주장은 서로 다른 기록이다. 중고 부품과 정비 책임을 맡은 사람이 중요한 배드랜드에서 민간 픽업으로 옮기는 수리 자재와 이 장비 본체는 같은 운송 요건을 요구하지 않는다. 운전자가 맡는 일과 두 사람이 연결해 분담하는 일에도 차이가 있다. 어느 시점에 옮겨 온 자산인지는 기업의 운송 기록과 현장에 있던 노마드의 정비 자료가 각각 보여 준다. 몇 명이 탑승할 수 있는지와 비슷한 기계에 신경으로 접속해 한 사람이 담당하는 제어 범위는 별개의 사양이다. 실제로 부양하고 있는 장갑차의 소재는 개별 운송 서류로 확인한다.","sources":[{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"팬앰 팔머 · 나무위키","url":"https://namu.wiki/w/%ED%8C%AC%EC%95%B0%20%ED%8C%94%EB%A8%B8"},{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"Militech · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Militech"}],"priority":195},{"title":"건설·인프라 회사","group":"기업","keywords":["코프버드","건설","나이트코프","복합개발","도시공사"],"short":"민간 자금이 개입하는 기반 시설과 재개발","body":"코프-버드 같은 건설업체와 나이트 코프, 시의 공공 사업은 같은 도시 재개발에 다른 방식으로 참여한다. 시는 허가와 계약 조건을 정하고, 민간 사업자는 자금과 시공, 때로 시설 운영을 맡는다. 도심의 제염과 기업 플라자 재건, 퍼시피카 관광지 공사 중단은 공사 구조와 자금 사정이 다르다. 건물의 소유, 임대, 유지보수 권한은 한 사업에 참여한 모든 회사에 공통으로 주어지지 않는다. 나이트 시티가 자유도시라는 지위는 여러 기업이 법인과 부지, 거래 거점을 유지하는 이유 가운데 하나다. 해운과 육상 운송, 항공·궤도 수송은 서로 다른 통행 규정을 가진다. 시정부의 공공 계약, 나이트 코프의 후원, 국제 기업의
