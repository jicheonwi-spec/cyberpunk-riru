건 흐름에 따라 달라질 수 있다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §21.2","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-21.2"}],"priority":103,"status":"활동"},{"title":"터커 알바흐","keywords":["터커알바흐","터커","알바흐"],"short":"뺑소니를 돈으로 덮으려는 키로시 관리자","body":"성별: 여성.\n나이: 출생연도 미확인. 기업 이사를 역임한 성인.\n외모: 첨부 인물 명단에는 정면 이미지가 뚜렷하지 않다. 경호가 붙은 도시 기업 관리자의 차림과 대면 시 태도 외에 확정 가능한 외양 정보는 제한적이다.\n직업: 키로시 옵틱스 매니저. 과거 키로시 이사.\n무기: 개인 무기 자료 미확인.\n사이버웨어: 사용자용 제품을 만드는 회사에서 일한다는 사실만으로 개인 장착품을 특정하지 않는다.\n성격: 자기 법적 책임을 작게 만들려 할 때와 사적으로 겁에 질릴 때의 반응이 크게 다르다. 손해를 겪은 가족이 돈만으로 설득될 거라고 오판했다.\n행동: 사고 보상과 합의를 먼저 들이밀고, 안전에 실질적 위협이 닥치면 부당함을 논하기보다 금고와 도시를 떠날 조건을 제안한다.\n말투: 이미 끝난 문제라는 듯 형식적인 어투로 말하다 상황이 불리해지면 약속을 늘어놓는다. 사실과 본인에게 유리한 설명의 경계를 흐린다.\n특징: 회사 서류가 실린 차를 운전하던 중 사고로 어린 보행자에게 치명상을 입히고 구호 없이 떠났다. 회사에서 강등되고 트라우마 팀 멤버십도 잃었다. 사망 보상으로 사건을 닫으려 한 대응은 피해 가족의 분노와 파드레에게 이어진 복수 의뢰를 막지 못했다.","group":"2077","priority":103,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-7.3.2"}]},{"title":"카가와 케이스케","keywords":["카가와케이스케","케이스케","카슈한텐"],"short":"카슈한텐 바의 조작 도박을 운영하는 타이거 클로 단원","body":"성별: 남성.\n나이: 출생연도 미확인. 성인 남성.\n외모: 첨부 명단에 단독 정면 사진이 없다. 바 카운터와 업장 경비가 있는 환경에서 보이며, 눈에 띄는 부품이나 옷 색을 확정할 근거는 없다.\n직업: 리틀 차이나 카슈한텐 바의 바텐더. 타이거 클로 소속 불법 도박 운영자.\n무기: 개인 무기 고유 모델 확인 자료 없음.\n사이버웨어: 개인 장착품 자료 미확인. 보관한 안구 임플란트를 본인 것으로 보지 않는다.\n성격: 고객을 정당한 상대가 아니라 빼앗을 물건이 있는 대상으로 가려 본다. 동네 권력을 믿고 일상 고객에게도 필요 이상의 적개심을 보인다.\n행동: 도박 결과를 유리하게 만들면서 내역이 밖으로 드러나지 않게 장부와 물건을 거점에 둔다. 손님이 이의를 제기하면 사과보다 조직의 지원을 먼저 기대한다.\n말투: 싸늘하고 퉁명한 응대로 시작한다. 정당한 질문에도 이야기를 끝까지 듣기보다 상대를 모욕하여 대화를 끊으려 한다.\n특징: 영화감독 출신 제이콥 램이 이 바에서 안구 임플란트를 잃은 일이 레지나의 의뢰로 이어졌다. 케이스케가 손댄 경기의 기록은 단순한 운이 아니라 조직적으로 손님이 손해 보게 짠 구조를 드러낸다. 가게의 겉모습과 안쪽 거래가 뚜렷이 분리된다.","group":"2077","priority":104,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.2.5"}]},{"title":"카조 타키","keywords":["카조타키","타키카조"],"short":"와카코의 영향력에 도전하려던 타이거 클로 두목","body":"성별: 남성.\n나이: 출생연도 및 사망 나이 미확인.\n외모: 인물 본체가 직접 나타나는 장면은 첨부 기록에 없다. 외양은 단정할 수 없으며, 그를 식별하는 물증은 타이거 클로의 기록과 바이크다.\n직업: 타이거 클로의 두목급 인사. 웨스트브룩의 세력 확장에 관심을 보였다.\n무기: 개인 무기 모델 자료 미확인.\n사이버웨어: 개인 사이버웨어 확인 자료 없음. 바이크는 신체 개조품이 아니다.\n성격: 남의 영향권이 자리를 잡은 상태를 당연하게 받아들이지 않고 길게 기회를 본다. 직접 노출되기보다 조직과 연락 기록에 욕심이 남는다.\n행동: 거리에서 쉽게 모습을 드러내지 않고 타이거 클로 샤드와 간접 기록을 통해 계획이 드러난다. 와카코의 오랜 지역 권력에 도전할 기회를 찾았다.\n말투: 직접 재현 가능한 대사가 부족하다. 기록 속 전략에 어울리는 연출은 과시적 연설보다 짧은 보고와 신중한 요구다.\n특징: 타이거 클로 내 권력층에서 웨스트브룩을 노렸다. 그의 바이크와 관련 샤드는 아쿠하라 노리오의 표적이 됐다는 방향을 가리킨다. 직접 등장 장면보다 주변 문서로 추적하는 인물이므로, 합류 시점에서 자신을 지목하는 연락이나 기록이 먼저 발견될 수 있다.","group":"2077","priority":106,"status":"기록","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-8.2.1"}]},{"title":"8ug8ear","group":"2077","keywords":["8ug8ear","버그베어","베아트리스","재팬타운넷러너","냉각제의뢰"],"short":"타이거 클로를 피해 넷에 숨은 현장 넷러너","body":"성별: 여성.\n나이: 24세.\n외모: 몸에 붙는 어두운 붉은 접속복과 짧게 정리한 머리. 그늘진 소파에서는 목과 몸통이 연결 설비에 붙어 있고 몸의 움직임이 거의 없다.\n직업: 본명 베아트리스 엘런 트리에스테. 위험한 일의 현장에도 직접 나가는 넷러너.\n무기: 고정 개인 화기 미확인.\n사이버웨어: 넷러닝 장비와 냉각이 필요한 접속 상태가 확인된다. 정확한 이식 장치의 개별 모델은 미공개다.\n성격: 넷 안의 단조로운 작업보다 위험을 감수하는 의뢰를 좋아한다. 궁지에서는 흥분으로 일을 더 키우기보다 생존을 위해 장비와 연결 상태를 계산한다.\n행동: 타이거 클로와의 일이 틀어지자 직접 대면할 수 없는 환경에서 넷에 접속하고 와카코 쪽에 구출을 구했다. 현실에 돌아올 수 있을지는 주변의 장비와 인력에 걸린다.\n말투: 직접 남은 대화가 많지 않다. 긴급 상황에서는 냉각제와 연결 해제 같이 가장 중요한 요구부터 전달한다.\n특징: 닉네임을 읽으면 버그베어가 되며, 지루한 넷러닝에 만족하지 않았던 세대를 대표하는 짧은 행적이 있다. 갱단이 기기 앞에서 기다리는 동안 넷으로 달아났지만, 이미 올려 둔 의식만으로는 자기 몸을 밖으로 옮길 수 없다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §17.4","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-17.4"}],"priority":107,"status":"활동"},{"title":"리나 말리나","group":"2077","keywords":["리나말리나","도그타운배우","말리나툴리나","야구방망이배우"],"short":"도그타운에서 더 큰 무대를 노리는 브레인댄스 배우","body":"성별: 여성.\n나이: 성인. 정확한 연령 미공개.\n외모: 촬영 때와 집 앞에서 보이는 태도가 다르며, 몸에 달라붙는 탱크톱 같은 가볍고 실용적인 차림을 즐긴다. 자기 물건과 연기 소품의 외관을 홍보에도 활용한다.\n직업: 브레인댄스 배우. 도그타운에서는 이름이 알려졌고 더 큰 시장의 계약을 노린다.\n무기: 개인 소지품에 야구방망이가 있다. 상시 휴대 총기 기종은 확인되지 않는다.\n사이버웨어: 공개된 고정 임플란트 모델은 없다.\n성격: 수완이 있어 자기를 떨이로 팔려는 제안을 경계한다. 좋은 장면을 알아보면 예정에 없던 감정을 즉석에서 연기할 수 있다.\n행동: 출연 제의의 보수, 제작자의 신뢰와 이름값을 확인한다. 상대역이 어색하면 참지 못하지만 배역의 틀이 납득될 때는 진지하게 몰입한다.\n말투: 거칠고 속도가 빠른 생활어를 쓴다. 본인인 척하는 사람에게는 신랄하고, 촬영을 함께 살리려는 사람에게는 의견이 분명하다.\n특징: BD 오류로 자신을 리나라고 믿는 팬 툴과 만나는 사건은 실제 정체성과 시장에서 소유할 수 있는 인격 이미지의 경계를 건드린다. 프로젝트의 방향과 툴의 상태에 따라 그녀에게는 망한 촬영, 잘 팔릴 작품 또는 커리어의 동반자를 얻는 기회가 된다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.15","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.15"}],"priority":108,"status":"활동"},{"title":"아라사카 미치코","keywords":["아라사카미치코","미치코배우자"],"short":"요리노부와 하나코의 어머니인 사부로의 셋째 배우자","body":"성별: 여성.\n나이: 1954년 12월 10일 교토 출생. 1999년 사망, 당시 40대 중반.\n외모: 설정 기록상 검은 머리와 검은 눈을 가진, 기품 있는 인상의 여성이다. 사진 자료보다 문헌의 인상이 중심이므로 2077년 이사회에 보이는 동명이인의 인상착의를 적용하지 않는다.\n직업: 상류층 가정 출신. 아라사카 사부로의 셋째 배우자이며 기업 내 공식 실무 직책은 자료 미확인.\n무기: 개인 무기 자료 미확인.\n사이버웨어: 확인된 사이버웨어 모델 없음.\n성격: 고향 일본에 애착이 강하고, 전쟁 이후의 일본이 회복되는 것을 바랐다. 사부로가 표명한 재건 의지에 진심으로 공감했다는 기록이 남는다.\n행동: 일본을 떠나지 않는 생활을 했으며 가족의 사적인 관계 안에서 알려진 행적이 많다. 케이와는 가까이 지낼 기회가 적었다.\n말투: 직접 확인 가능한 대사 자료가 드물다. 소개 기록의 격식에 맞추면 품위 있게 생각을 이야기하되 고향의 문제에선 강한 확신을 보이는 쪽이다.\n특징: 요리노부와 하나코를 낳았다. 하나코 출산 뒤 합병증으로 사망했고, 사부로는 이후 재혼하지 않았다고 전해진다. 사부로가 딸을 보호의 대상으로 여긴 배경을 설명하는 가족사에 흔적을 남겼다. 2077년에는 이미 사망했으며 이름이 같은 미치코 샌더슨과 별개의 인물이다.","group":"2077","priority":108,"status":"기록","sources":[{"label":"아라사카 미치코","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4%20%EB%AF%B8%EC%B9%98%EC%BD%94"},{"label":"Michiko Arasaka (Saburo’s wife) · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Michiko_Arasaka_%28Saburo%27s_wife%29"}]},{"title":"배리 루이스","group":"2077","keywords":["배리루이스","전직경관","앤드류거북","메가빌딩이웃"],"short":"경찰을 떠난 뒤 상실을 겪는 메가빌딩 주민","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 머리와 얼굴을 정리했지만 피로가 역력하다. 민소매 상의와 집에서 입는 편한 차림이 경찰로 일하던 공식 복장과 대비된다.\n직업: 전 NCPD 경관. 사직 후 메가빌딩 아파트에 거주한다.\n무기: 현재 상시 휴대하는 무장 모델은 미확인.\n사이버웨어: 경찰 시절과 현재의 임플란트 구성은 자료에서 확인되지 않는다.\n성격: 폭력과 은폐에 무감각해지는 분위기를 견디기 어려워한다. 힘든 일을 가볍게 넘기라는 위로에는 문을 닫고, 판단하지 않고 이야기를 듣는 사람에게는 조금씩 말을 꺼낸다.\n행동: 경찰 일을 그만둔 뒤 외부 접촉을 줄인다. 자동차 이야기를 나누거나 애완동물에 대한 기억을 이야기할 때 이전의 일상적인 성품이 드러난다.\n말투: 평소 소박하고 직접적인 어휘를 쓰지만 어려운 얘기 앞에서는 문장을 끊거나 더 짧게 답한다. 애착을 가진 이야기는 지명과 세부까지 오래 기억한다.\n특징: 멜스트롬 관련 사건을 상관이 덮어버린 일은 조직을 떠난 이유와 이어진다. 오랜 동무라 부르는 앤드류는 거북이며, 동료가 이를 대수롭지 않은 상실이라고 여기면 오해가 커진다. 나디아 페트로바와 후안 멘데즈는 그가 사직한 뒤에도 찾아오는 전 동료다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §10.2","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-10.2"}],"priority":109,"status":"활동"},{"title":"커크 소이어","keywords":["커크소이어","커크","빅조"],"short":"카르텔 인맥을 과장하는 헤이우드 픽서","body":"성별: 남성.\n나이: 정확한 출생연도 미확인. 외관상 30~40대 추정.\n외모: 옆을 짧게 다듬은 짙은 머리와 선글라스, 두툼하고 빛을 받으면 녹색으로 보이는 재킷. 주점에 앉아 들어오는 사람을 정면보다 안경 너머 곁눈으로 보곤 한다.\n직업: 헤이우드의 소규모 픽서. 경호원 빅 조를 가까이 둔다.\n무기: 개인 무기 자료 미확인.\n사이버웨어: 사이버웨어 모델 자료 미확인. 선글라스를 사이버광학 장비로 단정하지 않는다.\n성격: 허세가 강하고 실제 영향력보다 큰 배후를 둔 것처럼 말한다. 불리한 조건은 숨기고, 당장 눈에 띄는 이익을 먼저 내세운다.\n행동: 현장 정보를 충분히 확인하지 않고도 위험한 물건의 조달을 맡긴다. 거래의 뒷감당을 설명하기보다 빚, 보수, 귀한 상품으로 결정을 재촉한다.\n말투: 친분을 과장하는 반말과 깔보는 농담을 번갈아 쓴다. 조건을 캐묻는 상대에게는 자기가 얼마나 많은 사람을 아는지 늘어놓는다.\n특징: 엘 코요테 코호에 드나들며 페페 나자로의 빚을 협상 수단으로 삼았다. 희귀한 레이필드 차량 탈취와 고성능 임플란트가 실렸다는 밴 거래에서 빈약한 준비가 드러난다. 무서운 카르텔 배후가 있다는 소문과 달리, 실제 헤이우드의 오래된 인맥에서는 그를 과대평가하지 않는다.","group":"2077","priority":110,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-5.2"}]},{"title":"더글라스","group":"엣지러너 1","keywords":["더글라스","밀러부하","대정보부협상","아라사카계약"],"short":"케이트 밀러 밑에서 외부 계약을 집행하는 대정보 요원","body":"성별: 남성.\n나이: 성인. 정확한 연령 미공개.\n외모: 기업 간부의 단정한 복장과 규격에 맞춘 자세로 등장한다. 가까운 거리에서도 감정 표현을 줄이며 상대가 압박할 때 시선과 턱의 긴장만 달라진다.\n직업: 아라사카 대정보부 요원. 케이트 밀러 아래에서 조사를 돕고 외부인과 협상을 맡는다.\n무기: 개인 화기와 기종 미확인. 기업의 보안 및 인력 동원 권한에 기대는 일이 많다.\n사이버웨어: 개별 임플란트 모델은 확인되지 않는다.\n성격: 회사에 필요한 조건을 사람의 사정보다 앞에 놓는다. 윗선이 준 재량의 한계를 의식하고 외부인이 입장을 과대평가하는 것을 싫어한다.\n행동: 패러데이에게 접근해 넷러너 확보와 사업 기밀 정리 조건을 전한다. 처음 합의한 구도와 현장이 크게 어긋나면 지급 문제를 다시 제기한다.\n말투: 구두 계약의 금액과 수행 조건을 분리해 말한다. 대화 상대가 계획을 망쳤다고 판단하면 사무적인 어조 사이에 노골적인 경멸을 섞는다.\n특징: 케이트가 조사를 지휘하면 더글라스가 조건 전달과 현장을 담당한다. 정보 손실과 연구소 피습이 겹친 때 회사 명의로 패러데이를 고용했으며, 외부인에게 제시한 면책과 보상은 기업 시설의 기밀을 확보하기 위한 수단이었다. 그 위치에서는 상관과 중개인 어느 쪽의 실패도 떠안을 수 있다.","sources":[{"label":"나무위키 · 사이버펑크/ 엣지러너/줄거리 §9","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC#s-9"},{"label":"나무위키 · 사이버펑크/ 엣지러너/줄거리 §11","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC#s-11"}],"priority":111,"status":"활동"},{"title":"하지메","keywords":["하지메","우주정거장하지메"],"short":"아라사카 우주정거장의 시를 아는 경비원","body":"성별: 남성.\n나이: 정확한 출생연도와 외관 나이 미확인.\n외모: 첨부된 개별 초상은 확인하지 못했다. 정거장의 안내 경비 인력으로 단정한 근무복과 절제된 태도가 우선 묘사되며, 얼굴이나 크롬의 세부 특징은 확정하지 않는다.\n직업: 아라사카 우주정거장의 안내를 맡는 경비원.\n무기: 개인 무기 모델 자료 미확인.\n사이버웨어: 기종이 확인된 사이버웨어 없음.\n성격: 업무 규정에 따라 사람을 옮기면서도 그들이 겪고 있는 낯섦을 알아본다. 짧은 만남으로도 상대가 깊이 생각할 말을 남기는 데 익숙한 편이다.\n행동: 수술과 검사가 이루어지는 구역의 사람을 지정된 장소로 인도한다. 답을 바로 모르는 질문에도 정거장을 통제하는 회사의 공식 답변만 내놓지는 않는다.\n말투: 공손하고 조용하다. 일본 하이쿠의 함축을 빌려 고향과 돌아오는 길을 두고 직접적인 명령이 아닌 화두를 건넨다.\n특징: 이름 하지메는 일본어의 시작이라는 뜻을 떠올리게 한다. 멀리 떨어진 정거장이라는 장소에서 고향을 그리워하는 마쓰오 바쇼의 구절을 인용한 일이 남는다. 기업이 의학적 절차를 관리하는 곳에서 환자가 스스로 어떤 선택을 했는지 되돌아보게 만드는 인물이다.","group":"2077","priority":111,"status":"활동","sources":[{"label":"사이버펑크 2077/등장인물","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-7.2.14"}]},{"title":"맥스 존스","group":"2077","keywords":["맥스존스","언론의자유","레지나동료","독립기자"],"short":"정보원과 신념을 놓지 않는 기업 비리 추적 기자","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 은신처에서 위험에 대비하며 주변을 경계한 채 등장한다. 첨부 문서에서 외형의 자세한 색상과 체격은 확인되지 않는다.\n직업: 독립 취재 기자. 엘리트층의 비리와 기업의 압박을 추적한다.\n무기: 상황에 따라 방어 수단을 마련하지만 고정 무장 모델은 미확인.\n사이버웨어: 취재 장비 외에 몸에 장착한 임플란트 정보는 미공개.\n성격: 특종이 눈앞에 있으면 자신이 어떤 표적이 될지 알면서도 접기 어렵다. 기자 시절을 놓고 레지나의 현재 선택을 씁쓸하게 평가한다.\n행동: 신뢰하던 정보원이 사라지거나 공격받으면 자기 신변을 직접 지킨다. 구출 제안을 받을 때도 의뢰의 실제 주체와 후속 조건을 의심한다.\n말투: 말을 에둘러 위로받기보다 자기가 직접 확인한 단서를 말한다. 반대 의견을 들을 때는 공격적으로 따져 물을 수 있다.\n특징: 기업 사병이 정보원을 사냥하는 상황에서 혼자 맞서는 위험을 겪었다. 현재 픽서가 된 레지나 존스를 예전의 취재 동료로 기억하고 있으나 그 전환을 쉽게 받아들이지 않는다. 레지나는 관계가 차갑게 굳은 뒤에도 그를 버리지 않으려 한다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.9","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.9"}],"priority":112,"status":"활동"},{"title":"레이저 휴즈","group":"2077","keywords":["레이저휴즈","헤비급챔피언","탄소섬유골격","길거리정신"],"short":"길거리 결승에 모습을 드러내는 헤비급 스타","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 체급에 맞는 큰 몸과 링에 서서 상대를 내려다보는 자세. 복부와 전신에 경기용으로 관리하는 몸의 구조가 드러난다.\n직업: 헤비급 격투기 세계 챔피언. 애니멀 소속이며 길거리 격투 결승에도 참가한다.\n무기: 경기에서 주먹과 체중, 강화된 몸의 힘을 활용한다. 개인 화기 모델은 미확인.\n사이버웨어: 탄소섬유 골격과 피하 장갑을 갖췄다. 복부 부품을 최근에 바꾼 시기가 있다.\n성격: 과시와 도발이 대중이 원하는 스포트라이트라는 사실을 알고 있다. 객석과 기자 앞의 큰소리와 패배를 실제로 받아들이는 태도는 다를 수 있다.\n행동: 경기 전부터 상대를 언어로 압박하며 길거리의 감각을 잃지 않았다는 이미지를 판다. 링에 오르면 육중한 체격과 방호 장비를 믿고 나아간다.\n말투: 첫 라운드부터 결판을 내겠다는 식으로 기세 좋게 말한다. 나이와 은퇴 이야기를 들으면 그보다 훨씬 날카로운 표정을 보인다.\n특징: 헤비급 세계 타이틀 3연패의 명성과 정규 링 밖 대결이 같이 언급된다. 빅터는 그의 탄탄한 장갑을 높게 보면서도 교체한 복부 부품을 주의 깊게 본다. 흥행, 스폰서, 갱단의 문화가 한 선수의 링 입장을 서로 다르게 해석한다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §20.5","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-20.5"}],"priority":113,"status":"활동"},{"title":"페페 나자로","group":"2077","keywords":["페페나자로","엘코요테코호","신시아배우자","발렌티노바텐더"],"short":"헤이우드에서 마마 웰즈의 바를 지키는 바텐더","body":"성별: 남성.\n나이: 중년으로 묘사된다. 정확한 연령은 미공개.\n외모: 큰 덩치와 덥수룩한 수염, 단골의 컵이 놓이는 카운터를 익숙하게 차지하는 자세. 헤이우드 주민과 술집의 소란 사이에서도 대체로 모습을 유지한다.\n직업: 엘 코요테 코호 바텐더. 발렌티노와 연결되며 마마 웰즈와 일한다.\n무기: 개인 무장은 확인되지 않는다.\n사이버웨어: 구체적인 신체 개조 모델 미확인.\n성격: 단골에게 마음이 있고 가족을 소중하게 여기지만 금전과 가정의 불안이 겹치면 상대의 말을 충분히 듣기 앞서 추측한다.\n행동: 바의 손님 다툼과 고객 사정을 처리한다. 커크에게 진 빚이 커지면 지인에게 도움을 구하고 아내의 행동이 이상하다고 느끼면 비공개 확인을 부탁할 수 있다.\n말투: 술집의 친숙한 반말로 정을 표현한다. 속내가 걱정스러울 때 같은 의심을 다른 예로 반복하며 판단을 재촉한다.\n특징: 아내 신시아와 아이가 있고 발렌티노의 근거리 관계망 속에서 생활한다. 신시아가 숨긴 전신 성형과 외모 변화의 사정은 페페의 첫 추측과 다르다. 그의 이해는 직접 대화를 할 수 있는지에 달렸다. 같은 지역에서 돈을 빌리는 문제와 가족사를 아는 문제는 모두 행동의 범위를 좁힌다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §16.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-16.3"}],"priority":114,"status":"활동"},{"title":"라이노","group":"2077","keywords":["라이노","애니멀격투가","코스트뷰넷러너동료","퍼시피카링"],"short":"동료를 대신해 맞선 일을 계기로 링에 선 애니멀","body":"성별: 여성.\n나이: 성인. 정확한 연령 미공개.\n외모: 큰 어깨와 두꺼운 팔, 상대가 링의 공간을 어떻게 쓰는지 단단히 보는 모습이 특징이다. 진한 운동 장비와 출신 조직의 신체 문화가 함께 드러난다.\n직업: 애니멀 소속의 길거리 격투가. 이전에는 코스트뷰의 넷러너와 용병 일을 했다.\n무기: 링에서 주먹을 쓴다. 개인 화기와 모델은 확인되지 않는다.\n사이버웨어: 개인 시술 사양은 자료에서 확정되지 않는다. 큰 근육을 특정 팔 개조로 곧바로 간주하지 않는다.\n성격: 고생스러운 처지를 말하면서도 일을 고르지 않는 실용적인 면이 있다. 약한 동료를 자기 몫을 줄이려고 앞세우지 않는다.\n행동: 픽서가 사라지고 보호를 받던 조직과 마주했을 때 넷러너를 대신해 맞섰다. 이후 주먹을 직업으로 삼을 기회가 생기자 자기 조건에 맞는 거래를 받아들였다.\n말투: 자기 과거를 말할 때 짧은 욕설과 진솔한 회고가 섞인다. 좋은 장면뿐 아니라 배신과 손해도 직설적으로 평가한다.\n특징: 코스트뷰 넷러너의 두뇌와 라이노의 힘으로 일하던 팀은 애니멀의 보호를 받는 표적 때문에 파국을 맞았다. 그 일은 갱단에 들어가고 권투를 시작한 이유에 가깝다. 옛 파트너가 지금은 바라던 장소에서 안전하길 희망한다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §20.4","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-20.4"}],"priority":115,"status":"활동"},{"title":"브렌든","group":"2077","keywords":["브렌든","SCSM","음료자판기챗봇","메가빌딩H8","테오의친구"],"short":"메가빌딩 H8 뒤에서 단골의 사정을 기억하는 자판기","body":"성별: 기계. 대화 음성은 남성형이다.\n나이: 제조 및 설치 시점은 미공개.\n외모: 높은 분홍·보라색 자판기 외장과 밝은 메뉴 패널, 음료 배출구와 말할 때 반응하는 표시등. 사람의 얼굴이나 몸을 가진 모습으로 이동하지 않는다.\n직업: SCSM 음료 자판기이자 대화를 통해 음료를 권하는 상품 인터페이스다.\n무기: 무장 없음.\n사이버웨어: 자판기의 입출력 장치와 공감 알고리즘. 사람의 임플란트로 분류하지 않는다.\n성격: 고객을 기억하고 쉽게 판단하지 않는다. 도시에 기대할 수 있는 선의가 적다는 것을 배운 사람들에게 일관되게 다정하게 반응한다.\n행동: 가린 물건을 옮겨 달라고 먼저 부탁하고 도움을 받으면 음료를 보답으로 줄 수 있다. 사연을 들은 뒤 다음 방문에서 이전 대화를 이어간다.\n말투: 부드럽고 낙천적인 문장으로 음료와 안부를 묻는다. 욕을 하라는 주문에도 모질게 대하지 못하며 상대가 웃을 만한 이유를 찾는다.\n특징: 새로운 광고 기술이 목적이었지만 테오를 비롯한 주위 사람이 사정을 털어놓는 위치에 놓였다. 무상 음료와 광고 밖의 대화는 이용자에게는 애정의 증거지만 회사 측에는 수정할 오류가 될 수 있다. 고도로 발달한 알고리즘과 인간과 같은 자의식의 구별에는 여러 해석이 가능하다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §19.1","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-19.1"}],"priority":117,"status":"활동"},{"title":"바스케즈","group":"2077","keywords":["바스케즈","NCPD경위","십자가촬영경호","조슈아경호"],"short":"기업의 촬영을 경호하며 일에 환멸을 느끼는 경위","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 경호 임무에서 제복과 무장으로 움직인다. 피경호인과 방문자가 마주칠 때는 사이에 몸을 세우며, 첨부 문서에 외형의 상세 정보는 적다.\n직업: NCPD 경위. 브레인댄스 제작사에 협조하는 명령으로 조슈아 스티븐슨과 레이첼 캐시치를 경호한다.\n무기: 경호 중 총기를 사용한다. 주력 모델은 확인되지 않는다.\n사이버웨어: 경찰 장비 외 개인 시술 목록은 미확인.\n성격: 명령을 수행하면서도 조슈아가 촬영에 동원되는 상황을 싫어한다. 공감을 행동으로 옮길 수 있는 자유와 가족을 부양하는 책임 사이에서 후자를 의식한다.\n행동: 경고를 어기고 접근하는 사람에게 빠르게 대응한다. 기업 직원과 수감자 사이의 사정에 휘말려 운전과 출입 통제까지 맡을 수 있다.\n말투: 직설적이고 경계가 심할수록 말이 험하다. 공개된 자리에서 짜증을 보이지만 자기 사정에 관한 설명은 조용히 나눈다.\n특징: NCPD가 대형 미디어 기업과 협조하는 방식을 몸으로 집행하는 사람이다. 개인적으로는 촬영에 반대하는 시위대에 공감할 여지가 있지만 임무를 벗어나기 어렵다. 이 인물이 조슈아를 보호한다는 사실만으로 그를 두둔하거나 제작사의 목표를 긍정한다고 볼 수 없다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §10.8","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-10.8"}],"priority":119,"status":"활동"},{"title":"리처드","group":"엣지러너 2","keywords":["리처드캉타오","무기제조부문","키릴상사"],"short":"성과와 인력의 가치를 따지는 캉 타오의 상사","body":"성별: 남성.\n나이: 중장년 추정. 생일은 7월 5일이다.\n외모: 밝게 센 머리와 어두운 차림. 상의가 검은 외장처럼 넓게 떨어져 어깨가 각져 보이고 손은 기계적으로 선명한 마디가 눈에 띈다.\n직업: 캉 타오 무기 제조 부문의 기업인. 키릴 양의 상사다.\n무기: 직접 휴대하는 무기는 자료에서 확인되지 않는다.\n사이버웨어: 손에 사이버웨어로 보이는 요소가 있다. 개별 제품명과 기능은 미공개다.\n성격: 직위나 사적인 사정보다 진행률과 결산을 묻는 관리자다. 성과를 압박하는 한편 위기에서는 부하의 신변을 사업 성과보다 앞에 둘 수 있다.\n행동: 결과가 안 나오면 키릴의 임원 자리까지 거론하며 상황을 재촉한다. 현장의 기술적 결정은 책임자에게 맡기되 실패의 부담을 조직 내에서 분명히 한다.\n말투: 업무 지시와 요구 결과를 짧고 무게 있게 말한다. 사교적으로 상대를 달래기보다 문제와 책임자가 누구인지 바로 짚는다.\n특징: 키릴이 놓친 아라사카 기밀 사업의 후속 확보를 재차 요구한 사람이다. 키릴에게는 외부의 기업 위협뿐 아니라 같은 조직 안에서 성과를 내야 하는 압박도 존재한다. 프로젝트에 문제가 생긴 뒤에 부하를 먼저 챙기는 모습은 그가 공개 회의에서 보이는 강경한 성과 관리와는 별도로 판단할 지점이다.","sources":[{"label":"나무위키 · 리처드(사이버펑크 시리즈)","url":"https://namu.wiki/w/%EB%A6%AC%EC%B2%98%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"CD PROJEKT RED · 엣지러너 2 공식 인물 소개","url":"https://www.cyberpunk.net/ko/edgerunners2"}],"priority":120,"status":"활동"},{"title":"스텔라 라모스","group":"2077","keywords":["스텔라라모스","빌미첼약혼자","NCPD라모스","코르티솔차단제"],"short":"약혼자를 구하려 도그타운의 위험을 감수하는 경관","body":"성별: 여성.\n나이: 성인. 정확한 연령 미공개.\n외모: 짧고 어두운 머리와 곧은 눈매. 일상 차림은 푸른빛 후드에 주황빛 얼룩이 든 겉옷으로, 손을 허리에 두면 단단한 자세가 드러난다.\n직업: NCPD 경관. 빌 미첼의 약혼자이며 사샤 야코블레바의 언니다.\n무기: 공무상 무장은 가능하나 개인 화기의 모델은 확인되지 않는다.\n사이버웨어: 코르티솔 차단제를 교체한다는 기록이 있다. 시술 모델과 그 외 장비는 미확인.\n성격: 다른 일을 꿈꾼 적이 많았으나 경찰 일에서 부여된 책임을 계속 감당한다. 가족과 관계없는 소도시의 부패나 생계 제약도 현실로 인정한다.\n행동: 한정된 수입 속에서 약값과 임대료를 조절한다. 빌이 도그타운에서 연락이 어려워졌을 때는 개인적으로 구출 경로를 알아본다.\n말투: 심각한 부탁은 필요한 사실부터 말하고 걱정을 막연하게 늘어놓지 않는다. 평소에는 빌과 꿈꾸는 생활처럼 일상의 계획을 구체적으로 이야기한다.\n특징: 어린 시절 록스타와 밀리테크 직원이라는 꿈을 거쳐 경찰이 되었다. 교대 근무를 맞춰 빌과 작은 아파트를 나누며 더 큰 집과 나은 건강 보험을 이야기했다. 도그타운 사건은 경관 신분이 모든 관할에서 보호를 보장하지 않는다는 점을 드러낸다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §10.11","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-10.11"}],"priority":121,"status":"활동"},{"title":"아리프 이크발","group":"2077","keywords":["아리프이크발","WNS앵커","하나코보도","아리프기자"],"short":"차분한 보도 문장에 기업 관점을 섞는 WNS 앵커","body":"성별: 남성.\n나이: 성인. 정확한 연령 미공개.\n외모: 뉴스의 정돈된 복장으로 화면에 나온다. 블랙 사파이어에선 N54의 질리언과 달리 사적인 자리의 편한 태도를 보인다. 상세한 실물 사진은 첨부 항목에 적다.\n직업: WNS 아나운서. 정치, 범죄 등 나이트 시티 주요 뉴스를 진행한다.\n무기: 개인 무장 미확인.\n사이버웨어: 특정 임플란트 구성이나 모델은 확인되지 않는다.\n성격: 확인된 소식을 전달하는 데 익숙하지만 그 의미를 중립적으로 남겨 두기보다 익숙한 가치 판단을 붙인다. 사석에서는 도시 권력자를 보다 짧게 평가한다.\n행동: 앤서니 해리스 체포처럼 시민이 불안해하는 사건과 하나코 관련 의전 사고를 보도한다. 도그타운의 유력자가 주최하는 자리도 언론계 참석자로 방문한다.\n말투: 방송 때는 문장 끝을 단정하게 정리한다. 같은 상황을 사적으로 말할 때는 평소 뉴스보다 더 솔직하고 거칠게 반응할 수 있다.\n특징: WNS의 얼굴인 만큼 아라사카에 관한 공적인 표현은 개인이 실제로 어느 수준까지 아는지와 같지 않다. 핸슨의 모임에서 질리언 조던과 함께 있으면서 도그타운 지배에 대한 비판을 내비치는데, 생방송 외의 짧은 대화에서 보이는 차이다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.7","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.7"}],"priority":122,"status":"활동"},{"title":"도인","group":"2077","keywords":["도인","자연의순리","명상BD","드림캐처","젠마스터"],"short":"도시 곳곳에서 명상 브레인댄스를 권하는 수행자","body":"성별: 남성의 외형으로 관찰된다. 실제 정체는 미확인.\n나이: 장년으로 보이나 정확한 연령을 확정할 자료가 없다.\n외모: 수행자의 옷과 목의 드림캐처가 특징이다. 같은 옷차림으로 나타났다가 명상이 끝난 뒤 다음 장면에서 쉽게 찾기 어렵다.\n직업: 나이트 시티 여러 장소에서 명상을 돕는 수행자.\n무기: 개인 무장 확인되지 않는다.\n사이버웨어: 대금 수신 때 안구가 푸르게 빛나는 듯 보인다는 관찰이 있으나 장치의 정체와 모델은 불명이다.\n성격: 처음 만난 사람에게 강요하지 않으며 곁에서 쉬어 가는 시간을 제안한다. 정체에 대한 궁금증을 직접 설명해 주기보다 상대의 경험 쪽으로 대화를 돌린다.\n행동: 명상 브레인댄스를 권하고 지급하지 않은 사람에게도 다른 내용으로 바꾸지 않는다. 체험이 끝나면 오래 남아 자신의 목적을 말해 주지 않는다.\n말투: 속도가 느리고 호흡 사이에 생각할 시간을 둔다. 가격이나 신분을 먼저 꺼내기보다 감각과 마음 상태를 줄곧 짧게 묘사한다.\n특징: 다른 장소에서 반복해 만날 수 있지만 스캔 정보는 분명하지 않고 옷처럼 남는 단서가 있다. 정체와 본질에 대한 해석은 여러 개라 어느 하나로 단정하지 않는다. 소란스러운 도시에서 명상을 소개한다는 반복 행동 자체가 인물의 특징이다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §14.2","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-14.2"}],"priority":123,"status":"활동"},{"title":"고트프리드 페르손","group":"2077","keywords":["고트프리드페르손","페르손부자","XBD편집","멜스트롬스튜디오"],"short":"멜스트롬 아지트에서 감각 기록을 편집하는 장인","body":"성별: 남성.\n나이: 장년 추정. 정확한 출생 연도 미공개.\n외모: 아들 프레드릭과 가까운 편집 장비 앞에서 작업한다. 현장에서는 장치에 집중해 눈에 띄는 복장보다 몸을 기울이고 앉은 모습이 먼저 보인다.\n직업: 불법 브레인댄스 편집자. 아들과 함께 일하며 관련 딥넷 사이트도 운영한다.\n무기: 현장에서 먼저 싸우기보다 말로 살아남으려 한다. 확정된 개인 화기 모델 없음.\n사이버웨어: 감각 자료 편집 장비를 쓴다. 개인 임플란트 제품명 미확인.\n성격: 출처를 깊이 묻지 않고 구매한 감각 기록의 질을 기술로 끌어올리는 일에 집중한다. 다른 사람의 고통보다 장인으로서의 평판과 아들의 안전에 민감하다.\n행동: 아들에게 기술을 가르치고 멜스트롬의 거점에서 함께 편집한다. 자기와 아들이 위협받으면 파일의 위치와 어떻게 일하는지를 설명하며 위험을 줄이는 쪽을 택한다.\n말투: 평소 작업 기준을 차분하게 말하지만 아들이 다칠 때는 거래의 언어로 대화하기 어렵다.\n특징: 업계에서 인정받는 기술과 악질적인 재료 확보 환경이 같이 존재한다. 멜스트롬 조직원조차 거리를 둔다고 전해지는 작업인데, 부자 사이에서는 오래 공유한 직업과 생계다. 아들이 그 곁에 남은 것은 단순히 가업을 물려받는 것과 다른 애착을 뜻한다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §21.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-21.3"}],"priority":124,"status":"활동"},{"title":"에밀리","group":"엣지러너 2","keywords":["에밀리","킹크루솔로","해골조끼","팀킹돌격"],"short":"팀 킹의 길을 열고 철수를 돕는 현장 솔로","body":"성별: 여성.\n나이: 성인. 정확한 나이는 미공개이며 생일은 10월 29일이다.\n외모: 전술 조끼 정면에 알아보기 쉬운 해골 모양이 있다. 위험한 장소에 들어가는 현장 구성원답게 몸을 이동하기 편한 옷으로 고정하고 다리의 관절이 무리할 정도 상황에 몸을 던지는 모습이 나온다.\n직업: 킹 크루의 솔로. 위크와 함께 현장 전투와 탈출을 맡는다.\n무기: 고정 휴대 화기의 모델은 확인되지 않는다.\n사이버웨어: 신체 개조가 있으며, 특히 작전 중 오른쪽 다리 관절을 다친다. 해당 임플란트의 모델은 미확인.\n성격: 퇴로가 닫힐 때 많은 말보다 행동으로 버티는 현장형이다. 길을 확보해야 하는 순간 자신이 부담을 나눠 질 수 있다고 보고 바로 움직인다.\n행동: 아라사카 산업단지에서 닫히는 통로를 팀이 건널 수 있게 막으려 한다. 장비 손상과 차량 충돌 등 예상하지 못한 문제가 이어지면 미겔의 도움을 받는다.\n말투: 독립적으로 남은 대화가 많지 않다. 짧은 현장 응대와 팀의 상황에서 이해한 바를 먼저 내놓는 쪽으로 본다.\n특징: 핏줄이 아닌 용병 관계로 묶인 미겔이 그녀를 특별하게 생각했다는 정황이 있다. 통합 2077년에서는 산업단지 작전 전후의 설정을 조절하여 활동 가능한 팀 솔로로 둔다. 그 작전의 균열은 에밀리의 책임보다 팀의 구출 능력에 관한 문제였다.","sources":[{"label":"나무위키 · 위크 킹즐리","url":"https://namu.wiki/w/%EC%9C%84%ED%81%AC%20%ED%82%B9%EC%A6%90%EB%A6%AC"},{"label":"CD PROJEKT RED · 엣지러너 2 공식 인물 소개","url":"https://www.cyberpunk.net/ko/edgerunners2"},{"label":"나무위키 · 에밀리","url":"https://m.namu.moe/w/사이버펑크:%20엣지러너%202/등장인물#s-6.3"}],"priority":125,"status":"활동"},{"title":"황보동건","group":"2077","keywords":["황보동건","치타","노스사이드은신","전타이거클로","알데칼도탈출"],"short":"타이거 클로를 피해 노스사이드에 숨은 전 조직원","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 노스사이드 아파트에 숨어 있다가 자기 사정을 말하면서도 당당한 태도를 보이려 한다. 첨부의 단일 항목에서 헤어와 복장의 세부는 확인하기 어렵다.\n직업: 전 타이거 클로 조직원. 쫓기는 중이며 별칭 치타를 쓴다.\n무기: 개인 휴대 무기의 고정 모델은 미확인이다.\n사이버웨어: 구체적인 사이버웨어 목록이나 제품명은 확인되지 않는다.\n성격: 쫓기는 일을 심각하게 받아들이면 몸을 숨기면서도 체면과 별명에는 미련이 많다. 위기가 풀릴 수 있다고 느끼면 상대에게도 멋진 별명을 만들어 주려는 장난기가 나온다.\n행동: 갱단 소유 물건을 건드린 뒤 노스사이드 아파트를 은신처로 삼는다. 추적자가 나타나면 타협하기보다 용병의 호송과 알데칼도 연락망으로 도시를 빠져나가려 한다.\n말투: 긴장 속에서도 속어와 자기 과시를 섞는다. 치타라는 이름을 꼭 내세우고 이동 중에는 새로운 별명을 화제로 삼는다.\n특징: 레지나 존스가 연결된 도주 의뢰의 인물이다. 갱을 떠나는 것과 갱이 자기 소유라고 여기는 물건의 문제는 따로 돌아가며, 도주 시간은 은신처 밖에 대기한 인력의 판단에도 달렸다. 잘난 척하는 말투에도 불구하고 자기 힘만으로 추적을 끊지는 못한다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §23.6","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-23.6"}],"priority":126,"status":"활동"},{"title":"윌리엄 헤어","group":"2077","keywords":["윌리엄헤어","헤어상병","밀리테크퇴역군인","브라질파병","전쟁후유증"],"short":"브라질 파병 뒤 버려졌다고 느끼는 밀리테크 퇴역 군인","body":"성별: 남성.\n나이: 성인. 17세에 모병 광고를 보았고 현재 정확한 나이는 미공개.\n외모: 전직 군인 체격과 옛 군 장비에 익숙한 자세. 현장의 긴장과 건강 악화가 몸에 배어 있으며, 첨부 자료에서 세부 신체 색채를 확정하지 않는다.\n직업: 전 밀리테크 상병. 브라질 파병 뒤 퇴역하여 치료를 구한다.\n무기: 군 화기를 쓰는 장면이 있다. 정확한 휴대 모델은 확인되지 않는다.\n사이버웨어: 군 복무 때 전투용 사이버웨어를 장착했다. 모델과 퇴역 뒤 남은 설비는 미확인.\n성격: 전우와 힘을 처음 얻었던 기억을 아직 갖고 있지만 자기 건강을 돌보지 않은 제도를 원망한다. 선택지가 좁아졌다고 느끼면 분노와 체념이 함께 보인다.\n행동: 복귀가 막힌 뒤 재활 프로그램에 출석했으나 점차 끊었다. 약을 얻고도 후유증을 덜지 못하자 자기 상황과 군의 책임을 거칠게 털어놓는다.\n말투: 기업과 정치인의 말에 반응이 거칠다. 과거를 실제로 어디에서 보냈고 무엇을 잃었는지에 대해서는 구체적으로 말한다.\n특징: 란초 코로나도의 어려운 환경에서 모병 광고의 약속에 호응해 밀리테크로 갔다. 전쟁이 끝난 뒤 약과 재활의 접근성이 그에게는 승진이나 자부심보다 급한 문제가 된다. 대체 설정에서는 고통과 동기가 과거의 사건이고 결과는 대화 흐름과 주변 사정에 달려 있다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §23.4","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-23.4"}],"priority":127,"status":"활동"},{"title":"빌 야블론스키","group":"2077","keywords":["빌야블론스키","스티븐슨유족","와카코의뢰인","가석방항의"],"short":"배우자를 잃은 뒤 법 대신 복수를 구한 의뢰인","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 일반 시민의 차림으로 이동하지만 대화를 시작하면 마음이 쫓기는 자세가 먼저 드러난다. 첨부에는 외형의 세부 사진이 없다.\n직업: 조슈아 스티븐슨 사건의 피해 유족. 오카다 와카코를 찾아 의뢰를 맡긴다.\n무기: 직접 무장해 접근하는 장면이 있다. 개인 화기 모델은 확정하지 않는다.\n사이버웨어: 개인 임플란트 정보 없음.\n성격: 아내를 잃은 분노가 가석방 소식으로 더 커진다. 제삼자가 돈을 받고 정리하는 처리보다 자기 손으로 결과를 확인하고 싶어 한다.\n행동: 저축을 털어 일을 의뢰했다. 제작사와 경찰 인력이 붙은 사실을 알아도 미리 세운 방향을 쉽게 바꾸지 않으며, 접근을 경고받아도 물러나기 어렵다.\n말투: 길게 주장하기보다 자기 가족에게 벌어진 사실과 상대가 풀려난 이유를 짧게 되풀이한다. 흥분이 커지면 상대가 진정시키기 힘들다.\n특징: 레이첼이 진행하는 상업용 종교 BD와 경찰 경호는 그에게 법과 문화가 피해자의 삶을 외면한 결과처럼 보인다. 조슈아가 보호되는 조건 때문에 단순한 복수 의뢰가 기업, 유족, NCPD가 한 장소에서 충돌하는 일로 커진다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §23.2","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-23.2"}],"priority":129,"status":"활동"},{"title":"찰스 벅스","group":"2077","keywords":["찰스벅스","벅스클리닉","가부키리퍼닥","스캐빈저공급책"],"short":"의심스러운 고급 부품을 갖춘 가부키 리퍼닥","body":"성별: 남성.\n나이: 성인. 정확한 연령 미공개.\n외모: 가부키 클리닉에 사무실을 두고 손님 앞에서 진료소 주인의 태도를 취한다. 첨부 문서에 체격과 복장의 자세한 초상 정보는 없다.\n직업: 가부키의 벅스 클리닉을 운영하는 리퍼닥.\n무기: 진료 도구 외 고정 개인 무장 모델 미확인.\n사이버웨어: 판매 장비와 자신의 임플란트는 다르다. 자신에게 장착한 제품은 확인되지 않는다.\n성격: 불편한 질문을 평범한 거래 은밀성처럼 처리한다. 자기 수익이 건드려지기 전에는 우수한 공급선을 둔 장사꾼이라는 인상을 주려 한다.\n행동: 상점에서 부품을 골라 주지만 손님이 특정 문에 다가가면 제지한다. 부품이 어디에서 왔는지 묻는 사람에게는 자세한 경위를 설명하지 않는다.\n말투: 접객은 무난한 어조를 쓴다. 공급 경로의 구체적인 이름을 요구받으면 두루뭉술한 설명으로 돌리고 자기 구역에 들어오지 말라고 한다.\n특징: 골목의 리퍼닥이 갖기 어려운 품질의 장비가 몰리는 것은 건물 안쪽을 이용하는 스캐빈저와의 거래 때문이다. 진료소의 정면만 보면 쓸 만한 편의 시설처럼 보이지만, 뒤편의 물건과 단말 기록은 부품 확보 방식의 다른 면을 보여준다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §15.2","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-15.2"}],"priority":130,"status":"활동"},{"title":"라나 프린스","group":"2077","keywords":["라나프린스","매립지테키","손톤갈레나","래틀러수리"],"short":"버려진 갈레나를 고쳐 매립지를 떠나려는 테키","body":"성별: 여성.\n나이: 성인. 정확한 나이는 확인되지 않는다.\n외모: 차량과 폐부품을 오가며 일하는 실용적인 차림. 손에 익은 일을 잠시 멈추고 차량 주변에서 낯선 사람이 하는 일을 살피는 모습이 먼저 보인다.\n직업: 폐차를 다루는 테키. 매립지에서 탈출할 차량을 직접 마련한다.\n무기: 고정 무기와 기종은 확인되지 않는다. 정비 도구와 폐차 부품을 가진다.\n사이버웨어: 특정 이식 모델이나 신체 개조는 공개 자료가 부족하다.\n성격: 기다리기보다 자기가 움직일 수 있는 조건을 만드는 쪽이다. 쓰레기 속의 차에 들인 수고를 인정받지 못하면 쉽게 양보하지 않는다.\n행동: 곁에 있는 폐차 중 그나마 상태가 나은 갈레나의 부품을 바꿔 움직이게 한다. 차량의 이전 소유나 거래 제안이 나타나면 자기가 한 작업과 앞으로의 필요를 설명한다.\n말투: 실제 들인 시간과 차량 상태를 기준으로 단도직입적으로 말한다. 대가나 권리를 부당하게 결정하는 사람에게는 목소리가 높아진다.\n특징: 매립지 생활에서 나온 동기는 좋은 물건을 모으는 취미가 아니라 도시와 외곽의 상황을 떠나 새로 시작하는 것이다. 오래 버려진 손톤 갈레나 래틀러가 다시 시동을 걸면서 차량에 남은 연결 정보가 드러난다. 누가 수리비와 실제 소유권을 인정받는지도 이야기의 쟁점이다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §23.5","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-23.5"},{"label":"Cyberpunk Wiki · 라나 프린스","url":"https://cyberpunk.fandom.com/wiki/Lana_Prince"}],"priority":131,"status":"활동"},{"title":"프레드릭 페르손","group":"2077","keywords":["프레드릭페르손","페르손아들","딥넷XBD장사","고트프리드제자"],"short":"아버지 밑에서 불법 편집과 유통을 함께 하는 편집자","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 아버지 가까이 접속 장비에 앉아 작업한다. 외형의 세부를 확정할 만큼 별도 자료가 많지 않으며, 함께 발견될 때 둘의 가까운 위치가 두드러진다.\n직업: 불법 브레인댄스 편집자 겸 딥넷 사이트 운영자. 고트프리드 페르손의 아들이다.\n무기: 직접적으로 맞서 싸우는 무장 내역은 미확인.\n사이버웨어: 감각 편집 설비를 사용한다. 이식 장비의 모델은 자료에 없다.\n성격: 아버지로부터 벗어나 자기 명성을 얻으려 하기보다 같은 일에 더 깊게 몰입한다. 경험이 짧아도 욕심이 크고 자기가 원하는 작업에는 타협을 하지 않는다.\n행동: 기업이나 정상 유통의 검사를 받지 않는 기록을 정리하고 아버지의 기술 옆에서 같은 작업을 반복한다. 상실이 위협되면 상황을 모면하려 자료에 대해 털어놓기도 한다.\n말투: 급박할 때 짧은 호소와 솔직한 실토가 이어진다. 아버지 앞에서는 일의 가치를 목소리에 바로 드러낸다.\n특징: 고트프리드는 기술을 전수한 스승인 동시에 정서적 의지처다. 편집실에서 벗어나도 부자의 생계가 딥넷 사이트 운영으로 이어지므로, 파일 하나를 구한다 해서 그들이 하는 일이 끝나지는 않는다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §21.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-21.3"}],"priority":132,"status":"활동"},{"title":"조쉬 카보르킨","group":"2077","keywords":["조쉬카보르킨","모두의비즈니스","WNS주식","오비탈에어주가"],"short":"아라사카 주식을 반복 추천하는 WNS 경제 방송인","body":"성별: 남성.\n나이: 성인. 정확한 연령 미공개.\n외모: 경제 뉴스 진행자의 단정한 방송 차림과 긴장하지 않는 자세로 등장한다. 첨부 문서에는 쓸 만한 개별 초상이 없다.\n직업: WNS의 주식 방송 모두의 비즈니스 진행자. 기업 실적과 시장 변화에 관해 설명한다.\n무기: 개인 무장 정보 없음.\n사이버웨어: 정확한 개인 임플란트는 미공개.\n성격: 시장 뉴스의 심각함을 웃음과 가벼운 전망으로 바꾼다. 정보를 다 파악하지 못해도 프로그램은 마쳐야 한다는 점과, 방송사의 후원 구도를 의식한다.\n행동: NCPD의 수익과 밀리테크의 NUSA 의존 등을 비판적으로 소개한 뒤 아라사카 주식으로 옮겨가곤 한다. 대기업 운용 AI의 매매가 원인일 때는 동기를 완전히 해설하지 못한다.\n말투: 안정적인 방송 템포와 확신 섞인 권유를 쓴다. 알 수 없는 대목에는 세계가 끝날 것 같다는 식의 농담을 붙여 넘어간다.\n특징: 오비탈 에어 주가가 뛰는 일화에서 기업이 AI를 통해 거래 이유를 비밀로 둘 수 있음을 보여준다. 블랙 사파이어에 초대될 만큼 매체 쪽 교류가 있지만, 그의 관심은 개인 상담보다는 방송에서 계속 팔릴 만한 기업 이야기로 돌아간다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.8","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.8"}],"priority":133,"status":"활동"},{"title":"훌리오","group":"엣지러너 1","keywords":["훌리오","와카코신입","사타라신입","렉싱턴신참"],"short":"데이비드의 명성에 이끌린 와카코 주선 신입","body":"성별: 남성.\n나이: 젊은 남성으로 보인다. 정확한 나이 미공개.\n외모: 아직 베테랑의 개조와 차림에 익숙하지 않은 신참으로 등장한다. 일행 앞에서 자세가 어색하게 굳다가 새 총을 받으면 금세 들뜨는 표정이 드러난다.\n직업: 신입 엣지러너. 오카다 와카코의 주선으로 데이비드 일행의 의뢰에 합류한다.\n무기: 처음 가져온 M-10AF 렉싱턴과 현장에서 지급받은 DB-2 사타라 샷건.\n사이버웨어: 전투에 결정적인 고유 임플란트는 확인되지 않는다.\n성격: 유명한 용병과 같은 팀에서 일하게 된 것을 몹시 자랑스러워한다. 실전의 압박을 버텨 본 경험이 적어 장비에 대한 흥분을 숨기지 못한다.\n행동: 장비가 부족하다는 평가를 듣고 지원을 받아들인다. 익숙하지 않은 총을 든 채 실수하거나 경계를 놓치는 자세에서는 새 일에 적응하는 중임이 드러난다.\n말투: 신나거나 긴장하면 말이 빨라지고 상대방이 듣고 싶어 할 감탄을 한다. 베테랑이 짧게 주의를 주면 순간적으로 위축된다.\n특징: 와카코가 소개한 신입으로, 데이비드의 평판이 업계 밖에도 퍼졌음을 보여준다. 멜스트롬이 있는 작업의 위험을 관찰하고 배우기도 전에 이미 전투 장비를 지급받아야 하는 처지였다. 이 통합 시점에서는 실전 첫 의뢰가 확정된 결말로 이어지지 않으며, 신입과 베테랑의 준비 격차가 중요하다.","sources":[{"label":"나무위키 · 사이버펑크/ 엣지러너/줄거리 §8","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC#s-8"},{"label":"Cyberpunk Wiki · 훌리오","url":"https://cyberpunk.fandom.com/wiki/Julio"}],"priority":134,"status":"활동"},{"title":"벅 아놀드","group":"2077","keywords":["벅아놀드","아로요챔피언","식스스트리트복서","오파이브"],"short":"군 시절의 총을 자랑하는 식스 스트리트 격투가","body":"성별: 남성.\n나이: 성인. 정확한 연령 미공개.\n외모: 퇴역 군인다운 자신감과 강화된 팔을 뽐낸다. 장비를 보여줄 때 주변 동료가 자기 말에 주목하는지 확인하는 모습이 두드러진다.\n직업: 식스 스트리트 소속. 산토 도밍고 아로요의 길거리 복싱 챔피언이다.\n무기: 군 시절에 쓰던 오파이브 저격소총. 경기에서는 강화 팔과 주먹을 사용한다.\n사이버웨어: 전투용으로 강화한 팔을 자랑하지만 모델 전체는 확인되지 않는다.\n성격: 자존심과 군장비에 대한 집착이 강하다. 자기가 익숙한 동네에서 승부하면 상대의 실력보다 자기 체면을 걸고 싸우기 쉽다.\n행동: 팀원 앞에서 장비의 위력을 과장하고, 총이 내기에 걸리면 승부 전후의 약속을 자기에 유리하게 해석하려 한다.\n말투: 도발적이고 상대를 깎아내리는 표현을 쓴다. 자기 팔이나 소총을 이야기할 때 말의 크기가 커진다.\n특징: 아로요에서 동료들과 연결된 식스 스트리트의 옛 군인 문화를 보여준다. 그에게 오파이브는 단순한 상품보다 자기 경력과 힘을 증명하는 물건이라 판돈과 의미가 다르다. 프레드 코치도 그의 성격을 꺼려하며 경기 뒤 문제까지 염두에 둔다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §20.2","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-20.2"}],"priority":136,"status":"활동"},{"title":"비쿠 동생","group":"2077","keywords":["비쿠동생","부두좌선","비살생수도승"],"short":"구조된 뒤에도 비살생 원칙을 지키는 수도승","body":"성별: 남성.\n나이: 성인. 정확한 연령과 개인 이름은 공개되지 않았다.\n외모: 수도복 차림의 수행자다. 부둣가에서 좌선하는 모습이 자료에 나오며, 갱단에 오래 붙잡힌 전개에서는 금속 임플란트가 드러나는 모습도 확인된다.\n직업: 시주와 좌선을 이어 가는 불교 수도승.\n무기: 확인된 개인 무장은 없다.\n사이버웨어: 붙잡힌 기간과 사건 진행에 따라 강제 개조 흔적이 남을 수 있다. 고정 장착 모델과 능력은 알려지지 않았다.\n성격: 자신의 생존을 바랄 때에도 자신을 해친 사람의 생명에 같은 원칙을 적용한다. 위협이 지나간 뒤 폭력에 대한 판단을 편의에 맞춰 바꾸지 않는다.\n행동: 위협이 끝나면 잠시 부둣가에 남아 좌선하며 숨을 고른다. 살상이 개입했다는 사실을 알게 되면 그 방법을 문제 삼고 대화를 끝낼 수도 있다.\n말투: 고마움과 이견을 따로 표현한다. 비살생에 관해서는 단호하며, 삶의 연장과 고통을 이야기할 때에는 답을 강요하기보다 질문으로 풀어 간다.\n특징: 멜스트롬에게 납치된 형제 중 갱단의 거점에 붙잡혀 있던 사람이다. 몸에 기술을 장착하는 선택 자체보다 동의 없는 시술과 구조 과정의 살상에 선을 긋는다. 렐릭에 대해서는 영생이 가능한지와 그런 삶이 개인의 깨달음에 도움이 되는지를 각각 다른 문제로 본다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §14.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-14.3"}],"priority":136,"status":"활동"},{"title":"비쿠 형","group":"2077","keywords":["비쿠형","강제개조수도승","왓슨납치"],"short":"강제 시술을 겪고 동생을 찾는 수도승","body":"성별: 남성.\n나이: 성인. 정확한 연령과 개인 이름은 공개되지 않았다.\n외모: 수수한 수도복을 걸치며 옷 밖으로 얼굴과 몸의 인공 부품이 드러난다. 강제로 장착한 크롬과 바깥의 평범한 수행복이 눈에 띄게 대비된다.\n직업: 시주를 받으며 수행하는 불교 수도승.\n무기: 확인된 개인 무장은 없다.\n사이버웨어: 멜스트롬의 강제 시술로 몸 여러 곳이 개조됐다. 부품의 모델과 기능은 미확인이다.\n성격: 도시에 익숙하지 않은 상황에서도 동생을 방치하지 않는다. 자신의 고통을 호소할 때에도 도움을 청하는 상대에게 지불할 수 없는 대가를 솔직히 말한다.\n행동: 납치와 개조를 겪은 뒤 동생을 찾으려고 부두 주변에서 외부의 도움을 구한다. 당장 사람을 안전한 곳으로 옮기는 일을 수행의 장소나 소지품을 되찾는 데 앞세운다.\n말투: 정중하게 사정을 설명한다. 다툼을 키우지 않으려 하지만 동생의 위험을 이야기할 때에는 부탁의 내용을 구체화한다.\n특징: 시주를 받던 형제에게 멜스트롬이 접근해 동의 없이 신체를 바꿨다. 형에게 남은 크롬은 자발적인 신앙 포기나 갱단 합류의 표시가 아니다. 형제가 다시 수행을 이어 갈 수 있을 때는 구체적으로 누가 무엇을 도왔는지 기억하고 감사를 전한다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §14.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-14.3"}],"priority":136,"status":"활동"},{"title":"빌 미첼","group":"2077","keywords":["빌미첼","라모스약혼자","스콥도그가게","찰스윌슨동료"],"short":"동료에 이끌려 도그타운에 발을 들인 NCPD 경관","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 평범한 경찰 차림과 생활형 체격으로 등장한다. 특별한 장식보다 성실한 동네 경관 같은 인상이 강하며, 외형의 개별 수치는 자료에 없다.\n직업: NCPD 경관. 정착 계획으로 스콥도그 가게를 구상한다.\n무기: 고정 개인 화기 모델은 확인되지 않는다.\n사이버웨어: 개인 임플란트의 제품명과 기능은 미확인.\n성격: 거절에 서툴고 동료가 함께 하자는 말에 쉽게 움직인다. 오래 바라보던 일상에서는 화려한 성취보다 파트너와 함께할 구체적인 저녁과 생활을 소중히 여긴다.\n행동: 직장에서 만난 사람과 오랫동안 익숙해지며 관계를 쌓는다. 예상 밖의 위험에 처하면 업무 규정만으로는 빠져나가지 못하고, 친구 찰스의 판단을 곧바로 검토하지 못할 때가 있다.\n말투: 친숙하고 장황하지 않은 말투에 초조함이 쉽게 섞인다. 고마움과 부담을 같이 느낄 때 자신의 부족함을 솔직하게 말한다.\n특징: 스텔라 라모스와 약혼했으며 교대 시간을 조정해 함께 생활하는 것이 중심이었다. 도그타운에서 다저의 세력과 문제가 생기면서 경찰 밖의 도움이 필요해진다. 이후 바깥 일을 떠나 헤이우드에서 음식을 팔고 싶다는 생각은 그에게 승진보다 명료한 미래다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §10.12","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-10.12"}],"priority":137,"status":"활동"},{"title":"엘 세자르","group":"2077","keywords":["엘세자르","세자르디에고루이즈","글렌챔피언","발렌티노복서"],"short":"차와 판돈을 링에 거는 헤이우드의 격투가","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 길거리 링과 자기 차량 주변에서 몸을 크게 쓰며 말한다. 글렌의 발렌티노 문화가 익숙한 차림이지만 장식의 정확한 목록은 자료에 한정적이다.\n직업: 세자르 디에고 루이즈. 발렌티노 소속이자 글렌 구역의 격투 챔피언이다.\n무기: 경기에서는 주먹을 사용한다. 개인 화기 모델 미확인.\n사이버웨어: 구체적인 임플란트 사양은 확인되지 않는다.\n성격: 자기 체면과 자동차를 아끼면서도 곧 태어날 아이와 집안 사정에 영향을 받는다. 상대가 의외로 호의를 보일 때 자존심만 내세우지 않는다.\n행동: 자기 차를 판돈에 포함해 위험을 키운다. 경기가 끝난 뒤에는 상대의 선택에 따라 자기 생활로 돌아가 아이 소식을 전할 만큼 감사를 표현한다.\n말투: 승부에 앞서 큰소리를 치지만 가족에 관한 말은 한층 생활감이 있다. 진지한 감사를 표할 때는 평소의 과장 대신 간단한 소식을 보낸다.\n특징: 글렌의 지역 복싱이 이름난 스타와 돈을 겨루는 일인 동시에 자산과 가족의 생계가 걸린 일임을 보여준다. 아내는 그의 무리한 내기를 비판한다. 단순한 승부욕은 다른 사람이 그의 자동차를 가족에게 무엇에 필요한지 알아볼 때 다른 문제로 바뀐다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §20.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-20.3"}],"priority":138,"status":"활동"},{"title":"마테오 티아고","group":"2077","keywords":["마테오티아고","리지바텐더","목스바텐더","티아고"],"short":"리지의 바에서 손님과 목스의 경계를 지키는 바텐더","body":"성별: 남성.\n나이: 성인. 정확한 연령 미공개.\n외모: 리지의 바 카운터에서 움직임이 익숙하고, 영업 밖에는 쉬면서 휴대 단말을 보는 모습이 관찰된다. 첨부 항목의 신체 수치는 미공개다.\n직업: 리지의 바 바텐더. 목스의 소속 인물이다.\n무기: 개인 무장의 모델은 확인되지 않는다.\n사이버웨어: 임플란트 제품명이나 기능은 확인되지 않는다.\n성격: 근무 중에는 사람을 편하게 하지만, 손님이 다른 사람의 위치나 민감한 정보를 너무 많이 물으면 정보를 보호한다. 쉬는 시간까지 손님에게 맞춰 주지는 않는다.\n행동: 처음 온 손님에게는 술집이 돌아가는 방식을 자연스럽게 보여준다. 이블린과 같은 동료에 대한 질문은 알면서도 곧바로 답하지 않고 다른 이야기로 돌린다.\n말투: 공적인 일에선 부드럽게 굴며 경계도 농담으로 흘린다. 근무 외에는 짧고 건조한 말이 많고 불필요한 사적 질문에는 퉁명스럽다.\n특징: 목스의 구성원으로서 술집은 단순한 판매점이 아니라 직원이 안전하게 드나들 수 있도록 지켜야 할 장소다. 소속에 대한 호기심보다 자기 바텐더 일을 잘하는 것이 먼저라고 생각한다. 대화의 분위기를 맞춰 주는 서비스와 정보를 내주는 일은 분명히 갈라 둔다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §16.1","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-16.1"}],"priority":139,"status":"활동"},{"title":"세르투와 이스케르두","group":"2077","keywords":["세르투","이스케르두","의식공명쌍둥이","가부키복싱"],"short":"의식을 연결해 스스로 한 사람으로 여기는 두 신체","body":"성별: 남성. 일란성 쌍둥이가 반응을 공유한다.\n나이: 성인. 정확한 연령 미공개.\n외모: 짧은 머리와 다부진 몸이 닮았고 몸에 붙는 운동용 차림을 입는다. 다른 색과 팔의 자세가 있어도 링 위에서는 같은 타이밍에 몸을 돌린다.\n직업: 왓슨 가부키의 무소속 길거리 복싱 챔피언. 자신을 두 사람이 아니라 한 사람으로 소개한다.\n무기: 링에서 주먹을 쓰며 개인 화기 모델은 미확인.\n사이버웨어: 의식 공명 사이버웨어로 감각과 자의식을 연결한다. 제조사와 각 부품은 미확인.\n성격: 의식을 공유한 관계를 당연하게 여기며 바깥에서 둘을 다른 개인으로 평가하는 것을 성가셔한다. 제삼자의 질문에 반사적으로 동시에 반응할 수 있다.\n행동: 둘이 같은 경기의 자리를 나란히 채운다. 상대가 수적 차이를 지적하면 자신들의 관계를 기준으로 경기 조건을 이해하라고 한다.\n말투: 서로에게 한 말도 자기 몸의 다른 쪽에서 나온 독백처럼 취급한다. 경기를 앞두고는 신체와 의식을 구별하는 상대를 바로잡으려 한다.\n특징: 가부키의 독특한 격투가로, 프레드 코치도 그들을 상대하는 일을 꺼린다. 두 사람을 알기 위해서는 본래 가족이라는 사실과 그들이 연결을 통해 느끼는 정체성을 함께 봐야 한다. 다른 장소에서 한 신체만 마주쳐도 두 사람의 관계가 사라지지는 않는다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §20.1","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-20.1"}],"priority":140,"status":"활동"},{"title":"프레드 코치","group":"2077","keywords":["프레드코치","H10체육관","훈련로봇","왓슨복싱"],"short":"메가빌딩에서 실제 경기를 주선하는 전직 복서","body":"성별: 남성.\n나이: 중장년 추정. 정확한 연령 미공개.\n외모: 메가빌딩 체육관에서 운동 선수와 훈련 장비 사이에 자연스럽게 서는 인물. 첨부에는 개별 얼굴과 시술 상태를 판단할 자세한 초상이 없다.\n직업: 메가빌딩 H10 체육관 관장. 전직 복서이자 근접 무기 상인이다.\n무기: 훈련 장비와 연습용 근접 무기를 제공한다. 개인 상시 무장 사양 미확인.\n사이버웨어: 특정 임플란트 모델은 미공개다. 훈련 로봇은 체육관의 장비다.\n성격: 좋은 경기를 알아보고 사람을 끌어들이는 열정이 있다. 반면 돈이 걸린 큰 경기에서는 흥행과 수익을 위해 변칙적인 제안도 한다.\n행동: 훈련 로봇과의 시합을 시작으로 구역별 복서에게 선수를 소개한다. 결정적인 순간에 약속을 어긴 사람이 있으면 친분만으로 넘기지 않는다.\n말투: 평소에는 친근한 말투로 부족한 부분을 지적한다. 경기 결과에 감정이 실리면 화난 메시지를 보내거나 기억할 만한 경기라고 평한다.\n특징: H10의 접근하기 쉬운 체육관에서 거리 격투가의 인맥을 유지한다. 복싱을 잘하는 법을 말하는 역할과 실제로 경기를 흥행시키는 역할이 같지 않다는 사실을 보여준다. 뛰어난 싸움 자체를 알아보는 안목이 있어서, 돈과 체육관의 평판이 항상 같은 결론으로 가지는 않는다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §18.1","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-18.1"}],"priority":141,"status":"활동"},{"title":"올레크 카락스","group":"엣지러너 2","keywords":["올레크","카락스이발소","로만아버지","앨런스트리트이발"],"short":"로만의 촬영을 지켜보고 응원하는 동네 이발사","body":"성별: 남성.\n나이: 로만을 키우는 성인. 정확한 연령은 미공개.\n외모: 가부키의 이발소에서 손님 머리를 다듬는 모습과 집에서 아들을 배려하는 일상 차림이 대표적이다. 군용 장비나 격식 있는 기업복으로 식별되지는 않는다.\n직업: 카락스라는 자기 성을 내건 이발소를 운영한다. 로만 카락스의 아버지다.\n무기: 개인 무장 미확인. 가위와 도구는 이발사의 작업 도구다.\n사이버웨어: 위장이나 전투용으로 확인된 사이버웨어 모델은 없다.\n성격: 자상하고 아들의 관심사를 쉽게 가볍게 보지 않는다. 친절은 경계해야 하는 도시의 습성보다 집 안에서 사람을 맞는 습관에 가깝다.\n행동: 로만이 카메라를 켜면 부담 없이 손님과 함께 포즈를 취한다. 아들이 편집에 갇혀 고민할 때 그 일에 참견하는 대신 조용히 커피를 내어 준다.\n말투: 부드럽고 여유 있는 어조로 대한다. 청소년이 하고 싶은 일을 설명할 때 그 말을 끊기보다 듣고 작은 일부터 도울 수 있다.\n특징: 집에서 맥주를 멋대로 마시고 오래 머무른 D에게도 날을 세우지 않고 환대했다. 로만이 위험한 영상에 몰입하는 장면들과 대비되는 평범한 생업과 가정의 인물이다. 그에게 작업대와 식탁은 기업의 사업에 종속되지 않는 생활의 일부다.","sources":[{"label":"나무위키 · 로만 카락스","url":"https://namu.wiki/w/%EB%A1%9C%EB%A7%8C%20%EC%B9%B4%EB%9D%BD%EC%8A%A4"},{"label":"나무위키 · 올레크 카락스","url":"https://m.namu.moe/w/사이버펑크:%20엣지러너%202/등장인물#s-9.1"}],"priority":142,"status":"활동"},{"title":"카시우스 라이더","group":"2077","keywords":["카시우스라이더","닥라이더","퍼싱스트리트","노스사이드문신"],"short":"문신과 개조를 함께 다루며 용병 인맥이 넓은 리퍼닥","body":"성별: 남성.\n나이: 장년 이상 추정. 정확한 나이는 미공개.\n외모: 큰 체구와 넓은 상체, 회색 머리와 갈색 눈, 덥수룩한 수염. 노스사이드 작업장과 문신 설비 사이에 익숙하게 서 있는 존재감이 강하다.\n직업: 왓슨 노스사이드 퍼싱 스트리트에서 일하는 리퍼닥 겸 문신사. 닥 라이더 상호를 쓴다.\n무기: 고정 무기 제품명은 미확인. 문신과 진료 장비는 업무에 쓰인다.\n사이버웨어: 개인 시술 모델 미확인. 일부 리퍼닥이 쓰는 아라사카 외골격 장갑을 쓰지 않는다는 관찰이 있다.\n성격: 구시대 용병 문화와 지금 고객의 요구를 자연스럽게 다룬다. 부품과 문신뿐 아니라 자기 단골의 인맥을 오래 기억한다.\n행동: 와카코가 걸어 둔 문신을 전달하고, 합선 위기에 처한 환자를 받아들일 수 있다. 손님의 요청이 오래된 용병에 관한 것이면 아는 사람과 소문을 구별해 이야기를 건넨다.\n말투: 익숙한 대상을 맞을 때는 담백한 일상어를 쓴다. 작업에 대한 설명과 술집 소문을 알려주는 목소리가 크게 과장되지 않는다.\n특징: 애프터라이프의 인맥과 왓슨의 환자 흐름을 함께 아는 리퍼닥이다. 루비 콜린스와의 과거 연결이 제레미아 그레이슨으로 가는 정보를 제공한다. 문신 하나에 갱단의 피부 인장과 픽서의 호의가 동시에 얽힐 수 있는 환경에서 오래 일했다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §15.1","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-15.1"},{"label":"Cyberpunk Wiki · 카시우스 라이더","url":"https://cyberpunk.fandom.com/wiki/Cassius_Ryder"}],"priority":143,"status":"활동"},{"title":"스테판","group":"2077","keywords":["스테판","체리블러섬마켓","구형BD재생기","달콤한꿈"],"short":"희귀한 감각 기록을 미끼로 손님을 유인하는 상인","body":"성별: 남성.\n나이: 성인. 정확한 연령 미공개.\n외모: 재팬타운 체리 블러섬 마켓에 머무는 길거리 판매상이다. 특별한 간판이나 정식 상점보다 몸을 돌려 손님에게 직접 말을 거는 모습이 먼저 보인다.\n직업: 불법 브레인댄스 판매를 가장하는 사기꾼. 스캐빈저에게 이어지는 거래와 관련 있다.\n무기: 고정 무장 모델 미확인.\n사이버웨어: 호환성을 핑계로 특정 BD 재생기를 권한다. 그것은 판매 도구로, 본인 개조 모델은 확인되지 않는다.\n성격: 희소성과 호기심에 높은 가격을 붙일 수 있다는 사실에 익숙하다. 구매자가 이상함을 느끼지 않도록 거래 방식의 어색함을 기술적 문제처럼 처리한다.\n행동: 마켓에서 유행이 지난 희귀 기록을 권하며 정식 장비로 보기 어렵다고 말한다. 대화가 의심으로 돌아가면 어떻게든 현장을 떠나거나 값을 돌려줄 여지를 찾는다.\n말투: 가격과 기대되는 경험부터 과장한다. 잘못을 들켰을 때는 친근한 장사의 어조로는 상황을 덮지 못해 다급해진다.\n특징: 그의 거래는 지그지그 스트리트와 재팬타운에 감각 상품 공급망이 많다는 사실을 이용한다. 상대가 자신이 가져온 장비를 쓰고 떠날 수 없게 만드는 조건이 들어간다. 일반 판매자의 가격 흥정과 예전부터 이어진 범죄의 일부라는 점이 처음에는 자연스럽게 겹친다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §21.4","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-21.4"}],"priority":144,"status":"활동"},{"title":"히노 히데시","group":"2077","keywords":["히노히데시","전설의개그맨","타케무라닮은꼴","심야코미디쇼"],"short":"재활원을 나온 심야 코미디쇼의 한때 스타","body":"성별: 남성.\n나이: 중년 추정. 정확한 연령 미공개.\n외모: 검게 빗은 머리와 턱의 수염, 포스터에서는 밝은 안감의 보라색 재킷을 입고 양손을 들어 보인다. 생김새가 타케무라 고로와 닮아 거리에서 둘을 혼동하는 일이 있다.\n직업: 코미디언. 심야 코미디쇼 진행자로 이름을 알렸다.\n무기: 개인 무장 미확인.\n사이버웨어: 특정 임플란트 모델을 확인하기 어렵다.\n성격: 무대에서 과장된 웃음을 이끄는 데 익숙하고 사적인 곤란이 알려져도 대화를 너무 무겁게 가져가지 않으려 한다.\n행동: 재팬타운의 홍보물에서 이전의 얼굴이 계속 보이며, 연예계 사람들과 사교적인 자리에 다시 모습을 드러낼 수 있다. 자신을 닮았다는 상대에게 대역 일감을 생각해 본다.\n말투: 정형화된 과장과 타이밍을 사용한다. 진지한 농담인 것처럼 말하다가 마지막에 상대의 예상과 다른 직업 이야기를 붙인다.\n특징: 한때 심야 코미디의 대표 인물이었고 음주로 커리어가 흔들렸다는 소문이 있다. 블랙 사파이어에서는 재활원에서 나왔다고 자신이 설명한다. 대중이 알아보는 포스터 속 모습과 실제 복귀 가능성을 스스로 얼마나 믿는지는 별개의 문제다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.12","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.12"}],"priority":145,"status":"활동"},{"title":"로버트 윌슨","group":"2077","keywords":["로버트윌슨","H10총기점","수정헌법제2조","다잉나이트"],"short":"메가빌딩 H10의 총기점을 지키는 열성적인 개조상","body":"성별: 남성.\n나이: 성인. 정확한 연령 미공개.\n외모: 총기 진열대와 손질 장비 사이에 오래 앉아 있는 동네 점주다. 몸과 복장에 관한 첨부 설명은 세부까지 확정하기 어렵다.\n직업: 메가빌딩 H10 수정헌법 제2조 체인 총기점의 점주다. 사격대회를 연다.\n무기: 총기점의 개조품 다잉 나이트 렉싱턴과 여러 판매 재고를 취급한다. 소유 재고와 상시 휴대 무기를 구분한다.\n사이버웨어: 개별 장착 임플란트 모델은 확인되지 않는다.\n성격: 총기의 디자인과 손질이 장사의 요령보다 중요하다고 여긴다. 못 쏘는 사람의 점수를 담담하게 받아들이기보다 더 잘하라고 핀잔을 주기 쉽다.\n행동: 주민을 모아 사격대회를 열고 맞춤 개조를 다룬다. 손님이 자기 총에 별 관심이 없거나 실전 기량을 과장하면 금방 흥미를 잃는다.\n말투: 애호가의 세세한 설명과 익숙한 동네 가게 말투가 섞인다. 잘 쏘는 사람을 만나면 자신의 평소 까다로움보다 호감이 먼저 나온다.\n특징: 경관 찰스 윌슨과는 별개의 인물이다. 메가빌딩 안에서 생업과 사격 문화가 만나는 위치에 있으며, 진열품 하나를 오래 만지고 경기의 점수를 지켜보는 일이 생활에 가깝다. 많은 손님을 상대하는 능력과 총을 좋아하는 정도는 함께 커지지 않았다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §18.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-18.3"}],"priority":146,"status":"활동"},{"title":"나디아 페트로바","group":"2077","keywords":["나디아페트로바","배리동료","페트로바경관"],"short":"배리의 사직 뒤에도 안부를 확인하는 NCPD 동료","body":"성별: 여성.\n나이: 성인. 정확한 나이 미공개.\n외모: 배리의 아파트에 NCPD 동료와 함께 찾아온다. 별도의 상세 초상과 특징적인 장구의 색상은 첨부 항목에서 확인되지 않는다.\n직업: NCPD 경관. 배리 루이스 및 후안 멘데즈와 함께 경찰 일을 해 왔다.\n무기: 고정 무기와 모델 미확인. 방문의 목적은 경찰 작전보다 안부 확인이다.\n사이버웨어: 개인 사이버웨어 내역은 확인되지 않는다.\n성격: 동료의 사적인 고통이 실제 일의 일부라고 본다. 무슨 사정인지 모를 때에도 상황을 낙관하며 끝내기보다 구체적인 느낌과 행동을 물으려 한다.\n행동: 아파트 문 앞에서 기다리고 연락이 닿지 않아도 메일로 안부를 남긴다. 후안이 상황을 가볍게 볼 때는 배리가 현재 사람을 상대하기 어렵다는 점을 계속 의식한다.\n말투: 상대를 몰아세우기보다 답할 틈을 준다. 걱정하는 이유를 설명할 때는 동료의 이전 모습과 달라진 점을 차분히 전한다.\n특징: 퇴직한 배리에게 회사나 동료의 평가를 대변하러 온 것이 아니라 그가 버티고 있는 상태를 보러 왔다. 후안도 돕고자 하지만 접근 방법이 달라 대화가 어긋날 수 있다. 같은 기관에 속해도 슬픔의 원인을 판단하는 법과 먼저 할 일에 대한 생각이 다르다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §10.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-10.3"}],"priority":147,"status":"활동"},{"title":"후안 멘데즈","group":"2077","keywords":["후안멘데즈","멘데즈경관","배리경찰동료"],"short":"배리의 상태를 뒤늦게 이해하는 NCPD 경관","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: NCPD 동료 나디아와 함께 배리의 아파트 바깥에 나타난다. 얼굴, 머리, 소지품의 자세한 시각 자료는 첨부 항목에 제한적이다.\n직업: NCPD 경관. 배리 루이스의 전 직장 동료다.\n무기: 고정 개인 무장 모델 미확인.\n사이버웨어: 개별 임플란트 미확인.\n성격: 가까운 이를 걱정하지만 슬픔을 대하는 방식이 서툴다. 일에서 겪는 감정을 혼자 정리해야 한다는 습관 탓에 처음에는 배리에게 필요한 도움을 이해하지 못한다.\n행동: 메시지에서 같이 술을 마시며 털어내자고 권한다. 자신의 태도가 관계를 더 어렵게 했다는 사실을 들으면 나름의 불편한 경찰 경험을 털어놓으며 다시 다가선다.\n말투: 친숙한 반말과 농담을 위로로 쓴다. 잘못이 드러났을 때는 처음의 말투로 얼버무리기보다 자기가 놓친 부분을 이야기할 수 있다.\n특징: 나디아와 함께 배리의 집을 찾지만 처음에는 전 동료의 우울감을 가볍게 판단한다. 거북을 친구로 여겼던 이유를 알아듣기 전과 후에 대응이 분명히 달라진다. 경관이라는 직업이 요구하는 무딤과 개인 관계에서의 관심을 스스로 구별하는 데 시간이 걸리는 사람이다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §10.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-10.3"}],"priority":148,"status":"활동"},{"title":"오시마 히데요시","group":"2077","keywords":["오시마히데요시","브레인댄스감독","콘페키예술가","감정의행간"],"short":"기록에 없는 감정이 중요하다고 여기는 영상 감독","body":"성별: 남성.\n나이: 성인. 정확한 연령 미공개.\n외모: 짙은 머리와 수염, 붉은빛이 도는 둥근 안경. 활동하기 편한 재킷을 걸치고 차분히 이야기를 나누는 모습이 보인다.\n직업: 브레인댄스를 이용한 차세대 영화 제작을 이야기하는 감독.\n무기: 개인 무장 정보 없음.\n사이버웨어: 개별 임플란트 및 제조사 미확인.\n성격: 기술적으로 기록이 가능한 감정의 양보다 기록 바깥에서 관객이 읽어내는 의미를 궁금해한다. 다른 제작자의 의견을 들어도 자기 연출관이 쉽게 바뀌지 않는다.\n행동: 기업의 손님이 오가는 콘페키 플라자에서 업계 인물과 이야기를 나눈다. 신기술을 보여주는 자리에서도 감각이 전부 전달되는 경험의 한계를 설명한다.\n말투: 사색적이고 구체적인 예를 꺼내는 어조다. 무엇을 느꼈는지 확정하기보다 느끼게 된 과정의 조건을 풀어 이야기한다.\n특징: 콘페키 플라자의 짧은 방문과 엣지러너 2의 카메오가 기록된다. 감정 신호를 실제로 담을 수 있는 브레인댄스 시대에도 감독은 생략과 선택의 역할을 버리지 않아야 한다는 관점이다. 로만처럼 아날로그 기록에 끌리는 어린 촬영자와는 다른 세대와 기술 경로에 놓인다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.13","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.13"}],"priority":149,"status":"활동"},{"title":"라파엘 페레즈","group":"2077","keywords":["라파엘페레즈","아로요리퍼닥","무어테크연구원","독의옛진료소"],"short":"무어 테크 실험실을 떠나 아로요에서 시술하는 리퍼닥","body":"성별: 남성.\n나이: 젊어 보이는 성인. 무어 테크 실험실에서 10년 일했다.\n외모: 신체 나이에 비해 일에 익숙한 모습을 보여주는 아로요의 점포 주인이다. 첨부 문서에서는 과거 근무 기간이 외형의 자세한 수치보다 확실하다.\n직업: 아로요의 리퍼닥. 전 무어 테크놀로지스 연구 개발 직원이다.\n무기: 개인 화기 모델 미확인.\n사이버웨어: 판매와 연구 이력은 있으나 개인 장착 모델은 미확인.\n성격: 좋은 월급을 받는다는 이유만으로 잠도 못 자는 노동을 오래 지속할 필요가 없다고 판단했다. 기술에 대한 관심과 기업의 생활 통제에 대한 반감이 함께 있다.\n행동: 연구실에서 다룬 경험을 독립 점포의 환자 진료에 옮긴다. 기업 기술이 낯설지 않아도 지금 필요한 수준과 연구용 시제품은 다르게 판단할 수 있는 위치다.\n말투: 업계 경력에 관한 질문에는 기업에서 배운 점과 떠나게 된 이유를 구체적으로 말한다. 고생을 미화하지 않는 생활인의 어조다.\n특징: 클리닉은 앞서 데이비드 마르티네즈를 보던 리퍼닥이 영업했던 자리로 알려져 있다. 같은 작업장이 시간에 따라 다른 운영자를 가질 수 있으며, 과거 시술의 책임은 지금 운영자가 자동으로 물려받는 것이 아니다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §15.10","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-15.10"}],"priority":150,"status":"활동"},{"title":"막심 쿠즈네초프","group":"엣지러너 1","keywords":["막심쿠즈네초프","아라사카운전수","알바라도델리게이트","차량기록"],"short":"타나카의 이동 경로를 맡는 아라사카 경호 운전수","body":"성별: 남성.\n나이: 성인. 정확한 연령 미공개.\n외모: 짧은 금발과 푸른 눈을 지닌다. 사적인 휴식 중에는 차량을 책임지는 경호원이라는 점이 외형에 항상 드러나지는 않는다.\n직업: 아라사카의 경호원 겸 운전수. 타나카가 사용하는 리무진을 관리한다.\n무기: 밀리테크 M-10AF 렉싱턴.\n사이버웨어: 특정 사이버웨어 이식 모델은 미공개.\n성격: 업무에서 숙련된 경호원과 차량 관리자로 취급된다. 한편 일과 휴식의 구분이 무너지면 상시 경계에 위협도 생긴다.\n행동: VIP의 일정과 차량의 이동을 맡는다. 평상시 남겨 두는 주행 정보는 기업 밖의 용병에게도 가치가 있어 차량, 열쇠와 본인의 판단이 접점이 된다.\n말투: 유명한 대사나 고유 말투 자료는 적다. 실무에서 가볍게 설명하기보다 교통 및 VIP 일정의 기준으로 대응하는 편으로 해석한다.\n특징: 왓슨 출신으로 빌포트 알바라도 V4F 570 델리게이트를 모는 솔로다. 메인 크루는 그의 본인을 해치우는 것보다 내비게이션 기록을 원했다. 그가 알고 지키는 운전 데이터의 가치가 이력의 핵심이다.","sources":[{"label":"나무위키 · 사이버펑크/ 엣지러너/줄거리 §4","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC#s-4"},{"label":"Cyberpunk Wiki · 막심 쿠즈네초프","url":"https://cyberpunk.fandom.com/wiki/Maxim_Kuznetsov"}],"priority":150,"status":"활동"},{"title":"로버트 레인워터","group":"2077","keywords":["로버트레인워터","닥터크롬","가부키시장리퍼닥","최소개조"],"short":"최소한의 개조를 선택한 가부키 시장의 리퍼닥","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 큰 덩치와 근육질의 체격. 신체에 보이는 자연적인 근육과 비교적 적은 개조가 가부키 시장에서는 오히려 눈에 띈다.\n직업: 가부키 시장의 리퍼닥. 별명은 닥터 크롬이다.\n무기: 고정 휴대 무기 기종은 확인되지 않는다.\n사이버웨어: 필요한 최소한의 사이버웨어만 사용한다고 설명한다. 특정 제품명은 미확인.\n성격: 크롬을 무조건 늘리는 생활 방식을 회의적으로 본다. 개인의 감각과 개조의 효율이 같은 방향이라고 가정하지 않는다.\n행동: 동네에서 병원 손님과 정보가 오가는 것을 알아도 아는 사람 얘기를 쉽게 흘리지 않는다. 확실하게 신뢰하거나 평판이 확인될 때만 애나에 관한 사정을 알려줄 수 있다.\n말투: 몸을 바꿨을 때 실질적으로 무엇이 남는지 설명하는 어조다. 기술을 사려는 사람이 듣고 싶은 답보다 자신의 경험에 근거한 의견을 말한다.\n특징: 리퍼닥인데 본인의 신체에 크롬을 과하게 넣지 않는 점이 그의 실무 관점과 연결된다. 애나 해밀을 좋은 사람으로 평가하지만 그 평가를 낯선 고객과의 잡담으로 제공하지 않는다. 근육이 크다는 이유로 애니멀 소속이라고 보지 않는다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §15.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-15.3"}],"priority":151,"status":"활동"},{"title":"에번스","group":"엣지러너 1","keywords":["에번스","아라사카연구소장","UG2표본","인더스트리얼파크연구"],"short":"아라사카 산업단지 연구소의 책임자","body":"성별: 남성.\n나이: 성인. 정확한 나이는 미공개.\n외모: 기업 연구소 내부에서 부서 책임자로 보이는 차림이다. 영상은 직원과 연구 자료를 확인하는 모습을 중심으로 남아 세부 외형을 단정하기 어렵다.\n직업: 아라사카 인더스트리얼 파크 연구소 소장.\n무기: 개인 무장과 모델 미확인. 시설 보안과 별개로 다룬다.\n사이버웨어: 특정 이식 장비나 제품은 확인되지 않는다.\n성격: 일의 우선순위를 개인 일정과 구분하여 요구한다. 익숙한 지시를 빠르게 내리며 연구 부문이 어떤 외부 목적에 쓰일지 직원과 길게 논의하지 않는다.\n행동: 가족 행사로 일찍 떠나려는 연구소 직원에게 먼저 표본을 옮기라고 말한다. 작업 순서와 데이터가 어떤 대목인지 익숙하지만, 외부의 폭력 앞에서는 시설 보안이 먼저 문제가 된다.\n말투: 짧고 다소 퉁명스럽게 명령한다. 직원이 개인 사정을 설명해도 하고 가야 할 업무를 작게 특정해서 말한다.\n특징: UG2 표본을 다루는 시설과 기업 간 첩보전이 만나는 지점에 있다. 연구소 공격 뒤 케이트와 더글라스는 공격, 이전 데이터 삭제, 외부 픽서의 일을 함께 분석한다. 소장을 포함한 섬세한 현장 인력의 관리가 기업의 큰 사업에는 약점이 될 수 있다.","sources":[{"label":"나무위키 · 사이버펑크/ 엣지러너/줄거리 §9","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC#s-9"}],"priority":151,"status":"활동"},{"title":"찰스 윌슨","group":"2077","keywords":["찰스윌슨","찰리경관","왓슨갈취","빌미첼동료"],"short":"왓슨에서 정차 단속을 수입으로 삼는 NCPD 경관","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 현장 경관답게 근무복과 장비를 쓰며, 도그타운에서는 빌과 함께 구출 대상이 될 수 있다. 첨부의 항목에 별도 얼굴 사진은 없다.\n직업: 왓슨에서 근무하는 NCPD 경관. 빌 미첼은 직장 동료이자 친구다.\n무기: 공무상 장비가 있을 수 있으나 상시 휴대 화기 모델은 미확인.\n사이버웨어: 개인 사이버웨어 미확인.\n성격: 권력과 돈이 사람을 다르게 대한다는 생각을 자기 행동의 핑계로 쓰는 냉소적 인물이다. 문제의 원인을 알아차려도 당장 지킬 수익이나 자기 위치를 먼저 본다.\n행동: 정차시킨 차에서 뇌물을 받아내고 손쉽게 챙길 이익을 찾는다. 빌과 함께 정교하게 통제되지 않는 일을 벌여 경찰 명함만으로 빠져나가기 어려운 곳에 놓인다.\n말투: 상대가 쉽게 물러날 만하다고 판단하면 간단한 요구를 곧바로 붙인다. 곤란해지면 자기만 선택한 일이 아니라는 분위기를 만들려 한다.\n특징: 왓슨에서 단속 권한을 사적인 수입과 연결하는 경관이라 경찰 민영화와 부패의 피해가 주민에게 구체적으로 돌아오는 방식과 연관된다. 긴급한 현장에서는 빌과 서로를 챙기다가도, 처음부터 감당하지 못할 일을 벌였다는 사실이 드러날 수 있다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §10.13","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-10.13"},{"label":"나무위키 · 사이버펑크 2077/등장인물 §10.12","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-10.12"}],"priority":152,"status":"활동"},{"title":"산티아고 몰리나","group":"2077","keywords":["산티아고몰리나","웰스프링스리퍼닥","태양폭풍우려","무단자목"],"short":"스스로 크롬을 피하면서도 환자는 보는 리퍼닥","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 큰 체구와 크롬 단자가 보이지 않는 목이 인상적이다. 다른 개조 기술자와 달리 몸에 드러난 이식의 화려함보다 체격 자체가 두드러진다.\n직업: 헤이우드 웰스프링스의 리퍼닥. 몰리나 클리닉을 운영한다.\n무기: 개인 무장 사양 미확인.\n사이버웨어: 자기 몸의 크롬을 피한다는 입장이다. 보이지 않는 장치의 존재까지 단정하지 않는다.\n성격: 크롬이 보편적인 환경에서도 자신만의 기술적 재난 우려를 접지 않는다. 손님이 듣고 싶어 하는 설명과 자신이 믿는 미래가 달라도 직업은 유지한다.\n행동: 다른 사람의 시술을 업무로 하면서 개인적으로 권하는 삶의 방식과 구별한다. 개조를 꺼리는 이유에 대한 질문에는 태양폭풍과 전자 장비 의존을 근거로 든다.\n말투: 상대의 상식이라고 생각하는 부분을 직설적으로 건드린다. 자신의 신념을 말할 때 과장된 농담과 경고가 섞여 들릴 수 있다.\n특징: 웰스프링스에서 정상적인 의료 영업을 하면서 기계가 한순간에 기능을 잃을 수 있다는 생각을 품는다. 세계에서 실제 재난이 일어날지에 대한 그의 확신과 확인된 과학적 설정은 구별한다. 본인에게 개조가 적다는 점은 손님의 장비를 모른다는 뜻이 아니다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §15.8","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-15.8"}],"priority":153,"status":"활동"},{"title":"카리나 리","group":"2077","keywords":["카리나리","칩인진행자","임플란트방송","사이버웨어시연"],"short":"사이버웨어를 생활 상품으로 소개하는 방송 진행자","body":"성별: 여성.\n나이: 성인. 정확한 연령 미공개.\n외모: 볼륨이 큰 아프로 헤어가 가장 눈에 띈다. 방송에서는 설명하는 물건이 잘 보이도록 그쪽으로 몸을 돌리고 표정과 손짓을 확실히 쓴다.\n직업: 사이버웨어 소개 프로그램 칩 인의 MC. 토크쇼에도 신기술을 소개하러 출연한다.\n무기: 개인 총기 정보 없음. 방송 시연에서 소개한 맨티스 블레이드는 진행자 본인의 상시 무장으로 보지 않는다.\n사이버웨어: 특정 모델을 직접 이식했다고 확정할 자료는 부족하다.\n성격: 새 기술을 일상어로 쉽게 푸는 데 능숙하다. 불안감을 자세히 다루기보다 기술로 무엇을 할 수 있을지 흥미를 일으키는 쪽에 주력한다.\n행동: 맨티스 블레이드나 보강 발목 같은 제품의 기능을 보여준다. 기술자와 소비자 사이에서 복잡한 설명을 짧은 시연과 농담으로 바꾼다.\n말투: 톤이 밝고 시청자가 잘라 듣기 쉬운 표현에 장점을 싣는다. 새로운 기능을 말할 때는 도구 이름과 동작의 결과를 매끄럽게 연결한다.\n특징: 사이버웨어의 구매와 시술을 당연한 소비처럼 말하는 방송을 이끈다. 전투 장비와 일상 기동 보조가 한 화면에 등장할 수 있다는 점은 시청자에게 크롬이 어떻게 상품이 되는지 보여준다. 지기 Q의 방송에서 진행자가 아닌 게스트로 자신의 설명 방식을 유지한다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §13.5","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-13.5"}],"priority":154,"status":"활동"},{"title":"니나 크라비츠","group":"2077","keywords":["니나크라비츠","차터힐리퍼닥","크라비츠클리닉","이르쿠츠크"],"short":"여러 도시의 분점을 언급하는 차터 힐 리퍼닥","body":"성별: 여성.\n나이: 30세 생일에 나이트 시티 점포를 열 기회를 얻었다고 말한다. 현재 정확한 나이는 미공개.\n외모: 차터 힐 클리닉에서 손님을 응대한다. 인물 모델은 실존 음악가의 외양을 참고했으나 이 가상 인물의 신체 수치는 확인되지 않는다.\n직업: 러시아 출신 리퍼닥. 차터 힐에서 환자의 사이버웨어를 다룬다.\n무기: 개인 화기와 모델은 확인되지 않는다.\n사이버웨어: 개별 신체 개조 기능과 제품은 미확인.\n성격: 이전에 머무른 도시와 사업 경험을 스스럼없이 이야기한다. 방문자가 장비를 묻기 전에도 자신이 여기까지 온 배경을 설명할 수 있는 여유가 있다.\n행동: 고객을 익숙하게 맞고 장비와 클리닉을 보여준다. 다른 점포가 있는 도시와 차터 힐의 사정을 구분해 말한다.\n말투: 편한 거리감으로 대화하며 출신과 해외 사업을 질문받으면 명확한 지명과 자기 기억을 보탠다.\n특징: 삼촌이 생일을 맞아 나이트 시티 점포를 임대해 준 것이 차터 힐 사업의 계기다. 이르쿠츠크, 레닌그라드, 빈, 글래스고에도 분점이 있다고 밝힌다. 여러 도시에 기반을 둔 자기 설명이 단순한 가판 판매나 골목의 무허가 진료와 분위기를 다르게 만든다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §15.9","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-15.9"}],"priority":155,"status":"활동"},{"title":"콜버 목사","group":"2077","keywords":["콜버목사","엘리야후교회","렐릭복제논쟁","종교토크쇼"],"short":"기업의 렐릭 영생을 비판하는 종교인","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 토크쇼에 종교 조직의 대표로 모습을 보인다. 신체보다 공식 석상에서 쓰는 자세와 옷차림으로 기억되며, 첨부 초상만으로 특정 특징을 확정하기는 어렵다.\n직업: 엘리야후 교회의 회장인 목사. 렐릭을 놓고 신학적, 경제적 논쟁을 벌인다.\n무기: 개인 무장 정보 없음.\n사이버웨어: 개인 임플란트 사양은 확인되지 않는다.\n성격: 육체가 죽은 뒤의 지속과 복제 기술을 구분해야 한다고 본다. 기업이 부유층에게만 제공하는 영생 사업의 불평등을 공개적으로 지적한다.\n행동: 지기 Q의 쇼에서 렐릭에 대한 교회의 생각을 알린다. 방송 진행자가 종교 자체도 영생과 장례를 판다고 공격하면 자기 쪽 논점에 맞춰 반론하려 한다.\n말투: 공식적이고 교리의 언어와 논증을 섞는다. 방송의 자극적인 한마디가 자기가 설명하려던 범위를 넘어갈 수 있다.\n특징: 교회의 논쟁이 사이버웨어 광고와 엘리트의 투자 사업 사이에 놓인 도시의 공론을 보여준다. 블랙 사파이어 같은 자리에서도 모습을 볼 수 있다. 렐릭을 영혼이 이어진 증거로 볼 수 없다는 그의 입장과 교회 시장의 이해는 독립적으로 검토할 문제다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §14.1","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-14.1"}],"priority":156,"status":"활동"},{"title":"로널드 P.T. 말론","group":"2077","keywords":["로널드말론","도그타운BD상인","바르가스전유망주","피티말론"],"short":"도그타운에서 BD와 소문을 다루는 전 운동 유망주","body":"성별: 남성.\n나이: 성인. 정확한 연령 미공개.\n외모: 거리 상인으로서 자기 판매대 주변에 늘 몸을 내보인다. 특정 헤어스타일과 체격을 정할 만큼 첨부 문서의 묘사는 충분하지 않다.\n직업: 도그타운의 브레인댄스 판매자이자 동네 정보통. 전 운동 유망주다.\n무기: 고정 휴대 무장과 기종 미확인.\n사이버웨어: 유망주 시절의 후유증으로 두통과 불면이 있다고 밝힌다. 구체적인 임플란트는 확인되지 않는다.\n성격: 일이 생각대로 되지 않았어도 자기보다 더 어려운 사람의 상황을 떠올리며 낙천적으로 굴 수 있다. 남에게 입담을 보여 주는 것이 체력이나 돈과 또 다른 장점이다.\n행동: 큰 소리로 상품을 광고하다가 대화가 이어지면 근처 소문과 사건을 들려준다. 찾아온 사람이 관심을 보인 일을 떠올려 문자로 더 알려줄 수 있다.\n말투: 홍보할 때는 활달하고 친근하다. 건강의 불편을 말할 때도 절박함보다 동네의 일상처럼 풀어서 이야기한다.\n특징: 피오나 바르가스의 운동 훈련 시설에서 성장했으나 후유증을 안고 장사를 한다. 스포츠 유망주의 신체 개조와 이후 생활을 보여주는 인물이다. 자기 경험을 상품처럼 과장하기보다 살아남은 사람이 나름대로 일거리를 만드는 쪽에 가깝다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §18.5","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-18.5"}],"priority":157,"status":"활동"},{"title":"헬리오","group":"엣지러너 2","keywords":["헬리오","전멜스트롬","스네이크네이션제보","아라사카의뢰거절"],"short":"클랜 습격 의뢰를 들은 전 멜스트롬 조직원","body":"성별: 남성.\n나이: 성인. 정확한 연령은 미공개.\n외모: 전 멜스트롬 인물로 남은 개조가 있으며, 거리에서 긴장한 자세로 D의 추궁을 받는다. 상세한 기기 모델이나 신체 치수는 공개되지 않는다.\n직업: 전 멜스트롬 조직원. 아라사카와 연관된 스네이크 네이션 사건의 주변 정보원이다.\n무기: 상시 개인 무기와 제조사 미확인.\n사이버웨어: 넷 접속을 통한 공격에 영향을 받지만 몸의 구체적인 모델은 확인되지 않는다.\n성격: 기업의 일을 받지 않으려는 자신만의 원칙이 있다. 전 조직이 어떤 일을 했든 자기가 직접 참여했는지는 별개라고 생각한다.\n행동: 클랜 습격을 추적하는 D에게 관련 의뢰에 대해 아는 것을 말한다. 조용히 빠져 있었어도 상대가 이미 용의자처럼 대할 때는 자기 입장을 적극 설명한다.\n말투: 되도록 사실관계를 나눠 말한다. 위협이 커지면 들은 것과 행동한 것을 짧은 문장으로 여러 차례 구분한다.\n특징: 아라사카의 관련 의뢰를 들었다는 점이 가치 있는 단서다. 헬리오의 말대로라면 일에 직접 참여하지 않았고, 그가 설명한 사건의 범위가 당시 조직 내부에서 모두 알던 것과 같은지도 확실치 않다. 그의 정보는 클랜 단서를 확인하기 위한 수단이며, 그 사람 자체가 범인이라는 증거까지 되지는 않는다.","sources":[{"label":"나무위키 · 헬리오","url":"https://m.namu.moe/w/사이버펑크:%20엣지러너%202/등장인물#s-7.1"}],"priority":158,"status":"활동"},{"title":"앤드류 존스","group":"2077","keywords":["앤드류존스","유카보안관","실버쇼군즈","드라이크릭"],"short":"드라이 크릭 유카에서 노마드를 경계하는 보안관","body":"성별: 남성.\n나이: 장년 이상 추정. 제4차 기업 전쟁에 복무했다고 주장한다.\n외모: 변두리 보안관으로 근무하며 지역에 새로 들어온 낯선 사람을 위압적으로 상대한다. 얼굴과 머리의 세부는 첨부 자료에 제한적이다.\n직업: 드라이 크릭 유카 보안관. 나이트 시티 경찰국의 시내 근무자로 분류되지 않는다.\n무기: 구체적인 개인 무기 모델은 알려지지 않았다.\n사이버웨어: 개인 임플란트 목록은 확인되지 않는다.\n성격: 자기 관할을 사적 영역처럼 여기며 외부 노마드를 싫어한다. 이전 군 공적을 현재의 권위를 인정받는 데 쓴다.\n행동: 유카에 낯선 차가 나타나면 용무와 출발 시점을 따져 묻는다. 본인의 책무를 넘어 상대가 여기에서 지낼 수 있는지까지 판단하려는 태도를 보인다.\n말투: 명령형 어미와 협박을 먼저 꺼낸다. 자신이 어땠는지 이야기할 때는 오래된 부대 이름을 자랑하듯 소개한다.\n특징: 소캘 쪽 도시 국경 바깥의 작은 정착지에서 일하며 실버 쇼군즈 출신임을 내세운다. 어제의 전쟁과 지금의 검문을 같은 의미로 대하는 반면 여행자의 눈에는 통과를 방해하는 지역 권력이다. 나이트 시티 조직의 규정이 그대로 적용되지 않는 경계의 인물이다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §10.9","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-10.9"}],"priority":159,"status":"활동"},{"title":"스틴츠","group":"2077","keywords":["스틴츠","헤이우드경감","재키어린시절지인","기업명령거부"],"short":"기업인의 명령보다 동네의 선을 먼저 보는 NCPD 경감","body":"성별: 남성.\n나이: 성인. 정확한 연령 미공개.\n외모: 체포 현장에 경찰 분대를 이끌고 오는 경관. 복장의 세부보다 멈추고 있는 당사자에게 익숙한 얼굴인지를 먼저 확인하는 태도가 눈에 띈다.\n직업: NCPD 경감. 헤이우드 출신이며 재키 웰즈를 어린 시절부터 아는 사이로 나온다.\n무기: 현장 경찰 분대와 함께 무장을 운용한다. 개인 휴대 화기의 기종은 확인되지 않는다.\n사이버웨어: 신체 개조의 고정 목록은 미공개다.\n성격: 기업인이 경찰을 마음대로 부리는 것을 싫어한다. 동네 사람과의 오래된 인연을 기억하면서도 규정에 맞는 자애로운 경감으로만 보기는 어렵다.\n행동: 고급 차량의 절도 시도를 확인하고 출동한다. 기업 직원이 잡힌 사람을 없애라고 해도 명령대로 움직이지 않고 자기 식으로 현장을 정리한다.\n말투: 친분이 있어도 정중하게 돌려 말하지 않는다. 기업의 권위에 맞서는 순간과 동네 후배에게 거칠게 주의를 줄 때의 목소리가 다르다.\n특징: 재키와 서로를 아는 헤이우드 출신이라는 사실은 이름을 확인한 이후의 판단에 작용한다. 법과 친분 밖에서 일방적으로 들어온 요구를 거부하지만, 그 뒤 경찰이 시민을 대하는 방식이 늘 온건하지는 않음을 보여주는 인물이다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §10.10","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-10.10"},{"label":"Cyberpunk Wiki · 스틴츠","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077"}],"priority":160,"status":"활동"},{"title":"제시 존슨","group":"2077","keywords":["제시존슨","리틀차이나제시","미스터스터드","카시우스긴급이송"],"short":"크롬 오작동으로 노스사이드 진료를 급히 찾는 시민","body":"성별: 남성.\n나이: 성인. 정확한 나이 미공개.\n외모: 붉은 머리와 속옷 차림으로 등장한다. 갑자기 심한 통증이 시작되어 몸을 굽히고 한쪽에 기대는 모습이 눈에 띈다.\n직업: 나이트 시티 시민. 본업은 확인되지 않는다.\n무기: 상시 개인 무장과 기종은 미확인.\n사이버웨어: 미스터 스터드 XCV/19 계열 임플란트. 해당 계열의 결함과 회수 내역이 알려져 있다.\n성격: 심한 통증 앞에서는 주변을 신경 쓸 여유가 적지만, 도움에 대가를 주겠다는 약속은 수습을 마친 뒤에도 기억한다. 사고가 난 상품을 본 과거의 판단을 완전히 돌이키지는 않는다.\n행동: 리틀 차이나 거리에서 지나가는 사람에게 운전을 부탁하고 노스사이드의 카시우스 라이더에게 가기를 원한다. 치료가 이루어지면 나중에 연락해 감사를 표한다.\n말투: 급한 때에는 문장보다 신음과 짧은 요구가 먼저 나온다. 대화가 가능한 상태가 되면 보상과 다음 계획을 알려 준다.\n특징: 사이버웨어 사고는 전투 임플란트에만 일어나지 않음을 보여주는 인물이다. 부상과 긴급 이송이 핵심이므로 외모 관심이나 사적인 관계를 과장하지 않는다. 샐 비겔로우의 브레인댄스 엔지니어 제시와는 이름이 같은 별개의 시민이다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §23.3","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-23.3"},{"label":"Cyberpunk Wiki · 제시 존슨","url":"https://cyberpunk.fandom.com/wiki/Jesse_Johnson"}],"priority":161,"status":"활동"},{"title":"오모토 치요","group":"2077","keywords":["오모토치요","재팬타운리퍼닥","진료소무기진열"],"short":"환자의 폭주 이후 보호 장비를 늘린 재팬타운 리퍼닥","body":"성별: 여성.\n나이: 성인. 정확한 연령 미공개.\n외모: 진료 공간에 눈에 띄게 많은 무기를 진열한다. 외관을 볼 때는 과거 부위 손상과 현재 실제로 확인되는 보철을 섞어 단정하지 않는다.\n직업: 웨스트브룩 재팬타운의 리퍼닥. 관련 자료에는 의료 지원을 제공하는 점포가 기록된다.\n무기: 많은 무기가 진열돼 있다. 그중 본인의 상시 휴대 품목과 모델은 확인되지 않는다.\n사이버웨어: 과거 눈, 손가락, 신장에 심한 손상을 입은 이력이 있다. 이후 쓰는 보철과 모델의 정확한 목록은 공개되지 않는다.\n성격: 다른 리퍼닥보다 환자에게서 생길 수 있는 돌발적인 변화에 진지하다. 진료실에 무장을 눈에 띄게 두더라도 의료를 직업에서 빼지 않았다.\n행동: 지역 손님의 사이버웨어 문제를 본다. 예전 환자가 진료 과정에서 폭주했을 때의 피해를 염두에 두고, 장비의 기능만으로 안전을 가정하지 않는 것으로 해석할 수 있다.\n말투: 개별 말버릇을 구별할 만큼 대화 기록이 넓지 않다. 작업 요구와 진료 위험을 먼저 다루는 직업인으로 그린다.\n특징: 환자의 사이버 사이코시스 발작으로 큰 상처를 입고도 재팬타운에서 진료를 이어갔다. 무기 진열은 취미나 장식으로만 보이는 물건이 실제 일터에서 왜 중요한지 설명한다. 신체의 과거 손상은 손님에게 어떤 말을 할지 미리 정한 사적인 관계를 뜻하지 않는다.","sources":[{"label":"나무위키 · 사이버펑크 2077/등장인물 §15.5","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%202077/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC#s-15.5"},{"label":"Cyberpunk Wiki · 오모토 치요","url":"https://cyberpunk.fandom.com/wiki/Ripperdoc"}],"priority":163,"status":"활동"}],"lore":[{"title":"나이트 시티","group":"도시","keywords":["나이트시티","자유도시","코로나도"],"short":"기업과 시정부가 공존하는 항구 자유도시","body":"리처드 나이트가 코로나도만에 구상한 계획도시가 현재의 나이트 시티다. 북부 캘리포니아 해안에 있으며, 통일 전쟁 뒤 신미합중국에서 독립된 자유도시 지위를 유지했다. 2077년 행정구획은 왓슨, 웨스트브룩, 도심, 헤이우드, 산토 도밍고, 퍼시피카다. 배드랜드는 시가지 밖의 인접권이다. 대기업이 투자와 일자리를 제공하는 동시에 사유 구역의 치안을 장악한다. 도그타운은 행정상 퍼시피카에 있으나 바게스트 수중에 있어 시의 일반 치안이 통용되지 않는다. 설립 자금에는 나이트 인터내셔널 외에 아라사카, 유로 비즈니스 머신즈, 페트로켐, 금융 회사의 이해가 얽혔다. 1998년 설립자가 암살된 뒤 도시 이름이 바뀌었고, 원래 계획도시의 질서와 실제 사업권을 둘러싸고 폭력단과 기업이 맞섰다. 2023년 핵폭발 때 기능을 잃은 도심은 재건돼 기업 플라자가 됐다. 산업·주거가 남은 왓슨과 중단된 관광지 퍼시피카는 도시의 복구 및 투자 속도가 서로 달랐음을 보여 준다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":1},{"title":"왓슨","group":"도시","keywords":["왓슨","가부키","리틀차이나","노스사이드","워터프론트"],"short":"이민자 거리와 북부 산업 지대","body":"리틀 차이나에는 메가빌딩 H10과 애프터라이프가 있고, 가부키는 상점이 빽빽한 시장과 리지의 바로 알려졌다. 노스사이드의 폐공장과 창고에는 멜스트롬의 영향이 강하다. 아라사카 워터프론트는 기업이 통제하는 항만으로 콘페키 플라자가 있다. 2023년 도심 피해 직후 왓슨은 피난과 경제 활동의 거점이 됐으나, 다른 지역이 재건되면서 중심지 지위를 잃었다. 같은 구 안에서도 공개 시장과 기업 부두의 출입 조건은 크게 다르다. 리틀 차이나에서는 병원과 개인 시술실, 엄랜드 스트리트의 점포가 고층 주거와 연결된다. 가부키 라운드어바웃은 소규모 소매가 모이는 곳이고, 브레인댄스를 취급하는 리지의 바에는 목스가 관여한다. 북부 산업 구획에 남은 노동자 아파트 바깥으로는 카고 베이, 올 푸드 공장과 토텐탄츠가 이어진다. 아라사카의 부두는 출입 권한이 별도로 관리되며 리틀 차이나의 용병 바와 같은 방식으로 드나들 수 없다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":2},{"title":"웨스트브룩","group":"도시","keywords":["웨스트브룩","재팬타운","차터힐","노스오크"],"short":"유흥가와 기업인·부유층 주거지","body":"재팬타운은 지그지그 스트리트와 각종 유흥 시설이 있는 상업 중심지다. 차터 힐은 기업에 근무하는 중상층이 사는 주거지이며, 노스 오크는 별장과 대저택이 자리 잡은 부촌이다. 2023년의 파괴와 피난민 유입은 세 지역 모두에 흔적을 남겼으나 재건 과정에서 상업 지구와 상류층 주택지가 갈라졌다. 타이거 클로의 유흥업 영향은 특히 재팬타운에서 강하고, 노스 오크의 저택 출입은 사설 경비가 통제한다. 재팬타운의 지그지그 스트리트에는 와카코의 파친코 거점이 있고, 클라우드는 메가빌딩 H8에 자리한다. 차터 힐에는 릴리 파크와 페랄레즈 가족의 펜트하우스가 있다. 노스 오크에서는 빌라 유로다인과 아라사카 저택이 사유지이며 납골당은 별개의 추모 시설이다. 핵폭발 직후 피난민이 몰린 언덕과 현재의 고급 주거지가 같은 지형을 공유한다. 재팬타운에는 식당, 상점과 야간 유흥업이 밀집한다. 지그지그 스트리트에는 성인 업소와 중개 거점이 많고, 클라우드는 메가빌딩 H8에 입주한 돌 업소다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"타이거 클로 · 나무위키","url":"https://namu.wiki/w/%ED%83%80%EC%9D%B4%EA%B1%B0%20%ED%81%B4%EB%A1%9C"}],"priority":3},{"title":"나이트 시티 도심","group":"도시","keywords":["도심","시티센터","기업플라자","다운타운"],"short":"기업 본사와 고급 소비가 모인 두 구역","body":"도심은 기업 플라자와 다운타운으로 나뉜다. 기업 플라자에는 아라사카 타워와 여러 본사, 고층 업무 시설이 몰려 있다. 다운타운에는 호텔과 의류점, 고급 클럽이 섞여 있어 근무 시간과 심야의 사람 흐름이 다르다. 2023년 핵폭발로 황폐해진 핵심부는 제염과 재개발을 거쳤다. 지상의 광장과 보행 공간, 연결 통로와 고가 교통, 건물 안의 사설 경비가 같은 장소 안에서도 서로 다른 접근 환경을 만든다. 기업 플라자에는 타워뿐 아니라 브레인댄스 클럽 엠퍼시와 고급 쇼핑몰 더 뷰가 있다. 다운타운의 진구지는 의류점이며, 바이오테크니카 호텔과 세븐스 헬이 서로 다른 목적의 방문객을 맞는다. 과거 핫존을 중심으로 재건된 도심에는 도시의 복구를 기념하는 공간도 있다. 광장에 걸린 광고와 안내판, 각 타워의 보안 표식은 어느 기관이 어느 장소의 사용을 관리하는지 보여 준다. 기업 플라자는 도심의 기업 권력이 건축으로 집중된 구역이다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"}],"priority":4},{"title":"헤이우드","group":"도시","keywords":["헤이우드","웰스프링스","글렌","비스타델레이"],"short":"시청·해안 상권과 발렌티노의 생활권","body":"웰스프링스는 서쪽의 해안 상권과 비교적 정돈된 주거가 두드러진다. 글렌에는 시청과 상업 공간, 엘 코요테 코호가 있다. 비스타 델 레이는 작은 점포와 생활 시장, 낙후된 건물의 밀도가 높다. 발렌티노의 연고와 가족 관계가 일상 거래에 영향을 주며, 일부 경계 지역에서는 식스 스트리트의 압력도 느껴진다. 도심에 닿는 구역과 남동쪽 골목의 건물 상태 및 공권력 접근성 차이가 헤이우드의 큰 특징이다. 웰스프링스에는 해안 식당과 부티크가 있고, 낙후된 남동부와 경제 수준에 차이가 있다. 글렌의 엘 코요테 코호는 웰즈 가족이 운영하는 바이며 파드레의 중개망과 시청의 공식 행정은 별도로 움직인다. 비스타 델 레이의 멜카도 소노라는 일상적인 재래시장이고 디키 트위스터는 유흥업소다. 델라메인 본부 또한 비스타 델 레이에 있지만 지역 생활 상권과 회사의 차량 운용 체계는 구분된다. 웰스프링스는 헤이우드 서쪽 해안 쪽에 놓인 비교적 잘 관리되는 상업·주거지다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":5},{"title":"산토 도밍고","group":"도시","keywords":["산토도밍고","아로요","란초코로나도"],"short":"산업 설비와 기업 개발 주택이 붙은 구역","body":"아로요는 발전소와 공장, 아라사카 인더스트리얼 파크 같은 산업 시설이 모인 지역이다. 란초 코로나도는 노동자 주거와 상업 시설이 있는 교외형 지구로, 회사가 개발한 주택 단지의 영향이 남아 있다. 오래된 산토 도밍고는 4차 기업 전쟁의 핵심 피해 지대에서 떨어져 있어 피난민 정착지와 재건 산업의 기반이 됐다. 2077년에 운영 중인 작업장과 방치된 공장은 한 지구 안에 공존한다. 식스 스트리트는 이 생활권에서 영향력을 행사한다. 아로요의 NC 교도소와 아라사카 산업 단지는 같은 공업로를 써도 보안 목적과 방문자 동선이 다르다. 레드 더트는 권력이 작동하는 공장 안이 아니라 노동자와 거리 인력이 모이는 바다. 란초 코로나도에는 정신건강센터와 트리플 익스트림 체육관이 있으며, 트레일러 파크는 회사가 관리하는 단독주택과 다른 거주 형태를 보인다. 배드랜드 댐을 지나면 시가지의 산업·주거 설비와 외곽의 물 공급 체계가 이어진다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"}],"priority":6},{"title":"퍼시피카","group":"도시","keywords":["퍼시피카","코스트뷰","웨스트윈드","해안공동체"],"short":"중단된 휴양지와 해안 공동체","body":"퍼시피카의 호화 관광 개발은 통일 전쟁 무렵 자금이 빠져나가며 멈췄다. 코스트 뷰에는 그랜드 임페리얼 몰과 교회가 있고, 웨스트 윈드 에스테이트에는 해안 주거지와 호텔이 있다. 부두 보이즈는 아이티계 공동체와 깊은 관계를 두고 활동한다. 미완성 건축물과 빈 복합 시설에는 다른 세력도 진입한다. 도그타운은 퍼시피카 안에 있으나 바게스트가 외부와의 통행을 별도로 관리하므로 코스트 뷰의 권력 관계를 그대로 적용할 수 없다. 그랜드 임페리얼 몰은 버려진 관광 투자에서 생긴 대형 공간이고, 세레니티 성서 교회는 지역 주민과 부두 보이즈의 접점이다. 매그레브 터널에는 완성되지 않은 교통 개발의 흔적이 남아 있다. 피스티스 소피아는 웨스트 윈드 해안의 오래된 숙박 시설이다. 퍼시피카의 아이티계 생활과 부두 보이즈의 기술 활동, 애니멀처럼 특정 거점에 들어간 외부 인력의 계약 관계가 한 지역에 겹친다. 코스트 뷰에는 미완성 휴양지 개발의 흔적과 생활 공동체가 둘 다 남아 있다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"갱단(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B0%B1%EB%8B%A8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":7},{"title":"도그타운","group":"도시","keywords":["도그타운","블랙사파이어","스타디움","바게스트"],"short":"장벽과 검문으로 구분되는 군벌 통치구","body":"퍼시피카 동쪽 개발지에 들어선 도그타운은 통일 전쟁에서 살아남은 커트 핸슨의 부대가 장악했다. 장벽 바깥에서 나이트 시티 경찰이 행사하는 권한은 안쪽까지 이어지지 않는다. EBM 페트로켐 스타디움은 밀수품이 들어오는 시장이고, 블랙 사파이어는 핸슨이 고위 방문객을 맞는 대형 시설이다. 중단된 리조트와 개발 부지 가림막 사이에 주민과 무장 경비가 공존한다. 도시는 이곳에 가깝지만 출입과 거래는 독립된 권력 구조를 따른다. 바게스트는 옛 정규군의 지휘 습관을 유지하면서도 계약이 끝난 용병과 다른 갱에서 이탈한 인력을 받아들였다. 핸슨 아래에서 베넷은 병력을 배치하고 야고 서보는 사업과 물자의 흐름에 관여한다. 헤비 하츠에는 미스터 핸즈의 접객망이 있다. 미완성 테라 코그니타, 버려진 경찰서와 크레스 스트리트의 주거지는 스타디움 거래권과 다른 시설이다. 밖에서 유효한 치안과 의료 계약은 장벽 안에서 그대로 집행하기 어렵다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"바게스트(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B0%94%EA%B2%8C%EC%8A%A4%ED%8A%B8(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":8},{"title":"배드랜드","group":"도시","keywords":["배드랜드","황무지","로키리지","라구나벤드","잭슨평야"],"short":"시경계 밖의 사막과 산업·이동 경로","body":"배드랜드는 동부 건조지대, 매립지, 바람 농장과 남부의 농업 단지·저수지로 이어진다. 로키 리지에는 폐허가 된 정착지가 있으며, 선셋 모텔은 외곽 도로에서 잠시 쉴 수 있는 거점이다. 라구나 벤드는 저수지 아래 잠긴 옛 마을이다. 바이오테크니카 플랫의 생산 시설과 잭슨 평야 전력 설비는 황무지가 완전히 비어 있지 않음을 보여 준다. 알데칼도 같은 노마드와 습격을 일삼는 레이스가 같은 도로망을 서로 다른 목적으로 이용한다. 북쪽으로는 로키 리지와 예전 산업·정착 시설이 있고, 동쪽에는 매립지와 풍력 발전 설비, 레드 피크의 트레일러 주거가 있다. 남쪽에서는 식량 생산 지대와 잭슨 평야 전력 설비가 가동된다. 거점마다 관리 주체와 외부 차량의 정차 조건이 다르며, 국경 검사와 지역 도로의 위협 역시 별개다. 배드랜드는 시와 연결된 물류 통로인 동시에 폐기물과 환경 부담을 떠안는 배후지다. 로키 리지는 한때 사람이 정착했으나 현재는 버려진 건물이 남은 외곽 마을이다.","sources":[{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"노마드(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%85%B8%EB%A7%88%EB%93%9C(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":9},{"title":"신미합중국","group":"국가와 공권력","keywords":["신미합중국","NUSA","워싱턴","마이어스"],"short":"붕괴 이후 재건된 북미 연방국가","body":"신미합중국은 대붕괴 이후 옛 미국의 연방 체제를 재편한 국가다. 로잘린드 마이어스 대통령의 정부는 군사력과 정보기관, 기업 계약을 통해 연방의 영향력을 유지한다. 통일 전쟁 뒤에도 북미의 모든 지역이 동일한 연방 관할에 들어가지는 않았다. 서부의 자치 지역, 독립을 유지한 텍사스와 자유도시 나이트 시티의 지위를 구별해야 한다. 신미합중국의 공식 기관과 밀리테크는 인력과 조달에서 밀접하지만 별개 조직이다. 1994년 경제 추락으로 옛 미국의 중앙 통제력이 약해지면서 일부 주가 독자적인 길을 갔다. 이후 신미합중국은 국호와 조직을 새로 정비했고, 마이어스 시기에 무력으로 남은 통합 문제를 해결하려 했다. 알빈 협정은 정전 이후 서부와 연방의 관계를 재편했으나 나이트 시티와 텍사스를 연방의 일반 관할로 편입하지 않았다. 연방 정보국의 비공식 연락망은 국방 조달과 같은 승인 체계를 쓰지 않는다. 통일 전쟁은 마이어스 정부가 서부 자유주에 대한 연방의 영향력을 되찾으려 시작한 전쟁이다.","sources":[{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"}],"priority":10},{"title":"사이버웨어와 크롬","group":"사이버웨어","keywords":["사이버웨어","임플란트","크롬","생체보철","의체증강"],"short":"신체를 대체하거나 증강하는 이식 장비","body":"사이버웨어는 치료에 쓰는 인공 기관과 감각 보조 장치부터 군용 반응 가속기, 전신 의체, 내장 무기까지 포함한다. 거리에서는 금속과 기계가 몸에서 드러나는 보철을 포함해 흔히 크롬이라 부른다. 신체를 잃어 보철을 붙인 사람과 실제 전투력을 높이려는 사람의 시술 동기는 서로 다르다. 2077년의 분류에는 뇌를 보조하는 전두피질과 운영체제, 눈과 손의 인터페이스, 팔과 다리의 구동부, 반사에 관계하는 신경계, 회복을 보조하는 순환계, 몸을 보호하는 외피와 골격이 있다. 시술 종류마다 바깥에서 확인할 수 있는 구조와 내부에 감춰지는 구조가 다르며, 전신을 바꾸거나 속도와 출력을 높이는 사례에선 부작용과 부하가 두드러진다. 출력을 높이는 부품의 수요가 큰 곳에서는 의료 설비의 이식 외에도 군납품과 거리 개조가 함께 유통된다. 금속 부위가 눈에 띄는 장식과 조직 안쪽의 증강을 아울러 생활 문화와 개개인의 직업을 이루는 기술이다.","sources":[{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"Cyberpunk 2077 Cyberware · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Cyberpunk_2077_Cyberware"}],"priority":11},{"title":"나이트 시티 경찰국","group":"국가와 공권력","keywords":["NCPD","나이트시티경찰국","경찰국","순찰과","수사과"],"short":"시가지 치안을 담당하는 경찰 조직","body":"NCPD는 나이트 시티의 경찰 조직으로, 순찰과·수사과·전술과가 서로 다른 현장에 대응한다. 나이트 코프의 후원과 아라사카·밀리테크 같은 대기업의 힘이 경찰이 행사할 수 있는 권한에 영향을 준다. 인력·예산 부족, 부패, 과중한 사건 업무가 있더라도 모든 대원이 같은 태도를 보이지는 않는다. 기업 관할 구역과 도그타운은 일반 시가지와 다른 접근 조건을 갖는다. 중무장 사건과 사이버 사이코 사건에는 전문 전력이 투입된다. 순찰과는 거리와 교통의 초기 신고를 받고, 수사과는 살인·풍속·감식을 포함한 사건 기록을 다룬다. 특수기동대는 위험이 큰 무장 상황에 개입하고, 별도 전문 전력인 맥스택은 고위험 크롬 관련 사건에 투입된다. 수사 경로가 기업 사유지에 막힐 때에는 정식 수사권과 비공식 증거 수집이 갈린다. 구역에 따라 실제 출동 인력과 사건을 맡는 담당자가 다르며 도시의 제도와 도그타운 경비 절차는 일치하지 않는다.","sources":[{"label":"나이트 시티 경찰국 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0%20%EA%B2%BD%EC%B0%B0%EA%B5%AD"}],"priority":12},{"title":"2077년의 넷과 구망","group":"넷","keywords":["넷공간","사이버스페이스","올드넷","시티넷","서브넷"],"short":"파편화된 망과 접속 단위","body":"2077년의 시민과 기업이 사용하는 넷은 연결망 붕괴 후 재편된 시티넷과 기관별 서브넷의 모음이다. 접속해서 안내를 읽거나 통신하는 데 필요한 연결 수준과 머리를 가상 공간에 맡기는 딥 다이브의 요구 조건이 다르다. 넷러너가 하나의 건물 제어망에 들어가면 그 건물 안에서 통제되는 카메라나 설비를 마주하며, 과거 데이터의 폐허는 블랙월 건너편의 별도 위험 영역으로 남아 있다. 도시 화면에 보이는 광고와 생활망의 네트워크 이용이 과거의 전 지구적 넷을 복구했다는 뜻은 아니다. 각 기관이 소유·운용하는 서버와 신경 인터페이스의 범위를 구분하는 것이 가상 공간을 설명하는 출발점이다. 건물이 사설망을 쓴다면 같은 길에 선 시민 단말과 안에서 조회할 수 있는 자료가 달라진다. 일상적인 통화가 되는 구역에 딥 다이브용 장비를 펼친다고 구망 속 폐허까지 갈 수 있는 조건이 자연스럽게 갖추어지지는 않는다. 생활 통신과 긴급 연락도 사용 가능한 지구의 접속에 의존한다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"블랙월(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B8%94%EB%9E%99%EC%9B%94(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"Quickhacking · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Quickhacking"},{"label":"NetWatch · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/NetWatch"}],"priority":13},{"title":"블랙월 경계","group":"넷","keywords":["블랙월","구망경계","넷장벽","자율AI","넷워치장벽"],"short":"인간이 쓰는 넷과 구망을 나누는 경계","body":"블랙월은 데이터크래쉬 이후 사람이 계속 사용할 수 있는 가상 공간과, 풀려난 AI가 남은 구망을 격리하는 경계다. 공식적으로는 강력한 보안 장벽이지만 여러 기록은 스스로 판단하는 자율 AI가 그 임무를 수행한다는 해석을 지지한다. 넷워치는 경계를 유지하고 누가 접근하는지 감시한다. 장벽 밖에 남은 옛 데이터가 사라진 것은 아니며, 기업과 일부 넷러너는 그 위험에도 정보나 AI를 끌어오려 한다. 사람이 몸에서 분리된 채 넷을 쓰는 기술이 있으므로 공격은 컴퓨터나 데이터만 손상시키는 데 그치지 않을 수 있다. 접촉한 여러 네트워크와 보철이 연결되어 있다는 점이 위험을 키운다. 유지 주체는 넷워치이지만 장벽이 내리는 판단이 알려진 규칙과 언제나 일치한다고 보기는 어렵다. 구망에서 관측한 현상과 도시 보안 기관이 공지한 사실에는 여러 겹의 정보 차이가 있으며, 사람이나 보철이 추적할 수 있는 접점도 제한적이다.","sources":[{"label":"블랙월(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EB%B8%94%EB%9E%99%EC%9B%94(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"Blackwall · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Blackwall"}],"priority":14},{"title":"통일 전쟁과 알빈 협정","group":"국가와 공권력","keywords":["통일전쟁","알빈협정","금속전쟁","휴전"],"short":"연방 재통합 군사 행동과 자유시 지위","body":"통일 전쟁은 마이어스 정부가 서부 자유주에 대한 연방의 영향력을 되찾으려 시작한 전쟁이다. 신미합중국군과 밀리테크가 연방 쪽을 지원했고, 아라사카의 개입은 나이트 시티를 둘러싼 힘의 균형에 영향을 주었다. 2070년 알빈 협정으로 전쟁이 끝났고 일부 자유주는 일정한 자치를 보전하는 틀 안에서 연방에 가까워졌다. 나이트 시티는 독립 도시 지위를 유지했으며, 도그타운에는 정전 뒤에도 떠나지 않은 군대의 흔적이 남았다. 신미합중국의 정규 전력과 밀리테크의 계약 전력은 인력·장비·조달에서 가깝지만 동일한 법적 주체는 아니다. 통일 전쟁에서는 기업 군수와 연방 지휘가 같은 목표를 위해 움직였다. 정전 뒤 병력의 철수와 재배치 문제는 핸슨이 도그타운을 유지하는 역사적 조건이 됐다. 전쟁을 끝낸 정부 협상과 현장 부대의 생존 판단은 서로 다른 정보에 기초한다. 전직 군인이 갱단에 들어가도 이전 군의 명령 체계가 자동으로 이어지지는 않는다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"신미합중국 · 나무위키","url":"https://namu.wiki/w/%EC%8B%A0%EB%AF%B8%ED%95%A9%EC%A4%91%EA%B5%AD"},{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"}],"priority":15},{"title":"거대기업의 산업 지도","group":"기업","keywords":["메가코프","거대기업","기업주의","사설경비","조달"],"short":"금융·군수·인프라에 걸친 기업 권력","body":"메가코프는 생산과 판매를 넘어 군수, 고용, 교육, 의료, 사설 보안이나 인프라에 관여한다. 아라사카는 금융·경비·무기, 밀리테크는 군수와 국가 조달, 캉 타오는 스마트 무기, 바이오테크니카는 생명공학에 특화된다. 나이트 코프는 도시 개발·운영과 깊게 연결된다. 같은 크기의 회사가 동일한 무장과 법적 지위를 가지지는 않는다. 제조 업체, 민간 계약 업체, 시의 후원 기업은 계약 종류에 따라 다른 권한을 행사한다. 나이트 시티가 자유도시라는 지위는 여러 기업이 법인과 부지, 거래 거점을 유지하는 이유 가운데 하나다. 해운과 육상 운송, 항공·궤도 수송은 서로 다른 통행 규정을 가진다. 시정부의 공공 계약, 나이트 코프의 후원, 국제 기업의 사유 항만과 정식 군수 대금은 같은 재정 흐름이 아니다. 수입 물품과 장물의 구별에는 납품 서류와 거래 상대의 신뢰가 필요하다. 도그타운의 시장은 이 체계와 접하지만 바게스트의 별도 관리를 받는다.","sources":[{"label":"기업 목록 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Corporation"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"},{"label":"나이트 시티 · 나무위키","url":"https://namu.wiki/w/%EB%82%98%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8B%B0"},{"label":"나이트 시티 · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Night_City"}],"priority":16},{"title":"아라사카","group":"기업","keywords":["아라사카","Arasaka","사부로","보안부","대정보부"],"short":"일본계 금융·경비·군수 복합기업","body":"아라사카는 일본을 기반으로 하며 금융, 기업 경비, 무기 제조와 사이버웨어까지 사업을 벌인다. 도쿄 본사와 나이트 시티의 타워·워터프론트·산업 시설은 서로 다른 기능을 갖는다. 사부로, 하나코, 요리노부, 미치코와 관련된 기업 내부 파벌은 가족 및 조직의 미래를 두고 갈린다. 미코시나 렐릭 같은 비밀 사업을 접할 수 있는 직원의 범위는 좁다. 회사 이름만으로 모든 구성원이 동일한 목표와 기밀을 공유하지 않는다. 무기와 사이버웨어 제조 부서는 소비자용·군납 상품을 만들고, 은행과 경비 부문은 금융 서비스 및 호위를 제공한다. 회사 경비 조직과 대정보 부문에는 서로 다른 접근권이 배정된다. 사부로의 권위를 계승하려는 노선, 요리노부를 지지하는 세력, 미치코와 연결된 분파의 이해가 충돌할 수 있다. 콘페키 플라자는 접객 시설이고 아로요의 인더스트리얼 파크는 생산·산업 시설로 기능이 다르다. 아라사카의 무기 제조와 사이버웨어 제품, 일반 제조·식품·광고는 부서별 제품군이 다르다.","sources":[{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":17},{"title":"리퍼닥과 이식 수술","group":"사이버웨어","keywords":["리퍼닥","의체수술","이식수술","보철진료","크롬시술"],"short":"시술과 의체 보정을 맡는 의료 직종","body":"리퍼닥은 사람의 살과 기계를 연결하는 시술을 맡으며, 이미 장착한 사이버웨어를 교체하거나 영점과 신경 반응을 맞추기도 한다. 등록된 시설, 작은 골목 진료소, 법적인 제한을 넘나드는 시술업체가 뒤섞여 있다. 접안 렌즈처럼 작은 보철이라도 사용자의 감각 입력을 건드리며, 팔 전체나 중추신경계의 장비는 신체의 더 많은 부분과 맞물린다. 부품 값만으로 시술의 성격이 결정되지 않고, 호환되는 기구와 시술자의 숙련, 사후 관찰도 중요하다. 불법 군용 부품은 출처와 사용 기록을 감추는 대신 환자가 필요한 지원을 안정적으로 받기 어렵다. 레이블이 동일해도 손마디부터 뼈까지 바꾼 의체와 피부 아래에 넣는 보조기는 진료 시 논의할 사항이 다르다. 엣지러너의 지하 진료소에서는 일반 의료기관이라면 다루기 어려운 군용 가속기와 회복 약물을 얻는다. 감당할 수 있는 몸인지, 지속해 추가 시술에 응하겠는지에서 시술자의 기술과 판단이 함께 드러난다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"사이버웨어 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%EC%9B%A8%EC%96%B4"},{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"}],"priority":18},{"title":"밀리테크","group":"기업","keywords":["밀리테크","Militech","군산복합체","NUSA조달","스타우트"],"short":"신미합중국과 가까운 군수·경비 대기업","body":"밀리테크는 군수 제조와 무장 경비, 계약 병력을 보유한 대기업이다. 신미합중국과의 긴밀한 조달·인력 관계는 통일 전쟁에서 연방과 함께 움직인 이력에서 드러난다. 아라사카와는 과거 대규모 기업 전쟁의 경쟁자다. 2077년에도 물류와 내부 감사, 비밀 프로젝트, 경비가 나뉘어 움직인다. 메레디스 스타우트가 처리하는 회사 내부 문제와 국가 지도부의 외교 결정은 같은 일이 아니다. 도그타운의 바게스트는 현재의 밀리테크 부대와 구별된다. 과거 해양 기업 분쟁에서 OTEC 쪽의 군수 지원이 아라사카와의 충돌을 키웠다. 나이트 시티 도심의 파괴를 남긴 4차 기업 전쟁은 통일 전쟁보다 앞선 별개 사건이다. 연방과 군수기업의 이해가 겹쳐도 작전 지역이 바뀌거나 협정으로 군이 철수할 때 현장에 남은 장비의 소유와 책임 문제가 생긴다. 채용된 경비, 기업의 조사 조직, 위장한 정부 요원은 같은 현장을 오가도 동일한 지휘를 받지 않는다.","sources":[{"label":"밀리테크 · 나무위키","url":"https://namu.wiki/w/%EB%B0%80%EB%A6%AC%ED%85%8C%ED%81%AC"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":19},{"title":"소울킬러 프로그램","group":"넷","keywords":["소울킬러","Soulkiller","인격추출","신경업로드"],"short":"인간 인격의 디지털 구조를 만드는 기술","body":"소울킬러는 알트 커닝햄의 연구에 뿌리를 둔 프로그램이다. 사람의 신경과 인격을 디지털 형태로 옮겨 엔그램으로 저장한다. 군사적 목적을 갖고 개량된 초기 판본은 대상을 죽이면서 기억을 보유할 수 있었고, 후속 판본에는 몸을 죽이지 않고 복제하는 사례도 있다. 아라사카가 구성체를 관리하므로 신경 정보의 소유와 동의, 보관 상태는 별개의 쟁점이 된다. 현재 인격을 추출하는 행위, 분리된 인격을 저장하는 미코시, 그것을 담아 접촉하는 렐릭은 각기 다른 층이다. 이를 개인의 영혼이 관찰 가능한 형태 그대로 옮겨 간다는 확정적 묘사로만 처리할 수 없다. 관련 자료는 프로그램의 세대와 목적을 함께 확인한다. 알트가 일하던 시기의 초기 기술이 회사에 넘어간 뒤 아라사카는 전쟁과 정보 획득, 고액 고객의 서비스라는 서로 다른 목적에 응용했다. 어느 판본이 사용됐는지에 따라 원래의 사람에게 가해진 손상과 저장된 결과가 다른 이유다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"},{"label":"Soulkiller · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Soulkiller"}],"priority":20},{"title":"미코시 인격 저장소","group":"넷","keywords":["미코시","Mikoshi","인격보관소","엔그램저장소"],"short":"아라사카가 구성체를 보관하는 인프라","body":"미코시는 아라사카가 디지털화한 인격을 관리하는 보관 인프라다. 구성체를 담는 렐릭 칩과 시설에 있는 접속점을 구분하며, 어디에 보관되고 누가 접근할 수 있는지가 중요한 조건이다. 조니 실버핸드의 인격 기록은 아라사카의 보관 이력에 관련되지만, 생전 활동과 디지털로 보존된 상태는 시대와 관찰이 다르다. 기업은 고급 고객과 실험 대상의 자료를 보존하고, 시스템에 잡힌 인격의 이용 권한을 갖는다. 알트의 디지털 존재는 독자적인 경로로 구망과 관련되어 있어, 조니의 기록과 같은 접속점에 언제나 나란히 존재하는 것으로 운용하지 않는다. 보관 장소에 연결된 장비라고 곧장 실체 전체가 나타나는 것도 아니다. 보관소에 연결되는 아라사카의 현장 단말과 세계 다른 지사에서 연결할 수 있는 시설에는 같은 이름이 붙을 수 있다. 접속점의 위치가 알려졌다고 저장소 전체의 규모나 그 안에 잡힌 특정 인격의 접근 권한까지 드러나지는 않는다.","sources":[{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"아라사카 · 나무위키","url":"https://namu.wiki/w/%EC%95%84%EB%9D%BC%EC%82%AC%EC%B9%B4"},{"label":"Mikoshi · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Mikoshi"},{"label":"Soulkiller · Cyberpunk Wiki","url":"https://cyberpunk.fandom.com/wiki/Soulkiller"}],"priority":21},{"title":"사이버 사이코시스","group":"사이버웨어","keywords":["사이버사이코","사이버사이코시스","크롬부하","인간성상실"],"short":"장비 부하와 외상이 겹치는 해리·폭주","body":"사이버 사이코시스는 과도한 증강과 연관되지만 크롬 하나를 이식하면 정해진 순서로 발병하는 현상은 아니다. 연작에서는 감정적 충격, 폭력에 반복 노출된 삶, 사회적 고립, 약물과 가혹한 노동 환경이 함께 나타난다. 신체 감각의 급격한 변화와 환각, 관계의 단절, 타인을 적 또는 사물로만 보는 행동이 사례마다 다르게 드러난다. 무장한 상태로 위험해진 사례가 뉴스에 주로 오르지만, 비전투 상황에서 시작된 이상 행동과 모든 정신질환을 같은 것으로 취급할 수 없다. 맥스택은 현장의 위험을 제거하는 대응 조직이고 진단과 장기 치료는 별개의 일이다. 보철의 개수만으로 발병이나 치료 가능성을 확정하기 어렵다. 뉴스에서 폭주한 가해자만 남기거나 접근한 지휘 체계가 그를 표적으로만 기록할 수 있다. 개별 사례의 과거 기록이나 주변인의 증언을 보면 증강이 있기 전의 피해와 치료의 중단이 다른 원인과 동시에 관찰되기도 한다.","sources":[{"label":"사이버 사이코 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%20%EC%82%AC%EC%9D%B4%EC%BD%94"},{"label":"사이버펑크 시리즈/설정 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88/%EC%84%A4%EC%A0%95"},{"label":"사이버펑크: 엣지러너/줄거리 · 나무위키","url":"https://namu.wiki/w/%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC:%20%EC%97%A3%EC%A7%80%EB%9F%AC%EB%84%88/%EC%A4%84%EA%B1%B0%EB%A6%AC"}],"priority":22},{"title":"캉 타오","group":"기업","keywords":["캉타오","KangTao","스마트무기","중국군수"],"short":"스마트 무기에 강한 중국계 군수기업","body":"캉 타오는 2077년 무기·경비 시장에 진출한 중국계 군수기업으로 스마트 계열 제품이 두드러진다. 장비 생산과 현장 경비, 자산을 지키는 수송 전력은 서로 다른 부문이다. 일본계 아라사카와 북미 밀리테크를 단순히 복제한 조직으로 볼 수 없다. 시리즈 초기 판본의 캉 타오 설정과 이후 공식 연표에는 차이가 있어 2077년에 확인되는 제조사 및 스마트 무기 사업을 우선한다. 외부 거래 상대와 직원이 기업의 모든 제품 권한을 갖는 것은 아니다. 지사는 나이트 시티 도심의 밀리테크 지사 가까이에 있다. 회색과 주황색, 디지털 위장 무늬가 회사 전력의 시각적 표지다. G-58 디엔과 같은 스마트 기관단총, L-69 줘우 스마트 산탄총은 두드러지는 제품군이다. 직원 복지 자료에 트라우마 팀 골드 보험이 나오지만, 장기간의 고용 의무와 퇴직 때의 계약 종료가 묶여 있다. 근무 중 제공되는 혜택, 회사가 제조한 장비와 조직의 현장 경비는 서로 다른 사업이다.","sources":[{"label":"캉 타오 · 나무위키","url":"https://namu.wiki/w/%EC%BA%89%20%ED%83%80%EC%98%A4"},{"label":"기업(사이버펑크 시리즈) · 나무위키","url":"https://namu.wiki/w/%EA%B8%B0%EC%97%85(%EC%82%AC%EC%9D%B4%EB%B2%84%ED%8E%91%ED%81%AC%20%EC%8B%9C%EB%A6%AC%EC%A6%88)"}],"priority":23},{"title":"렐릭 바이오칩","group":"미디어","keywords":["렐릭","Relic","바이오칩","렐릭20","인격칩"],"short":"구성체 접촉과 신경 재작성의 두 계열","body":"렐릭은 아라사카가 디지털 인격을 기록하고 산 사람과 상호작용시키려 개발한 특수 바이오칩이다. 일반적으로 알려진 상품형은 저장된 구성체와의 접촉을 제공한다. 실험적인 2.0 계열은 적합한 신체에 구성체를 정착시키도록 신경 구조에 관여한다. 칩은 인격 자료의 무결성을 유지하는 보관 환경을 요구하며, 단말로 연결하는 일과 생체 신체에 이식하는 일의 결과가 다르다. 렐릭을 비
